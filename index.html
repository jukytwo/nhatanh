<h1>Góc học tập lớp 1</h1><p>Bố mẹ đăng nhập bằng tài khoản Góc học tập một lần trên máy này, trang sẽ tự mở chương trình của bé.</p>
<a class="b" href="../vietanh/?next=nhatanh">Đăng nhập</a><div id="w"></div></main>
<script>
(function(){var box=document.getElementById("box");
function ask(t){box.hidden=false;if(t)document.getElementById("w").textContent=t}
if(!window.crypto||!crypto.subtle||!("DecompressionStream" in window)){ask("Trình duyệt này đã cũ. Hãy cập nhật Safari hoặc Chrome.");return}
var a=null;try{a=JSON.parse(localStorage.getItem("gh:acct")||"null")}catch(e){}
var hk=a&&a.keys&&a.keys.hub;if(!hk){ask("");return}
var d=new Date(),td=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
if(a.exp&&a.exp.slice(0,10)<td){ask("Tài khoản đã hết hạn, bố mẹ đăng nhập lại nhé.");return}
var raw;try{raw=Uint8Array.from(atob(hk),function(c){return c.charCodeAt(0)})}catch(e){ask("");return}
fetch("app.bin",{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error("net");return r.arrayBuffer()}).then(function(b){
 return crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]).then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(b,0,12)},k,new Uint8Array(b,12))})
}).then(function(p){return new Response(new Blob([p]).stream().pipeThrough(new DecompressionStream("gzip"))).text()})
.then(function(h){document.open();document.write(h);document.close()})
.catch(function(e){ask(String(e).indexOf("net")>=0?"Chưa tải được. Máy cần có mạng để mở lần đầu.":"Tài khoản trên máy này chưa mở được chương trình, bố mẹ đăng nhập lại nhé.")})})();
