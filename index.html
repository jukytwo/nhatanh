bông hoa nắng.","doc":"Trong giấc mơ buổi sáng. Bạn nhỏ mơ thấy mặt trời mang túi hoa nắng đi rải hoa vàng khắp nơi. Trên đồng cỏ có những bông hoa lạ mang tên các bạn trong lớp, bạn còn nghe thấy tiếng gà trống trò chuyện.","hoi":[{"q":"Trong giấc mơ, mặt trời làm gì?","o":["Chiếu sáng sân trường","Đánh thức các bạn","Rải hoa nắng khắp nơi"],"a":2},{"q":"Trên đồng cỏ, bạn nhỏ thấy gì?","o":["Đàn bướm vàng bay lượn","Hoa lạ mang tên các bạn","Đàn gà con đi kiếm ăn"],"a":1},{"q":"Bạn nhỏ nghe thấy tiếng con gì?","o":["Gà trống","Chim sẻ","Chim sơn ca"],"a":0}],"viet":"giấc mơ","choi":"Mỗi sáng thức dậy, bé kể một giấc mơ, thật hay tưởng tượng đều được, gói gọn trong ba câu.","bm":"Bài thơ nhiều hình ảnh tưởng tượng; hỏi bé 'nếu là em, em sẽ mơ thấy gì?'.","chude":"Chủ đề 7. Thế giới trong mắt em"},{"id":"tv1-c7-3","tap":2,"tuan":31,"ten":"Bài 3. Ngày mới bắt đầu","loai":"doc","am":["ay","âu"],"tieng":["ngày","bay","tay","đầu","sâu","câu"],"tu":[{"w":"máy bay","e":"✈️"},{"w":"bàn tay","e":"✋"},{"w":"con sâu","e":"🐛"},{"w":"chim bồ câu","e":"🕊️"},{"w":"dâu tây","e":"🍓"}],"cau":"Một ngày mới bắt đầu.","doc":"Ngày mới bắt đầu. Buổi sáng, những tia nắng đánh thức mọi vật. Các con vật rời tổ đi kiếm ăn, bạn nhỏ thức dậy chuẩn bị đến trường. Một ngày mới bắt đầu thật tươi vui.","hoi":[{"q":"Buổi sáng, cái gì đánh thức mọi vật?","o":["Tiếng gà gáy","Những tia nắng","Tiếng chuông"],"a":1},{"q":"Thức dậy, các con vật làm gì?","o":["Rời tổ kiếm ăn","Hót chào ngày mới","Ra sông uống nước"],"a":0},{"q":"Bạn nhỏ thức dậy làm gì?","o":["Ra vườn tưới cây","Giúp mẹ quét nhà","Chuẩn bị đến trường"],"a":2}],"viet":"ngày mới","choi":"Làm 'đồng hồ buổi sáng': bé xếp các tranh việc buổi sáng theo đúng thứ tự (thức dậy, đánh răng, ăn sáng, đi học).","bm":"Bài giúp bé tập tự chuẩn bị buổi sáng; cho bé tự soạn cặp từ tối hôm trước.","chude":"Chủ đề 7. Thế giới trong mắt em"},{"id":"tv1-c7-4","tap":2,"tuan":31,"ten":"Bài 4. Hỏi mẹ","loai":"doc","am":["ơi","uôi"],"tieng":["trời","chơi","bơi","Cuội","chuối","tuổi"],"tu":[{"w":"mặt trời","e":"☀️"},{"w":"đồ chơi","e":"🧸"},{"w":"đi bơi","e":"🏊"},{"w":"nải chuối","e":"🍌"},{"w":"dòng suối","e":"🏞️"}],"cau":"Mẹ ơi, gió từ đâu đến?","doc":"Hỏi mẹ. Bạn nhỏ nhìn bầu trời và hỏi mẹ thật nhiều điều: gió từ đâu đến, ai tô bầu trời xanh. Bạn còn hỏi chú Cuội trên cung trăng có buồn không, có phải chú phi công bay lên thăm chú Cuội.","hoi":[{"q":"Bạn nhỏ hỏi mẹ về điều gì?","o":["Gió, bầu trời, chú Cuội","Hoa, lá và các cây cối","Sông, biển và đàn cá"],"a":0},{"q":"Vì sao bạn nhỏ nghĩ chú phi công bay lên thăm chú Cuội?","o":["Vì chú phi công là bạn","Vì máy bay bay cao","Vì chú Cuội buồn"],"a":2}],"viet":"hỏi mẹ","choi":"Làm 'hộp câu hỏi': mỗi tối bé bỏ vào hộp một câu hỏi 'vì sao', cuối tuần cả nhà cùng tìm câu trả lời.","bm":"Kể cho bé nghe sự tích chú Cuội cung trăng nếu bé chưa biết, bé sẽ hiểu bài thơ hơn.","chude":"Chủ đề 7. Thế giới trong mắt em"},{"id":"tv1-c7-5","tap":2,"tuan":32,"ten":"Bài 5. Những cánh cò","loai":"doc","am":["anh","ao"],"tieng":["cánh","xanh","nhanh","ao","cao","sao"],"tu":[{"w":"quả chanh","e":"🍋"},{"w":"bánh mì","e":"🥖"},{"w":"ngôi sao","e":"⭐"},{"w":"quả táo","e":"🍎"},{"w":"nhà cao tầng","e":"🏢"}],"cau":"Đàn cò bay trên cánh đồng.","doc":"Những cánh cò. Bạn nhỏ kể ngày trước đàn cò thường kiếm tôm cá ở ao hồ, đầm lầy quê mình. Giờ ao hồ, đầm lầy đã thành những khu nhà cao tầng, tiếng ồn làm đàn cò sợ hãi.","hoi":[{"q":"Đàn cò thường kiếm tôm cá ở đâu?","o":["Ở cánh đồng lúa","Ở bờ biển xa","Ở ao hồ, đầm lầy"],"a":2},{"q":"Ao hồ, đầm lầy giờ đã thành gì?","o":["Bãi biển","Nhà cao tầng","Cánh đồng lúa"],"a":1},{"q":"Điều gì làm đàn cò sợ hãi?","o":["Tiếng ồn","Người đi bắt","Trời lạnh"],"a":0}],"viet":"những cánh cò","choi":"Gấp con cò giấy và cho cò 'đi tìm ao hồ' trên tấm bản đồ vẽ tay, bé đặt cò vào chỗ có nước.","bm":"Bài nói về môi trường; hỏi bé vì sao cần giữ lại ao hồ, cây xanh cho chim muông.","chude":"Chủ đề 7. Thế giới trong mắt em"},{"id":"tv1-c7-6","tap":2,"tuan":32,"ten":"Bài 6. Buổi trưa hè","loai":"doc","am":["ưa","ươm"],"tieng":["trưa","mưa","dưa","bướm","gươm","ươm"],"tu":[{"w":"cơn mưa","e":"🌧️"},{"w":"dưa hấu","e":"🍉"},{"w":"con ngựa","e":"🐴"},{"w":"con bướm","e":"🦋"},{"w":"vườn ươm","e":"🌱"}],"cau":"Buổi trưa hè thật yên tĩnh.","doc":"Buổi trưa hè. Bài thơ tả buổi trưa hè ở làng quê, mọi vật như đang nghỉ ngơi. Chú bò nằm im, cánh bướm bay âm thầm, không gian êm ả dưới nắng hè.","hoi":[{"q":"Bài thơ nhắc đến những con vật nào?","o":["Con trâu và con chim","Con bò và con bướm","Con mèo và con gà"],"a":1},{"q":"Từ ngữ nào cho thấy buổi trưa hè rất yên tĩnh?","o":["Nằm im, êm ả","Ồn ào, náo nhiệt","Chạy nhảy"],"a":0}],"viet":"buổi trưa hè","choi":"Trò 'trưa hè yên lặng': cả nhà nằm im một phút, sau đó bé kể lại những tiếng động nhỏ nhất bé nghe được.","bm":"Chỉ cho bé các từ gợi sự yên tĩnh trong bài như 'nằm im', 'êm ả' để bé dùng khi nói và viết.","chude":"Chủ đề 7. Thế giới trong mắt em"},{"id":"tv1-c7-7","tap":2,"tuan":32,"ten":"Bài 7. Hoa phượng","loai":"doc","am":["ương","oa"],"tieng":["phượng","trường","đường","hoa","loa","toa"],"tu":[{"w":"bông hoa","e":"🌸"},{"w":"cái loa","e":"📢"},{"w":"toa tàu","e":"🚃"},{"w":"trường học","e":"🏫"},{"w":"con đường","e":"🛣️"}],"cau":"Hoa phượng nở đỏ rực mùa hè.","doc":"Hoa phượng. Bài thơ tả cây phượng trồng ở xóm nhà bạn nhỏ. Mùa hè, hoa phượng nở đỏ rực cả cành như lửa. Bạn nhỏ nghĩ gió đã quạt cho cây, mặt trời đã ủ ấm nên hoa nở rộ.","hoi":[{"q":"Cây phượng trồng ở đâu?","o":["Ở xóm nhà bạn","Ở sân trường","Bên bờ sông"],"a":0},{"q":"Theo bạn nhỏ, gió và mặt trời đã làm gì cho cây?","o":["Gió hát, mặt trời chiếu","Gió tưới, mặt trời soi","Gió quạt, mặt trời ủ ấm"],"a":2}],"viet":"hoa phượng","choi":"Dẫn bé đi tìm cây phượng gần nhà hoặc ở trường, nhặt vài cánh hoa ép vào vở làm kỉ niệm.","bm":"Hoa phượng nở báo hiệu mùa hè và năm học sắp kết thúc; hỏi bé mong gì cho kì nghỉ hè.","chude":"Chủ đề 7. Thế giới trong mắt em"},{"id":"tv1-c7-ot","tap":2,"tuan":32,"ten":"Ôn tập","loai":"on-tap","am":["ia","ăng","ơi"],"tieng":["tia","thìa","nắng","trăng","trời","chơi"],"tu":[{"w":"cái thìa","e":"🥄"},{"w":"trăng","e":"🌙"},{"w":"mặt trời","e":"☀️"},{"w":"đồ chơi","e":"🧸"},{"w":"cái răng","e":"🦷"}],"cau":"Em thấy thế giới quanh em thật đẹp.","doc":"Ôn tập chủ đề Thế giới trong mắt em: bé đọc lại các bài, kể một điều thú vị bé quan sát được và đọc thuộc một bài thơ.","hoi":[{"q":"Trong bài Những cánh cò, điều gì làm đàn cò sợ hãi?","o":["Người đi bắt","Trời lạnh","Tiếng ồn"],"a":2},{"q":"Theo bạn nhỏ, buổi tối tia nắng đi đâu?","o":["Đi chợ","Đi ngủ","Đi học"],"a":1}],"viet":"Viết một câu về điều em thích","choi":"Bé kể một điều bé quan sát được trong ngày (bầu trời, con vật, cây cối) và vẽ lại.","bm":"Chủ đề khuyến khích bé quan sát; mỗi tối hỏi bé hôm nay em thấy điều gì thú vị.","chude":"Chủ đề 7. Thế giới trong mắt em"},{"id":"tv1-c8-1","tap":2,"tuan":33,"ten":"Bài 1. Cậu bé thông minh","loai":"doc","am":["inh","ông"],"tieng":["minh","sinh","kính","thông","sông","công"],"tu":[{"w":"cây thông","e":"🌲"},{"w":"kính","e":"👓"},{"w":"học sinh","e":"🧒"},{"w":"dòng sông","e":"🏞️"},{"w":"chim công","e":"🦚"}],"cau":"Vinh là cậu bé thông minh.","doc":"Cậu bé thông minh. Vinh và các bạn đang chơi đá bóng thì quả bóng lăn xuống một cái hố sâu. Vinh nghĩ ra cách mượn nón của các bạn đi múc nước đổ vào hố, nước dâng lên đưa quả bóng nổi lên miệng hố. Các bạn đều phục Vinh.","hoi":[{"q":"Vinh và các bạn chơi trò gì?","o":["Trốn tìm","Đá bóng","Nhảy dây"],"a":1},{"q":"Vinh lấy quả bóng lên bằng cách nào?","o":["Đổ nước cho bóng nổi lên","Lấy cây sào khều lên","Nhờ bạn trèo xuống"],"a":0},{"q":"Vì sao các bạn phục Vinh?","o":["Vì Vinh đá bóng giỏi","Vì Vinh chạy nhanh nhất","Vì Vinh nghĩ ra cách hay"],"a":2}],"viet":"thông minh","choi":"Làm thí nghiệm: thả một quả bóng bàn vào cốc rỗng, đổ nước vào cho bóng nổi lên miệng cốc như cách của Vinh.","bm":"Hỏi bé: nếu là em, em sẽ lấy bóng lên bằng cách nào? Khuyến khích bé nghĩ ra nhiều cách.","chude":"Chủ đề 8. Đất nước và con người"},{"id":"tv1-c8-2","tap":2,"tuan":33,"ten":"Bài 2. Lính cứu hỏa","loai":"doc","am":["inh","ưu"],"tieng":["lính","kính","tính","cứu","cừu","lựu"],"tu":[{"w":"xe cứu hoả","e":"🚒"},{"w":"kính","e":"👓"},{"w":"máy tính","e":"💻"},{"w":"con cừu","e":"🐑"},{"w":"bưu điện","e":"🏤"}],"cau":"Các chú lính cứu hỏa rất dũng cảm.","doc":"Lính cứu hỏa. Bài đọc kể về những người lính cứu hỏa. Khi có đám cháy, các chú mặc quần áo chống cháy, đi ủng, đeo găng tay, đội mũ, dùng vòi phun nước để dập lửa. Các chú rất dũng cảm.","hoi":[{"q":"Lính cứu hỏa dập lửa bằng gì?","o":["Vòi phun nước","Xẻng xúc cát","Tấm chăn ướt"],"a":0},{"q":"Lính cứu hỏa mặc gì khi làm việc?","o":["Áo phản quang, mũ bảo hiểm","Áo khoác dày, giày","Đồ chống cháy, ủng, găng, mũ"],"a":2},{"q":"Em thấy lính cứu hỏa là người thế nào?","o":["Rất khéo tay","Rất dũng cảm","Rất vui tính"],"a":1}],"viet":"lính cứu hỏa","choi":"Đóng vai lính cứu hỏa: bé đội mũ, cầm 'vòi' bằng ống giấy dập 'đám cháy' bằng giấy đỏ và đọc to số điện thoại 114.","bm":"Dạy bé số 114 và nhắc: thấy cháy thì chạy ra xa, báo ngay người lớn, không tự dập lửa.","chude":"Chủ đề 8. Đất nước và con người"},{"id":"tv1-c8-3","tap":2,"tuan":33,"ten":"Bài 3. Lớn lên bạn làm gì?","loai":"doc","am":["ơn","am"],"tieng":["lớn","sơn","cơn","làm","cam","tám"],"tu":[{"w":"hộp sơn","e":"🎨"},{"w":"cơn mưa","e":"🌧️"},{"w":"quả cam","e":"🍊"},{"w":"số tám","e":"8️⃣"},{"w":"con lợn","e":"🐷"}],"cau":"Lớn lên em muốn làm cô giáo.","doc":"Lớn lên bạn làm gì? Bài thơ kể ước mơ nghề nghiệp của các bạn nhỏ. Một bạn muốn làm thuỷ thủ lái tàu vượt sóng ra khơi, một bạn muốn làm đầu bếp làm bánh, nấu món ngon, một bạn muốn làm nông dân trồng lúa.","hoi":[{"q":"Vì sao một bạn muốn làm thuỷ thủ?","o":["Để đánh cá ngoài biển","Để đi khắp thế giới","Để lái tàu vượt sóng"],"a":2},{"q":"Bạn muốn làm đầu bếp thích làm gì?","o":["Trồng rau, hái quả","Làm bánh, nấu món ngon","Bán hàng ở chợ"],"a":1},{"q":"Bạn nhỏ ở khổ thơ thứ ba muốn làm nghề gì?","o":["Nông dân","Bác sĩ","Phi công"],"a":0}],"viet":"lớn lên","choi":"Bé hoá trang thành nghề mình thích và giới thiệu: 'Lớn lên tớ làm..., vì...'.","bm":"Tôn trọng mọi ước mơ của bé, kể cả khi ước mơ đổi mỗi tuần; hỏi thêm nghề đó giúp được ai.","chude":"Chủ đề 8. Đất nước và con người"},{"id":"tv1-c8-4","tap":2,"tuan":34,"ten":"Bài 4. Ruộng bậc thang ở Sa Pa","loai":"doc","am":["ang","uông"],"tieng":["thang","vàng","làng","ruộng","chuông","xuồng"],"tu":[{"w":"màu vàng","e":"🟡"},{"w":"ngôi làng","e":"🏘️"},{"w":"ruộng bậc thang","e":"🌾"},{"w":"cái chuông","e":"🔔"},{"w":"chiếc xuồng","e":"🛶"}],"cau":"Ruộng bậc thang vàng rực mùa lúa chín.","doc":"Ruộng bậc thang ở Sa Pa. Bài đọc giới thiệu những thửa ruộng bậc thang ở Sa Pa. Mùa lúa chín, cả thung lũng vàng rực và thơm ngát. Những thửa ruộng này có từ hàng trăm năm trước, do người Mông, người Dao, người Hà Nhì làm nên.","hoi":[{"q":"Mùa lúa chín, ruộng bậc thang thế nào?","o":["Xanh mướt cả thung lũng","Vàng rực, thơm ngát","Trắng xoá như mây"],"a":1},{"q":"Ruộng bậc thang có từ bao giờ?","o":["Từ hàng trăm năm trước","Từ vài năm trước","Từ năm ngoái mới làm"],"a":0},{"q":"Ai đã làm nên ruộng bậc thang?","o":["Người Kinh ở đồng bằng","Bộ đội làm đường","Người Mông, Dao, Hà Nhì"],"a":2}],"viet":"ruộng bậc thang","choi":"Xếp các khối đồ chơi hoặc sách thành bậc thang, bé đặt 'lúa' bằng giấy vàng lên từng bậc như ruộng bậc thang.","bm":"Mở ảnh ruộng bậc thang Sa Pa cho bé xem và chỉ trên bản đồ: Sa Pa ở phía bắc nước ta.","chude":"Chủ đề 8. Đất nước và con người"},{"id":"tv1-c8-5","tap":2,"tuan":34,"ten":"Bài 5. Nhớ ơn","loai":"doc","am":["ơn","ây"],"tieng":["ơn","sơn","lớn","cây","mây","dây"],"tu":[{"w":"hộp sơn","e":"🎨"},{"w":"con lợn","e":"🐷"},{"w":"cái cây","e":"🌳"},{"w":"đám mây","e":"☁️"},{"w":"cơn mưa","e":"🌧️"}],"cau":"Ăn quả nhớ kẻ trồng cây.","doc":"Nhớ ơn. Bài đồng dao nhắc các bạn nhỏ nhớ ơn những người làm ra những thứ mình dùng hằng ngày: người cày ruộng cho ta hạt gạo, người trồng cây cho ta quả ngọt và bóng mát, người chèo đò đưa ta qua sông. Ăn quả thì nhớ người trồng cây.","hoi":[{"q":"Bài đồng dao nhắc em nhớ ơn ai?","o":["Người làm ra gạo, cây, đò","Thầy cô giáo ở trường","Các bạn cùng lớp em"],"a":0},{"q":"Câu 'Ăn quả nhớ kẻ trồng cây' khuyên em điều gì?","o":["Ăn quả phải rửa sạch","Phải chăm trồng cây","Biết ơn người giúp mình"],"a":2}],"viet":"nhớ ơn","choi":"Mỗi bữa ăn, bé nói một câu cảm ơn người làm ra món ăn: bác nông dân, người bán hàng, người nấu cơm.","bm":"Giải thích câu 'Ăn quả nhớ kẻ trồng cây' bằng ví dụ thật trong nhà, như cây xoài ông trồng hay bữa cơm mẹ nấu.","chude":"Chủ đề 8. Đất nước và con người"},{"id":"tv1-c8-6","tap":2,"tuan":34,"ten":"Bài 6. Du lịch biển Việt Nam","loai":"doc","am":["iên","at"],"tieng":["biển","tiên","điện","cát","hát","mát"],"tu":[{"w":"biển","e":"🌊"},{"w":"cô tiên","e":"🧚"},{"w":"điện thoại","e":"📱"},{"w":"bãi cát","e":"🏖️"},{"w":"ca hát","e":"🎤"}],"cau":"Biển Việt Nam xanh và đẹp.","doc":"Du lịch biển Việt Nam. Nước ta có nhiều bãi biển đẹp như ở Thanh Hoá, Đà Nẵng, Khánh Hoà. Đi biển, các bạn được tắm biển, nghịch sóng, nhặt vỏ ốc, xây lâu đài cát. Những đồi cát luôn đổi hình dạng vì gió thổi cát bay.","hoi":[{"q":"Bài đọc nhắc đến bãi biển ở đâu?","o":["Hạ Long, Cát Bà, Vũng Tàu","Phú Quốc, Côn Đảo","Thanh Hoá, Đà Nẵng, Khánh Hoà"],"a":2},{"q":"Đi biển, em có thể làm gì?","o":["Câu cá, chèo thuyền nhỏ","Tắm biển, xây lâu đài cát","Đi bộ lên đỉnh núi"],"a":1},{"q":"Vì sao đồi cát luôn đổi hình dạng?","o":["Vì gió thổi cát bay","Vì sóng đánh vào bờ","Vì người đi lên cát"],"a":0}],"viet":"biển Việt Nam","choi":"Xây lâu đài cát trong khay hoặc chơi tìm vỏ ốc giấu quanh phòng; mỗi vỏ ốc tìm được, bé kể tên một bãi biển đã đi.","bm":"Chỉ trên bản đồ Việt Nam những nơi có biển cả nhà đã đến, gắn bài học với chuyến đi thật.","chude":"Chủ đề 8. Đất nước và con người"},{"id":"tv1-c8-ot","tap":2,"tuan":34,"ten":"Ôn tập","loai":"on-tap","am":["inh","ơn","iên"],"tieng":["minh","lính","ơn","lớn","biển","tiên"],"tu":[{"w":"học sinh","e":"🧒"},{"w":"kính","e":"👓"},{"w":"cơn mưa","e":"🌧️"},{"w":"biển","e":"🌊"},{"w":"điện thoại","e":"📱"}],"cau":"Em yêu đất nước Việt Nam.","doc":"Ôn tập chủ đề Đất nước và con người: bé đọc lại các bài, kể về một nghề em thích và một cảnh đẹp của đất nước.","hoi":[{"q":"Vinh lấy quả bóng lên bằng cách nào?","o":["Gọi người lớn","Đổ nước vào hố","Lấy sào khều"],"a":1},{"q":"Mùa lúa chín, ruộng bậc thang ở Sa Pa có màu gì?","o":["Vàng rực","Xanh mướt","Nâu sẫm"],"a":0}],"viet":"Viết tên một nơi đẹp của Việt Nam","choi":"Đố bé kể tên ba nghề và một việc của mỗi nghề, rồi kể ba nơi đẹp của Việt Nam mà bé biết.","bm":"Cuối chủ đề, cho bé đọc to một bài trước cả nhà để bé thêm tự tin.","chude":"Chủ đề 8. Đất nước và con người"},{"id":"tv1-cn-1","tap":2,"tuan":35,"ten":"Ôn tập cuối năm. Bài 1","loai":"on-tap","am":["oa","uy","ương"],"tieng":["hoa","toa","khuy","thuỷ","trường","đường"],"tu":[{"w":"bông hoa","e":"🌸"},{"w":"tàu thuỷ","e":"🚢"},{"w":"trường học","e":"🏫"},{"w":"con đường","e":"🛣️"},{"w":"huy hiệu","e":"🎖️"}],"cau":"Em đã học hết lớp 1.","doc":"Ôn tập cuối năm: bé đọc lại các bài đã học trong năm, đọc thêm bài mới, trả lời câu hỏi và nói về điều bé nhớ nhất ở lớp 1.","hoi":[{"q":"Từ nào có vần uy?","o":["tàu thuỷ","con bướm","chuối"],"a":0},{"q":"Từ nào có vần oa?","o":["âm nhạc","bóng","bông hoa"],"a":2}],"viet":"Viết một câu về điều em nhớ nhất ở lớp 1","choi":"Bé rút thăm tên một bài đã học trong năm, đọc lại một đoạn và kể điều bé nhớ nhất về bài đó.","bm":"Cuối năm, đánh giá nhẹ nhàng: bé đọc trơn, hiểu ý chính và viết được câu ngắn là đạt yêu cầu lớp 1.","chude":"Ôn tập và đánh giá cuối năm"},{"id":"tv1-cn-2","tap":2,"tuan":35,"ten":"Ôn tập cuối năm. Bài 2","loai":"on-tap","am":["iêng","uôi","ach"],"tieng":["tiếng","riêng","chuối","tuổi","sách","gạch"],"tu":[{"w":"tiếng chuông","e":"🔔"},{"w":"nải chuối","e":"🍌"},{"w":"dòng suối","e":"🏞️"},{"w":"quyển sách","e":"📕"},{"w":"viên gạch","e":"🧱"}],"cau":"Em thích đọc sách trong kì nghỉ hè.","doc":"Ôn tập cuối năm: bé luyện đọc, tìm tiếng có vần khó, chép một câu thơ yêu thích và kể về một cuốn sách bé đã đọc.","hoi":[{"q":"Từ nào có vần iêng?","o":["quả lê","chụp ảnh","tiếng chuông"],"a":2},{"q":"Từ nào có vần uôi?","o":["vui vẻ","nải chuối","con vượn"],"a":1}],"viet":"Chép một câu thơ em thích","choi":"Thi viết đẹp: bé chép một câu thơ yêu thích lên tấm thiệp, cả nhà bình chọn rồi treo lên tường.","bm":"Ghi lại những vần bé còn nhầm để ôn nhẹ trong hè, mỗi ngày chỉ năm đến mười phút.","chude":"Ôn tập và đánh giá cuối năm"},{"id":"tv1-cn-3","tap":2,"tuan":35,"ten":"Ôn tập cuối năm. Bài 3","loai":"on-tap","am":["anh","ươc","oc"],"tieng":["xanh","tranh","nước","thước","học","sóc"],"tu":[{"w":"bức tranh","e":"🖼️"},{"w":"quả chanh","e":"🍋"},{"w":"giọt nước","e":"💧"},{"w":"thước kẻ","e":"📏"},{"w":"lớp học","e":"🏫"},{"w":"con sóc","e":"🐿️"}],"cau":"Tạm biệt lớp 1, em vào hè.","doc":"Ôn tập cuối năm: bé đọc một bài mới, trả lời câu hỏi, viết vài câu ngắn và nói lời cảm ơn thầy cô, bạn bè sau một năm học.","hoi":[{"q":"Từ nào có vần ươc?","o":["lá","giọt nước","cái áo"],"a":1},{"q":"Từ nào có vần oc?","o":["lớp học","cái nồi","con chim"],"a":0}],"viet":"Viết lời cảm ơn cô giáo","choi":"Bé làm người dẫn chương trình, giới thiệu một câu chuyện yêu thích cho cả nhà rồi kể lại câu chuyện đó.","bm":"Cùng bé làm một tấm thiệp cảm ơn cô giáo cuối năm, để bé tự viết một câu ngắn.","chude":"Ôn tập và đánh giá cuối năm"}]},"toan1":{"book":"Toán 1 – Kết nối tri thức với cuộc sống","chude":[{"id":"cd1","ten":"Chủ đề 1. Các số từ 0 đến 10","tap":1,"bai":[{"id":"t1-01","ten":"Bài 1. Các số 0, 1, 2, 3, 4, 5","tuan":1,"muctieu":["Bé đếm được nhóm đồ vật có từ 0 đến 5 cái","Bé đọc, viết được các số 0, 1, 2, 3, 4, 5","Bé hiểu số 0 nghĩa là không có cái nào"],"gen":[{"k":"dem","max":5},{"k":"thutu","max":5}],"vidu":"Trên đĩa có 3 quả chuối, bé ăn hết thì đĩa còn 0 quả.","choi":"Bố mẹ úp 5 cái chén lên bàn, giấu kẹo dưới vài cái. Bé lật từng chén, đếm số kẹo tìm được rồi giơ đúng số ngón tay.","bm":"Bé hay quên số 0, bố mẹ cho bé nhìn một cái hộp rỗng và nói: không có cái nào là số 0."},{"id":"t1-02","ten":"Bài 2. Các số 6, 7, 8, 9, 10","tuan":2,"muctieu":["Bé đếm được nhóm đồ vật có từ 6 đến 10 cái","Bé đọc, viết được các số 6, 7, 8, 9, 10","Bé đếm xuôi từ 0 đến 10 và đếm ngược từ 10 về 0"],"gen":[{"k":"dem","max":10},{"k":"thutu","max":10}],"vidu":"Hai bàn tay của bé có tất cả 10 ngón.","choi":"Thả 10 nắp chai vào rổ. Bố mẹ đọc một số từ 6 đến 10, bé bốc đúng số nắp chai đó, xếp thành hàng rồi đếm lại cho cả nhà nghe.","bm":"Khi đếm, nhắc bé chạm tay vào từng món và mỗi món chỉ đếm một lần, vì đồ vật để lộn xộn bé hay đếm sót hoặc đếm lặp."},{"id":"t1-03","ten":"Bài 3. Nhiều hơn, ít hơn, bằng nhau","tuan":3,"muctieu":["Bé so sánh được hai nhóm đồ vật bằng cách ghép từng cặp một","Bé nói đúng nhóm nào nhiều hơn, nhóm nào ít hơn, hai nhóm có bằng nhau không"],"gen":[{"k":"dem","max":10},{"k":"sosanh","max":5}],"vidu":"Nhà có 4 người mà chỉ có 3 cái ghế, vậy số ghế ít hơn số người.","choi":"Dọn bàn ăn: bé đặt cạnh mỗi cái chén một đôi đũa. Bố mẹ lén thêm hoặc bớt đũa, bé xem đũa thừa hay thiếu để nói nhiều hơn, ít hơn hay bằng nhau.","bm":"Bày bên này ít đồ mà to, bên kia nhiều đồ mà nhỏ, để bé hiểu nhiều hơn là ở số lượng chứ không phải ở chỗ nào trông to hơn."},{"id":"t1-04","ten":"Bài 4. So sánh số","tuan":3,"muctieu":["Bé so sánh được hai số trong phạm vi 10","Bé dùng đúng các dấu >, <, =","Bé xếp được ba, bốn số theo thứ tự từ bé đến lớn"],"gen":[{"k":"sosanh","max":10},{"k":"dem","max":10}],"vidu":"Bé có 7 viên bi, bạn có 5 viên, vậy 7 > 5.","choi":"Bố và bé mỗi người bốc một nắm hạt đậu rồi đếm. Bé đặt hai chiếc đũa thành dấu so sánh, miệng dấu mở về phía nắm nhiều hơn.","bm":"Dạy bé mẹo miệng cá sấu luôn há về phía số lớn, bé sẽ không viết ngược dấu > và <."},{"id":"t1-05","ten":"Bài 5. Mấy và mấy","tuan":5,"muctieu":["Bé tách được một số thành hai phần, ví dụ 5 gồm 2 và 3","Bé gộp hai nhóm nhỏ và nói được cả hai nhóm có mấy cái","Bé tìm được nhiều cách tách một số trong phạm vi 10"],"gen":[{"k":"tachgop","max":10},{"k":"dem","max":10}],"vidu":"Trong đĩa có 6 cái bánh, 4 cái nhân đậu và 2 cái nhân thịt, vậy 6 gồm 4 và 2.","choi":"Bố mẹ cầm 7 hạt đậu, chia vào hai tay rồi nắm lại, mở một tay ra. Bé đoán tay kia có mấy hạt, mở ra kiểm tra rồi đổi lượt.","bm":"Cho bé tìm hết các cách tách một số (5 gồm 1 và 4, 2 và 3...) bằng đồ vật thật trước khi làm trên giấy hay trên app."},{"id":"t1-06","ten":"Bài 6. Luyện tập chung","tuan":6,"muctieu":["Bé đếm, đọc, viết thành thạo các số từ 0 đến 10","Bé so sánh số và điền đúng dấu >, <, =","Bé tách, gộp được số trong phạm vi 10"],"gen":[{"k":"dem","max":10},{"k":"thutu","max":10},{"k":"sosanh","max":10},{"k":"tachgop","max":10}],"vidu":"Đi chợ về, bé đếm 8 quả trứng mẹ mua và nói 8 gồm 5 và 3.","choi":"Nhảy ô số: viết các số 0 đến 10 lên giấy, dán dọc hành lang. Bố mẹ hô số lớn hơn 6, số liền sau 4, số gồm 2 và 3, bé nhảy tới đúng ô.","bm":"Bài này ôn cả chủ đề, bố mẹ để ý bé còn lúng túng phần nào (đếm, dấu so sánh hay tách số) thì cho chơi thêm phần đó."}]},{"id":"cd2","ten":"Chủ đề 2. Làm quen với một số hình phẳng","tap":1,"bai":[{"id":"t1-07","ten":"Bài 7. Hình vuông, hình tròn, hình tam giác, hình chữ nhật","tuan":7,"muctieu":["Bé nhận ra và gọi đúng tên hình vuông, hình tròn, hình tam giác, hình chữ nhật","Bé tìm được đồ vật trong nhà có dạng các hình này","Bé đếm được số hình mỗi loại trong một bức tranh"],"gen":[{"k":"hinhphang"},{"k":"dem","max":10}],"vidu":"Mặt đồng hồ treo tường có dạng hình tròn, còn quyển vở có dạng hình chữ nhật.","choi":"Đi săn hình: bố mẹ gọi tên một hình, bé đi quanh nhà tìm đồ vật có dạng hình đó trong một phút, như cái đĩa, viên gạch lát nền, tấm thiệp.","bm":"Bé hay nhầm hình vuông với hình chữ nhật, bố mẹ cho bé lấy sợi dây so các cạnh: bốn cạnh dài bằng nhau mới là hình vuông."},{"id":"t1-08","ten":"Bài 8. Thực hành lắp ghép, xếp hình","tuan":8,"muctieu":["Bé ghép được các hình đã học thành hình mới như ngôi nhà, con cá","Bé xếp được que tính thành hình vuông, hình tam giác","Bé nói được hình mới được ghép từ những hình nào"],"gen":[{"k":"hinhphang"},{"k":"dem","max":10}],"vidu":"Đặt một hình tam giác lên trên một hình vuông là thành ngôi nhà.","choi":"Cắt bìa hộp bánh cũ thành vài hình vuông, tam giác, chữ nhật. Bé ghép thành ngôi nhà, con thuyền rồi đếm xem đã dùng mấy hình mỗi loại.","bm":"Để bé tự xoay, lật các mảnh ghép, đừng ghép hộ, vì bé hiểu hình tốt nhất khi tự tay thử."},{"id":"t1-09","ten":"Bài 9. Luyện tập chung","tuan":8,"muctieu":["Bé nhận dạng nhanh bốn loại hình phẳng","Bé đếm được số hình mỗi loại trong tranh ghép","Bé xếp được hình theo mẫu"],"gen":[{"k":"hinhphang"},{"k":"dem","max":10},{"k":"sosanh","max":10}],"vidu":"Trên tấm thảm có 3 hình tròn và 5 hình vuông, hình vuông nhiều hơn.","choi":"Bố mẹ dùng đũa và nắp chai xếp một hình mẫu, bé nhìn rồi xếp lại y hệt bên cạnh. Sau đó đổi vai để bé ra đề cho bố mẹ.","bm":"Khi đếm hình trong tranh, chỉ bé đánh dấu từng hình đã đếm để không đếm trùng."}]},{"id":"cd3","ten":"Chủ đề 3. Phép cộng, phép trừ trong phạm vi 10","tap":1,"bai":[{"id":"t1-10","ten":"Bài 10. Phép cộng trong phạm vi 10","tuan":9,"muctieu":["Bé hiểu phép cộng là gộp lại, thêm vào","Bé tính được phép cộng có tổng không quá 10","Bé nói được phép cộng phù hợp với một bức tranh"],"gen":[{"k":"cong","max":10},{"k":"tachgop","max":10},{"k":"toan_loi","max":10}],"vidu":"Trong rổ có 4 quả cam, mẹ bỏ thêm 2 quả, vậy 4 + 2 = 6.","choi":"Bố mẹ bỏ vài viên kẹo vào hộp, rồi thả thêm vài viên nữa trước mặt bé. Bé nói phép cộng, sau đó mở hộp đếm lại để kiểm tra.","bm":"Tập cho bé đếm thêm từ số lớn hơn (5 + 2 thì đếm tiếp 6, 7) thay vì đếm lại từ đầu, và cho bé thấy đổi chỗ hai số thì kết quả không đổi."},{"id":"t1-11","ten":"Bài 11. Phép trừ trong phạm vi 10","tuan":11,"muctieu":["Bé hiểu phép trừ là bớt đi, tách ra","Bé tính được phép trừ trong phạm vi 10","Bé nói được phép trừ phù hợp với một bức tranh"],"gen":[{"k":"tru","max":10},{"k":"tachgop","max":10},{"k":"toan_loi","max":10}],"vidu":"Có 8 cái bánh, bé ăn 3 cái, còn lại 8 - 3 = 5 cái.","choi":"Xếp 10 vỏ chai nhựa làm ki, bé lăn quả bóng. Đếm số chai bị đổ rồi nói phép trừ để biết còn mấy chai đứng.","bm":"Bé hay đếm luôn cả phần đã bớt, bố mẹ cho bé cất hẳn phần bớt đi chỗ khác rồi mới đếm phần còn lại."},{"id":"t1-12","ten":"Bài 12. Bảng cộng, bảng trừ trong phạm vi 10","tuan":13,"muctieu":["Bé thuộc bảng cộng, bảng trừ trong phạm vi 10","Bé thấy được từ một phép cộng có thể suy ra hai phép trừ","Bé tính nhanh mà không cần đếm ngón tay"],"gen":[{"k":"cong","max":10},{"k":"tru","max":10},{"k":"congtru","max":10}],"vidu":"Biết 6 + 4 = 10 thì bé suy ra được 10 - 4 = 6 và 10 - 6 = 4.","choi":"Làm bộ thẻ phép tính từ bìa hộp sữa. Bố mẹ lật từng thẻ, ai nói kết quả đúng trước thì được giữ thẻ, cuối cùng đếm xem ai nhiều thẻ hơn.","bm":"Mỗi ngày ôn vài phép tính lúc ngồi xe hay chờ cơm, ngắn mà đều đặn thì bé thuộc bảng nhanh hơn ngồi học lâu một lần."},{"id":"t1-13","ten":"Bài 13. Luyện tập chung","tuan":14,"muctieu":["Bé tính cộng, trừ thành thạo trong phạm vi 10","Bé viết được phép tính cho một tình huống trong tranh","Bé so sánh được kết quả của hai phép tính"],"gen":[{"k":"congtru","max":10},{"k":"toan_loi","max":10},{"k":"sosanh","max":10}],"vidu":"Trên cành có 7 con chim, 2 con bay đi, bé viết 7 - 2 = 5.","choi":"Chơi bán hàng: bé làm người bán, mỗi món giá từ 1 đến 5 nắp chai. Bố mẹ mua hai món, bé tính tổng; bố mẹ đưa 10 nắp chai thì bé tính số nắp phải trả lại.","bm":"Gặp bài có tranh, hỏi bé thêm vào hay bớt đi trước, rồi mới để bé viết phép tính, bé sẽ chọn đúng dấu cộng hay trừ."}]},{"id":"cd4","ten":"Chủ đề 4. Làm quen với một số hình khối","tap":1,"bai":[{"id":"t1-14","ten":"Bài 14. Khối lập phương, khối hộp chữ nhật","tuan":15,"muctieu":["Bé nhận ra và gọi đúng tên khối lập phương, khối hộp chữ nhật","Bé tìm được đồ vật trong nhà có dạng hai khối này","Bé đếm được số khối trong một hình xếp"],"gen":[{"k":"hinhkhoi"},{"k":"dem","max":10}],"vidu":"Con xúc xắc có dạng khối lập phương, hộp sữa tươi có dạng khối hộp chữ nhật.","choi":"Gom các hộp trong nhà (hộp sữa, hộp bánh, khối gỗ, xúc xắc) vào một rổ. Bé chia thành hai đống khối lập phương và khối hộp chữ nhật, rồi xếp thành tháp và đếm.","bm":"Cho bé sờ từng mặt để thấy khối lập phương có mọi mặt đều là hình vuông, còn khối hộp chữ nhật có mặt dài, mặt ngắn."},{"id":"t1-15","ten":"Bài 15. Vị trí, định hướng trong không gian","tuan":15,"muctieu":["Bé dùng đúng các từ trên, dưới, trước, sau, ở giữa","Bé phân biệt được bên phải, bên trái của mình","Bé làm theo được lời chỉ đường sang phải, sang trái"],"gen":[{"k":"vitri"}],"vidu":"Con mèo nằm dưới gầm bàn, quyển sách để trên bàn.","choi":"Giấu một món đồ chơi rồi chỉ đường bằng lời: đi thẳng, rẽ trái, nhìn dưới gối. Bé tìm được thì đổi vai, bé giấu và chỉ đường cho bố mẹ.","bm":"Đeo cho bé một sợi dây thun ở tay phải vài ngày để bé nhớ bên phải, và lưu ý bé rằng bên phải của người đứng đối diện thì ngược với bên phải của mình."},{"id":"t1-16","ten":"Bài 16. Luyện tập chung","tuan":16,"muctieu":["Bé nhận dạng khối lập phương, khối hộp chữ nhật trong đồ vật quen thuộc","Bé tả được vị trí đồ vật bằng các từ trên, dưới, trái, phải, trước, sau","Bé đếm được số khối trong hình xếp"],"gen":[{"k":"hinhkhoi"},{"k":"vitri"},{"k":"dem","max":10}],"vidu":"Trên kệ, hộp sữa đứng giữa hộp bánh và con xúc xắc.","choi":"Bố mẹ xếp ba, bốn cái hộp thành hàng rồi đố: hộp nào ở giữa, cái gì nằm bên trái hộp sữa. Sau đó bé tự xếp và đố lại bố mẹ.","bm":"Khi bé trả lời vị trí, khuyến khích bé nói cả câu, ví dụ hộp sữa ở bên phải con xúc xắc, để luyện cả cách nói."}]},{"id":"cd5","ten":"Chủ đề 5. Ôn tập học kì 1","tap":1,"bai":[{"id":"t1-17","ten":"Bài 17. Ôn tập các số trong phạm vi 10","tuan":17,"muctieu":["Bé đếm, đọc, viết được các số từ 0 đến 10","Bé so sánh, xếp thứ tự các số trong phạm vi 10","Bé tách, gộp được số trong phạm vi 10"],"gen":[{"k":"dem","max":10},{"k":"thutu","max":10},{"k":"sosanh","max":10},{"k":"tachgop","max":10}],"vidu":"Bé đếm số bậc cầu thang từ cửa vào nhà và đọc to từng số.","choi":"Viết các số 0 đến 10 lên giấy rồi úp xuống. Mỗi người rút hai thẻ, ai có thẻ lớn hơn được một điểm, nhưng phải nói thêm số đó gồm mấy và mấy.","bm":"Đây là bài ôn trước kiểm tra học kì, cho bé làm ít câu mà chắc và khen khi bé tự sửa được lỗi của mình."},{"id":"t1-18","ten":"Bài 18. Ôn tập phép cộng, phép trừ trong phạm vi 10","tuan":17,"muctieu":["Bé tính nhanh phép cộng, phép trừ trong phạm vi 10","Bé viết được phép tính phù hợp với tranh hoặc câu chuyện ngắn","Bé biết thử lại phép trừ bằng phép cộng"],"gen":[{"k":"cong","max":10},{"k":"tru","max":10},{"k":"congtru","max":10},{"k":"toan_loi","max":10}],"vidu":"Mẹ có 9 cái bánh, cho bé 4 cái, mẹ còn 9 - 4 = 5 cái.","choi":"Bố mẹ giơ hai bàn tay với số ngón khác nhau, bé nói tổng. Sau đó bố mẹ giơ một số ngón rồi gập bớt vài ngón, bé nói còn lại mấy.","bm":"Khuyến khích bé tự kiểm tra: làm xong 9 - 4 = 5 thì thử lại xem 5 + 4 có bằng 9 không."},{"id":"t1-19","ten":"Bài 19. Ôn tập hình học","tuan":18,"muctieu":["Bé nhận dạng được hình vuông, hình tròn, hình tam giác, hình chữ nhật","Bé nhận dạng được khối lập phương, khối hộp chữ nhật","Bé dùng đúng các từ chỉ vị trí và hướng"],"gen":[{"k":"hinhphang"},{"k":"hinhkhoi"},{"k":"vitri"}],"vidu":"Viên gạch lát nền có dạng hình vuông, còn cái tủ lạnh có dạng khối hộp chữ nhật.","choi":"Bố mẹ tả một đồ vật trong phòng, ví dụ nó có dạng khối hộp chữ nhật và nằm bên trái ti vi, bé đoán đó là gì rồi đến lượt bé tả.","bm":"Nhắc bé gọi là hình khi vẽ phẳng trên giấy, gọi là khối khi là đồ vật cầm được trên tay."},{"id":"t1-20","ten":"Bài 20. Ôn tập chung","tuan":18,"muctieu":["Bé ôn lại các số và phép tính trong phạm vi 10","Bé ôn lại hình phẳng, hình khối và vị trí","Bé giải được bài toán bằng tranh ngắn"],"gen":[{"k":"congtru","max":10},{"k":"sosanh","max":10},{"k":"toan_loi","max":10},{"k":"hinhphang"},{"k":"hinhkhoi"},{"k":"vitri"}],"vidu":"Trên bàn có 3 cái đĩa tròn và 4 cái khăn vuông, tất cả là 7 món.","choi":"Đường đua ôn tập: dán 10 tờ giấy trên sàn, mỗi tờ một câu đố nhỏ (một phép tính, một hình cần gọi tên, một vị trí cần chỉ). Bé giải hết các tờ là về đích.","bm":"Ghi lại vài câu bé còn sai để ôn tiếp trong kỳ nghỉ giữa năm, mỗi ngày chừng 10 phút là đủ."}]},{"id":"cd6","ten":"Chủ đề 6. Các số đến 100","tap":2,"bai":[{"id":"t1-21","ten":"Bài 21. Số có hai chữ số","tuan":19,"muctieu":["Bé đếm được theo chục và đơn vị, ví dụ 3 chục và 5 đơn vị là 35","Bé đọc, viết được các số có hai chữ số","Bé nhận ra các số tròn chục như 10, 20, 30"],"gen":[{"k":"chucdv","max":99},{"k":"so100","max":99},{"k":"dem","max":20}],"vidu":"Một vỉ trứng có 10 quả, 2 vỉ và 3 quả lẻ là 23 quả.","choi":"Bé bó que kem hoặc ống hút thành từng bó 10 bằng dây thun. Bố mẹ nói một số như 42, bé lấy 4 bó và 2 que lẻ.","bm":"Bé hay đọc sai khi hàng đơn vị là 1, 4, 5, bố mẹ luyện kỹ cách đọc hai mươi mốt, ba mươi tư, năm mươi lăm, mười lăm."},{"id":"t1-22","ten":"Bài 22. So sánh số có hai chữ số","tuan":20,"muctieu":["Bé so sánh được hai số có hai chữ số","Bé biết so hàng chục trước, hàng chục bằng nhau thì so hàng đơn vị","Bé tìm được số lớn nhất, số bé nhất trong một nhóm số"],"gen":[{"k":"sosanh","max":99},{"k":"so100","max":99},{"k":"chucdv","max":99}],"vidu":"Bé được 45 điểm, anh được 54 điểm, vì 4 chục ít hơn 5 chục nên 45 < 54.","choi":"Mỗi người rút hai thẻ số từ 0 đến 9 rồi ghép thành số có hai chữ số, ai ghép được số lớn hơn thì thắng ván đó.","bm":"Bé hay thấy chữ số hàng đơn vị lớn mà cho là số lớn hơn (như 29 và 31), bố mẹ cho bé xếp bằng bó que để thấy số chục mới quyết định."},{"id":"t1-23","ten":"Bài 23. Bảng các số từ 1 đến 100","tuan":21,"muctieu":["Bé đếm được từ 1 đến 100","Bé tìm được số liền trước, số liền sau của một số","Bé nhận ra quy luật của bảng 100 ô theo hàng và theo cột"],"gen":[{"k":"thutu","max":100},{"k":"so100","max":100}],"vidu":"Truyện bé đang đọc dừng ở trang 39, trang tiếp theo là trang 40.","choi":"Kẻ bảng 100 ô, bố mẹ che vài ô bằng nắp chai. Bé đoán số dưới nắp rồi lật ra kiểm tra.","bm":"Bé hay ngập ngừng ở chỗ chuyển chục như 29 sang 30, 59 sang 60, nên cho bé đếm to những đoạn này nhiều lần."},{"id":"t1-24","ten":"Bài 24. Luyện tập chung","tuan":22,"muctieu":["Bé đọc, viết và tách được số có hai chữ số thành chục và đơn vị","Bé so sánh và xếp thứ tự các số đến 100","Bé điền được số còn thiếu trong dãy số"],"gen":[{"k":"chucdv","max":99},{"k":"so100","max":100},{"k":"sosanh","max":99},{"k":"thutu","max":100}],"vidu":"Bé đếm được 36 viên bi và nói 36 gồm 3 chục và 6 đơn vị.","choi":"Đổ ra một nắm hạt đậu, bé xếp thành từng nhóm 10 rồi đếm xem có mấy chục, mấy đơn vị và ghi số lên giấy. Đổi nắm khác và so xem nắm nào nhiều hơn.","bm":"Khi đếm số lượng lớn, khuyên bé gom từng nhóm 10 trước, vừa nhanh vừa ít sai."}]},{"id":"cd7","ten":"Chủ đề 7. Độ dài và đo độ dài","tap":2,"bai":[{"id":"t1-25","ten":"Bài 25. Dài hơn, ngắn hơn","tuan":22,"muctieu":["Bé so sánh được hai đồ vật cái nào dài hơn, ngắn hơn, cao hơn, thấp hơn","Bé biết đặt hai vật bằng nhau ở một đầu khi so độ dài","Bé tìm được vật dài nhất, ngắn nhất trong một nhóm"],"gen":[{"k":"dodai"}],"vidu":"Đặt hai cây bút sát nhau, cây bút chì dài hơn cây bút sáp.","choi":"Bé tìm trong nhà ba món đồ như cái thìa, chiếc đũa, cây lược và xếp từ ngắn nhất đến dài nhất. Sau đó cả nhà đứng sát lưng để bé so ai cao hơn.","bm":"Nhắc bé đặt hai vật bằng nhau ở một đầu rồi mới so, nếu không bé dễ kết luận sai."},{"id":"t1-26","ten":"Bài 26. Đơn vị đo độ dài","tuan":23,"muctieu":["Bé đo được độ dài bằng gang tay, bước chân, que tính","Bé biết xăng-ti-mét là đơn vị đo độ dài, viết tắt là cm","Bé dùng thước kẻ đo được đồ vật ngắn"],"gen":[{"k":"dodai"}],"vidu":"Bé đo cái bàn học được 5 gang tay của bé nhưng chỉ được 4 gang tay của bố.","choi":"Bé dùng thước kẻ đo cây bút, cục tẩy, chiếc thìa, ghi số xăng-ti-mét lên giấy nhớ rồi dán vào từng món.","bm":"Bé hay đặt vạch số 1 của thước vào đầu vật, dặn bé luôn đặt vạch 0 trùng với một đầu của vật cần đo."},{"id":"t1-27","ten":"Bài 27. Thực hành ước lượng và đo độ dài","tuan":24,"muctieu":["Bé ước lượng được độ dài đồ vật bằng gang tay, que tính, xăng-ti-mét","Bé đo lại để kiểm tra điều mình ước lượng","Bé hiểu ước lượng là đoán gần đúng"],"gen":[{"k":"dodai"}],"vidu":"Bé đoán quyển vở dài khoảng 3 gang tay, đo thử thấy đúng 3 gang.","choi":"Cả nhà đoán cái gối dài mấy gang tay và viết ra giấy, rồi bé đo. Ai đoán gần nhất được chọn món tráng miệng tối nay.","bm":"Khen bé khi đoán gần đúng, vì mục tiêu là bé có cảm giác về độ dài chứ không phải đoán trúng hoàn toàn."},{"id":"t1-28","ten":"Bài 28. Luyện tập chung","tuan":24,"muctieu":["Bé so sánh, đo và ước lượng được độ dài đồ vật","Bé đọc đúng số đo trên thước theo xăng-ti-mét","Bé so sánh được hai số đo, ví dụ 12 cm dài hơn 9 cm"],"gen":[{"k":"dodai"},{"k":"so100","max":100},{"k":"sosanh","max":99}],"vidu":"Bé đo bút chì dài 12 cm, bút sáp dài 8 cm, vậy bút chì dài hơn.","choi":"Bé đo các món đồ chơi bằng thước kẻ, ghi số đo, rồi xếp chúng thành hàng từ ngắn đến dài và đọc to số đo từng món.","bm":"Cho bé tự cầm thước đo nhiều đồ thật trong nhà, vì làm trên giấy thì đúng nhưng đo thật bé mới thấy chỗ mình hay đặt thước lệch."}]},{"id":"cd8","ten":"Chủ đề 8. Phép cộng, phép trừ (không nhớ) trong phạm vi 100","tap":2,"bai":[{"id":"t1-29","ten":"Bài 29. Phép cộng số có hai chữ số với số có một chữ số","tuan":25,"muctieu":["Bé đặt tính và tính được phép cộng như 32 + 5","Bé biết cộng hàng đơn vị với hàng đơn vị, giữ nguyên hàng chục","Bé tính nhẩm được phép cộng số tròn chục với số có một chữ số"],"gen":[{"k":"cong100"},{"k":"chucdv","max":99}],"vidu":"Lọ có 23 viên kẹo, mẹ bỏ thêm 4 viên, vậy có 23 + 4 = 27 viên.","choi":"Dùng bó ống hút: bé lấy 3 bó và 2 ống lẻ, thêm 5 ống nữa, đếm xem được bao nhiêu rồi viết phép cộng.","bm":"Khi đặt tính, nhắc bé viết số có một chữ số thẳng cột với hàng đơn vị, vì bé hay viết lệch sang cột chục."},{"id":"t1-30","ten":"Bài 30. Phép cộng số có hai chữ số với số có hai chữ số","tuan":26,"muctieu":["Bé đặt tính và tính được phép cộng như 34 + 25","Bé cộng đơn vị với đơn vị, chục với chục","Bé tính nhẩm được phép cộng các số tròn chục như 20 + 30"],"gen":[{"k":"cong100"},{"k":"chucdv","max":99}],"vidu":"Lớp có 15 bạn nam và 14 bạn nữ, cả lớp có 15 + 14 = 29 bạn.","choi":"Cắt giấy làm thẻ ghi 10 và thẻ ghi 1. Bố mẹ đưa 2 thẻ 10 và 3 thẻ 1, rồi đưa thêm 1 thẻ 10 và 4 thẻ 1, bé gom lại và tính tổng.","bm":"Dặn bé luôn tính từ phải sang trái, hàng đơn vị trước rồi mới tới hàng chục."},{"id":"t1-31","ten":"Bài 31. Phép trừ số có hai chữ số cho số có một chữ số","tuan":27,"muctieu":["Bé đặt tính và tính được phép trừ như 38 - 5","Bé biết trừ hàng đơn vị, giữ nguyên hàng chục","Bé tính nhẩm được phép trừ đơn giản"],"gen":[{"k":"tru100"},{"k":"chucdv","max":99}],"vidu":"Bé có 27 nhãn dán, tặng bạn 4 cái, còn 27 - 4 = 23 cái.","choi":"Bày 3 bó ống hút và 6 ống lẻ, bé lấy đi số ống lẻ theo lời bố mẹ, đếm xem còn bao nhiêu rồi viết phép trừ.","bm":"Lớp 1 chỉ học trừ không nhớ, nếu bé hỏi những phép như 32 - 5 thì bố mẹ hẹn lên lớp 2 sẽ học, chưa cần giải thích lúc này."},{"id":"t1-32","ten":"Bài 32. Phép trừ số có hai chữ số cho số có hai chữ số","tuan":28,"muctieu":["Bé đặt tính và tính được phép trừ như 58 - 23","Bé trừ đơn vị với đơn vị, chục với chục","Bé thử lại được kết quả bằng phép cộng"],"gen":[{"k":"tru100"},{"k":"cong100"}],"vidu":"Cuốn truyện có 48 trang, bé đã đọc 25 trang, còn 48 - 25 = 23 trang.","choi":"Dán một phép trừ lên cửa tủ lạnh mỗi ngày, bé tính đúng thì được lấy món ăn vặt; cuối tuần bé tự ra đề dán cho bố mẹ.","bm":"Bé hay lấy số lớn trừ số bé ở từng cột mà không để ý số nào nằm trên, dặn bé luôn lấy số ở trên trừ số ở dưới."},{"id":"t1-33","ten":"Bài 33. Luyện tập chung","tuan":29,"muctieu":["Bé cộng, trừ không nhớ thành thạo trong phạm vi 100","Bé giải được bài toán có lời văn ngắn với một phép tính","Bé so sánh được kết quả các phép tính"],"gen":[{"k":"cong100"},{"k":"tru100"},{"k":"toan_loi","max":100},{"k":"sosanh","max":99}],"vidu":"Vườn có 35 cây cam và 20 cây bưởi, cả vườn có 55 cây.","choi":"Ném bóng giấy vào ba cái rổ ghi 10 điểm, 20 điểm và 5 điểm. Sau mỗi lượt bé tự cộng điểm của mình, ai đủ 60 điểm trước thì thắng.","bm":"Với bài toán có lời văn, đọc chậm cho bé nghe, hỏi bài cho biết gì và hỏi gì, rồi mới để bé chọn phép tính."}]},{"id":"cd9","ten":"Chủ đề 9. Thời gian, giờ và lịch","tap":2,"bai":[{"id":"t1-34","ten":"Bài 34. Xem giờ đúng trên đồng hồ","tuan":30,"muctieu":["Bé nhận ra kim ngắn chỉ giờ, kim dài chỉ phút","Bé đọc được giờ đúng khi kim dài chỉ số 12","Bé nói được giờ của các việc hằng ngày như ăn sáng, đi ngủ"],"gen":[{"k":"dongho"}],"vidu":"Kim dài chỉ số 12, kim ngắn chỉ số 7 là 7 giờ, giờ bé đi học.","choi":"Làm đồng hồ từ cái đĩa giấy và hai que tăm. Bố mẹ nói một việc như bé ăn tối, bé xoay kim chỉ đúng giờ đó.","bm":"Bé hay nhầm hai kim, cho bé nhớ kim ngắn chỉ giờ, còn kim dài đứng ở số 12 là giờ đúng."},{"id":"t1-35","ten":"Bài 35. Các ngày trong tuần","tuan":30,"muctieu":["Bé biết một tuần có 7 ngày và đọc thuộc tên các ngày từ thứ Hai đến Chủ nhật","Bé nói được hôm nay, hôm qua, ngày mai là thứ mấy","Bé gắn được việc của mình với từng ngày trong tuần"],"gen":[{"k":"lich"}],"vidu":"Hôm nay thứ Sáu thì ngày mai là thứ Bảy, bé được nghỉ học.","choi":"Làm lịch tuần bằng 7 tờ giấy dán tường, mỗi tối bé lật sang ngày mới và kể ngày mai mình có việc gì.","bm":"Bé hay quên Chủ nhật đứng sau thứ Bảy và là ngày cuối tuần, mỗi sáng đọc nối các ngày như một bài hát thì bé nhớ nhanh."},{"id":"t1-36","ten":"Bài 36. Thực hành xem lịch và giờ","tuan":31,"muctieu":["Bé đọc được tờ lịch: thứ mấy, ngày mấy, tháng mấy","Bé xem được giờ đúng trên đồng hồ thật trong nhà","Bé xếp được các việc trong ngày theo giờ"],"gen":[{"k":"lich"},{"k":"dongho"}],"vidu":"Sáng nay bé xé tờ lịch và đọc: thứ Ba, ngày 15, tháng 4.","choi":"Mỗi sáng giao bé xem lịch bàn và đồng hồ treo tường, báo cho cả nhà hôm nay thứ mấy, ngày mấy và bây giờ mấy giờ.","bm":"Nên dùng lịch có số ngày to, ít chữ để bé tự đọc, lịch ghi cả âm lịch và nhiều chữ dễ làm bé rối."},{"id":"t1-37","ten":"Bài 37. Luyện tập chung","tuan":32,"muctieu":["Bé xem giờ đúng nhanh và chính xác","Bé nói được hôm qua, ngày mai là thứ mấy, ngày mấy","Bé giải được bài toán đơn giản về giờ và ngày"],"gen":[{"k":"dongho"},{"k":"lich"}],"vidu":"Bé bắt đầu học bơi lúc 4 giờ chiều, học một giờ thì 5 giờ về nhà.","choi":"Bé làm hướng dẫn viên: bố mẹ hỏi cuối tuần này đi chơi thứ mấy, mấy giờ xuất phát, bé xem lịch và xoay đồng hồ giấy để trả lời.","bm":"Gắn bài học vào việc thật của bé như giờ xem hoạt hình, ngày đi thăm ông bà, bé sẽ nhớ lâu hơn làm bài trên giấy."}]},{"id":"cd10","ten":"Chủ đề 10. Ôn tập cuối năm","tap":2,"bai":[{"id":"t1-38","ten":"Bài 38. Ôn tập các số và phép tính trong phạm vi 10","tuan":32,"muctieu":["Bé đọc, viết, so sánh được các số từ 0 đến 10","Bé cộng, trừ thành thạo trong phạm vi 10","Bé giải được bài toán bằng tranh với một phép tính"],"gen":[{"k":"dem","max":10},{"k":"sosanh","max":10},{"k":"tachgop","max":10},{"k":"congtru","max":10},{"k":"toan_loi","max":10}],"vidu":"Nhà có 6 người, đã bày 4 cái ghế, bé tính cần mang thêm 2 cái.","choi":"Chơi Bingo số: kẻ bảng 3 ô x 3 ô ghi các số từ 0 đến 10. Bố mẹ đọc phép tính, bé tính rồi đặt nắp chai lên ô kết quả, đủ một hàng là hô Bingo.","bm":"Phần này là nền cho cả lớp 2, nếu bé vẫn đếm ngón tay khi tính thì luyện thêm bảng cộng, trừ qua trò chơi mỗi ngày."},{"id":"t1-39","ten":"Bài 39. Ôn tập các số và phép tính trong phạm vi 100","tuan":33,"muctieu":["Bé đọc, viết, so sánh được các số đến 100","Bé cộng, trừ không nhớ trong phạm vi 100","Bé giải được bài toán có lời văn với một phép tính"],"gen":[{"k":"so100","max":100},{"k":"chucdv","max":99},{"k":"cong100"},{"k":"tru100"},{"k":"toan_loi","max":100}],"vidu":"Bé có 45 viên bi, được anh cho 30 viên, bé có tất cả 75 viên.","choi":"Đua về đích 100: dùng bảng 100 ô và xúc xắc, mỗi lượt bé gieo, tiến số ô bằng số chấm và đọc số ô mình đứng. Gặp ô có dấu sao thì phải tính một phép cộng hoặc trừ.","bm":"Kiểm tra bé đọc đúng các số như 15, 21, 54, 75 và đặt tính thẳng cột, đây là hai lỗi hay gặp nhất cuối năm."},{"id":"t1-40","ten":"Bài 40. Ôn tập hình học và đo lường","tuan":34,"muctieu":["Bé nhận dạng được hình phẳng, hình khối và nói đúng vị trí đồ vật","Bé đo, so sánh được độ dài theo xăng-ti-mét","Bé xem được giờ đúng và đọc được tờ lịch"],"gen":[{"k":"hinhphang"},{"k":"hinhkhoi"},{"k":"vitri"},{"k":"dodai"},{"k":"dongho"},{"k":"lich"}],"vidu":"Bé đo hộp bút dài 20 cm và nhận ra nó có dạng khối hộp chữ nhật.","choi":"Thẻ nhiệm vụ: mỗi thẻ là một việc nhỏ như tìm một vật hình tròn, đo cái thìa, xoay đồng hồ giấy về 9 giờ, đọc thứ trên lịch. Bé rút thẻ và làm xong trong 5 phút.","bm":"Để bé thực hành với đồ thật trong nhà như thước, đồng hồ, tờ lịch chứ không chỉ làm trên app."},{"id":"t1-41","ten":"Bài 41. Ôn tập chung","tuan":35,"muctieu":["Bé ôn lại toàn bộ kiến thức Toán lớp 1","Bé tự tin làm bài kiểm tra cuối năm","Bé biết tự soát lại bài làm"],"gen":[{"k":"congtru","max":10},{"k":"so100","max":100},{"k":"cong100"},{"k":"tru100"},{"k":"toan_loi","max":100},{"k":"dodai"},{"k":"dongho"},{"k":"hinhphang"}],"vidu":"Đi siêu thị, bé đếm số món trong giỏ, so xem hộp nào dài hơn và xem đồng hồ để biết mấy giờ về nhà.","choi":"Đố vui cả nhà: mỗi người ra cho nhau một câu đố về phép tính, hình, giờ hoặc độ dài. Bé trả lời đúng được một ngôi sao, đủ 10 sao được chọn trò chơi cuối tuần.","bm":"Trước kiểm tra, cho bé làm bài vừa sức để bé vui và tự tin, nhắc bé đọc kỹ đề và soát lại từng câu."}]}]},"eng1":{"framework":"Cambridge Primary English as a Second Language curriculum framework (0057), Stage 1: các mạch Listening, Speaking, Reading, Writing, Use of English. Vốn từ đối chiếu danh sách từ Cambridge English Pre A1 Starters (bản 2018, dùng cho kỳ thi từ 2018).","wordlist":"Pre A1 Starters","units":[{"id":"e1-01","en":"Hello!","vi":"Xin chào","tuan":"1-3","words":[{"w":"hello","e":"👋","vi":"xin chào"},{"w":"hi","e":"🙋","vi":"chào (thân mật)"},{"w":"boy","e":"👦","vi":"bạn trai"},{"w":"girl","e":"👧","vi":"bạn gái"},{"w":"friend","e":"🧑‍🤝‍🧑","vi":"bạn bè"},{"w":"teacher","e":"🧑‍🏫","vi":"cô giáo, thầy giáo"},{"w":"name","e":"📛","vi":"tên"},{"w":"happy","e":"😊","vi":"vui"},{"w":"sad","e":"😢","vi":"buồn"},{"w":"thank you","e":"🙏","vi":"cảm ơn"},{"w":"yes","e":"✅","vi":"vâng, có"},{"w":"no","e":"❌","vi":"không"}],"phrases":[{"en":"Hello! I'm Bingo.","vi":"Xin chào! Mình là Bingo."},{"en":"What's your name? My name's Anna.","vi":"Bạn tên là gì? Mình tên là Anna."},{"en":"How old are you? I'm six.","vi":"Bạn mấy tuổi? Mình sáu tuổi."},{"en":"Thank you!","vi":"Cảm ơn bạn!"},{"en":"Goodbye! See you!","vi":"Tạm biệt! Hẹn gặp lại!"}],"phonics":{"letters":["a","b"],"words":["apple","animal","bag","ball","book"]},"goals":["Bé nghe và đáp lại lời chào, câu hỏi tên, tuổi khi cô hoặc bố mẹ nói chậm","Bé tự chào và giới thiệu tên, tuổi của mình bằng một câu ngắn","Bé nhận ra chữ A a, B b, nói được âm đầu của apple và ball","Bé tô chữ A, B và chép tên mình, viết hoa chữ cái đầu tên"],"game":"Chào theo nhạc: bật một bài hát vui, cả nhà đi vòng quanh phòng, nhạc tắt thì đứng lại, bắt tay người gần nhất và nói Hello! I'm... Chơi 5 đến 6 lượt, mỗi lượt đổi giọng to, nhỏ, vui, buồn cho bé đoán happy hay sad.","parent":"Bố mẹ không cần phát âm chuẩn, chỉ cần chào con bằng Hello mỗi sáng và Goodbye khi đưa con tới lớp. Chữ a trong apple đọc mở miệng rộng, nghe gần giữa a và e của tiếng Việt, khác chữ a trong tên bé."},{"id":"e1-02","en":"My classroom","vi":"Lớp học của em","tuan":"4-6","words":[{"w":"school","e":"🏫","vi":"trường học"},{"w":"book","e":"📖","vi":"quyển sách"},{"w":"pen","e":"🖊️","vi":"bút mực"},{"w":"pencil","e":"✏️","vi":"bút chì"},{"w":"crayon","e":"🖍️","vi":"bút sáp màu"},{"w":"ruler","e":"📏","vi":"thước kẻ"},{"w":"bag","e":"🎒","vi":"cặp sách"},{"w":"chair","e":"🪑","vi":"cái ghế"},{"w":"computer","e":"💻","vi":"máy tính"},{"w":"paper","e":"📄","vi":"giấy"},{"w":"clock","e":"🕒","vi":"đồng hồ"}],"phrases":[{"en":"What's this? It's a pencil.","vi":"Đây là cái gì? Đó là cái bút chì."},{"en":"Is it a pen? Yes, it is.","vi":"Đó có phải bút mực không? Đúng rồi."},{"en":"Open your book, please.","vi":"Con mở sách ra nhé."},{"en":"Close your book.","vi":"Con gấp sách lại."},{"en":"Stand up. Sit down.","vi":"Đứng lên. Ngồi xuống."}],"phonics":{"letters":["c","d"],"words":["cat","car","cake","dog","duck","doll","desk"]},"goals":["Bé nghe và làm theo các lệnh quen thuộc trong lớp: mở sách, gấp sách, đứng lên, ngồi xuống","Bé gọi tên đồ dùng học tập và hỏi đáp được What's this? It's a...","Bé đọc chữ C c, D d và ghép âm đầu với hình con mèo, con chó","Bé dùng a trước tên đồ vật (a pen, a book) và tập viết chữ c, d"],"game":"Simon says: bố mẹ hô Simon says stand up! thì bé đứng lên, Simon says open your book! thì bé mở sách. Nếu bố mẹ chỉ hô Sit down! mà không có Simon says thì bé phải đứng yên. Đổi vai cho bé làm người hô.","parent":"Khi con đi học về, bố mẹ lấy từng món trong cặp ra hỏi What's this? cho con trả lời. Chữ c trong cat, car đọc như chữ k của tiếng Việt, không đọc như x."},{"id":"e1-03","en":"Colours","vi":"Màu sắc","tuan":"7-9","words":[{"w":"red","e":"🔴","vi":"màu đỏ"},{"w":"blue","e":"🔵","vi":"màu xanh dương"},{"w":"yellow","e":"🟡","vi":"màu vàng"},{"w":"green","e":"🟢","vi":"màu xanh lá"},{"w":"orange","e":"🟠","vi":"màu cam"},{"w":"purple","e":"🟣","vi":"màu tím"},{"w":"pink","e":"🌸","vi":"màu hồng"},{"w":"brown","e":"🟤","vi":"màu nâu"},{"w":"black","e":"⚫","vi":"màu đen"},{"w":"white","e":"⚪","vi":"màu trắng"}],"phrases":[{"en":"What colour is it? It's red.","vi":"Nó màu gì? Nó màu đỏ."},{"en":"Is it green? No, it isn't. It's blue.","vi":"Nó màu xanh lá à? Không phải. Nó màu xanh dương."},{"en":"I like yellow.","vi":"Mình thích màu vàng."},{"en":"My favourite colour is pink.","vi":"Màu mình thích nhất là màu hồng."},{"en":"Colour the apple red.","vi":"Tô quả táo màu đỏ."}],"phonics":{"letters":["e","f"],"words":["egg","elephant","fish","frog","face","foot"]},"goals":["Bé nghe tên màu và tô hoặc chọn đúng màu","Bé hỏi và trả lời What colour is it? It's...","Bé đọc tên các màu khi có chấm màu bên cạnh, nhận ra chữ E e, F f","Bé đặt màu trước đồ vật khi nói (a red ball, a blue bag)"],"game":"Chạy tìm màu: bố mẹ hô Red!, bé chạy chạm vào một đồ vật màu đỏ trong nhà và nói It's red! Đổi 6 đến 8 màu, càng về sau hô càng nhanh.","parent":"Tiếng Anh đặt màu trước đồ vật (a red ball), ngược với tiếng Việt (quả bóng đỏ). Bé nói ngược thì bố mẹ chỉ nhắc lại câu đúng một lần, không cần bắt con sửa."},{"id":"e1-04","en":"Numbers 1 to 10","vi":"Số đếm từ 1 đến 10","tuan":"10-12","words":[{"w":"one","e":"1️⃣","vi":"một"},{"w":"two","e":"2️⃣","vi":"hai"},{"w":"three","e":"3️⃣","vi":"ba"},{"w":"four","e":"4️⃣","vi":"bốn"},{"w":"five","e":"5️⃣","vi":"năm"},{"w":"six","e":"6️⃣","vi":"sáu"},{"w":"seven","e":"7️⃣","vi":"bảy"},{"w":"eight","e":"8️⃣","vi":"tám"},{"w":"nine","e":"9️⃣","vi":"chín"},{"w":"ten","e":"🔟","vi":"mười"}],"phrases":[{"en":"How many balls? Five balls.","vi":"Có mấy quả bóng? Năm quả bóng."},{"en":"Let's count to ten!","vi":"Cùng đếm đến mười nào!"},{"en":"I've got two hands.","vi":"Mình có hai bàn tay."},{"en":"Point to number seven.","vi":"Chỉ vào số bảy."}],"phonics":{"letters":["g","h"],"words":["goat","girl","garden","game","hat","hand","horse","house"]},"goals":["Bé đếm xuôi từ 1 đến 10 và đếm ngược từ 10 về 1","Bé nghe một số và chỉ đúng chữ số, trả lời được How many...?","Bé thêm s khi nói nhiều đồ vật (three apples, two cats)","Bé đọc chữ G g, H h và chép các từ one, two, three"],"game":"Nhảy theo số: bố mẹ hô Jump four!, bé vừa nhảy vừa đếm to one, two, three, four. Đổi sang Clap six! (vỗ tay sáu cái), Wave three! (vẫy tay ba lần).","parent":"Lúc leo cầu thang, xếp giày hay bày bát đũa, bố mẹ đếm bằng tiếng Anh cùng con. Nhắc con đọc rõ âm s cuối từ khi có nhiều đồ vật, vì tiếng Việt không có âm cuối này."},{"id":"e1-05","en":"My family","vi":"Gia đình em","tuan":"13-15","words":[{"w":"family","e":"👨‍👩‍👧‍👦","vi":"gia đình"},{"w":"mum","e":"👩","vi":"mẹ"},{"w":"dad","e":"👨","vi":"bố"},{"w":"brother","e":"👦","vi":"anh trai, em trai"},{"w":"sister","e":"👧","vi":"chị gái, em gái"},{"w":"baby","e":"👶","vi":"em bé"},{"w":"grandma","e":"👵","vi":"bà"},{"w":"grandpa","e":"👴","vi":"ông"},{"w":"photo","e":"📸","vi":"bức ảnh"},{"w":"love","e":"❤️","vi":"yêu thương"}],"phrases":[{"en":"This is my mum.","vi":"Đây là mẹ của mình."},{"en":"Who's this? It's my brother.","vi":"Đây là ai? Đó là anh trai mình."},{"en":"He's my dad. She's my grandma.","vi":"Đó là bố mình. Đó là bà mình."},{"en":"Have you got a sister? No, I haven't.","vi":"Bạn có chị gái không? Mình không có."},{"en":"I love my family.","vi":"Mình yêu gia đình mình."}],"phonics":{"letters":["i","j"],"words":["in","it","big","fish","jump","juice","jacket","jeans"]},"goals":["Bé nghe câu hỏi Who's this? và chỉ đúng người trong ảnh","Bé giới thiệu từng người trong nhà bằng This is my...","Bé dùng he cho nam, she cho nữ khi nói về người trong nhà","Bé đọc chữ I i, J j và chép từ mum, dad"],"game":"Hướng dẫn viên album: lấy ảnh gia đình, bé chỉ từng người và nói This is my... Sau đó đổi vai, bố mẹ cố tình nói sai một người để bé phát hiện và sửa: No! It's my grandpa.","parent":"Tiếng Việt phân biệt ông bà nội, ngoại, anh hay em, còn ở mức này tiếng Anh chỉ cần grandma, grandpa, brother, sister. Bé hỏi thì bố mẹ giải thích một từ dùng chung cho cả hai bên."},{"id":"e1-06","en":"My toys","vi":"Đồ chơi của em","tuan":"16-18","words":[{"w":"teddy","e":"🧸","vi":"gấu bông"},{"w":"ball","e":"⚽","vi":"quả bóng"},{"w":"doll","e":"🪆","vi":"búp bê"},{"w":"kite","e":"🪁","vi":"cái diều"},{"w":"robot","e":"🤖","vi":"rô-bốt"},{"w":"car","e":"🚗","vi":"ô tô"},{"w":"train","e":"🚂","vi":"tàu hỏa"},{"w":"balloon","e":"🎈","vi":"bóng bay"},{"w":"bike","e":"🚲","vi":"xe đạp"},{"w":"plane","e":"✈️","vi":"máy bay"},{"w":"boat","e":"⛵","vi":"con thuyền"}],"phrases":[{"en":"I've got a kite.","vi":"Mình có một cái diều."},{"en":"Have you got a robot? Yes, I have.","vi":"Bạn có rô-bốt không? Mình có."},{"en":"Where's my ball? It's under the bed.","vi":"Quả bóng của mình đâu rồi? Nó ở dưới gầm giường."},{"en":"The teddy is on the chair.","vi":"Gấu bông ở trên ghế."},{"en":"Let's play!","vi":"Cùng chơi nào!"}],"phonics":{"letters":["k","l"],"words":["kite","kick","kiwi","kitchen","leg","lemon","lamp","lizard"]},"goals":["Bé gọi tên đồ chơi và nói mình có gì bằng I've got...","Bé nghe và đặt đồ chơi đúng chỗ in, on, under","Bé đọc và ghép các từ ngắn ball, car, kite với hình","Bé viết chữ k, l và chép một câu ngắn có dấu chấm cuối câu"],"game":"Đi tìm đồ chơi: bố mẹ giấu 3 món đồ chơi, bé hỏi Where's my teddy?, bố mẹ gợi ý It's under the table hoặc It's on the sofa, bé chạy đi tìm. Tìm được thì bé giấu lại cho bố mẹ tìm.","parent":"Ba từ in, on, under bé hay lẫn. Bố mẹ đặt đồ thật rồi hỏi Where's the ball?, cho con chỉ tay trước, nói sau. Dùng đồ chơi thật của con sẽ nhớ nhanh hơn tranh."},{"id":"e1-07","en":"Numbers 11 to 20","vi":"Số đếm từ 11 đến 20","tuan":"19-21","words":[{"w":"eleven","e":"1️⃣1️⃣","vi":"mười một"},{"w":"twelve","e":"1️⃣2️⃣","vi":"mười hai"},{"w":"thirteen","e":"1️⃣3️⃣","vi":"mười ba"},{"w":"fourteen","e":"1️⃣4️⃣","vi":"mười bốn"},{"w":"fifteen","e":"1️⃣5️⃣","vi":"mười lăm"},{"w":"sixteen","e":"1️⃣6️⃣","vi":"mười sáu"},{"w":"seventeen","e":"1️⃣7️⃣","vi":"mười bảy"},{"w":"eighteen","e":"1️⃣8️⃣","vi":"mười tám"},{"w":"nineteen","e":"1️⃣9️⃣","vi":"mười chín"},{"w":"twenty","e":"2️⃣0️⃣","vi":"hai mươi"}],"phrases":[{"en":"How many crayons? Fifteen.","vi":"Có bao nhiêu bút sáp? Mười lăm cái."},{"en":"Count from eleven to twenty.","vi":"Đếm từ mười một đến hai mươi."},{"en":"What number is it? It's twelve.","vi":"Đây là số mấy? Là số mười hai."},{"en":"There are twenty children in my class.","vi":"Lớp mình có hai mươi bạn."}],"phonics":{"letters":["m","n"],"words":["mum","monkey","mango","milk","mouse","nose","nine","name","night"]},"goals":["Bé đếm tiếp từ 10 đến 20 và đếm ngược từ 20 về 10","Bé nghe số từ 11 đến 20 và tìm đúng chữ số","Bé nhận ra đuôi teen trong thirteen đến nineteen, nhớ riêng eleven, twelve","Bé đọc chữ M m, N n và chép các từ số ngắn như ten, twelve"],"game":"Nhảy ô số: dán 10 tờ giấy ghi số 11 đến 20 trên sàn, bố mẹ đọc một số, bé nhảy tới đứng đúng ô và đọc to. Lượt sau bé đọc, bố mẹ nhảy.","parent":"Eleven và twelve không theo quy luật, từ thirteen trở đi có đuôi teen. Bố mẹ đọc kéo dài âm teen để bé nghe rõ, và đếm đồ vật thật như kẹo, hạt, bút trong nhà."},{"id":"e1-08","en":"Animals","vi":"Con vật","tuan":"22-24","words":[{"w":"cat","e":"🐱","vi":"con mèo"},{"w":"dog","e":"🐶","vi":"con chó"},{"w":"bird","e":"🐦","vi":"con chim"},{"w":"fish","e":"🐟","vi":"con cá"},{"w":"duck","e":"🦆","vi":"con vịt"},{"w":"chicken","e":"🐔","vi":"con gà"},{"w":"cow","e":"🐄","vi":"con bò"},{"w":"monkey","e":"🐒","vi":"con khỉ"},{"w":"elephant","e":"🐘","vi":"con voi"},{"w":"tiger","e":"🐯","vi":"con hổ"},{"w":"giraffe","e":"🦒","vi":"hươu cao cổ"},{"w":"snake","e":"🐍","vi":"con rắn"}],"phrases":[{"en":"What's this? It's a monkey.","vi":"Đây là con gì? Đó là con khỉ."},{"en":"I like cats.","vi":"Mình thích mèo."},{"en":"Can a fish swim? Yes, it can.","vi":"Cá có bơi được không? Có."},{"en":"A bird can fly. A dog can't fly.","vi":"Chim bay được. Chó không bay được."},{"en":"Look at the big elephant!","vi":"Nhìn con voi to kìa!"}],"phonics":{"letters":["o","p"],"words":["on","orange","dog","doll","pen","pear","pink","pineapple"]},"goals":["Bé nghe mô tả ngắn (It's big. It's grey.) và đoán đúng con vật","Bé gọi tên các con vật quen thuộc và nói con vật làm được gì với can, can't","Bé đọc chữ O o, P p và đọc tên con vật ngắn như cat, dog","Bé chép tên 3 con vật và nói mình thích con nào bằng I like..."],"game":"Đi như con vật: bố mẹ hô Walk like an elephant!, bé đi nặng nề như voi; Jump like a frog!, bé nhảy như ếch. Sau đó bé bắt chước một con vật, bố mẹ đoán It's a monkey!","parent":"Khi xem hoạt hình hay đi sở thú, bố mẹ hỏi What's this? và Can it fly? Tiếng kêu con vật trong tiếng Anh khác tiếng Việt (dog: woof, duck: quack), bé thường rất thích so sánh."},{"id":"e1-09","en":"My body","vi":"Cơ thể em","tuan":"25-27","words":[{"w":"head","e":"🙆","vi":"cái đầu"},{"w":"face","e":"😀","vi":"khuôn mặt"},{"w":"hair","e":"💇","vi":"tóc"},{"w":"eye","e":"👁️","vi":"mắt"},{"w":"ear","e":"👂","vi":"tai"},{"w":"nose","e":"👃","vi":"mũi"},{"w":"mouth","e":"👄","vi":"miệng"},{"w":"arm","e":"💪","vi":"cánh tay"},{"w":"hand","e":"✋","vi":"bàn tay"},{"w":"leg","e":"🦵","vi":"chân"},{"w":"foot","e":"🦶","vi":"bàn chân"},{"w":"body","e":"🧍","vi":"cơ thể"}],"phrases":[{"en":"Point to your nose.","vi":"Chỉ vào mũi của con."},{"en":"Clap your hands.","vi":"Vỗ tay nào."},{"en":"Wave your arms.","vi":"Vẫy hai tay nào."},{"en":"I've got two eyes and one mouth.","vi":"Mình có hai mắt và một cái miệng."},{"en":"This is my hair.","vi":"Đây là tóc của mình."}],"phonics":{"letters":["q","r"],"words":["queen","quack","question","red","robot","ruler","rice"]},"goals":["Bé nghe lệnh và chỉ đúng bộ phận cơ thể, làm động tác theo lời bố mẹ","Bé tả mình bằng câu có and: I've got two eyes and one nose","Bé đọc chữ Q q, R r và nhớ chữ q luôn đi cùng u","Bé viết số nhiều đúng: eyes, ears, hands, và biết nhiều bàn chân là feet"],"game":"Nhanh tay nhanh mắt: bố mẹ hô Point to your ear! Clap your hands! Jump! Wave your arms!, tăng tốc dần. Ai làm sai thì đổi vai làm người hô.","parent":"Một bàn chân là foot, hai bàn chân là feet; bé nói foots cũng không sao, bố mẹ nhắc lại từ đúng là được. Chữ qu đọc gần như qu trong quả của tiếng Việt nên bé dễ nhớ. Ba từ queen, quack, question chỉ để luyện âm, chưa cần thuộc."},{"id":"e1-10","en":"Food","vi":"Đồ ăn","tuan":"28-30","words":[{"w":"apple","e":"🍎","vi":"quả táo"},{"w":"banana","e":"🍌","vi":"quả chuối"},{"w":"mango","e":"🥭","vi":"quả xoài"},{"w":"watermelon","e":"🍉","vi":"dưa hấu"},{"w":"rice","e":"🍚","vi":"cơm"},{"w":"bread","e":"🍞","vi":"bánh mì"},{"w":"egg","e":"🥚","vi":"quả trứng"},{"w":"milk","e":"🥛","vi":"sữa"},{"w":"juice","e":"🧃","vi":"nước hoa quả"},{"w":"water","e":"💧","vi":"nước"},{"w":"ice cream","e":"🍦","vi":"kem"},{"w":"cake","e":"🍰","vi":"bánh ngọt"}],"phrases":[{"en":"I like bananas. I don't like eggs.","vi":"Mình thích chuối. Mình không thích trứng."},{"en":"Do you like mango? Yes, I do.","vi":"Bạn có thích xoài không? Có, mình thích."},{"en":"Would you like some juice? Yes, please.","vi":"Bạn có muốn uống nước hoa quả không? Có, cho mình xin."},{"en":"Can I have some water, please?","vi":"Cho con xin chút nước được không ạ?"},{"en":"Here you are. Thank you!","vi":"Của bạn đây. Cảm ơn!"}],"phonics":{"letters":["s","t"],"words":["sun","sand","sock","sister","ten","tiger","table","tomato","train"]},"goals":["Bé nghe bố mẹ gọi món và chọn đúng đồ ăn","Bé nói món mình thích và không thích bằng I like... I don't like...","Bé mời và đáp lịch sự: Would you like...? Yes, please. No, thank you.","Bé đọc chữ S s, T t và chép câu I like apples."],"game":"Quán ăn của Bingo: bé làm người bán, xếp hoa quả thật hoặc hình lên bàn. Bố mẹ làm khách gọi Can I have a banana, please?, bé đưa và nói Here you are. Đổi vai sau 3 món.","parent":"Bữa ăn là lúc học tốt nhất: mỗi bữa hỏi con một câu Do you like...? và nhắc con nói please, thank you. Từ rice dùng cho cả gạo và cơm, bé không cần phân biệt."},{"id":"e1-11","en":"Clothes","vi":"Quần áo","tuan":"31-33","words":[{"w":"T-shirt","e":"👕","vi":"áo phông"},{"w":"dress","e":"👗","vi":"váy liền"},{"w":"shoe","e":"👟","vi":"giày"},{"w":"sock","e":"🧦","vi":"tất"},{"w":"hat","e":"👒","vi":"mũ rộng vành"},{"w":"baseball cap","e":"🧢","vi":"mũ lưỡi trai"},{"w":"jacket","e":"🧥","vi":"áo khoác"},{"w":"jeans","e":"👖","vi":"quần bò"},{"w":"shorts","e":"🩳","vi":"quần soóc"},{"w":"glasses","e":"👓","vi":"kính mắt"},{"w":"boots","e":"👢","vi":"ủng, bốt"},{"w":"watch","e":"⌚","vi":"đồng hồ đeo tay"}],"phrases":[{"en":"I'm wearing a red T-shirt.","vi":"Mình đang mặc áo phông màu đỏ."},{"en":"What are you wearing?","vi":"Bạn đang mặc gì thế?"},{"en":"Put on your shoes, please.","vi":"Con đi giày vào nhé."},{"en":"Whose hat is this? It's mine.","vi":"Mũ này của ai? Của mình."},{"en":"My socks are blue.","vi":"Tất của mình màu xanh dương."}],"phonics":{"letters":["u","v","w"],"words":["under","up","bus","duck","very","van","five","seven","water","window","watch","walk"]},"goals":["Bé nghe mô tả màu và quần áo, chọn đúng người hoặc món đồ","Bé nói mình đang mặc gì: I'm wearing...","Bé đọc chữ U u, V v, W w và phân biệt âm v với âm w","Bé viết từ ngắn hat, sock, kết hợp màu đã học (a red hat)"],"game":"Thi mặc đồ: bày quần áo lên giường, bố mẹ hô Put on a hat and socks!, bé mặc thật nhanh rồi nói I'm wearing a hat and socks. Đổi vai cho bé ra lệnh.","parent":"Âm v đặt răng trên chạm nhẹ môi dưới, âm w chu tròn môi như khi nói u-a. Người Việt hay đọc hai âm này giống nhau, bố mẹ chỉ cần làm khẩu hình cho con nhìn. Mỗi sáng thay đồ là dịp hỏi What are you wearing?"},{"id":"e1-12","en":"My house","vi":"Ngôi nhà của em","tuan":"34-35","words":[{"w":"house","e":"🏠","vi":"ngôi nhà"},{"w":"garden","e":"🏡","vi":"khu vườn"},{"w":"kitchen","e":"🍳","vi":"nhà bếp"},{"w":"door","e":"🚪","vi":"cửa ra vào"},{"w":"window","e":"🪟","vi":"cửa sổ"},{"w":"bed","e":"🛏️","vi":"cái giường"},{"w":"sofa","e":"🛋️","vi":"ghế sofa"},{"w":"bath","e":"🛁","vi":"bồn tắm"},{"w":"mirror","e":"🪞","vi":"cái gương"},{"w":"phone","e":"📱","vi":"điện thoại"},{"w":"TV","e":"📺","vi":"ti vi"},{"w":"flower","e":"🌷","vi":"bông hoa"}],"phrases":[{"en":"Where's Mum? She's in the kitchen.","vi":"Mẹ đâu rồi? Mẹ ở trong bếp."},{"en":"This is my bedroom.","vi":"Đây là phòng ngủ của mình."},{"en":"The cat is on the sofa.","vi":"Con mèo ở trên ghế sofa."},{"en":"The lamp is next to the bed.","vi":"Cái đèn ở bên cạnh giường."},{"en":"Open the window, please.","vi":"Con mở cửa sổ ra nhé."}],"phonics":{"letters":["x","y","z"],"words":["box","six","fox","yellow","yes","young","zoo","zebra"]},"goals":["Bé nghe và đặt đồ đúng chỗ theo in, on, under, next to","Bé dẫn bố mẹ đi quanh nhà, gọi tên phòng và đồ vật, nói ai đang ở đâu","Bé đọc chữ X x, Y y, Z z và hát trọn bảng chữ cái từ A đến Z","Bé viết tên mình và 3 từ chỉ đồ vật trong nhà"],"game":"Hướng dẫn viên ngôi nhà: bé dẫn bố mẹ đi một vòng, đến mỗi phòng nói This is the kitchen, chỉ đồ vật nói It's a sofa. Bố mẹ hỏi thêm Where's the TV? để bé chạy tới chỉ.","parent":"Chữ x trong tiếng Anh thường đứng cuối từ và đọc như ks (box, six), khác hẳn chữ x của tiếng Việt. Tuần cuối năm cho bé hát bài ABC và chỉ từng chữ trên bảng chữ cái để ôn cả 26 chữ."}]},"mathcam1":{"framework":"Cambridge Primary Mathematics curriculum framework (0096, bản 2020), Stage 1: các mạch Number; Geometry and Measure; Statistics and Probability; Thinking and Working Mathematically. Stage 1 không có mục tiêu xác suất, nên chương trình không có bài xác suất.","book":"Cambridge Primary Mathematics Learner's Book 1, 2nd edition (Cherri Moseley, Janet Rees, Cambridge University Press, 2021): 16 unit, thứ tự unit theo sách; tên bài nhỏ trong mỗi unit soạn theo khung chương trình.","units":[{"id":"m1-01","en":"Numbers to 10","vi":"Các số đến 10","tuan":"1-3","note":"Gần trùng phần Các số từ 0 đến 10 của Toán 1 trong nước. Cambridge thêm nhận biết nhanh số chấm mà không cần đếm (như mặt xúc xắc) và nói so sánh bằng lời more, less; Toán 1 trong nước dùng dấu >, <, = sớm hơn. Học song song, bé vừa biết viết dấu, vừa nói được bằng tiếng Anh.","lessons":[{"id":"m1-01a","en":"Counting to 10","vi":"Đếm đến 10","goals":[["I can count objects to 10.","Bé đếm được đồ vật đến 10."],["I can say and read number names from zero to ten.","Bé đọc được tên các số từ 0 đến 10 bằng tiếng Anh."]],"words":[["count","đếm"],["number","số"],["how many","bao nhiêu"],["zero","số không"]],"gen":[{"k":"dem","max":10}],"say":[["Count the apples. How many?","Đếm số táo. Có bao nhiêu quả?"],["Count to ten.","Đếm đến mười."]],"choi":"Đếm đồ trong nhà: bé lấy đúng số thìa, số bút, số kẹp quần áo mà bố mẹ đọc bằng tiếng Anh (Bring me five spoons!), đặt thành hàng rồi đếm lại to.","bm":"Nhắc bé chạm tay vào từng đồ vật khi đếm, mỗi đồ chỉ đếm một lần; bé hay đếm nhanh hơn tay chỉ."},{"id":"m1-01b","en":"Zero and quick looking","vi":"Số 0 và nhìn nhanh","goals":[["I know that zero means none.","Bé hiểu số 0 nghĩa là không có gì."],["I can see how many dots without counting, up to 10.","Bé nhìn nhóm chấm quen thuộc và nói ngay số lượng, không cần đếm từng chấm."]],"words":[["zero","số không"],["none","không có cái nào"],["dots","các chấm"],["dice","xúc xắc"]],"gen":[{"k":"dem","max":10}],"say":[["How many dots? Just look!","Có mấy chấm? Nhìn thôi, không đếm nhé!"],["How many are left? Zero!","Còn lại mấy cái? Không còn cái nào!"]],"choi":"Chớp mắt đoán số: bố mẹ giơ bàn tay hoặc mặt xúc xắc trong 2 giây rồi giấu đi, bé nói ngay số chấm. Đúng 5 lần liên tiếp thì đổi vai.","bm":"Bàn tay 5 ngón và mặt xúc xắc là mẫu dễ nhớ nhất, cho bé tập nhìn 5 và 5 thêm 1, 2 để ra 6, 7."},{"id":"m1-01c","en":"More, less and order","vi":"Nhiều hơn, ít hơn, sắp thứ tự","goals":[["I can say which number is more or less.","Bé nói được số nào lớn hơn, số nào bé hơn."],["I can put numbers to 10 in order.","Bé sắp xếp được các số đến 10 theo thứ tự."]],"words":[["more","nhiều hơn"],["less","ít hơn"],["the same","bằng nhau"],["order","thứ tự"],["one more","thêm một"]],"gen":[{"k":"sosanh","max":10},{"k":"thutu","max":10}],"say":[["Which is more, 6 or 8?","Số nào lớn hơn, 6 hay 8?"],["What is one more than 5?","Thêm 1 vào 5 thì được mấy?"],["Put the numbers in order.","Sắp các số theo thứ tự."]],"choi":"Ai nhiều hơn: mỗi người bốc một nắm hạt lạc, cùng đếm rồi nói I have more! hoặc I have less! Người nhiều hơn được một điểm.","bm":"Khi bé so sánh, hỏi thêm More by how many? (hơn bao nhiêu) để chuẩn bị cho phép trừ ở bài sau."}]},{"id":"m1-02","en":"Working with numbers to 10","vi":"Làm tính với các số đến 10","tuan":"4-6","note":"Tương ứng phần Phép cộng, phép trừ trong phạm vi 10 của Toán 1 trong nước. Cambridge yêu cầu thuộc các cặp số cộng lại bằng 10 và coi phép trừ còn là tìm hiệu, tức là so hai nhóm xem hơn kém bao nhiêu, không chỉ là bớt đi. Đây là nền để bé cộng qua 10 ở Unit 10.","lessons":[{"id":"m1-02a","en":"Number pairs and making 10","vi":"Tách gộp số, cặp số tạo thành 10","goals":[["I can split a number into two parts.","Bé tách được một số thành hai phần (5 gồm 2 và 3)."],["I know the pairs of numbers that make 10.","Bé thuộc các cặp số cộng lại bằng 10."]],"words":[["make","tạo thành"],["part","phần"],["pair","cặp"],["ten","mười"]],"gen":[{"k":"tachgop","max":10}],"say":[["What goes with 7 to make 10?","Số nào ghép với 7 để được 10?"],["6 is 4 and 2.","6 gồm 4 và 2."]],"choi":"Giấu ngón tay: bé giơ đủ 10 ngón, bố mẹ gập vài ngón lại và hỏi How many are hiding?, bé nói số ngón bị gập. Lần lượt đủ các cặp 1 và 9 đến 5 và 5.","bm":"Cặp số bằng 10 (1 và 9, 2 và 8...) cần thuộc lòng như bảng cửu chương; ôn mỗi ngày 2 phút trên xe đi học là đủ."},{"id":"m1-02b","en":"Adding to 10","vi":"Cộng trong phạm vi 10","goals":[["I can add by counting on.","Bé cộng bằng cách đếm thêm từ số lớn hơn."],["I can add two groups to find how many altogether.","Bé gộp hai nhóm để tìm tất cả có bao nhiêu."]],"words":[["add","cộng"],["plus","cộng (dấu +)"],["equals","bằng"],["altogether","tất cả"],["count on","đếm thêm"]],"gen":[{"k":"cong","max":10},{"k":"toan_loi","max":10}],"say":[["3 add 2 equals what?","3 cộng 2 bằng mấy?"],["How many altogether?","Tất cả có bao nhiêu?"]],"choi":"Bến xe buýt: hai chiếc hộp làm xe buýt, bố mẹ cho 4 con thú lên xe rồi thêm 3 con nữa, bé đếm thêm five, six, seven và trả lời Seven altogether!","bm":"Dạy bé giữ số lớn trong đầu rồi đếm thêm số nhỏ, không phải đếm lại từ 1; cách này giúp bé tính nhanh hơn nhiều."},{"id":"m1-02c","en":"Subtracting to 10","vi":"Trừ trong phạm vi 10","goals":[["I can take away and count back.","Bé bớt đi và đếm lùi để làm phép trừ."],["I can find the difference between two numbers.","Bé tìm được hai số hơn kém nhau bao nhiêu."]],"words":[["take away","bớt đi"],["subtract","trừ"],["minus","trừ (dấu -)"],["left","còn lại"],["difference","hiệu, hơn kém"]],"gen":[{"k":"tru","max":10},{"k":"congtru","max":10}],"say":[["Take away 2. How many are left?","Bớt đi 2. Còn lại bao nhiêu?"],["What is the difference between 7 and 4?","7 và 4 hơn kém nhau bao nhiêu?"]],"choi":"Ăn bớt bánh: xếp 8 chiếc bánh quy, bé ăn 2 chiếc rồi nói Eight take away two is six. Sau đó so hai đĩa bánh xem đĩa nào nhiều hơn và nhiều hơn mấy chiếc.","bm":"Câu hỏi hơn kém bao nhiêu (difference) bé thường lúng túng; cho bé xếp hai hàng đồ vật thẳng nhau rồi đếm phần thừa ra."}]},{"id":"m1-03","en":"Geometry","vi":"Hình học","tuan":"7-8","note":"Toán 1 trong nước học hình vuông, hình tròn, hình tam giác, hình chữ nhật và khối lập phương, khối hộp chữ nhật. Cambridge thêm khối cầu, khối trụ, khối nón, yêu cầu bé đếm cạnh, mặt, nói cạnh thẳng hay cong, mặt phẳng hay cong và phân loại hình theo đặc điểm.","lessons":[{"id":"m1-03a","en":"2D shapes","vi":"Hình phẳng","goals":[["I can name circles, triangles, squares and rectangles.","Bé gọi tên hình tròn, tam giác, vuông, chữ nhật."],["I can count the sides of a shape.","Bé đếm được số cạnh của một hình."]],"words":[["circle","hình tròn"],["triangle","hình tam giác"],["square","hình vuông"],["rectangle","hình chữ nhật"],["side","cạnh"],["straight","thẳng"],["curved","cong"]],"gen":[{"k":"hinhphang"}],"say":[["How many sides has it got?","Hình này có mấy cạnh?"],["Find the triangle.","Tìm hình tam giác."]],"choi":"Thám tử hình: bố mẹ hô Find a circle!, bé tìm trong nhà một đồ có mặt tròn (đĩa, đồng hồ) rồi chạy về kể tên.","bm":"Hình vuông cũng là một loại hình chữ nhật đặc biệt, nhưng ở lớp 1 bé chỉ cần phân biệt bốn cạnh bằng nhau hay không."},{"id":"m1-03b","en":"3D shapes","vi":"Hình khối","goals":[["I can name cubes, cuboids, spheres, cylinders and cones.","Bé gọi tên khối lập phương, hộp chữ nhật, cầu, trụ, nón."],["I can tell 2D shapes from 3D shapes.","Bé phân biệt được hình phẳng với hình khối."]],"words":[["cube","khối lập phương"],["cuboid","khối hộp chữ nhật"],["sphere","khối cầu"],["cylinder","khối trụ"],["cone","khối nón"],["face","mặt"],["flat","phẳng"]],"gen":[{"k":"hinhkhoi"},{"k":"hinhphang"}],"say":[["Can it roll?","Khối này có lăn được không?"],["Is it a cube or a cuboid?","Đây là khối lập phương hay khối hộp chữ nhật?"]],"choi":"Lăn hay trượt: gom hộp sữa, quả bóng, lon nước, nón sinh nhật. Bé đặt từng món lên tấm ván nghiêng, đoán trước It rolls! hay It slides! rồi thử.","bm":"Hình phẳng chỉ vẽ được trên giấy, hình khối cầm được trên tay; cho bé đặt hộp lên giấy, đồ theo một mặt để thấy mặt của khối là một hình phẳng."}]},{"id":"m1-04","en":"Fractions","vi":"Phân số","tuan":"9-10","note":"Toán 1 trong nước chưa học phân số, đây là phần Cambridge dạy thêm. Bé chỉ cần hiểu một nửa là một trong hai phần bằng nhau, chia đôi cái bánh, chia đều đồ cho hai bạn; chưa cần viết ký hiệu 1/2.","lessons":[{"id":"m1-04a","en":"Equal and not equal parts","vi":"Phần bằng nhau và không bằng nhau","goals":[["I can tell if two parts are equal.","Bé nhận ra hai phần có bằng nhau hay không."]],"words":[["equal","bằng nhau"],["not equal","không bằng nhau"],["part","phần"],["whole","cả cái, nguyên vẹn"]],"gen":[{"k":"phanso"}],"say":[["Are the two parts equal?","Hai phần này có bằng nhau không?"]],"choi":"Cắt bánh mì: bố mẹ cắt một lát bánh mì thành hai phần, có lúc bằng nhau, có lúc lệch. Bé nhìn và nói Equal! hoặc Not equal!, đúng thì được ăn một phần.","bm":"Cho bé gấp đôi tờ giấy, chồng hai nửa khít lên nhau là bằng nhau; đây là cách kiểm tra bé tự làm được."},{"id":"m1-04b","en":"Half","vi":"Một nửa","goals":[["I can find half of a shape.","Bé tìm được một nửa của một hình."],["I can share a group into two equal halves.","Bé chia một nhóm đồ vật thành hai nửa bằng nhau."]],"words":[["half","một nửa"],["halves","các nửa"],["share","chia"],["fold","gấp"]],"gen":[{"k":"phanso"}],"say":[["Colour half of the circle.","Tô màu một nửa hình tròn."],["Share 6 sweets between 2 children.","Chia đều 6 cái kẹo cho 2 bạn."]],"choi":"Chia kẹo cho gấu bông: bé chia 8 viên kẹo cho mình và gấu bông, mỗi lần đưa một viên cho mỗi bên, rồi đếm và nói Half is four!","bm":"Một nửa phải là hai phần bằng nhau; nếu bé nói cái nửa to, cái nửa bé thì nhân dịp giải thích hai phần đó không phải một nửa."}]},{"id":"m1-05","en":"Measures","vi":"Đo lường","tuan":"11-12","note":"Toán 1 trong nước có phần Độ dài và đo độ dài, đến cuối năm học cả đơn vị xăng-ti-mét. Cambridge Stage 1 chỉ so sánh và đo bằng vật không chuẩn, nhưng thêm khối lượng (nặng, nhẹ) và dung tích (đầy, vơi, rỗng), hai nội dung trong nước chưa học ở lớp 1.","lessons":[{"id":"m1-05a","en":"Long, short and tall","vi":"Dài, ngắn, cao, thấp","goals":[["I can compare lengths using longer, shorter and taller.","Bé so sánh độ dài bằng các từ dài hơn, ngắn hơn, cao hơn."],["I can order three things from shortest to longest.","Bé xếp ba đồ vật từ ngắn nhất đến dài nhất."]],"words":[["long","dài"],["longer","dài hơn"],["longest","dài nhất"],["short","ngắn"],["tall","cao"],["thin","mỏng, gầy"]],"gen":[{"k":"dodai"}],"say":[["Which pencil is the longest?","Bút chì nào dài nhất?"],["Who is taller?","Ai cao hơn?"]],"choi":"Xếp hàng đồ chơi: bé xếp ô tô, bút, thìa từ ngắn nhất đến dài nhất, đặt thẳng đầu ở một vạch rồi nói This one is the longest!","bm":"Nhắc bé đặt các đồ vật thẳng hàng ở một đầu khi so sánh; bé hay so mà hai đầu lệch nhau nên kết luận sai."},{"id":"m1-05b","en":"Heavy and light, full and empty","vi":"Nặng nhẹ, đầy và rỗng","goals":[["I can say which is heavier or lighter.","Bé nói được đồ nào nặng hơn, đồ nào nhẹ hơn."],["I can say if a cup is full, half full or empty.","Bé nói được cốc đầy, vơi một nửa hay rỗng."]],"words":[["heavy","nặng"],["light","nhẹ"],["full","đầy"],["empty","rỗng"],["more","nhiều hơn"],["less","ít hơn"]],"gen":[{"k":"sosanh","max":10}],"say":[["Which is heavier, the apple or the book?","Quả táo hay quyển sách nặng hơn?"],["Is the cup full or empty?","Cốc đầy hay rỗng?"]],"choi":"Cân bằng tay: bé cầm hai đồ vật mỗi tay, đoán Heavy! Light! rồi kiểm tra bằng móc treo áo làm cân. Sau đó rót nước vào ba cốc: full, half full, empty.","bm":"Đồ to chưa chắc đã nặng (quả bóng bay to mà nhẹ); cho bé tự cầm thử để thấy điều này. Chưa có bộ bài tập riêng cho khối lượng, app dùng bài so sánh nhiều hơn, ít hơn để luyện cùng."}]},{"id":"m1-06","en":"Position","vi":"Vị trí","tuan":"13-14","note":"Phần vị trí trùng với bài vị trí, định hướng trong không gian của Toán 1 trong nước (trên, dưới, phải, trái, trước, sau, ở giữa). Cambridge thêm số thứ tự first đến tenth, trong nước chưa dạy riêng ở lớp 1.","lessons":[{"id":"m1-06a","en":"Where is it?","vi":"Đồ vật ở đâu?","goals":[["I can say where things are.","Bé nói được vị trí đồ vật: trên, dưới, trước, sau, bên cạnh, ở giữa."]],"words":[["on","trên"],["under","dưới"],["next to","bên cạnh"],["between","ở giữa"],["in front of","phía trước"],["behind","phía sau"],["left","bên trái"],["right","bên phải"]],"gen":[{"k":"vitri"}],"say":[["Put the ball under the chair.","Đặt quả bóng dưới ghế."],["What is next to the cat?","Cái gì ở bên cạnh con mèo?"]],"choi":"Giấu gấu bông: bố mẹ giấu gấu và chỉ đường bằng tiếng Anh It's behind the door! It's between the pillows!, bé tìm rồi đổi vai.","bm":"Trái phải là khó nhất; đeo cho bé một chiếc dây chun ở tay phải trong tuần này để bé có mốc nhớ."},{"id":"m1-06b","en":"First to tenth","vi":"Thứ nhất đến thứ mười","goals":[["I can use first, second, third up to tenth.","Bé dùng được số thứ tự từ thứ nhất đến thứ mười."]],"words":[["first","thứ nhất"],["second","thứ hai"],["third","thứ ba"],["last","cuối cùng"],["line","hàng"]],"gen":[{"k":"thutu","max":10},{"k":"vitri"}],"say":[["Who is third in the line?","Ai đứng thứ ba trong hàng?"],["Colour the fifth flower.","Tô màu bông hoa thứ năm."]],"choi":"Đua xe đồ chơi: xếp các xe thành hàng, đẩy một lượt rồi bé xếp hạng first, second, third theo xe nào đi xa nhất.","bm":"Tiếng Việt chỉ thêm chữ thứ trước số, còn tiếng Anh có từ riêng first, second, third; từ thứ tư trở đi chỉ cần thêm đuôi th (fourth, fifth)."}]},{"id":"m1-07","en":"Time","vi":"Thời gian","tuan":"15-16","note":"Toán 1 trong nước học các ngày trong tuần ở cuối năm (phần Thời gian, giờ và lịch). Cambridge học sớm hơn, thêm 12 tháng trong năm và các buổi trong ngày. Bố mẹ có thể dạy song ngữ cùng lúc: Thứ Hai là Monday.","lessons":[{"id":"m1-07a","en":"Days of the week","vi":"Các ngày trong tuần","goals":[["I know the days of the week in order.","Bé thuộc thứ tự các ngày trong tuần."],["I can say what day it is today.","Bé nói được hôm nay là thứ mấy."]],"words":[["day","ngày"],["week","tuần"],["today","hôm nay"],["tomorrow","ngày mai"],["yesterday","hôm qua"],["Monday","thứ Hai"]],"gen":[{"k":"lich"}],"say":[["What day is it today?","Hôm nay là thứ mấy?"],["How many days are in a week?","Một tuần có mấy ngày?"]],"choi":"Bánh xe tuần lễ: vẽ 7 ô trên giấy tròn, mỗi ô một ngày và một hoạt động quen (Saturday: đi bơi). Mỗi sáng bé xoay kim tới ngày hôm nay và đọc to.","bm":"Tuần trong tiếng Anh thường bắt đầu từ Monday; Chủ nhật là Sunday, không phải ngày thứ tám như cách gọi của nhiều bé."},{"id":"m1-07b","en":"Months and parts of the day","vi":"Tháng trong năm và các buổi trong ngày","goals":[["I can say the months of the year in order.","Bé đọc được 12 tháng theo thứ tự."],["I can use morning, afternoon, evening and night.","Bé dùng đúng các từ buổi sáng, chiều, tối, đêm."]],"words":[["month","tháng"],["year","năm"],["morning","buổi sáng"],["afternoon","buổi chiều"],["evening","buổi tối"],["night","ban đêm"]],"gen":[{"k":"lich"}],"say":[["When is your birthday?","Sinh nhật con vào tháng mấy?"],["Do you eat breakfast in the morning or at night?","Con ăn sáng vào buổi sáng hay ban đêm?"]],"choi":"Sinh nhật cả nhà: treo tờ lịch năm, bé tìm tháng sinh nhật của từng người, dán hình ngôi sao và nói Mum's birthday is in May.","bm":"Tháng trong tiếng Việt gọi theo số, còn tiếng Anh có tên riêng; chỉ cần cho bé hát bài các tháng, chưa cần thuộc ngay."}]},{"id":"m1-08","en":"Statistics","vi":"Thống kê","tuan":"17-18","note":"Toán 1 trong nước chưa có thống kê, phần này lớp 2 mới học. Cambridge cho bé thu thập dữ liệu thật như hỏi cả nhà thích quả gì, phân loại, xếp thành biểu đồ tranh rồi trả lời nhiều nhất, ít nhất.","lessons":[{"id":"m1-08a","en":"Sorting into groups","vi":"Phân loại thành nhóm","goals":[["I can sort objects into groups.","Bé phân loại được đồ vật thành các nhóm."],["I can record in a list or a table.","Bé ghi lại kết quả vào danh sách hoặc bảng đơn giản."]],"words":[["sort","phân loại"],["group","nhóm"],["same","giống nhau"],["different","khác nhau"],["table","bảng"]],"gen":[{"k":"thongke"}],"say":[["Sort the buttons by colour.","Phân loại cúc áo theo màu."],["How many are in the red group?","Nhóm màu đỏ có bao nhiêu cái?"]],"choi":"Dọn đồ chơi kiểu thống kê: bé phân đồ chơi vào ba giỏ (cars, animals, balls), đếm từng giỏ rồi kể giỏ nào nhiều nhất.","bm":"Cho bé tự chọn cách phân loại (theo màu, theo cỡ, theo loại) rồi hỏi Why?; Cambridge rất coi trọng việc bé giải thích lựa chọn của mình."},{"id":"m1-08b","en":"Pictograms and block graphs","vi":"Biểu đồ tranh và biểu đồ khối","goals":[["I can read a pictogram.","Bé đọc được biểu đồ tranh."],["I can say which has the most and the least.","Bé nói được cột nào nhiều nhất, ít nhất."]],"words":[["pictogram","biểu đồ tranh"],["block graph","biểu đồ khối"],["most","nhiều nhất"],["least","ít nhất"],["fewer","ít hơn"]],"gen":[{"k":"thongke"}],"say":[["Which fruit do most children like?","Nhiều bạn thích loại quả nào nhất?"],["How many children like bananas?","Có bao nhiêu bạn thích chuối?"]],"choi":"Khảo sát cả nhà: bé hỏi mỗi người Do you like mango or banana?, xếp một khối lego cho mỗi câu trả lời thành hai cột, rồi nói Mango is the most!","bm":"Biểu đồ khối dựng từ lego thật dễ hiểu hơn hình vẽ; sau khi xếp, cho bé vẽ lại trên giấy kẻ ô."}]},{"id":"m1-09","en":"Numbers to 20","vi":"Các số đến 20","tuan":"19-21","note":"Toán 1 trong nước học tiếp các số đến 100 ở học kì 2. Cambridge dừng ở 20 nhưng học kỹ hơn: ước
