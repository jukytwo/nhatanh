"giọt nước","bé"],"a":0}],"viet":"ai, ay, ây, máy bay","choi":"Nặn chữ: bé nặn đất nặn hoặc xếp que tính thành vần ai, rồi kể một từ có vần ai; mỗi từ kể đúng được nặn thêm một chữ.","bm":"ay và ây dễ lẫn: ay mở miệng rộng hơn (tay, máy), ây khép hơn (mây, cây). Bé hay viết 'mai bai' thay vì 'máy bay'."},{"id":"tv1-39","tap":1,"tuan":9,"ten":"Bài 39. oi ôi ơi","loai":"van","am":["oi","ôi","ơi"],"tieng":["voi","còi","chổi","đôi","bơi","phơi"],"tu":[{"w":"con voi","e":"🐘"},{"w":"gói quà","e":"🎁"},{"w":"cái chổi","e":"🧹"},{"w":"đi bơi","e":"🏊"},{"w":"đồ chơi","e":"🧸"},{"w":"mặt trời","e":"☀️"}],"cau":"Bé đi bơi với bố.","doc":"","hoi":[{"q":"Từ nào có vần ôi?","o":["cái chổi","cặp sách","viết bài"],"a":0},{"q":"Từ nào có vần oi?","o":["bánh mì","dừa","con voi"],"a":2}],"viet":"oi, ôi, ơi, đồ chơi","choi":"Nhảy ô: kẻ các ô trên sàn, mỗi ô ghi một vần trong bài (oi, ôi, ơi); bố mẹ đọc từ nào, bé nhảy vào ô có vần của từ đó.","bm":"oi, ôi, ơi giống nhau ở chữ i cuối; luyện bằng tiếng gọi quen thuộc 'Ơi!' khi gọi nhau trong nhà."},{"id":"tv1-40","tap":1,"tuan":9,"ten":"Bài 40. Ôn tập và kể chuyện","loai":"ke-chuyen","am":["om","ôm","ơm","em","êm","im","um","ai","ay","ây","oi","ôi","ơi"],"tieng":["tôm","kem","chim","tay","mây","voi"],"tu":[{"w":"con tôm","e":"🦐"},{"w":"que kem","e":"🍦"},{"w":"con chim","e":"🐦"},{"w":"máy bay","e":"✈️"},{"w":"đám mây","e":"☁️"},{"w":"con voi","e":"🐘"}],"cau":"Hai bạn đi chơi trong rừng.","doc":"Kể chuyện về hai người bạn và con gấu. Hai người bạn đang đi trong rừng thì gặp gấu. Một người vội trèo lên cây trốn, bỏ mặc bạn; người kia nằm im giả chết, gấu đến gần rồi bỏ đi. Người bạn ấy bảo: gấu dặn đừng chơi với người bỏ bạn lúc nguy hiểm.","hoi":[{"q":"Khi gặp gấu, một người đã làm gì?","o":["Nằm im giả chết","Chạy về làng gọi người","Trèo lên cây trốn"],"a":2},{"q":"Câu chuyện khuyên em điều gì?","o":["Gặp gấu thì phải chạy thật nhanh","Không bỏ bạn khi bạn gặp nguy","Đi rừng thì nên đi một mình"],"a":1}],"viet":"tay, chim, voi","choi":"Diễn kịch nhỏ: bé và bố mẹ mỗi người nhận một vai trong câu chuyện, dùng thú bông làm nhân vật và diễn lại trong năm phút.","bm":"Hỏi bé: em sẽ làm gì nếu bạn gặp nguy hiểm? Hướng bé tới việc ở lại cùng bạn và gọi người lớn giúp."},{"id":"tv1-41","tap":1,"tuan":10,"ten":"Bài 41. ui ưi","loai":"van","am":["ui","ưi"],"tieng":["núi","túi","mũi","vui","gửi","ngửi"],"tu":[{"w":"ngọn núi","e":"⛰️"},{"w":"túi xách","e":"👜"},{"w":"cái mũi","e":"👃"},{"w":"gửi thư","e":"📨"},{"w":"ngửi hoa","e":"🌷"},{"w":"dùi trống","e":"🥁"}],"cau":"Bé gửi thư cho bà ở quê.","doc":"","hoi":[{"q":"Từ nào có vần ui?","o":["bướu lạc đà","ngọn núi","con tằm"],"a":1},{"q":"Từ nào có vần ưi?","o":["gửi thư","con ghẹ","bạch tuộc"],"a":0}],"viet":"ui, ưi, gửi thư","choi":"Săn tiếng: bố mẹ đọc chậm từng từ, nghe tiếng nào có vần ui hoặc ưi thì bé vỗ tay một cái, không có thì ngồi im. Sau năm lượt đổi vai, bé đọc để bố mẹ vỗ tay.","bm":"ui và ưi khác nhau ở râu của ư; vần ưi chỉ có ít từ (gửi, ngửi, cửi), cho bé thuộc lòng các từ này."},{"id":"tv1-42","tap":1,"tuan":10,"ten":"Bài 42. ao eo","loai":"van","am":["ao","eo"],"tieng":["sao","táo","chào","mèo","kẹo","kéo"],"tu":[{"w":"ngôi sao","e":"⭐"},{"w":"quả táo","e":"🍎"},{"w":"cái áo","e":"👕"},{"w":"con mèo","e":"🐱"},{"w":"kẹo","e":"🍬"},{"w":"cái kéo","e":"✂️"}],"cau":"Mèo con trèo lên cây cao.","doc":"","hoi":[{"q":"Từ nào có vần ao?","o":["ngôi sao","sư tử","biển"],"a":0},{"q":"Từ nào có vần eo?","o":["nải chuối","bóng","con mèo"],"a":2}],"viet":"ao, eo, ngôi sao, con mèo","choi":"Đi tìm đồ vật: bé đi quanh nhà tìm ba đồ vật hoặc tranh ảnh có tên chứa vần ao hoặc eo, ví dụ ngôi sao, mang về và đọc to tên từng thứ.","bm":"Bé hay viết 'mèo' thành 'mao'; đọc kéo dài chữ đầu vần 'mè-o' cho bé nghe rõ."},{"id":"tv1-43","tap":1,"tuan":10,"ten":"Bài 43. au âu êu","loai":"van","am":["au","âu","êu"],"tieng":["rau","cau","trâu","cầu","sếu","kêu"],"tu":[{"w":"rau","e":"🥬"},{"w":"con trâu","e":"🐃"},{"w":"dâu tây","e":"🍓"},{"w":"con gấu","e":"🐻"},{"w":"cây cầu","e":"🌉"},{"w":"cái lều","e":"⛺"}],"cau":"Trâu ăn cỏ bên chân cầu.","doc":"","hoi":[{"q":"Từ nào có vần êu?","o":["phô mai","xếp hình","cái lều"],"a":2},{"q":"Từ nào có vần âu?","o":["dê","con trâu","giấc ngủ"],"a":1}],"viet":"au, âu, êu, con trâu","choi":"Bắt bóng: bố mẹ tung quả bóng và nói một tiếng; tiếng có vần au, âu hoặc êu thì bé bắt bóng, không có thì để bóng rơi.","bm":"âu và êu dễ lẫn ở miền Nam; âu như 'trâu', êu như 'kêu'. Cho bé nhìn hình con trâu để nhớ âu."},{"id":"tv1-44","tap":1,"tuan":10,"ten":"Bài 44. iu ưu","loai":"van","am":["iu","ưu"],"tieng":["rìu","địu","líu","cừu","lựu","bưu"],"tu":[{"w":"cái rìu","e":"🪓"},{"w":"con cừu","e":"🐑"},{"w":"bưu điện","e":"🏤"},{"w":"chim hót líu lo","e":"🐦"},{"w":"nhỏ xíu","e":"🐜"}],"cau":"Chim hót líu lo trên cành.","doc":"","hoi":[{"q":"Từ nào có vần iu?","o":["dưa hấu","cái rìu","mèo"],"a":1},{"q":"Từ nào có vần ưu?","o":["con cừu","ống hút","chuyền bóng"],"a":0}],"viet":"iu, ưu, con cừu","choi":"Viết lên lưng: bố mẹ dùng ngón tay viết vần iu lên lưng bé, bé đoán đúng thì đọc một từ có vần iu như cái rìu, rồi đổi vai.","bm":"iu và ưu ít gặp; nhớ qua 'cái rìu', 'con cừu', 'quả lựu'. Đừng bắt bé đọc nhanh, cứ chậm mà đúng."},{"id":"tv1-45","tap":1,"tuan":10,"ten":"Bài 45. Ôn tập và kể chuyện","loai":"ke-chuyen","am":["ui","ưi","ao","eo","au","âu","êu","iu","ưu"],"tieng":["núi","gửi","sao","mèo","trâu","cừu"],"tu":[{"w":"ngọn núi","e":"⛰️"},{"w":"cái mũi","e":"👃"},{"w":"quả táo","e":"🍎"},{"w":"con mèo","e":"🐱"},{"w":"con gấu","e":"🐻"},{"w":"con cừu","e":"🐑"}],"cau":"Bé hái hoa cúc trắng tặng mẹ.","doc":"Kể chuyện: Sự tích hoa cúc trắng. Mẹ cô bé ốm nặng vì làm lụng vất vả. Một cụ già bảo cô vào rừng tìm bông hoa cúc trắng ở gốc cây cổ thụ về làm thuốc. Bông hoa chỉ có bốn cánh, cô bé khéo léo xé mỗi cánh thành thật nhiều sợi nhỏ, nhờ tấm lòng hiếu thảo mà mẹ khỏi bệnh.","hoi":[{"q":"Cô bé vào rừng tìm gì?","o":["Bông hoa cúc trắng","Cây nấm làm thuốc","Quả chín trên cây cổ thụ"],"a":0},{"q":"Cô bé là người như thế nào?","o":["Thông minh, nhanh nhẹn","Dũng cảm, không sợ rừng","Hiếu thảo, thương mẹ"],"a":2}],"viet":"núi, mèo, cừu","choi":"Kể nối tiếp: bố mẹ kể câu đầu, bé kể câu tiếp theo, cứ thế đến hết chuyện; ai quên thì được xem lại tranh gợi ý.","bm":"Hỏi bé đã làm gì khi bố mẹ mệt; khen những việc nhỏ bé đã làm như lấy nước, đấm lưng cho mẹ."},{"id":"tv1-46","tap":1,"tuan":11,"ten":"Bài 46. ac ăc âc","loai":"van","am":["ac","ăc","âc"],"tieng":["bác","vạc","mắc","tắc","gấc","nhấc"],"tu":[{"w":"bác sĩ","e":"👨‍⚕️"},{"w":"âm nhạc","e":"🎵"},{"w":"tắc kè","e":"🦎"},{"w":"xúc xắc","e":"🎲"},{"w":"giấc ngủ","e":"😴"},{"w":"các bạn","e":"👫"}],"cau":"Bác sĩ khám bệnh cho bé.","doc":"","hoi":[{"q":"Từ nào có vần âc?","o":["lời chào","thỏ","giấc ngủ"],"a":2},{"q":"Từ nào có vần ăc?","o":["con đường","tắc kè","con gấu"],"a":1}],"viet":"ac, ăc, âc, bác sĩ","choi":"Ghép thẻ chữ: viết các chữ đã học ra thẻ giấy, bé ghép thành tiếng như bác, vạc, đọc to rồi đố bố mẹ đọc theo.","bm":"Vần có c cuối đọc dứt khoát, ngậm lại ở cổ. Miền Nam hay đọc at và ac giống nhau nên bé dễ viết sai 'bát' và 'bác'; cho bé nhớ theo nghĩa."},{"id":"tv1-47","tap":1,"tuan":11,"ten":"Bài 47. oc ôc uc ưc","loai":"van","am":["oc","ôc","uc","ưc"],"tieng":["sóc","cóc","ốc","cốc","cúc","mực"],"tu":[{"w":"con sóc","e":"🐿️"},{"w":"con cóc","e":"🐸"},{"w":"ốc sên","e":"🐌"},{"w":"cốc sữa","e":"🥛"},{"w":"hoa cúc","e":"🌼"},{"w":"con mực","e":"🦑"}],"cau":"Sóc nhỏ nhặt hạt, ốc sên bò chậm.","doc":"","hoi":[{"q":"Từ nào có vần oc?","o":["cá","con sóc","nghe"],"a":1},{"q":"Từ nào có vần uc?","o":["hoa cúc","váy xoè","hạt muối"],"a":0}],"viet":"oc, ôc, uc, ưc","choi":"Ai nhanh hơn: bày các hình trong bài lên bàn, bố mẹ đọc một từ, bé chỉ đúng hình thật nhanh; đúng năm lần được một ngôi sao.","bm":"oc và ôc khác nhau ở cái mũ: con cóc, cái cốc. Vần uc và ưc ít từ, dùng hoa cúc và con mực để nhớ."},{"id":"tv1-48","tap":1,"tuan":11,"ten":"Bài 48. at ăt ât","loai":"van","am":["at","ăt","ât"],"tieng":["hát","mát","mắt","cắt","mật","đất"],"tu":[{"w":"ca hát","e":"🎤"},{"w":"bãi cát","e":"🏖️"},{"w":"đôi mắt","e":"👀"},{"w":"mật ong","e":"🍯"},{"w":"trái đất","e":"🌍"},{"w":"bát cơm","e":"🍚"}],"cau":"Ong làm mật, bé hát vang.","doc":"","hoi":[{"q":"Từ nào có vần ăt?","o":["đôi mắt","ngôi làng","thỏ"],"a":0},{"q":"Từ nào có vần ât?","o":["thợ xây","lớp học","mật ong"],"a":2}],"viet":"at, ăt, ât, mật ong","choi":"Nặn chữ: bé nặn đất nặn hoặc xếp que tính thành vần at, rồi kể một từ có vần at; mỗi từ kể đúng được nặn thêm một chữ.","bm":"at, ăt, ât kết thúc bằng t, lưỡi chạm răng rồi dừng. Bé dễ nhầm 'mắt' với 'mắc', nhắc bé: đôi mắt viết t."},{"id":"tv1-49","tap":1,"tuan":11,"ten":"Bài 49. ot ôt ơt","loai":"van","am":["ot","ôt","ơt"],"tieng":["rót","ngọt","cột","bột","ớt","vợt"],"tu":[{"w":"quả ớt","e":"🌶️"},{"w":"cà rốt","e":"🥕"},{"w":"cây vợt","e":"🏸"},{"w":"kẹo ngọt","e":"🍬"},{"w":"giọt nước","e":"💧"},{"w":"cột cờ","e":"🚩"}],"cau":"Thỏ ăn cà rốt, ớt thì cay.","doc":"","hoi":[{"q":"Từ nào có vần ơt?","o":["dừa","mùa xuân","quả ớt"],"a":2},{"q":"Từ nào có vần ot?","o":["gà con","kẹo ngọt","số hai"],"a":1}],"viet":"ot, ôt, ơt, quả ớt","choi":"Nhảy ô: kẻ các ô trên sàn, mỗi ô ghi một vần trong bài (ot, ôt, ơt); bố mẹ đọc từ nào, bé nhảy vào ô có vần của từ đó.","bm":"'Quả ớt' là vần ơt có râu, 'cà rốt' là vần ôt có mũ. Bé hay viết 'ớc' theo cách nói miền Nam, cần nhớ mặt chữ."},{"id":"tv1-50","tap":1,"tuan":11,"ten":"Bài 50. Ôn tập và kể chuyện","loai":"ke-chuyen","am":["ac","ăc","âc","oc","ôc","uc","ưc","at","ăt","ât","ot","ôt","ơt"],"tieng":["bác","sóc","cúc","mắt","mật","ớt"],"tu":[{"w":"con sóc","e":"🐿️"},{"w":"ốc sên","e":"🐌"},{"w":"hoa cúc","e":"🌼"},{"w":"mật ong","e":"🍯"},{"w":"đôi mắt","e":"👀"},{"w":"cà rốt","e":"🥕"}],"cau":"Thỏ con biết nói lời cảm ơn.","doc":"Kể chuyện về thỏ con biết cảm ơn và xin lỗi. Mẹ dặn thỏ con: làm sai thì phải xin lỗi, được giúp thì phải cảm ơn. Đi chơi, thỏ lỡ va phải bạn sóc và gặp chuyện cần bác voi giúp; thỏ nhớ lời mẹ, biết nói lời xin lỗi và cảm ơn đúng lúc.","hoi":[{"q":"Mẹ dặn thỏ con điều gì?","o":["Đi chơi xa phải xin phép bố mẹ","Làm sai thì xin lỗi, được giúp thì cảm ơn","Gặp người lớn thì phải chào hỏi lễ phép"],"a":1}],"viet":"sóc, mắt, cà rốt","choi":"Kể chuyện bằng tranh: bố mẹ vẽ nhanh bốn tranh của câu chuyện ra giấy rồi xáo trộn; bé xếp lại đúng thứ tự và kể theo từng tranh.","bm":"Tập cho bé thói quen nói 'con cảm ơn', 'con xin lỗi' trong nhà như thỏ con; bố mẹ làm gương trước."},{"id":"tv1-51","tap":1,"tuan":12,"ten":"Bài 51. et êt it","loai":"van","am":["et","êt","it"],"tieng":["vẹt","két","tết","dệt","vịt","mít"],"tu":[{"w":"con vẹt","e":"🦜"},{"w":"ngày Tết","e":"🧧"},{"w":"dệt vải","e":"🧵"},{"w":"con vịt","e":"🦆"},{"w":"thịt","e":"🍖"}],"cau":"Tết đến, cả nhà về quê.","doc":"","hoi":[{"q":"Từ nào có vần it?","o":["con vịt","giấc ngủ","xương"],"a":0},{"q":"Từ nào có vần êt?","o":["con thuyền","cá","ngày Tết"],"a":2}],"viet":"et, êt, it, con vịt","choi":"Săn tiếng: bố mẹ đọc chậm từng từ, nghe tiếng nào có vần et, êt hoặc it thì bé vỗ tay một cái, không có thì ngồi im. Sau năm lượt đổi vai, bé đọc để bố mẹ vỗ tay.","bm":"'Con vẹt' là vần et, 'ngày Tết' là êt, 'con vịt' là it. Chữ Tết viết hoa vì là tên ngày lễ."},{"id":"tv1-52","tap":1,"tuan":12,"ten":"Bài 52. ut ưt","loai":"van","am":["ut","ưt"],"tieng":["bút","sút","phút","mứt","sứt","nứt"],"tu":[{"w":"bút chì","e":"✏️"},{"w":"sút bóng","e":"⚽"},{"w":"ống hút","e":"🥤"},{"w":"một phút","e":"⏱️"},{"w":"trứng nứt","e":"🐣"}],"cau":"Bé lấy bút chì vẽ hộp mứt.","doc":"","hoi":[{"q":"Từ nào có vần ưt?","o":["quả đào","cặp sách","trứng nứt"],"a":2},{"q":"Từ nào có vần ut?","o":["trăng","bút chì","lê"],"a":1}],"viet":"ut, ưt, bút chì","choi":"Đi tìm đồ vật: bé đi quanh nhà tìm ba đồ vật hoặc tranh ảnh có tên chứa vần ut hoặc ưt, ví dụ bút chì, mang về và đọc to tên từng thứ.","bm":"ut và ưt khác nhau ở râu: 'bút' và 'mứt'. Các vần có p, t, c ở cuối đều đọc ngắn và dứt."},{"id":"tv1-53","tap":1,"tuan":12,"ten":"Bài 53. ap ăp âp","loai":"van","am":["ap","ăp","âp"],"tieng":["tháp","đạp","cặp","bắp","tập","nấp"],"tu":[{"w":"xe đạp","e":"🚲"},{"w":"ngọn tháp","e":"🗼"},{"w":"cặp sách","e":"🎒"},{"w":"bắp ngô","e":"🌽"},{"w":"cá mập","e":"🦈"},{"w":"tập thể dục","e":"🤸"}],"cau":"Bé đạp xe, đeo cặp đi học.","doc":"","hoi":[{"q":"Từ nào có vần ăp?","o":["tàu thuỷ","cặp sách","trường học"],"a":1},{"q":"Từ nào có vần ap?","o":["xe đạp","khoai lang","trường học"],"a":0}],"viet":"ap, ăp, âp, xe đạp","choi":"Bắt bóng: bố mẹ tung quả bóng và nói một tiếng; tiếng có vần ap, ăp hoặc âp thì bé bắt bóng, không có thì để bóng rơi.","bm":"ap, ăp, âp kết thúc bằng p nên môi khép lại. Nhắc bé 'xe đạp' viết p chứ không phải c."},{"id":"tv1-54","tap":1,"tuan":12,"ten":"Bài 54. op ôp ơp","loai":"van","am":["op","ôp","ơp"],"tieng":["họp","góp","hộp","xốp","lớp","chớp"],"tu":[{"w":"con cọp","e":"🐅"},{"w":"hộp quà","e":"🎁"},{"w":"lớp học","e":"🏫"},{"w":"tia chớp","e":"⚡"},{"w":"bánh xốp","e":"🧇"}],"cau":"Cả lớp góp quà tặng bạn.","doc":"","hoi":[{"q":"Từ nào có vần ơp?","o":["lớp học","cú mèo","màu vàng"],"a":0},{"q":"Từ nào có vần ôp?","o":["nhà cao tầng","bướu lạc đà","hộp quà"],"a":2}],"viet":"op, ôp, ơp, lớp học","choi":"Viết lên lưng: bố mẹ dùng ngón tay viết vần op lên lưng bé, bé đoán đúng thì đọc một từ có vần op như con cọp, rồi đổi vai.","bm":"Cho bé ngậm môi ở cuối tiếng để cảm nhận âm p: con cọp, hộp quà, lớp học."},{"id":"tv1-55","tap":1,"tuan":12,"ten":"Bài 55. Ôn tập và kể chuyện","loai":"ke-chuyen","am":["et","êt","it","ut","ưt","ap","ăp","âp","op","ôp","ơp"],"tieng":["vẹt","vịt","bút","đạp","mập","lớp"],"tu":[{"w":"con vẹt","e":"🦜"},{"w":"con vịt","e":"🦆"},{"w":"bút chì","e":"✏️"},{"w":"xe đạp","e":"🚲"},{"w":"cá mập","e":"🦈"},{"w":"lớp học","e":"🏫"}],"cau":"Gấu con chia mật cho các bạn.","doc":"Kể chuyện về gấu con và hũ mật. Gấu con có hũ mật ngon nhưng giấu đi, không muốn chia cho ai. Về sau thấy các bạn tìm khắp rừng mà không có cái ăn, gấu con đem mật ra chia và hứa không ích kỉ nữa.","hoi":[{"q":"Lúc đầu gấu con làm gì với hũ mật?","o":["Chia ngay cho các bạn","Ăn hết một mình","Giấu đi, không chia"],"a":2},{"q":"Cuối truyện gấu con đã làm gì?","o":["Giấu hũ mật kĩ hơn","Chia mật cho các bạn","Đi tìm thêm mật mới"],"a":1}],"viet":"vịt, bút, lớp","choi":"Diễn kịch nhỏ: bé và bố mẹ mỗi người nhận một vai trong câu chuyện, dùng thú bông làm nhân vật và diễn lại trong năm phút.","bm":"Hỏi bé món gì bé thích nhất và bé có sẵn lòng chia cho bạn không; khen bé mỗi khi bé chia sẻ."},{"id":"tv1-56","tap":1,"tuan":13,"ten":"Bài 56. ep êp ip up","loai":"van","am":["ep","êp","ip","up"],"tieng":["dép","kẹp","bếp","xếp","nhịp","búp"],"tu":[{"w":"đôi dép","e":"👡"},{"w":"kẹp giấy","e":"📎"},{"w":"nhà bếp","e":"🍳"},{"w":"xếp hình","e":"🧩"},{"w":"cúp vàng","e":"🏆"},{"w":"chụp ảnh","e":"📷"},{"w":"nhịp trống","e":"🥁"}],"cau":"Bé xếp dép gọn gàng ở cửa.","doc":"","hoi":[{"q":"Từ nào có vần ip?","o":["quả lê","nhịp trống","viên thuốc"],"a":1},{"q":"Từ nào có vần up?","o":["cúp vàng","chùm nho","dưa hấu"],"a":0}],"viet":"ep, êp, ip, up","choi":"Ghép thẻ chữ: viết các chữ đã học ra thẻ giấy, bé ghép thành tiếng như dép, kẹp, đọc to rồi đố bố mẹ đọc theo.","bm":"Bốn vần đều có p cuối. Bé hay viết 'bếp' thành 'bết'; đọc mẫu và khép môi ở cuối tiếng."},{"id":"tv1-57","tap":1,"tuan":13,"ten":"Bài 57. anh ênh inh","loai":"van","am":["anh","ênh","inh"],"tieng":["chanh","cành","bánh","kênh","kính","xinh"],"tu":[{"w":"quả chanh","e":"🍋"},{"w":"bánh mì","e":"🥖"},{"w":"bức tranh","e":"🖼️"},{"w":"kính","e":"👓"},{"w":"máy tính","e":"💻"},{"w":"đỉnh núi","e":"🏔️"}],"cau":"Bé ngồi bập bênh với bạn.","doc":"","hoi":[{"q":"Từ nào có vần anh?","o":["quả chanh","xe đạp","cái giường"],"a":0},{"q":"Từ nào có vần inh?","o":["dùi trống","con chim","kính"],"a":2}],"viet":"anh, ênh, inh, quả chanh","choi":"Ai nhanh hơn: bày các hình trong bài lên bàn, bố mẹ đọc một từ, bé chỉ đúng hình thật nhanh; đúng năm lần được một ngôi sao.","bm":"Miền Nam thường đọc anh gần như 'ăn', bố mẹ đọc mẫu rõ. Mẹo nhớ: 'quả chanh' là anh, 'bập bênh' là ênh, 'kính' là inh."},{"id":"tv1-58","tap":1,"tuan":13,"ten":"Bài 58. ach êch ich","loai":"van","am":["ach","êch","ich"],"tieng":["sách","gạch","khách","ếch","lịch","xích"],"tu":[{"w":"quyển sách","e":"📕"},{"w":"viên gạch","e":"🧱"},{"w":"con ếch","e":"🐸"},{"w":"tờ lịch","e":"📅"},{"w":"thích","e":"👍"},{"w":"vở kịch","e":"🎭"}],"cau":"Bé thích đọc sách cùng mẹ.","doc":"","hoi":[{"q":"Từ nào có vần ich?","o":["pháo hoa","gia đình","tờ lịch"],"a":2},{"q":"Từ nào có vần ach?","o":["con đường","quyển sách","con mèo"],"a":1}],"viet":"ach, êch, ich, quyển sách","choi":"Nặn chữ: bé nặn đất nặn hoặc xếp que tính thành vần ach, rồi kể một từ có vần ach; mỗi từ kể đúng được nặn thêm một chữ.","bm":"ach, êch, ich có ch ở cuối; bé hay viết 'sát'. Nhớ theo ba hình: quyển sách, con ếch, tờ lịch."},{"id":"tv1-59","tap":1,"tuan":13,"ten":"Bài 59. ang ăng âng","loai":"van","am":["ang","ăng","âng"],"tieng":["bàng","làng","măng","trăng","tầng","vâng"],"tu":[{"w":"buổi sáng","e":"🌅"},{"w":"ngôi làng","e":"🏘️"},{"w":"trăng","e":"🌙"},{"w":"cái răng","e":"🦷"},{"w":"nắng","e":"☀️"},{"w":"nhà tầng","e":"🏢"}],"cau":"Buổi sáng, nắng vàng rực rỡ.","doc":"","hoi":[{"q":"Từ nào có vần ăng?","o":["đá quý","trăng","cái dù"],"a":1},{"q":"Từ nào có vần ang?","o":["buổi sáng","cái nơ","mật ong"],"a":0}],"viet":"ang, ăng, âng, vầng trăng","choi":"Nhảy ô: kẻ các ô trên sàn, mỗi ô ghi một vần trong bài (ang, ăng, âng); bố mẹ đọc từ nào, bé nhảy vào ô có vần của từ đó.","bm":"ang, ăng, âng kết thúc bằng ng: miệng mở, lưỡi lùi vào trong. Phân biệt an và ang là chỗ bé miền Nam hay sai nhất."},{"id":"tv1-60","tap":1,"tuan":13,"ten":"Bài 60. Ôn tập và kể chuyện","loai":"ke-chuyen","am":["ep","êp","ip","up","anh","ênh","inh","ach","êch","ich","ang","ăng","âng"],"tieng":["dép","bếp","chanh","kính","sách","trăng"],"tu":[{"w":"quả chanh","e":"🍋"},{"w":"kính","e":"👓"},{"w":"quyển sách","e":"📕"},{"w":"con ếch","e":"🐸"},{"w":"trăng","e":"🌙"},{"w":"cái răng","e":"🦷"}],"cau":"Quạ bôi trắng lông để giả làm bồ câu.","doc":"Kể chuyện về chú quạ muốn làm bồ câu. Quạ bôi trắng bộ lông để giả làm bồ câu và vào sống trong chuồng bồ câu. Bồ câu nhận ra và đuổi quạ đi; quay về, đàn quạ cũng không nhận vì bộ lông lạ. Quạ chẳng còn nơi nào nhận mình.","hoi":[{"q":"Quạ làm gì để vào chuồng bồ câu?","o":["Bôi trắng bộ lông","Học hót như bồ câu","Mang thóc đến biếu"],"a":0},{"q":"Vì sao cuối cùng quạ không có nơi nào nhận?","o":["Vì quạ bay đi quá xa","Vì đàn quạ đã chuyển nhà","Vì quạ giả làm loài khác"],"a":2}],"viet":"chanh, sách, trăng","choi":"Kể nối tiếp: bố mẹ kể câu đầu, bé kể câu tiếp theo, cứ thế đến hết chuyện; ai quên thì được xem lại tranh gợi ý.","bm":"Trò chuyện với bé: mỗi người có một vẻ riêng, không cần giả làm người khác mới được yêu quý."},{"id":"tv1-61","tap":1,"tuan":14,"ten":"Bài 61. ong ông ung ưng","loai":"van","am":["ong","ông","ung","ưng"],"tieng":["ong","bóng","ông","công","sung","lưng","trứng"],"tu":[{"w":"con ong","e":"🐝"},{"w":"quả bóng","e":"⚽"},{"w":"ông","e":"👴"},{"w":"chim công","e":"🦚"},{"w":"khủng long","e":"🦕"},{"w":"quả trứng","e":"🥚"}],"cau":"Ông trồng cây, ong bay quanh vườn.","doc":"","hoi":[{"q":"Từ nào có vần ung?","o":["người bạn","thơm","khủng long"],"a":2},{"q":"Từ nào có vần ông?","o":["con bướm","ông","chụp ảnh"],"a":1}],"viet":"ong, ông, ung, ưng","choi":"Săn tiếng: bố mẹ đọc chậm từng từ, nghe tiếng nào có vần ong, ông, ung hoặc ưng thì bé vỗ tay một cái, không có thì ngồi im. Sau năm lượt đổi vai, bé đọc để bố mẹ vỗ tay.","bm":"Miền Nam hay đọc 'ông' gần như 'ôm'; khi đọc ng cuối miệng vẫn mở, không khép môi."},{"id":"tv1-62","tap":1,"tuan":14,"ten":"Bài 62. iêc iên iêp","loai":"van","am":["iêc","iên","iêp"],"tieng":["xiếc","tiệc","tiên","biển","thiệp","diếp"],"tu":[{"w":"rạp xiếc","e":"🎪"},{"w":"bữa tiệc","e":"🎉"},{"w":"cô tiên","e":"🧚"},{"w":"biển","e":"🌊"},{"w":"tấm thiệp","e":"💌"},{"w":"điện thoại","e":"📱"}],"cau":"Bé đi xem xiếc cùng bố mẹ.","doc":"","hoi":[{"q":"Từ nào có vần iêc?","o":["con voi","rạp xiếc","ốc sên"],"a":1},{"q":"Từ nào có vần iêp?","o":["tấm thiệp","một phút","thuyền"],"a":0}],"viet":"iêc, iên, iêp, cô tiên","choi":"Đi tìm đồ vật: bé đi quanh nhà tìm ba đồ vật hoặc tranh ảnh có tên chứa vần iêc, iên hoặc iêp, ví dụ rạp xiếc, mang về và đọc to tên từng thứ.","bm":"iê là nguyên âm đôi, đọc liền 'i-ê'. Bé hay viết thiếu ê trong 'biển', 'xiếc'."},{"id":"tv1-63","tap":1,"tuan":14,"ten":"Bài 63. iêng iêm yên","loai":"van","am":["iêng","iêm","yên"],"tieng":["chiêng","tiếng","liềm","kiếm","yên","yến"],"tu":[{"w":"tiếng chuông","e":"🔔"},{"w":"kim tiêm","e":"💉"},{"w":"điểm mười","e":"💯"},{"w":"yên lặng","e":"🤫"},{"w":"chim yến","e":"🐦"}],"cau":"Lớp học yên lặng nghe cô giảng.","doc":"","hoi":[{"q":"Từ nào có vần yên?","o":["yên lặng","hộp sơn","ngửi hoa"],"a":0},{"q":"Từ nào có vần iêm?","o":["chiếc xuồng","chụp ảnh","kim tiêm"],"a":2}],"viet":"iêng, iêm, yên","choi":"Bắt bóng: bố mẹ tung quả bóng và nói một tiếng; tiếng có vần iêng, iêm hoặc yên thì bé bắt bóng, không có thì để bóng rơi.","bm":"yên viết bằng y dài vì không có âm đầu; khi có âm đầu thì viết iê như 'tiếng', 'kiếm'. Đây là quy tắc bé hay nhầm."},{"id":"tv1-64","tap":1,"tuan":14,"ten":"Bài 64. iêt iêu yêu","loai":"van","am":["iêt","iêu","yêu"],"tieng":["viết","biết","Việt","diều","tiêu","yêu"],"tu":[{"w":"viết bài","e":"✍️"},{"w":"con diều","e":"🪁"},{"w":"cờ Việt Nam","e":"🇻🇳"},{"w":"yêu thương","e":"🥰"}],"cau":"Bé thả diều trên bãi cỏ.","doc":"","hoi":[{"q":"Từ nào có vần iêu?","o":["chim hải âu","cái áo","con diều"],"a":2},{"q":"Từ nào có vần yêu?","o":["xoài","yêu thương","nắng"],"a":1}],"viet":"iêt, iêu, yêu, Việt Nam","choi":"Viết lên lưng: bố mẹ dùng ngón tay viết vần iêt lên lưng bé, bé đoán đúng thì đọc một từ có vần iêt như viết bài, rồi đổi vai.","bm":"Cùng quy tắc với bài trước: 'yêu' viết y khi đứng đầu, 'diều' viết i khi có âm đầu. Chữ Việt trong Việt Nam viết hoa."},{"id":"tv1-65","tap":1,"tuan":14,"ten":"Bài 65. Ôn tập và kể chuyện","loai":"ke-chuyen","am":["ong","ông","ung","ưng","iêc","iên","iêp","iêng","iêm","yên","iêt","iêu","yêu"],"tieng":["ong","ông","trứng","biển","tiếng","diều"],"tu":[{"w":"con ong","e":"🐝"},{"w":"ông","e":"👴"},{"w":"quả trứng","e":"🥚"},{"w":"biển","e":"🌊"},{"w":"con diều","e":"🪁"},{"w":"kim tiêm","e":"💉"}],"cau":"Hổ thấy xấu hổ vì đã hung hăng.","doc":"Kể chuyện: Lửa, mưa và con hổ hung hăng. Con hổ kiêu ngạo hay quát nạt mọi loài; nó gầm gừ với lửa rồi nhảy vào lửa nên bị bỏng. Mưa rơi, hổ lại tưởng có ai ném sỏi vào mình. Thoát nạn, hổ thấy xấu hổ vì đã hung hăng với mọi người.","hoi":[{"q":"Vì sao hổ bị bỏng?","o":["Vì nó bị mưa làm ướt","Vì nó nhảy vào lửa","Vì nó bị ném sỏi"],"a":1},{"q":"Cuối truyện hổ cảm thấy thế nào?","o":["Xấu hổ","Tức giận","Sợ mưa"],"a":0}],"viet":"ông, biển, diều","choi":"Kể chuyện bằng tranh: bố mẹ vẽ nhanh bốn tranh của câu chuyện ra giấy rồi xáo trộn; bé xếp lại đúng thứ tự và kể theo từng tranh.","bm":"Hỏi bé: khi tức giận em nên làm gì thay vì quát bạn như con hổ? Gợi ý hít thở sâu và nói nhẹ nhàng."},{"id":"tv1-66","tap":1,"tuan":15,"ten":"Bài 66. uôi uôm","loai":"van","am":["uôi","uôm"],"tieng":["chuối","muối","suối","tuổi","buồm","nhuộm"],"tu":[{"w":"nải chuối","e":"🍌"},{"w":"hạt muối","e":"🧂"},{"w":"dòng suối","e":"🏞️"},{"w":"con muỗi","e":"🦟"},{"w":"cánh buồm","e":"⛵"}],"cau":"Bé năm nay sáu tuổi.","doc":"","hoi":[{"q":"Từ nào có vần uôm?","o":["cánh buồm","bánh xốp","chuột máy tính"],"a":0},{"q":"Từ nào có vần uôi?","o":["đoàn tàu","bưu điện","nải chuối"],"a":2}],"viet":"uôi, uôm, cánh buồm","choi":"Ghép thẻ chữ: viết các chữ đã học ra thẻ giấy, bé ghép thành tiếng như chuối, muối, đọc to rồi đố bố mẹ đọc theo.","bm":"uô là nguyên âm đôi, đọc liền 'u-ô'. uôi trong 'chuối', uôm trong 'buồm'; bé hay viết thiếu chữ ô."},{"id":"tv1-67","tap":1,"tuan":15,"ten":"Bài 67. uôc uôt","loai":"van","am":["uôc","uôt"],"tieng":["thuốc","đuốc","cuốc","chuột","tuốt","nuốt"],"tu":[{"w":"viên thuốc","e":"💊"},{"w":"bạch tuộc","e":"🐙"},{"w":"con chuột","e":"🐭"},{"w":"chuột máy tính","e":"🖱️"},{"w":"buộc nơ","e":"🎀"}],"cau":"Chú chuột nhắt chạy tuốt vào hang.","doc":"","hoi":[{"q":"Từ nào có vần uôt?","o":["bắp","kính","con chuột"],"a":2},{"q":"Từ nào có vần uôc?","o":["ban đêm","viên thuốc","cái đèn"],"a":1}],"viet":"uôc, uôt, con chuột","choi":"Ai nhanh hơn: bày các hình trong bài lên bàn, bố mẹ đọc một từ, bé chỉ đúng hình thật nhanh; đúng năm lần được một ngôi sao.","bm":"uôc và uôt khác nhau ở âm cuối c và t; miền Nam đọc gần giống nhau nên bé nhớ theo từ: viên thuốc, con chuột."},{"id":"tv1-68","tap":1,"tuan":15,"ten":"Bài 68. uôn uông","loai":"van","am":["uôn","uông"],"tieng":["khuôn","chuồn","cuộn","chuông","xuồng","luống"],"tu":[{"w":"cuộn len","e":"🧶"},{"w":"cái chuông","e":"🔔"},{"w":"chiếc xuồng","e":"🛶"},{"w":"luống rau","e":"🥬"},{"w":"uống sữa","e":"🥛"},{"w":"cái muỗng","e":"🥄"}],"cau":"Chuồn chuồn bay qua luống rau.","doc":"","hoi":[{"q":"Từ nào có vần uôn?","o":["tuần lễ","cuộn len","nghe"],"a":1},{"q":"Từ nào có vần uông?","o":["cái chuông","ông","cột cờ"],"a":0}],"viet":"uôn, uông, cái chuông","choi":"Nặn chữ: bé nặn đất nặn hoặc xếp que tính thành vần uôn, rồi kể một từ có vần uôn; mỗi từ kể đúng được nặn thêm một chữ.","bm":"'Cuộn len' có n cuối, 'cái chuông' có ng cuối. Đọc mẫu để bé nghe lúc lưỡi chạm răng và lúc miệng mở."},{"id":"tv1-69","tap":1,"tuan":15,"ten":"Bài 69. ươi ươu","loai":"van","am":["ươi","ươu"],"tieng":["người","tươi","bưởi","mười","hươu","bướu"],"tu":[{"w":"số mười","e":"🔟"},{"w":"tươi cười","e":"😄"},{"w":"hươu cao cổ","e":"🦒"},{"w":"bướu lạc đà","e":"🐪"},{"w":"người bạn","e":"🧑‍🤝‍🧑"}],"cau":"Hươu cao cổ ăn lá trên cây cao.","doc":"","hoi":[{"q":"Từ nào có vần ươu?","o":["hươu cao cổ","ăn cơm","nho"],"a":0},{"q":"Từ nào có vần ươi?","o":["dùi trống","y tá","số mười"],"a":2}],"viet":"ươi, ươu, con hươu","choi":"Nhảy ô: kẻ các ô trên sàn, mỗi ô ghi một vần trong bài (ươi, ươu); bố mẹ đọc từ nào, bé nhảy vào ô có vần của từ đó.","bm":"ươi và ươu là vần dài, cho bé đánh vần từng phần rồi đọc trơn: số mười, con hươu."},{"id":"tv1-70","tap":1,"tuan":15,"ten":"Bài 70. Ôn tập và kể chuyện","loai":"ke-chuyen","am":["uôi","uôm","uôc","uôt","uôn","uông","ươi","ươu"],"tieng":["chuối","buồm","chuột","chuông","mười","hươu"],"tu":[{"w":"nải chuối","e":"🍌"},{"w":"cánh buồm","e":"⛵"},{"w":"con chuột","e":"🐭"},{"w":"cái chuông","e":"🔔"},{"w":"số mười","e":"🔟"},{"w":"hươu cao cổ","e":"🦒"}],"cau":"Chuột đồng xin về quê.","doc":"Kể chuyện: Chuột nhà và chuột đồng. Chuột nhà rủ chuột đồng lên thành phố vì nghĩ ở đó có nhiều món ngon. Nhưng chuột đồng bị mèo rượt, lại gặp chó dữ ở kho thức ăn nên sợ hết hồn. Chuột đồng xin về quê, vì thấy thức ăn tự mình làm ra mới ngon và yên ổn.","hoi":[{"q":"Chuột nhà rủ chuột đồng đi đâu?","o":["Về quê chơi","Vào rừng sâu","Lên thành phố"],"a":2},{"q":"Vì sao chuột đồng xin về quê?","o":["Ở phố đồ ăn không ngon","Ở phố gặp mèo và chó","Chuột đồng nhớ mẹ quá"],"a":1}],"viet":"chuối, chuột, hươu","choi":"Diễn kịch nhỏ: bé và bố mẹ mỗi người nhận một vai trong câu chuyện, dùng thú bông làm nhân vật và diễn lại trong năm phút.","bm":"Hỏi bé thích sống ở thành phố hay ở quê và vì sao; không có đáp án đúng sai, chỉ cần bé nói thành câu trọn vẹn."},{"id":"tv1-71","tap":1,"tuan":16,"ten":"Bài 71. ươc ươt","loai":"van","am":["ươc","ươt"],"tieng":["thước","nước","bước","lướt","trượt","mượt"],"tu":[{"w":"thước kẻ","e":"📏"},{"w":"giọt nước","e":"💧"},{"w":"bước chân","e":"👣"},{"w":"lướt sóng","e":"🏄"},{"w":"trượt tuyết","e":"⛷️"},{"w":"rước đèn","e":"🏮"}],"cau":"Bé cầm đèn đi rước đèn Trung thu.","doc":"","hoi":[{"q":"Từ nào có vần ươt?","o":["đồ chơi","lướt sóng","cam"],"a":1},{"q":"Từ nào có vần ươc?","o":["thước kẻ","bác sĩ","chó"],"a":0}],"viet":"ươc, ươt, thước kẻ","choi":"Săn tiếng: bố mẹ đọc chậm từng từ, nghe tiếng nào có vần ươc hoặc ươt thì bé vỗ tay một cái, không có thì ngồi im. Sau năm lượt đổi vai, bé đọc để bố mẹ vỗ tay.","bm":"ươc và ươt khác ở âm cuối: 'thước', 'nước' có c; 'lướt', 'trượt' có t. Nhớ theo từng cặp hình."},{"id":"tv1-72","tap":1,"tuan":16,"ten":"Bài 72. ươm ươp","loai":"van","am":["ươm","ươp"],"tieng":["bướm","gươm","cườm","ươm","mướp","ướp"],"tu":[{"w":"con bướm","e":"🦋"},{"w":"vườn ươm","e":"🌱"},{"w":"chuỗi cườm","e":"📿"},{"w":"ướp lạnh","e":"🧊"}],"cau":"Bướm vàng bay quanh giàn mướp.","doc":"","hoi":[{"q":"Từ nào có vần ươm?","o":["con bướm","quả cam","lá thư"],"a":0},{"q":"Từ nào có vần ươp?","o":["chú ý","trăng","ướp lạnh"],"a":2}],"viet":"ươm, ươp, con bướm","choi":"Đi tìm đồ vật: bé đi quanh nhà tìm ba đồ vật hoặc tranh ảnh có tên chứa vần ươm hoặc ươp, ví dụ con bướm, mang về và đọc to tên từng thứ.","bm":"ươm và ươp đều khép môi ở cuối; ươm có m ngân dài, ươp có p dứt khoát."},{"id":"tv1-73","tap":1,"tuan":16,"ten":"Bài 73. ươn ương","loai":"van","am":["ươn","ương"],"tieng":["vườn","lươn","vượn","giường","gương","đường"],"tu":[{"w":"khu vườn","e":"🏡"},{"w":"con vượn","e":"🦧"},{"w":"cái giường","e":"🛏️"},{"w":"con đường","e":"🛣️"},{"w":"hoa hướng dương","e":"🌻"}],"cau":"Vườn nhà bà có hoa hướng dương.","doc":"","hoi":[{"q":"Từ nào có vần ươn?","o":["tóc xoăn","con cừu","khu vườn"],"a":2},{"q":"Từ nào có vần ương?","o":["lê","cái giường","vở kịch"],"a":1}],"viet":"ươn, ương, khu vườn","choi":"Bắt bóng: bố mẹ tung quả bóng và nói một tiếng; tiếng có vần ươn hoặc ương thì bé bắt bóng, không có thì để bóng rơi.","bm":"Miền Nam hay đọc 'vườn' thành 'vường'; đọc mẫu và chạm lưỡi ở cuối khi đọc n."},{"id":"tv1-74","tap":1,"tuan":16,"ten":"Bài 74. oa oe","loai":"van","am":["oa","oe"],"tieng":["hoa","toa","khoa","loa","xoè","khoẻ"],"tu":[{"w":"bông hoa","e":"🌸"},{"w":"cái loa","e":"📢"},{"w":"toa tàu","e":"🚃"},{"w":"khoẻ mạnh","e":"💪"},{"w":"váy xoè","e":"👗"},{"w":"chích choè","e":"🐦"}],"cau":"Bé tập thể dục cho khoẻ.","doc":"","hoi":[{"q":"Từ nào có vần oa?","o":["chuỗi cườm","bông hoa","biển"],"a":1},{"q":"Từ nào có vần oe?","o":["khoẻ mạnh","số mười","khỉ"],"a":0}],"viet":"oa, oe, bông hoa","choi":"Viết lên lưng: bố mẹ dùng ngón tay viết vần oa lên lưng bé, bé đoán đúng thì đọc một từ có vần oa như bông hoa, rồi đổi vai.","bm":"oa, oe có âm o đứng đệm: môi tròn rồi mở ra. Chữ 'khoẻ' có nơi viết 'khỏe', hai cách đều đọc như nhau."},{"id":"tv1-75","tap":1,"tuan":16,"ten":"Bài 75. Ôn tập và kể chuyện","loai":"ke-chuyen","am":["ươc","ươt","ươm","ươp","ươn","ương","oa","oe"],"tieng":["thước","lướt","bướm","vườn","hoa","khoẻ"],"tu":[{"w":"thước kẻ","e":"📏"},{"w":"lướt sóng","e":"🏄"},{"w":"con bướm","e":"🦋"},{"w":"con vượn","e":"🦧"},{"w":"bông hoa","e":"🌸"},{"w":"khoẻ mạnh","e":"💪"}],"cau":"Mây hoá thành mưa tưới cho vườn hoa.","doc":"Kể chuyện về đám mây nhỏ. Mây trôi một mình thấy buồn nên hoá thành mưa rơi xuống giúp mọi người. Cây cối tươi tốt, các bạn nhỏ vui chơi; rồi nước bay hơi, gió đưa lên trời, mây lại thành mây.","hoi":[{"q":"Mây nhỏ làm gì để giúp mọi người?","o":["Hoá thành mưa","Che nắng cho cây","Thổi gió mát"],"a":0},{"q":"Sau khi mưa rơi, cây cối thế nào?","o":["Bị ngập úng","Rụng hết lá","Tươi tốt"],"a":2}],"viet":"vườn, hoa, khoẻ","choi":"Kể nối tiếp: bố mẹ kể câu đầu, bé kể câu tiếp theo, cứ thế đến hết chuyện; ai quên thì được xem lại tranh gợi ý.","bm":"Cho bé xem hơi nước bốc lên khi mẹ nấu canh để bé hiểu vì sao nước lại bay lên thành mây."},{"id":"tv1-76","tap":1,"tuan":17,"ten":"Bài 76. oan oăn oat oăt","loai":"van","am":["oan","oăn","oat","oăt"],"tieng":["khoan","toán","ngoan","xoăn","hoạt","loắt"],"tu":[{"w":"học toán","e":"🔢"},{"w":"đoàn tàu","e":"🚂"},{"w":"tóc xoăn","e":"👩‍🦱"},{"w":"phim hoạt hình","e":"📺"},{"w":"bé ngoan","e":"😇"}],"cau":"Bé ngoan ngồi xem phim hoạt hình.","doc":"","hoi":[{"q":"Từ nào có vần oan?","o":["hoa thơm","hoa hướng dương","học toán"],"a":2},{"q":"Từ nào có vần oat?","o":["bước chân","phim hoạt hình","cây vợt"],"a":1}],"viet":"oan, oăn, oat, oăt","choi":"Ghép thẻ chữ: viết các chữ đã học ra thẻ giấy, bé ghép thành tiếng như khoan, toán, đọc to rồi đố bố mẹ đọc theo.","bm":"oăn và oăt dùng chữ ă, bé hay quên dấu trăng; 'tóc xoăn', 'loắt choắt' là các từ hay gặp."},{"id":"tv1-77","tap":1,"tuan":17,"ten":"Bài 77. oai uê uy","loai":"van","am":["oai","uê","uy"],"tieng":["khoai","xoài","ngoài","huệ","khuy","thuỷ"],"tu":[{"w":"khoai lang","e":"🍠"},{"w":"quả xoài","e":"🥭"},{"w":"điện thoại","e":"📱"},{"w":"tàu thuỷ","e":"🚢"},{"w":"huy hiệu","e":"🎖️"},{"w":"hoa huệ","e":"💐"}],"cau":"Bé đi tàu thuỷ về quê thăm bà.","doc":"","hoi":[{"q":"Từ nào có vần oai?","o":["khăn","khoai lang","rùa"],"a":1},{"q":"Từ nào có vần uy?","o":["tàu thuỷ","cây tre","máy bay"],"a":0}],"viet":"oai, uê, uy, tàu thuỷ","choi":"Ai nhanh hơn: bày các hình trong bài lên bàn, bố mẹ đọc một từ, bé chỉ đúng hình thật nhanh; đúng năm lần được một ngôi sao.","bm":"Chú ý 'quê' không thuộc vần uê mà là qu ghép với ê. 'Tàu thuỷ' cũng có thể viết 'tàu thủy'."},{"id":"tv1-78","tap":1,"tuan":17,"ten":"Bài 78. uân uât","loai":"van","am":["uân","uât"],"tieng":["xuân","tuần","huân","luật","khuất","thuật"],"tu":[{"w":"mùa xuân","e":"🌸"},{"w":"huân chương","e":"🏅"},{"w":"ảo thuật","e":"🎩"},{"w":"võ thuật","e":"🥋"},{"w":"tuần lễ","e":"📅"}],"cau":"Mùa xuân về, cây đâm chồi nảy lộc.","doc":"","hoi":[{"q":"Từ nào có vần uân?","o":["mùa xuân","số bảy","con tằm"],"a":0},{"q":"Từ nào có vần uât?","o":["cái nơ","viết bài","ảo thuật"],"a":2}],"viet":"uân, uât, mùa xuân","choi":"Nặn chữ: bé nặn đất nặn hoặc xếp que tính thành vần uân, rồi kể một từ có vần uân; mỗi từ kể đúng được nặn thêm một chữ.","bm":"uân và uât là vần dài; cho bé đọc từng phần u, â rồi ghép lại."},{"id":"tv1-79","tap":1,"tuan":17,"ten":"Bài 79. uyên uyêt","loai":"van","am":["uyên","uyêt"],"tieng":["thuyền","truyện","chuyền","khuyết","tuyết","duyệt"],"tu":[{"w":"con thuyền","e":"⛵"},{"w":"truyện tranh","e":"📚"},{"w":"chuyền bóng","e":"🏐"},{"w":"trăng khuyết","e":"🌙"},{"w":"bông tuyết","e":"❄️"},{"w":"người tuyết","e":"⛄"}],"cau":"Bé thích đọc truyện tranh về người tuyết.","doc":"","hoi":[{"q":"Từ nào có vần uyêt?","o":["cái trống","con cọp","trăng khuyết"],"a":2},{"q":"Từ nào có vần uyên?","o":["xương","con thuyền","chuột máy tính"],"a":1}],"viet":"uyên, uyêt, con thuyền","choi":"Nhảy ô: kẻ các ô trên sàn, mỗi ô ghi một vần trong bài (uyên, uyêt); bố mẹ đọc từ nào, bé nhảy vào ô có vần của từ đó.","bm":"uyên, uyêt là vần dài nhất lớp 1; cho bé đánh vần 'u, y, ê, n' vài lần rồi đọc trơn 'thuyền'."},{"id":"tv1-80","tap":1,"tuan":17,"ten":"Bài 80. Ôn tập và kể chuyện","loai":"ke-chuyen","am":["oan","oăn","oat","oăt","oai","uê","uy","uân","uât","uyên","uyêt"],"tieng":["toán","xoăn","hoạt","xoài","xuân","thuyền"],"tu":[{"w":"học toán","e":"🔢"},{"w":"phim hoạt hình","e":"📺"},{"w":"quả xoài","e":"🥭"},{"w":"tàu thuỷ","e":"🚢"},{"w":"mùa xuân","e":"🌸"},{"w":"con thuyền","e":"⛵"}],"cau":"Nhờ đôi chân, hươu thoát khỏi sói.","doc":"Kể chuyện về chú hươu và đôi chân. Hươu rất tự hào về cặp sừng đẹp nhưng lại chê bốn cái chân là xấu. Một hôm bị chó sói đuổi, nhờ đôi chân chạy nhanh mà hươu thoát nạn. Hươu hiểu ra mỗi thứ đều có ích riêng.","hoi":[{"q":"Hươu tự hào về điều gì?","o":["Đôi chân dài","Cặp sừng đẹp","Bộ lông vàng"],"a":1},{"q":"Cái gì đã cứu hươu khi bị sói đuổi?","o":["Đôi chân chạy nhanh","Cặp sừng to đẹp","Bộ lông lẫn vào cỏ"],"a":0}],"viet":"xoài, xuân, thuyền","choi":"Kể chuyện bằng tranh: bố mẹ vẽ nhanh bốn tranh của câu chuyện ra giấy rồi xáo trộn; bé xếp lại đúng thứ tự và kể theo từng tranh.","bm":"Nói với bé: cái gì cũng có ích, kể cả những thứ trông không đẹp; liên hệ với các bộ phận trên cơ thể bé."},{"id":"tv1-81","tap":1,"tuan":18,"ten":"Bài 81. Ôn tập","loai":"on-tap","am":["ơi","ao","ăng"],"tieng":["trời","phơi","đào","áo","nắng","trắng"],"tu":[{"w":"mặt trời","e":"🌞"},{"w":"quả đào","e":"🍑"},{"w":"cái áo","e":"👕"},{"w":"trăng","e":"🌙"},{"w":"ngôi sao","e":"⭐"}],"cau":"Nắng lên, mẹ phơi áo trắng.","doc":"Ôn tập: ghép chữ thành tên các con vật, đọc một bài thơ ngắn, tìm tiếng có vần ơi, ao, ăng trong bài và chép lại khổ thơ cuối.","hoi":[{"q":"Từ nào có vần ơi?","o":["mặt trời","tiếng chuông","cốc"],"a":0},{"q":"Từ nào có vần ao?","o":["sữa","dê","quả đào"],"a":2}],"viet":"Chép khổ thơ cuối của bài đọc","choi":"Săn tiếng: bố mẹ đọc chậm từng từ, nghe tiếng nào có vần ơi, ao hoặc ăng thì bé vỗ tay một cái, không có thì ngồi im. Sau năm lượt đổi vai, bé đọc để bố mẹ vỗ tay.","bm":"Bài ôn gồm cả đọc thơ và chép thơ; nếu bé viết còn chậm, chỉ cần chép một hai dòng thật đẹp."},{"id":"tv1-82","tap":1,"tuan":18,"ten":"Bài 82. Ôn tập","loai":"on-tap","am":["anh","ang"],"tieng":["xanh","chanh","bánh","vàng","sáng","trang"],"tu":[{"w":"màu vàng","e":"🟡"},{"w":"màu xanh","e":"🟢"},{"w":"quả chanh","e":"🍋"},{"w":"trang sách","e":"📖"},{"w":"ánh nắng","e":"🌞"}],"cau":"Lá xanh, hoa vàng, nắng long lanh.","doc":"Ôn tập: viết các số từ 0 đến 9 bằng chữ, tìm tiếng cùng vần với tên các số, luyện chính tả c và k, g và gh, ng và ngh, đọc một đoạn văn và tìm tiếng có vần anh, ang.","hoi":[{"q":"Từ nào có vần ang?","o":["con ong","con mèo","màu vàng"],"a":2},{"q":"Từ nào có vần anh?","o":["vui vẻ","màu xanh","chạy nhảy"],"a":1}],"viet":"Các số từ 0 đến 9 viết bằng chữ","choi":"Đi tìm đồ vật: bé đi quanh nhà tìm ba đồ vật hoặc tranh ảnh có tên chứa vần anh hoặc ang, ví dụ màu vàng, mang về và đọc to tên từng thứ.","bm":"Cho bé đếm từ không đến chín bằng chữ rồi tìm tiếng cùng vần với tên số (hai và tai, ba và gà), đây là trò bé rất thích."},{"id":"tv1-83","tap":1,"tuan":18,"ten":"Bài 83. Ôn tập","loai":"on-tap","am":["oi","ông","e"],"tieng":["voi","còi","sông","thông","tre","xe"],"tu":[{"w":"con voi","e":"🐘"},{"w":"dòng sông","e":"🏞️"},{"w":"cây thông","e":"🌲"},{"w":"luỹ tre","e":"🎋"},{"w":"xe đạp","e":"🚲"}],"cau":"Làng em có luỹ tre xanh, có dòng sông nhỏ.","doc":"Ôn tập: đọc câu chuyện voi thua cuộc thi với hổ nên phải nộp mình cho hổ, nhưng nhờ trí khôn của khỉ mà voi thoát nạn. Sau đó bé đọc thêm một đoạn ngắn và chép câu ca dao về làng quê.","hoi":[{"q":"Nhờ đâu voi thoát khỏi hổ?","o":["Vì hổ thương voi","Nhờ trí khôn của khỉ","Nhờ voi khoẻ hơn hổ"],"a":1}],"viet":"Câu ca dao về làng quê có luỹ tre và dòng sông","choi":"Bắt bóng: bố mẹ tung quả bóng và nói một tiếng; tiếng có vần oi, ông hoặc e thì bé bắt bóng, không có thì để bóng rơi.","bm":"Khi đọc truyện dài, cho bé đọc từng câu, bố mẹ đọc câu tiếp theo; đọc thay phiên giúp bé không mệt."},{"id":"tv1-dgk1","tap":1,"tuan":18,"ten":"Đánh giá cuối học kì","loai":"on-tap","am":["ach","ươi","uyên"],"tieng":["sách","mười","thuyền","khách","tươi","truyện"],"tu":[{"w":"quyển sách","e":"📕"},{"w":"số mười","e":"🔟"},{"w":"con thuyền","e":"⛵"},{"w":"truyện tranh","e":"📚"},{"w":"tươi cười","e":"😄"}],"cau":"Em đọc sách và kể truyện cho cả nhà nghe.","doc":"Bài tự đánh giá cuối học kì một: bé đọc to một đoạn ngắn, trả lời câu hỏi về đoạn vừa đọc và nghe viết một câu.","hoi":[{"q":"Từ nào có vần ươi?","o":["số mười","mùa xuân","xe đạp"],"a":0},{"q":"Từ nào có vần uyên?","o":["giọt nước","câu cá","con thuyền"],"a":2}],"viet":"Nghe viết một câu ngắn","choi":"Làm 'buổi biểu diễn đọc': bé chọn một bài yêu thích trong học kì, đọc to cho cả nhà nghe, mỗi người tặng bé một lời khen cụ thể.","bm":"Đây là bài tự đánh giá, bố mẹ chỉ quan sát bé đọc và viết, ghi lại những vần bé còn nhầm để ôn trong kì nghỉ."},{"id":"tv1-c1-1","tap":2,"tuan":19,"ten":"Bài 1. Tôi là học sinh lớp 1","loai":"doc","am":["inh","ơp"],"tieng":["sinh","xinh","kính","lớp","chớp","hợp"],"tu":[{"w":"học sinh","e":"🧒"},{"w":"lớp học","e":"🏫"},{"w":"máy tính","e":"💻"},{"w":"kính","e":"👓"},{"w":"tia chớp","e":"⚡"}],"cau":"Em là học sinh lớp 1.","doc":"Tôi là học sinh lớp 1. Bạn nhỏ kể về mình: đầu năm học mới làm quen với bảng chữ cái, giờ đã tự đọc được truyện tranh và biết làm toán. Bạn rất vui và tự hào vì mình đã lớn, học được nhiều điều ở trường.","hoi":[{"q":"Bạn nhỏ học lớp mấy?","o":["Lớp 2","Lớp 3","Lớp 1"],"a":2},{"q":"Đầu năm học, bạn nhỏ học gì?","o":["Làm toán","Bảng chữ cái","Đọc truyện"],"a":1},{"q":"Bây giờ bạn nhỏ làm được gì?","o":["Đọc truyện tranh, làm toán","Viết thư dài cho bạn ở xa","Đọc báo cho ông bà nghe"],"a":0}],"viet":"học sinh lớp 1","choi":"Bé đóng vai học sinh lớp 1 giới thiệu về mình: tên, lớp, trường và một điều bé đã học được. Bố mẹ quay một đoạn video ngắn để cuối năm cả nhà xem lại.","bm":"Bé đọc trơn còn chậm là bình thường; cho bé dò tay theo dòng chữ, đọc thầm một lượt rồi mới đọc to.","chude":"Chủ đề 1. Tôi và các bạn"},{"id":"tv1-c1-2","tap":2,"tuan":19,"ten":"Bài 2. Đôi tai xấu xí","loai":"doc","am":["ai","ôi"],"tieng":["tai","dài","hai","đôi","tối","vội"],"tu":[{"w":"đôi tai","e":"👂"},{"w":"con nai","e":"🦌"},{"w":"buổi tối","e":"🌃"},{"w":"đôi giày","e":"👟"},{"w":"cái nồi","e":"🍲"}],"cau":"Thỏ có đôi tai dài.","doc":"Đôi tai xấu xí. Thỏ con buồn vì đôi tai to và dài bị các bạn chê cười. Một lần cả nhóm đi chơi xa rồi lạc đường, nhờ đôi tai thính, thỏ nghe được tiếng bố gọi và dẫn các bạn về nhà. Từ đó các bạn khen đôi tai của thỏ, thỏ không còn buồn nữa.","hoi":[{"q":"Vì sao thỏ con buồn?","o":["Vì bị lạc đường","Vì tai bị chê","Vì không ai chơi cùng"],"a":1},{"q":"Khi đi chơi xa, các bạn gặp chuyện gì?","o":["Bị lạc đường","Bị trời mưa ướt","Bị con sói đuổi"],"a":0},{"q":"Nhờ đâu cả nhóm tìm được đường về?","o":["Nhờ bố đi tìm thấy","Nhờ chim chỉ đường về","Nhờ tai thỏ nghe tiếng bố"],"a":2}],"viet":"đôi tai","choi":"Chơi 'tai thính': bé nhắm mắt, bố mẹ tạo tiếng động ở các góc phòng (gõ cốc, vò giấy, gọi tên), bé đoán tiếng gì và chỉ đúng hướng.","bm":"Bài dạy bé không chê bạn về ngoại hình; hỏi bé đã bao giờ bị trêu chưa và lúc đó bé cảm thấy thế nào.","chude":"Chủ đề 1. Tôi và các bạn"},{"id":"tv1-c1-3","tap":2,"tuan":19,"ten":"Bài 3. Bạn của gió","loai":"doc","am":["ây","ong"],"tieng":["cây","mây","đẩy","sóng","bóng","trong"],"tu":[{"w":"cái cây","e":"🌳"},{"w":"đám mây","e":"☁️"},{"w":"sóng biển","e":"🌊"},{"w":"quả bóng","e":"⚽"},{"w":"con ong","e":"🐝"}],"cau":"Gió đẩy sóng, gió thổi lá cây.","doc":"Bạn của gió. Bài thơ kể gió đi tìm bạn, bay cùng chim, luồn qua kẽ lá. Nhớ bạn, gió gõ cửa, đẩy sóng, thổi căng những cánh buồm. Khi gió vắng, lá cây đứng im, chim không bay, sóng ngủ yên, thuyền buồm nằm im trên bến.","hoi":[{"q":"Gió đi tìm bạn ở đâu?","o":["Bay cùng chim, qua kẽ lá","Chạy theo dòng sông dài","Trốn trong đám mây trắng"],"a":0},{"q":"Khi gió vắng, thuyền buồm thế nào?","o":["Ra khơi thật xa","Đi thật nhanh","Nằm im trên bến"],"a":2}],"viet":"bạn của gió","choi":"Thả thuyền giấy trong chậu nước, bé thổi làm gió đẩy thuyền đi và kể gió đang làm gì; đổi lại bố mẹ thổi, bé đoán gió đi đâu.","bm":"Bài thơ có vần, cho bé đọc nhấn nhẹ vào cuối mỗi dòng để cảm nhận nhịp thơ.","chude":"Chủ đề 1. Tôi và các bạn"},{"id":"tv1-c1-4","tap":2,"tuan":20,"ten":"Bài 4. Giải thưởng tình bạn","loai":"doc","am":["an","ay"],"tieng":["bạn","đàn","lan","chạy","tay","hay"],"tu":[{"w":"bạn bè","e":"👫"},{"w":"chạy bộ","e":"🏃"},{"w":"bàn tay","e":"✋"},{"w":"cây đàn","e":"🎸"},{"w":"máy bay","e":"✈️"}],"cau":"Nai đỡ bạn dậy rồi cùng chạy.","doc":"Giải thưởng tình bạn. Nai và hoẵng cùng chạy thi, cả hai dẫn đầu. Hoẵng vấp phải hòn đá và ngã, nai liền dừng lại đỡ bạn dậy. Hai bạn về đích sau cùng nhưng được trao giải thưởng tình bạn.","hoi":[{"q":"Đôi bạn trong câu chuyện là ai?","o":["Nai và thỏ","Hoẵng và hươu","Nai và hoẵng"],"a":2},{"q":"Vì sao hoẵng bị ngã?","o":["Bị bạn xô ngã","Vấp hòn đá","Chạy quá mệt"],"a":1},{"q":"Khi hoẵng ngã, nai đã làm gì?","o":["Dừng lại đỡ bạn dậy","Chạy tiếp về đích","Gọi người đến giúp"],"a":0}],"viet":"tình bạn","choi":"Chạy tiếp sức trong nhà: khi một người giả vờ vấp ngã, người kia phải dừng lại đỡ dậy rồi cả hai cùng về đích.","bm":"Nhấn mạnh với bé: giúp bạn quý hơn về nhất; khen ngay khi bé biết chờ bạn hoặc nhường bạn.","chude":"Chủ đề 1. Tôi và các bạn"},{"id":"tv1-c1-5","tap":2,"tuan":20,"ten":"Bài 5. Sinh nhật của voi con","loai":"doc","am":["ât","oi"],"tieng":["nhật","mật","đất","voi","vòi","gói"],"tu":[{"w":"sinh nhật","e":"🎂"},{"w":"mật ong","e":"🍯"},{"w":"trái đất","e":"🌍"},{"w":"con voi","e":"🐘"},{"w":"gói quà","e":"🎁"}],"cau":"Voi con vẫy vòi cảm ơn các bạn.","doc":"Sinh nhật của voi con. Hôm nay là sinh nhật voi con, các bạn thỏ trắng, gấu đen, sóc nâu, khỉ vàng và vẹt đến chúc mừng. Thỏ mang cà rốt, gấu mang buồng chuối, khỉ và sóc múa tặng bạn, vẹt nói lời chúc. Voi con vui lắm, vẫy vòi cảm ơn các bạn.","hoi":[{"q":"Thỏ trắng tặng voi con quà gì?","o":["Quả bóng","Cà rốt","Bánh kem"],"a":1},{"q":"Voi con cảm ơn các bạn bằng cách nào?","o":["Vẫy vòi","Phun nước","Tặng quà"],"a":0}],"viet":"sinh nhật","choi":"Tổ chức sinh nhật cho gấu bông: bé chọn quà cho từng con thú như trong bài và nói một lời chúc với mỗi bạn.","bm":"Tập cho bé nói lời cảm ơn khi nhận quà và lời chúc khi đi dự sinh nhật bạn.","chude":"Chủ đề 1. Tôi và các bạn"},{"id":"tv1-c1-ot","tap":2,"tuan":20,"ten":"Ôn tập","loai":"on-tap","am":["inh","ai","ay"],"tieng":["sinh","tai","nai","chạy","tay","bay"],"tu":[{"w":"học sinh","e":"🧒"},{"w":"đôi tai","e":"👂"},{"w":"con nai","e":"🦌"},{"w":"chạy bộ","e":"🏃"},{"w":"máy bay","e":"✈️"}],"cau":"Em yêu các bạn của em.","doc":"Ôn tập chủ đề Tôi và các bạn: bé đọc lại các bài đã học, kể về một người bạn của mình và tìm tiếng có vần đã luyện.","hoi":[{"q":"Trong bài Đôi tai xấu xí, ai dẫn các bạn về nhà?","o":["Thỏ con","Nai","Voi con"],"a":0},{"q":"Trong cuộc thi chạy, nai đã giúp ai?","o":["Thỏ con","Voi con","Hoẵng"],"a":2}],"viet":"Viết tên một người bạn thân","choi":"Đố vui: bố mẹ tả một nhân vật (tai dài, hay giúp bạn, có cái vòi), bé đoán đó là ai trong các bài đã học.","bm":"Cho bé chọn bài thích nhất trong chủ đề và đọc lại cho cả nhà nghe.","chude":"Chủ đề 1. Tôi và các bạn"},{"id":"tv1-c2-1","tap":2,"tuan":21,"ten":"Bài 1. Nụ hôn trên bàn tay","loai":"doc","am":["ôn","ay"],"tieng":["hôn","môn","tôn","tay","bay","chạy"],"tu":[{"w":"nụ hôn","e":"😘"},{"w":"bàn tay","e":"✋"},{"w":"máy bay","e":"✈️"},{"w":"chạy nhảy","e":"🏃"},{"w":"bồn tắm","e":"🛁"}],"cau":"Mẹ hôn lên bàn tay Nam.","doc":"Nụ hôn trên bàn tay. Ngày đầu đi học, Nam thấy lo lắng. Mẹ hôn vào lòng bàn tay Nam và dặn: lúc nào lo thì áp bàn tay lên má, sẽ thấy mẹ luôn ở bên. Nam chào mẹ rồi vui vẻ bước vào lớp.","hoi":[{"q":"Ngày đầu đi học, Nam thấy thế nào?","o":["Buồn ngủ","Tức giận","Lo lắng"],"a":2},{"q":"Mẹ dặn Nam làm gì khi thấy lo?","o":["Chạy ra tìm mẹ","Áp tay lên má","Nói với cô giáo"],"a":1},{"q":"Chào mẹ xong, Nam làm gì?","o":["Vui vẻ vào lớp","Đứng nhìn mẹ về","Ôm mẹ khóc mãi"],"a":0}],"viet":"nụ hôn","choi":"Mẹ và bé cùng 'in' một nụ hôn vào lòng bàn tay nhau trước khi đi học, đi làm, thành bí mật nhỏ của hai mẹ con.","bm":"Nếu bé hay lo khi đến lớp, dùng chính cách trong bài: áp tay lên má là có mẹ ở bên.","chude":"Chủ đề 2. Mái ấm gia đình"},{"id":"tv1-c2-2","tap":2,"tuan":21,"ten":"Bài 2. Làm anh","loai":"doc","am":["anh","ang"],"tieng":["anh","bánh","dành","xanh","dàng","sang"],"tu":[{"w":"anh trai","e":"👦"},{"w":"cái bánh","e":"🍰"},{"w":"quả chanh","e":"🍋"},{"w":"màu vàng","e":"🟡"},{"w":"buổi sáng","e":"🌅"}],"cau":"Làm anh phải biết nhường em.","doc":"Làm anh. Bài thơ nói làm anh không dễ chút nào: em khóc thì phải dỗ dành, em ngã thì nâng dậy thật nhẹ nhàng. Có quà bánh, anh chia em phần hơn; có đồ chơi đẹp, anh nhường em. Làm anh khó nhưng ai thương em thì sẽ làm được.","hoi":[{"q":"Khi em bé ngã, anh phải làm gì?","o":["Gọi mẹ ra đỡ em","Nâng em dậy nhẹ nhàng","Dặn em đừng khóc nữa"],"a":1},{"q":"Có quà bánh, anh chia cho em thế nào?","o":["Chia em phần hơn","Chia đều hai phần","Để dành cho mẹ"],"a":0}],"viet":"làm anh","choi":"Bé đóng vai anh chị chăm em búp bê: dỗ khi em khóc, đỡ khi em ngã, chia bánh cho em phần hơn.","bm":"Hỏi bé: các anh chị trong nhà đã thương em như thế nào? Giúp bé thấy tình thương giữa anh chị em.","chude":"Chủ đề 2. Mái ấm gia đình"},{"id":"tv1-c2-3","tap":2,"tuan":21,"ten":"Bài 3. Cả nhà đi chơi núi","loai":"doc","am":["ui","ươc"],"tieng":["núi","túi","vui","nước","bước","thước"],"tu":[{"w":"ngọn núi","e":"⛰️"},{"w":"túi xách","e":"👜"},{"w":"vui vẻ","e":"😄"},{"w":"nước uống","e":"💧"},{"w":"bước chân","e":"👣"}],"cau":"Cả nhà vui vẻ đi chơi núi.","doc":"Cả nhà đi chơi núi. Bố mẹ đưa Nam và Đức đi chơi núi. Mẹ chuẩn bị quần áo, đồ ăn, nước uống và thuốc chống muỗi. Đến đoạn đường dốc quanh co, bố cõng Đức lên.","hoi":[{"q":"Bố mẹ đưa Nam và Đức đi đâu?","o":["Đi chơi núi","Đi tắm biển","Về thăm quê"],"a":0},{"q":"Mẹ chuẩn bị những gì?","o":["Đồ bơi, mũ, kính râm, phao","Sách truyện, đồ chơi","Quần áo, đồ ăn, thuốc muỗi"],"a":2},{"q":"Đến đoạn dốc, bố làm gì?","o":["Quay về","Cõng Đức","Ngồi nghỉ"],"a":1}],"viet":"đi chơi núi","choi":"Cả nhà soạn ba lô cho một chuyến đi tưởng tượng: bé tự chọn đồ cần mang (nước, đồ ăn, áo, thuốc chống muỗi) và nói vì sao cần.","bm":"Hỏi thêm: khi đi chơi xa em cần nhớ gì để an toàn? Gắn bài đọc với một chuyến đi thật của gia đình.","chude":"Chủ đề 2. Mái ấm gia đình"},{"id":"tv1-c2-4","tap":2,"tuan":22,"ten":"Bài 4. Quạt cho bà ngủ","loai":"doc","am":["at","oe"],"tieng":["quạt","mát","hát","choè","khoẻ","xoè"],"tu":[{"w":"chích choè","e":"🐦"},{"w":"ca hát","e":"🎤"},{"w":"khoẻ mạnh","e":"💪"},{"w":"bãi cát","e":"🏖️"}],"cau":"Bé quạt cho bà ngủ.","doc":"Quạt cho bà ngủ. Bà bị ốm, đang nằm ngủ. Bạn nhỏ ngồi quạt cho bà và mong chim chích choè đừng hót nữa để bà ngủ ngon. Bài thơ cho thấy bạn nhỏ rất thương bà.","hoi":[{"q":"Vì sao bạn nhỏ không muốn chích choè hót?","o":["Vì chim hót quá to","Vì bạn muốn nghe tivi","Vì bà ốm, cần ngủ yên"],"a":2},{"q":"Bạn nhỏ làm gì khi bà ngủ?","o":["Đọc truyện cho bà","Quạt cho bà","Đi lấy thuốc"],"a":1}],"viet":"quạt cho bà","choi":"Bé cầm quạt giấy quạt cho ông bà hoặc bố mẹ lúc nghỉ trưa, đi nhón chân thật nhẹ như bạn nhỏ trong bài.","bm":"Bài thơ nhịp nhẹ, cho bé đọc chậm, nhỏ giọng như đang giữ yên lặng cho bà ngủ.","chude":"Chủ đề 2. Mái ấm gia đình"},{"id":"tv1-c2-5","tap":2,"tuan":22,"ten":"Bài 5. Bữa cơm gia đình","loai":"doc","am":["ơm","inh"],"tieng":["cơm","thơm","đình","bình","xinh","kính"],"tu":[{"w":"bát cơm","e":"🍚"},{"w":"gia đình","e":"👨‍👩‍👧‍👦"},{"w":"hoa thơm","e":"🌸"},{"w":"học sinh","e":"🧒"}],"cau":"Cả nhà quây quần bên mâm cơm.","doc":"Bữa cơm gia đình. Ngày Gia đình Việt Nam 28 tháng 6, nhà bạn Chi tổ chức một bữa liên hoan. Cả nhà quây quần bên nhau, Chi rất vui vì được ở bên những người thân yêu.","hoi":[{"q":"Ngày Gia đình Việt Nam là ngày nào?","o":["20 tháng 11","28 tháng 6","1 tháng 6"],"a":1},{"q":"Vì sao Chi rất vui?","o":["Vì được ở bên người thân","Vì được ăn món ngon","Vì được tặng quà mới"],"a":0}],"viet":"gia đình","choi":"Trong bữa cơm tối, mỗi người kể một chuyện vui trong ngày; bé là người mời cả nhà ăn cơm và giúp dọn bát đũa.","bm":"Có thể đánh dấu ngày 28 tháng 6 lên lịch để cả nhà cùng làm một việc vui với nhau.","chude":"Chủ đề 2. Mái ấm gia đình"},{"id":"tv1-c2-6","tap":2,"tuan":22,"ten":"Bài 6. Ngôi nhà","loai":"doc","am":["oan","ai"],"tieng":["xoan","ngoan","toán","mái","hai","tai"],"tu":[{"w":"bé ngoan","e":"😇"},{"w":"học toán","e":"🔢"},{"w":"mái nhà","e":"🏠"},{"w":"đôi tai","e":"👂"},{"w":"con nai","e":"🦌"}],"cau":"Em yêu ngôi nhà của em.","doc":"Ngôi nhà. Bạn nhỏ kể về ngôi nhà mình yêu: trước ngõ có hàng xoan, chim hót lảnh lót ở đầu hồi, mái nhà vàng thơm mùi rạ. Bạn yêu ngôi nhà, yêu cả quê hương đất nước.","hoi":[{"q":"Trước ngõ nhà bạn nhỏ có gì?","o":["Hàng xoan","Hàng tre","Cây đa"],"a":0},{"q":"Tiếng chim ở đầu hồi nghe thế nào?","o":["Ồn ào","Khe khẽ","Lảnh lót"],"a":2}],"viet":"ngôi nhà","choi":"Bé vẽ ngôi nhà của mình và gọi tên các thứ trong tranh (mái nhà, cửa, cây, chim); bố mẹ viết chữ bên cạnh cho bé đọc.","bm":"Nhà ở thành phố khác ngôi nhà quê trong bài; hỏi bé điều bé thích nhất ở nhà mình.","chude":"Chủ đề 2. Mái ấm gia đình"},{"id":"tv1-c2-ot","tap":2,"tuan":22,"ten":"Ôn tập","loai":"on-tap","am":["ay","ang","ơm"],"tieng":["tay","bay","vàng","sáng","cơm","thơm"],"tu":[{"w":"bàn tay","e":"✋"},{"w":"màu vàng","e":"🟡"},{"w":"bát cơm","e":"🍚"},{"w":"máy bay","e":"✈️"},{"w":"buổi sáng","e":"🌅"}],"cau":"Em yêu bố mẹ, ông bà và anh chị.","doc":"Ôn tập chủ đề Mái ấm gia đình: bé đọc lại các bài, kể về một việc làm của người thân và đọc thuộc một đoạn thơ yêu thích.","hoi":[{"q":"Ai cõng Đức khi lên dốc?","o":["Mẹ","Anh Nam","Bố"],"a":2},{"q":"Bạn nhỏ quạt cho ai ngủ?","o":["Con mèo","Bà","Em bé"],"a":1}],"viet":"Viết tên các người thân trong nhà","choi":"Thi kể tên các thành viên trong gia đình và một việc mỗi người làm cho cả nhà.","bm":"Cho bé đọc thuộc một đoạn thơ yêu thích trong chủ đề, như Làm anh hoặc Quạt cho bà ngủ.","chude":"Chủ đề 2. Mái ấm gia đình"},{"id":"tv1-c3-1","tap":2,"tuan":23,"ten":"Bài 1. Tôi đi học","loai":"doc","am":["oc","ương"],"tieng":["học","sóc","cóc","trường","đường","gương"],"tu":[{"w":"con sóc","e":"🐿️"},{"w":"con cóc","e":"🐸"},{"w":"con đường","e":"🛣️"},{"w":"trường học","e":"🏫"},{"w":"cái giường","e":"🛏️"}],"cau":"Mẹ dắt tay em đến trường.","doc":"Tôi đi học. Cứ mỗi độ cuối thu, bạn nhỏ lại nhớ về buổi đầu tiên đi học. Hôm ấy mẹ dắt tay đến trường, con đường quen bỗng thấy lạ, cảnh vật xung quanh như đổi khác.","hoi":[{"q":"Cuối thu, bạn nhỏ nhớ lại điều gì?","o":["Ngày đi chơi xa","Buổi đầu đi học","Ngày được khen"],"a":1},{"q":"Ai đưa bạn nhỏ đến trường hôm đó?","o":["Mẹ","Ông","Anh trai"],"a":0}],"viet":"tôi đi học","choi":"Bé kể lại ngày đầu đi học lớp 1 của mình: ai đưa đi, bé thấy gì lạ, gặp bạn nào. Bố mẹ ghi lại vào sổ kỉ niệm.","bm":"Bài văn tả cảm xúc; hỏi bé 'lúc đó em thấy thế nào?' để bé tập nói về cảm xúc của mình.","chude":"Chủ đề 3. Mái trường mến yêu"},{"id":"tv1-c3-2","tap":2,"tuan":23,"ten":"Bài 2. Đi học","loai":"doc","am":["ương","uôi"],"tieng":["trường","nương","hương","suối","chuối","tuổi"],"tu":[{"w":"trường học","e":"🏫"},{"w":"hoa hướng dương","e":"🌻"},{"w":"dòng suối","e":"🏞️"},{"w":"nải chuối","e":"🍌"},{"w":"con đường","e":"🛣️"}],"cau":"Một mình em tới lớp.","doc":"Đi học. Hôm qua mẹ dắt bé đến trường, hôm nay mẹ bận lên nương nên bé tự đi học. Trường của bé nhỏ xinh, nằm yên giữa rừng cây. Đường đến trường có hương rừng thơm, suối trong và những tán cọ xoè ra che nắng.","hoi":[{"q":"Vì sao hôm nay bạn nhỏ tự đi học?","o":["Vì mẹ bận lên nương","Vì bé đã lớn hơn","Vì trường ở gần nhà"],"a":0},{"q":"Trường của bạn nhỏ thế nào?","o":["To, có sân rộng","Ở cạnh bờ sông","Nhỏ, giữa rừng cây"],"a":2},{"q":"Trên đường đến trường có gì?","o":["Đồng lúa, đàn trâu","Hương rừng, suối, cọ","Cầu tre, bờ sông"],"a":1}],"viet":"đi học","choi":"Vẽ con đường từ nhà đến trường của bé, đánh dấu những thứ bé thấy mỗi ngày như cây, cửa hàng, ngã tư.","bm":"Bé ở thành phố không có rừng cọ, suối; kể thêm cho bé về các bạn nhỏ vùng núi đi học xa thế nào.","chude":"Chủ đề 3. Mái trường mến yêu"},{"id":"tv1-c3-3","tap":2,"tuan":23,"ten":"Bài 3. Hoa yêu thương","loai":"doc","am":["oa","ương"],"tieng":["hoa","toa","loa","thương","trường","đường"],"tu":[{"w":"bông hoa","e":"🌸"},{"w":"cái loa","e":"📢"},{"w":"toa tàu","e":"🚃"},{"w":"yêu thương","e":"❤️"},{"w":"trường học","e":"🏫"}],"cau":"Lớp em như một bông hoa.","doc":"Hoa yêu thương. Lớp của bạn nhỏ có bốn tổ. Các bạn cùng làm bức tranh một bông hoa có bốn cánh và đặt tên là Hoa yêu thương, cho thấy cả lớp gắn bó với nhau.","hoi":[{"q":"Lớp của bạn nhỏ có mấy tổ?","o":["2 tổ","6 tổ","4 tổ"],"a":2},{"q":"Bức tranh bông hoa bốn cánh tên là gì?","o":["Hoa tình bạn","Hoa yêu thương","Hoa bốn mùa"],"a":1}],"viet":"hoa yêu thương","choi":"Cả nhà cùng làm một bông hoa giấy, mỗi người làm một cánh và viết tên mình, ghép thành bông hoa yêu thương của gia đình.","bm":"Hỏi bé lớp bé có mấy tổ, bé ngồi tổ nào, bạn cùng tổ tên gì.","chude":"Chủ đề 3. Mái trường mến yêu"},{"id":"tv1-c3-4","tap":2,"tuan":24,"ten":"Bài 4. Cây bàng và lớp học","loai":"doc","am":["ang","oc"],"tieng":["bàng","sáng","vàng","học","sóc","cóc"],"tu":[{"w":"buổi sáng","e":"🌅"},{"w":"màu vàng","e":"🟡"},{"w":"lớp học","e":"🏫"},{"w":"con sóc","e":"🐿️"},{"w":"con cóc","e":"🐸"}],"cau":"Cây bàng nghiêng mình nghe cô giảng.","doc":"Cây bàng và lớp học. Cây bàng già đứng bên lớp học, tán lá xoè rộng như chiếc ô xanh. Cây ghé sát cửa lớp để nghe cô giảng bài. Sáng thứ Hai, lớp học rộn ràng tiếng các bạn.","hoi":[{"q":"Vì sao cây bàng ghé sát cửa lớp?","o":["Để che nắng","Để nghe cô giảng","Để chờ các bạn"],"a":1},{"q":"Sáng thứ Hai, lớp học thế nào?","o":["Rộn ràng","Yên lặng","Vắng vẻ"],"a":0}],"viet":"cây bàng","choi":"Đóng vai cây bàng: bé đứng giang tay làm tán cây, nghiêng người 'nghe' bố mẹ giảng bài rồi kể lại cây nghe được gì.","bm":"Nếu gần nhà có cây bàng, dẫn bé ra xem lá non, lá già để bé thấy cây đổi màu theo mùa.","chude":"Chủ đề 3. Mái trường mến yêu"},{"id":"tv1-c3-5","tap":2,"tuan":24,"ten":"Bài 5. Bác trống trường","loai":"doc","am":["ông","ương"],"tieng":["trống","ông","công","trường","đường","gương"],"tu":[{"w":"cái trống","e":"🥁"},{"w":"ông","e":"👴"},{"w":"chim công","e":"🦚"},{"w":"trường học","e":"🏫"},{"w":"con đường","e":"🛣️"}],"cau":"Tùng, tùng, tùng! Bác trống gọi em vào lớp.","doc":"Bác trống trường. Bác trống tròn trĩnh, da nâu bóng, nằm ở một góc sân trường. Ngày nào bác cũng giúp các bạn vào lớp và ra về đúng giờ. Ngày khai giảng, tiếng trống của bác báo hiệu năm học mới bắt đầu.","hoi":[{"q":"Bác trống trông như thế nào?","o":["Tròn, da nâu bóng","Nhỏ, màu đỏ tươi","To, da trắng sáng"],"a":0},{"q":"Hằng ngày bác trống giúp các bạn điều gì?","o":["Học bài và làm toán","Giữ trật tự trong lớp","Vào lớp, ra về đúng giờ"],"a":2},{"q":"Ngày khai giảng, tiếng trống báo hiệu gì?","o":["Giờ ra chơi đến","Năm học mới bắt đầu","Hết một buổi học"],"a":1}],"viet":"bác trống trường","choi":"Dùng nồi hoặc hộp làm trống, gõ các nhịp khác nhau cho vào lớp, ra chơi, tan học; bé nghe nhịp và làm động tác tương ứng.","bm":"Trống được gọi là 'bác' như một con người; giải thích cho bé đây là cách nói làm bài thêm gần gũi.","chude":"Chủ đề 3. Mái trường mến yêu"},{"id":"tv1-c3-6","tap":2,"tuan":24,"ten":"Bài 6. Giờ ra chơi","loai":"doc","am":["ơi","ây"],"tieng":["chơi","bơi","trời","dây","mây","cây"],"tu":[{"w":"đồ chơi","e":"🧸"},{"w":"đi bơi","e":"🏊"},{"w":"mặt trời","e":"☀️"},{"w":"đám mây","e":"☁️"},{"w":"cái cây","e":"🌳"}],"cau":"Giờ ra chơi, em nhảy dây cùng bạn.","doc":"Giờ ra chơi. Bài thơ tả giờ ra chơi rộn ràng ở sân trường. Các bạn nhảy dây, đá cầu thật tài, thật nhịp nhàng. Giờ ra chơi vui vẻ, ai cũng thích.","hoi":[{"q":"Bài thơ nhắc đến những trò chơi nào?","o":["Trốn tìm, kéo co","Đá bóng, chạy thi","Nhảy dây, đá cầu"],"a":2},{"q":"Giờ ra chơi thế nào?","o":["Yên ả","Rộn ràng","Lặng lẽ"],"a":1}],"viet":"giờ ra chơi","choi":"Chơi nhảy dây hoặc đá cầu năm phút cùng bé, vừa chơi vừa đọc vài câu thơ trong bài cho đúng nhịp.","bm":"Hỏi bé giờ ra chơi ở trường bé thường chơi gì, với ai, để bé nối bài thơ với đời sống.","chude":"Chủ đề 3. Mái trường mến yêu"},{"id":"tv1-c3-ot","tap":2,"tuan":24,"ten":"Ôn tập","loai":"on-tap","am":["ương","ông","oc"],"tieng":["trường","đường","trống","ông","học","sóc"],"tu":[{"w":"trường học","e":"🏫"},{"w":"cái trống","e":"🥁"},{"w":"con sóc","e":"🐿️"},{"w":"con đường","e":"🛣️"},{"w":"ông","e":"👴"}],"cau":"Em yêu mái trường của em.","doc":"Ôn tập chủ đề Mái trường mến yêu: bé đọc lại các bài, kể về trường lớp, thầy cô và bạn bè của mình.","hoi":[{"q":"Hôm bé tự đi học, mẹ đi đâu?","o":["Đi chợ","Lên nương","Đi làm xa"],"a":1},{"q":"Tiếng trống ngày khai giảng báo hiệu điều gì?","o":["Năm học mới bắt đầu","Giờ ra chơi đã đến","Hết giờ học buổi sáng"],"a":0}],"viet":"Viết tên trường của bé","choi":"Đố bé: nhịp trống nào báo vào lớp, nhịp nào báo ra chơi? Bé dùng nồi gõ thử.","bm":"Cho bé chọn bài thơ thích nhất trong chủ đề và đọc diễn cảm cho ông bà nghe qua điện thoại.","chude":"Chủ đề 3. Mái trường mến yêu"},{"id":"tv1-c4-1","tap":2,"tuan":25,"ten":"Bài 1. Rửa tay trước khi ăn","loai":"doc","am":["ay","ăn"],"tieng":["tay","bay","chạy","ăn","khăn","chăn"],"tu":[{"w":"bàn tay","e":"✋"},{"w":"máy bay","e":"✈️"},{"w":"ăn cơm","e":"🍚"},{"w":"chạy bộ","e":"🏃"}],"cau":"Em rửa tay trước khi ăn.","doc":"Rửa tay trước khi ăn. Bàn tay cầm nắm nhiều thứ nên dễ dính vi trùng; nếu không rửa tay, vi trùng theo thức ăn vào bụng và gây bệnh. Vì vậy em cần rửa tay sạch bằng xà phòng và nước sạch trước khi ăn.","hoi":[{"q":"Vi trùng vào cơ thể bằng cách nào?","o":["Từ tay dính vào thức ăn","Từ nước uống ở trường","Từ hơi thở của bạn"],"a":0},{"q":"Em rửa tay đúng cách bằng gì?","o":["Nước ấm","Khăn ướt lau thật kĩ","Xà phòng và nước sạch"],"a":2}],"viet":"rửa tay","choi":"Hát một bài ngắn trong lúc rửa tay và làm đủ các bước: làm ướt tay, xoa xà phòng, chà lòng bàn tay, mu bàn tay, kẽ ngón, rửa sạch rồi lau khô.","bm":"Để bé tự rửa tay trước mỗi bữa ăn, bố mẹ chỉ nhắc; thói quen sẽ hình thành sau vài tuần.","chude":"Chủ đề 4. Điều em cần biết"},{"id":"tv1-c4-2","tap":2,"tuan":25,"ten":"Bài 2. Lời chào đi trước","loai":"doc","am":["ao","ươc"],"tieng":["chào","sao","táo","trước","bước","nước"],"tu":[{"w":"lời chào","e":"👋"},{"w":"ngôi sao","e":"⭐"},{"w":"quả táo","e":"🍎"},{"w":"bước chân","e":"👣"},{"w":"giọt nước","e":"💧"}],"cau":"Con chào bà ạ!","doc":"Lời chào đi trước. Bài thơ ví lời chào như bông hoa, như làn gió mát, như bàn tay thân thiện. Đi đến đâu lời chào cũng đi trước, giúp em gần gũi với mọi người. Bài thơ nhắc em luôn lễ phép chào hỏi khi gặp ai.","hoi":[{"q":"Lời chào được ví với những gì?","o":["Ánh nắng, cơn mưa, dòng sông","Con chim, cánh bướm","Bông hoa, làn gió, bàn tay"],"a":2},{"q":"Bài thơ khuyên em điều gì?","o":["Đi đâu cũng phải nhanh","Lễ phép chào mọi người","Phải biết cảm ơn"],"a":1}],"viet":"lời chào","choi":"Thi chào hỏi: bố mẹ lần lượt đóng vai ông bà, cô giáo, bác bảo vệ, bạn bè; bé chào cho đúng với từng người.","bm":"Dạy bé chào kèm lời đầy đủ: 'Con chào bà ạ', 'Em chào cô ạ'.","chude":"Chủ đề 4. Điều em cần biết"},{"id":"tv1-c4-3","tap":2,"tuan":25,"ten":"Bài 3. Khi mẹ vắng nhà","loai":"doc","am":["ăng","oi"],"tieng":["vắng","trắng","nắng","sói","nói","gọi"],"tu":[{"w":"nắng","e":"☀️"},{"w":"trăng","e":"🌙"},{"w":"con sói","e":"🐺"},{"w":"con voi","e":"🐘"},{"w":"gói quà","e":"🎁"}],"cau":"Mẹ vắng nhà, em không mở cửa cho người lạ.","doc":"Khi mẹ vắng nhà. Dê mẹ đi kiếm cỏ, dặn đàn con chỉ mở cửa khi nghe đúng tiếng mẹ. Sói rình sẵn, chờ dê mẹ đi xa thì gõ cửa và giả giọng dê mẹ. Đàn dê con nhớ lời mẹ, không mở cửa, sói đành bỏ đi. Mẹ về nghe chuyện liền khen các con ngoan.","hoi":[{"q":"Dê mẹ dặn các con chỉ mở cửa khi nào?","o":["Khi có người gõ cửa","Khi nghe đúng tiếng mẹ","Khi trời đã sáng"],"a":1},{"q":"Sói làm gì khi dê mẹ vừa đi xa?","o":["Gõ cửa, giả giọng mẹ","Phá cửa xông vào","Nấp sau gốc cây"],"a":0},{"q":"Nghe chuyện, dê mẹ nói gì?","o":["Dặn các con đi trốn","Đi đuổi sói đi xa","Khen các con ngoan"],"a":2}],"viet":"mẹ vắng nhà","choi":"Diễn lại câu chuyện: bố mẹ làm sói giả giọng, bé làm dê con, chỉ mở cửa khi nghe đúng 'mật khẩu' của gia đình.","bm":"Dặn bé quy tắc thật: ở nhà không có người lớn thì không mở cửa cho người lạ, kể cả khi người đó nói là người quen.","chude":"Chủ đề 4. Điều em cần biết"},{"id":"tv1-c4-4","tap":2,"tuan":26,"ten":"Bài 4. Nếu không may bị lạc","loai":"doc","am":["ac","iên"],"tieng":["lạc","bác","nhạc","viên","biển","tiên"],"tu":[{"w":"bác sĩ","e":"👨‍⚕️"},{"w":"âm nhạc","e":"🎵"},{"w":"công viên","e":"🏞️"},{"w":"biển","e":"🌊"},{"w":"cô tiên","e":"🧚"}],"cau":"Nếu bị lạc, em đứng yên và tìm người giúp.","doc":"Nếu không may bị lạc. Bố đưa Nam và em đi chơi công viên. Trước khi vào, bố dặn hai anh em đi cẩn thận, nếu bị lạc thì tìm đến cổng có lá cờ to. Khi bị lạc, Nam nhớ lời bố, đi theo biển chỉ dẫn và tìm được đường.","hoi":[{"q":"Bố đưa Nam và em đi đâu?","o":["Công viên","Siêu thị","Bệnh viện"],"a":0},{"q":"Bố dặn nếu bị lạc thì làm gì?","o":["Đứng yên một chỗ","Hỏi người bán hàng","Tìm đến cổng có cờ to"],"a":2},{"q":"Khi bị lạc, Nam đã làm gì?","o":["Đứng khóc gọi bố","Đi theo biển chỉ dẫn","Hỏi một người lạ"],"a":1}],"viet":"không may bị lạc","choi":"Tập cho bé đọc thuộc số điện thoại của bố mẹ và địa chỉ nhà; chơi đóng vai bé bị lạc ở siêu thị và tìm cô nhân viên để nhờ giúp.","bm":"Mỗi lần đến nơi đông người, thống nhất với bé một điểm hẹn và dạy bé tìm người mặc đồng phục để nhờ giúp.","chude":"Chủ đề 4. Điều em cần biết"},{"id":"tv1-c4-5","tap":2,"tuan":26,"ten":"Bài 5. Đèn giao thông","loai":"doc","am":["en","ao"],"tieng":["đèn","kèn","len","giao","sao","táo"],"tu":[{"w":"cái đèn","e":"💡"},{"w":"cái kèn","e":"🎺"},{"w":"đèn giao thông","e":"🚦"},{"w":"ngôi sao","e":"⭐"},{"w":"quả táo","e":"🍎"}],"cau":"Đèn đỏ thì dừng, đèn xanh thì đi.","doc":"Đèn giao thông. Đèn giao thông có ba màu. Đèn đỏ thì người và xe phải dừng lại, đèn xanh thì được đi, đèn vàng báo đi chậm lại để dừng. Nhờ có đèn giao thông, đường phố trật tự và an toàn hơn.","hoi":[{"q":"Đèn giao thông có mấy màu?","o":["Hai màu","Năm màu","Ba màu"],"a":2},{"q":"Gặp đèn đỏ, người và xe phải làm gì?","o":["Đi chậm lại","Dừng lại","Bấm còi"],"a":1},{"q":"Nếu không có đèn giao thông thì sao?","o":["Đường lộn xộn, nguy hiểm","Xe đi được nhanh hơn","Không ai phải đứng đợi"],"a":0}],"viet":"đèn giao thông","choi":"Làm đèn giao thông bằng ba tấm giấy đỏ, vàng, xanh; bố mẹ giơ màu nào, bé đi, đi chậm hoặc dừng cho đúng màu đó.","bm":"Mỗi lần đi đường, hỏi bé đèn đang màu gì và mình phải làm gì để bài học thành phản xạ.","chude":"Chủ đề 4. Điều em cần biết"},{"id":"tv1-c4-ot","tap":2,"tuan":26,"ten":"Ôn tập","loai":"on-tap","am":["ay","ao","en"],"tieng":["tay","chạy","chào","sao","đèn","kèn"],"tu":[{"w":"bàn tay","e":"✋"},{"w":"lời chào","e":"👋"},{"w":"đèn giao thông","e":"🚦"},{"w":"quả táo","e":"🍎"},{"w":"cái kèn","e":"🎺"}],"cau":"Em biết giữ an toàn cho mình.","doc":"Ôn tập chủ đề Điều em cần biết: bé nhắc lại các điều cần nhớ về rửa tay, chào hỏi, không mở cửa cho người lạ, khi bị lạc và khi đi đường.","hoi":[{"q":"Đàn dê con chỉ mở cửa khi nào?","o":["Khi có người gõ cửa","Khi nghe đúng tiếng mẹ","Khi trời tối"],"a":1},{"q":"Gặp đèn đỏ, em phải làm gì?","o":["Dừng lại","Đi chậm lại","Chạy qua nhanh"],"a":0}],"viet":"Viết số điện thoại của bố hoặc mẹ","choi":"Trò 'đúng hay sai': bố mẹ nói một tình huống (mở cửa cho người lạ, rửa tay trước khi ăn...), bé giơ ngón cái lên hoặc chúc xuống.","bm":"Đây là chủ đề về an toàn, nên ôn lại vài lần trong năm chứ không chỉ trong tuần học.","chude":"Chủ đề 4. Điều em cần biết"},{"id":"tv1-c5-1","tap":2,"tuan":27,"ten":"Bài 1. Kiến và chim bồ câu","loai":"doc","am":["iên","âu"],"tieng":["kiến","tiên","biển","câu","sâu","trâu"],"tu":[{"w":"con kiến","e":"🐜"},{"w":"biển","e":"🌊"},{"w":"cô tiên","e":"🧚"},{"w":"chim bồ câu","e":"🕊️"},{"w":"con trâu","e":"🐃"},{"w":"dâu tây","e":"🍓"}],"cau":"Kiến và bồ câu giúp đỡ nhau.","doc":"Kiến và chim bồ câu. Kiến bị rơi xuống dòng nước, bồ câu thả một chiếc lá cho kiến bám vào và lên được bờ. Sau đó, thấy người thợ săn đang nhắm bắn bồ câu, kiến bò đến cắn vào chân anh ta. Người thợ săn giật mình, bồ câu bay đi thoát nạn.","hoi":[{"q":"Bồ câu cứu kiến bằng cách nào?","o":["Thả chiếc lá xuống","Ngậm kiến bay lên","Gọi cá đến giúp"],"a":0},{"q":"Kiến cứu bồ câu bằng cách nào?","o":["Bò lên báo cho bồ câu","Gọi đàn kiến đến","Cắn chân người thợ săn"],"a":2},{"q":"Câu chuyện khuyên em điều gì?","o":["Phải biết bơi giỏi","Giúp nhau khi gặp khó","Đừng đến gần sông"],"a":1}],"viet":"kiến và chim bồ câu","choi":"Thả một chiếc lá vào chậu nước, đặt 'kiến' (một hạt đậu) lên lá; bé kể lại kiến được cứu và đã giúp lại bồ câu ra sao.","bm":"Hỏi bé: ai đã từng giúp em, và em đã cảm ơn hay giúp lại người đó chưa?","chude":"Chủ đề 5. Bài học từ cuộc sống"},{"id":"tv1-c5-2","tap":2,"tuan":27,"ten":"Bài 2. Câu chuyện của rễ","loai":"doc","am":["uyên","âu"],"tieng":["chuyện","truyện","thuyền","câu","sâu","nâu"],"tu":[{"w":"truyện tranh","e":"📚"},{"w":"con thuyền","e":"⛵"},{"w":"câu cá","e":"🎣"},{"w":"con sâu","e":"🐛"},{"w":"gấu nâu","e":"🐻"}],"cau":"Rễ nằm sâu dưới đất nuôi cây.","doc":"Câu chuyện của rễ. Bài thơ nói về rễ cây nằm sâu dưới đất, chẳng ai nhìn thấy. Nhờ rễ nuôi cây mà hoa nở thắm, quả trĩu cành, lá xanh tươi. Rễ âm thầm làm việc mà rất khiêm nhường.","hoi":[{"q":"Nhờ có rễ, cây thế nào?","o":["Cây cao và to","Cây có nhiều gai","Hoa thắm, quả trĩu"],"a":2},{"q":"Nếu không có rễ, cây sẽ ra sao?","o":["Cây vẫn mọc lá xanh","Cây không ra hoa, quả","Cây chỉ thấp đi"],"a":1}],"viet":"câu chuyện của rễ","choi":"Ngâm một hạt đậu trên bông ẩm, mỗi ngày cùng bé xem rễ mọc dài ra; bé sẽ hiểu rễ làm việc âm thầm thế nào.","bm":"Giải nghĩa từ 'khiêm nhường' bằng ví dụ đời thường: làm tốt mà không khoe.","chude":"Chủ đề 5. Bài học từ cuộc sống"},{"id":"tv1-c5-3","tap":2,"tuan":27,"ten":"Bài 3. Câu hỏi của sói","loai":"doc","am":["oi","oc"],"tieng":["sói","voi","nói","sóc","học","cóc"],"tu":[{"w":"con sói","e":"🐺"},{"w":"con voi","e":"🐘"},{"w":"con sóc","e":"🐿️"},{"w":"con cóc","e":"🐸"},{"w":"lớp học","e":"🏫"}],"cau":"Sóc vui vì có nhiều bạn.","doc":"Câu hỏi của sói. Sóc đang chuyền cành thì trượt chân, rơi trúng đầu sói. Sói hỏi vì sao họ nhà sóc lúc nào cũng vui đùa, còn sói thì luôn buồn bực. Câu trả lời là sói hay gây sự với mọi người và chẳng có bạn bè.","hoi":[{"q":"Chuyện gì xảy ra khi sóc chuyền cành?","o":["Sóc bị sói bắt","Sóc rơi trúng đầu sói","Sóc làm rơi quả thông"],"a":1},{"q":"Sói hỏi sóc điều gì?","o":["Vì sao sóc luôn vui","Sóc đi đâu thế","Vì sao sóc rơi xuống"],"a":0},{"q":"Vì sao sói luôn buồn bực?","o":["Vì không ai sợ sói cả","Vì sói hay bị sóc trêu","Vì hay gây sự, không có bạn"],"a":2}],"viet":"câu hỏi của sói","choi":"Đóng vai sóc và sói: bố mẹ làm sói hỏi, bé làm sóc trả lời vì sao mình vui; rồi đổi vai để bé tự nghĩ câu hỏi.","bm":"Hỏi bé: vì sao có bạn mà mình lại vui? Bé sẽ tự rút ra bài học của truyện.","chude":"Chủ đề 5. Bài học từ cuộc sống"},{"id":"tv1-c5-4","tap":2,"tuan":28,"ten":"Bài 4. Chú bé chăn cừu","loai":"doc","am":["ưu","ăn"],"tieng":["cừu","lựu","bưu","chăn","khăn","ăn"],"tu":[{"w":"con cừu","e":"🐑"},{"w":"bưu điện","e":"🏤"},{"w":"khăn","e":"🧣"},{"w":"ăn cơm","e":"🍚"}],"cau":"Không ai tin người hay nói dối.","doc":"Chú bé chăn cừu. Chú bé chăn cừu buồn chán nên bày trò kêu cứu là có sói. Hai lần các bác nông dân chạy đến giúp thì chẳng thấy sói đâu. Đến khi sói đến thật, chú kêu cứu nhưng không ai tin nữa, sói vồ mất cả đàn cừu.","hoi":[{"q":"Lúc đầu nghe kêu cứu, các bác nông dân làm gì?","o":["Chạy đến giúp","Không ai đến","Gọi thêm người"],"a":0},{"q":"Vì sao sói vồ được cả đàn cừu?","o":["Vì chú bé ngủ quên","Vì sói đến quá nhanh","Vì không ai tin chú"],"a":2},{"q":"Câu chuyện khuyên em điều gì?","o":["Phải chăm chăn cừu","Không được nói dối","Đừng chơi một mình"],"a":1}],"viet":"chú bé chăn cừu","choi":"Trò 'thật hay bịa': bố mẹ kể vài chuyện, bé đoán chuyện nào thật, chuyện nào bịa, rồi cùng nói vì sao nói dối làm người khác mất lòng tin.","bm":"Đừng doạ bé; nhấn vào ý nói thật thì mọi người tin mình và sẵn lòng giúp mình.","chude":"Chủ đề 5. Bài học từ cuộc sống"},{"id":"tv1-c5-5","tap":2,"tuan":28,"ten":"Bài 5. Tiếng vọng của núi","loai":"doc","am":["iêng","ui"],"tieng":["tiếng","chiêng","riêng","núi","vui","túi"],"tu":[{"w":"tiếng chuông","e":"🔔"},{"w":"ngọn núi","e":"⛰️"},{"w":"vui vẻ","e":"😄"},{"w":"túi xách","e":"👜"}],"cau":"Em nói lời hay, núi đáp lời hay.","doc":"Tiếng vọng của núi. Gấu con đứng trên núi kêu to và nghe núi đáp lại y hệt. Gấu mẹ bảo con hãy nói với núi rằng con yêu núi, và núi cũng đáp lại lời yêu thương ấy. Gấu con thấy rất vui.","hoi":[{"q":"Khi gấu con kêu to, chuyện gì xảy ra?","o":["Gấu mẹ chạy đến","Chim kêu đáp lại","Núi vọng lại y hệt"],"a":2},{"q":"Gấu mẹ bảo con nói gì với núi?","o":["Con đi về","Con yêu núi","Con ghét núi"],"a":1},{"q":"Làm theo lời mẹ, gấu con thấy thế nào?","o":["Rất vui","Rất sợ","Buồn ngủ"],"a":0}],"viet":"tiếng vọng của núi","choi":"Chơi 'tiếng vọng': bố mẹ nhắc lại y hệt điều bé nói, lời vui thì đáp lời vui; bé thấy mình nói gì sẽ nhận lại điều ấy.","bm":"Liên hệ với bé: mình nói lời dễ thương với bạn thì bạn cũng nói lời dễ thương với mình.","chude":"Chủ đề 5. Bài học từ cuộc sống"},{"id":"tv1-c5-ot","tap":2,"tuan":28,"ten":"Ôn tập","loai":"on-tap","am":["oi","âu","ui"],"tieng":["sói","voi","câu","sâu","núi","vui"],"tu":[{"w":"con sói","e":"🐺"},{"w":"chim bồ câu","e":"🕊️"},{"w":"ngọn núi","e":"⛰️"},{"w":"con voi","e":"🐘"},{"w":"con trâu","e":"🐃"}],"cau":"Mỗi câu chuyện cho em một bài học.","doc":"Ôn tập chủ đề Bài học từ cuộc sống: bé kể lại các câu chuyện đã học và nói bài học rút ra từ mỗi chuyện.","hoi":[{"q":"Vì sao không ai đến cứu khi sói đến thật?","o":["Vì mọi người ở quá xa","Vì chú bé nói dối nhiều lần","Vì không ai nghe thấy tiếng"],"a":1},{"q":"Kiến đã cứu bồ câu bằng cách nào?","o":["Cắn chân thợ săn","Gọi đàn kiến đến","Bò lên báo cho chim"],"a":0}],"viet":"Viết tên câu chuyện em thích nhất","choi":"Bé chọn một nhân vật trong chủ đề và kể lại câu chuyện bằng lời của nhân vật đó.","bm":"Cho bé tự nói bài học của mỗi chuyện bằng lời của mình, không cần đúng câu chữ.","chude":"Chủ đề 5. Bài học từ cuộc sống"},{"id":"tv1-c6-1","tap":2,"tuan":29,"ten":"Bài 1. Loài chim của biển cả","loai":"doc","am":["âu","ao"],"tieng":["âu","sâu","câu","bão","sao","cao"],"tu":[{"w":"chim hải âu","e":"🐦"},{"w":"con sâu","e":"🐛"},{"w":"ngôi sao","e":"⭐"},{"w":"cơn bão","e":"🌀"},{"w":"chim bồ câu","e":"🕊️"}],"cau":"Hải âu bay rất xa trên biển.","doc":"Loài chim của biển cả. Hải âu là loài chim bay rất xa, vượt qua cả những vùng biển rộng lớn. Hải âu còn bơi rất giỏi. Người ta gọi hải âu là chim báo bão vì khi bão sắp đến, chúng bay thành đàn đi tìm chỗ trú.","hoi":[{"q":"Hải âu bay xa thế nào?","o":["Vượt qua biển rộng","Chỉ quanh bờ biển","Từ cây này sang cây kia"],"a":0},{"q":"Ngoài bay xa, hải âu còn giỏi gì?","o":["Lặn","Hót","Bơi"],"a":2},{"q":"Vì sao hải âu được gọi là chim báo bão?","o":["Vì bay rất cao trên trời","Vì bay thành đàn tìm chỗ trú","Vì kêu to khi trời mưa"],"a":1}],"viet":"chim hải âu","choi":"Bé dang tay làm chim hải âu bay quanh phòng; khi bố mẹ hô 'bão đến', bé bay thật nhanh về chỗ trú dưới gầm bàn.","bm":"Mở cho bé xem ảnh hoặc video chim hải âu bay trên biển để bé hình dung.","chude":"Chủ đề 6. Thiên nhiên kì thú"},{"id":"tv1-c6-2","tap":2,"tuan":29,"ten":"Bài 2. Bảy sắc cầu vồng","loai":"doc","am":["ay","ông"],"tieng":["bảy","tay","máy","vồng","sông","trống"],"tu":[{"w":"cầu vồng","e":"🌈"},{"w":"số bảy","e":"7️⃣"},{"w":"máy bay","e":"✈️"},{"w":"dòng sông","e":"🏞️"},{"w":"cái trống","e":"🥁"}],"cau":"Cầu vồng có bảy màu rực rỡ.","doc":"Bảy sắc cầu vồng. Bài thơ tả cầu vồng hiện ra sau cơn mưa, khi mặt trời ló ra. Cầu vồng có bảy màu: đỏ, cam, vàng, lục, lam, chàm, tím. Cầu vồng chỉ ẩn hiện một lúc rồi tan rất nhanh.","hoi":[{"q":"Cầu vồng thường xuất hiện khi nào?","o":["Sáng sớm tinh mơ","Lúc trời nhiều mây","Sau mưa, khi có nắng"],"a":2},{"q":"Cầu vồng có mấy màu?","o":["Mười màu","Bảy màu","Ba màu"],"a":1}],"viet":"cầu vồng","choi":"Xếp bảy món đồ chơi theo đúng thứ tự màu cầu vồng: đỏ, cam, vàng, lục, lam, chàm, tím.","bm":"Sau cơn mưa có nắng, dẫn bé ra ban công tìm cầu vồng; hoặc tạo cầu vồng bằng cốc nước và đèn pin.","chude":"Chủ đề 6. Thiên nhiên kì thú"},{"id":"tv1-c6-3","tap":2,"tuan":29,"ten":"Bài 3. Chúa tể rừng xanh","loai":"doc","am":["anh","ưng"],"tieng":["xanh","nhanh","cánh","rừng","lưng","trứng"],"tu":[{"w":"rừng xanh","e":"🌳"},{"w":"quả trứng","e":"🥚"},{"w":"quả chanh","e":"🍋"},{"w":"chạy nhanh","e":"🏃"},{"w":"bánh mì","e":"🥖"}],"cau":"Hổ là chúa tể rừng xanh.","doc":"Chúa tể rừng xanh. Bài đọc giới thiệu con hổ, loài thú ăn thịt sống trong rừng. Hổ có cái đuôi dài và cứng như roi sắt. Hổ di chuyển nhanh, nhảy xa và săn mồi rất giỏi.","hoi":[{"q":"Hổ ăn gì và sống ở đâu?","o":["Ăn cỏ, sống trên núi","Ăn thịt, sống trong rừng","Ăn cá, sống ven sông"],"a":1},{"q":"Đuôi hổ thế nào?","o":["Dài, cứng như roi sắt","Ngắn và có nhiều lông","Dài và mềm như dây"],"a":0}],"viet":"rừng xanh","choi":"Đố vui về con vật: bố mẹ tả đặc điểm (đuôi dài, sống trong rừng, săn mồi giỏi), bé đoán con gì; rồi đổi vai.","bm":"Nói với bé hổ ngoài đời rất nguy hiểm, chỉ nên xem ở sở thú; và hổ đang ít dần nên cần được bảo vệ.","chude":"Chủ đề 6. Thiên nhiên kì thú"},{"id":"tv1-c6-4","tap":2,"tuan":30,"ten":"Bài 4. Cuộc thi tài năng rừng xanh","loai":"doc","am":["ai","ông"],"tieng":["tài","hai","nai","công","ông","sông"],"tu":[{"w":"chim công","e":"🦚"},{"w":"con nai","e":"🦌"},{"w":"đôi tai","e":"👂"},{"w":"ông","e":"👴"},{"w":"dòng sông","e":"🏞️"}],"cau":"Mỗi con vật có một tài riêng.","doc":"Cuộc thi tài năng rừng xanh. Các con vật trong rừng mở hội thi tài. Vẹt bắt chước tiếng các loài, mèo rừng hát, gõ kiến khoét tổ thật nhanh, công múa đẹp, còn voọc chuyền cành rất khéo. Mỗi loài có một tài riêng.","hoi":[{"q":"Công biểu diễn tiết mục gì?","o":["Múa","Hát","Chạy"],"a":0},{"q":"Vẹt có tài gì?","o":["Hát hay như mèo rừng","Múa đẹp nhất rừng","Bắt chước tiếng loài khác"],"a":2},{"q":"Gõ kiến biểu diễn gì?","o":["Chuyền cành","Khoét tổ nhanh","Bắt chước tiếng"],"a":1}],"viet":"cuộc thi tài năng","choi":"Mở cuộc thi tài năng trong nhà: mỗi người biểu diễn một tài (hát, nhảy, bắt chước tiếng con vật), bé làm người chấm điểm.","bm":"Nhấn vào ý mỗi người có một tài riêng, không cần giỏi giống người khác.","chude":"Chủ đề 6. Thiên nhiên kì thú"},{"id":"tv1-c6-5","tap":2,"tuan":30,"ten":"Bài 5. Cây liễu dẻo dai","loai":"doc","am":["iêu","ai"],"tieng":["liễu","diều","nhiều","dai","tài","hai"],"tu":[{"w":"cây liễu","e":"🌳"},{"w":"con diều","e":"🪁"},{"w":"đôi tai","e":"👂"},{"w":"con nai","e":"🦌"},{"w":"số hai","e":"2️⃣"}],"cau":"Cành liễu mềm mại đung đưa trong gió.","doc":"Cây liễu dẻo dai. Thân cây liễu không to nhưng rất chắc khoẻ. Cành liễu mềm mại, đung đưa theo gió mà không gãy. Liễu rất dễ trồng, chỉ cần cắm một cành xuống đất là cành sẽ mọc thành cây mới.","hoi":[{"q":"Thân cây liễu thế nào?","o":["To và rất cao","Nhỏ bé, yếu ớt lắm","Không to nhưng chắc"],"a":2},{"q":"Cành liễu thế nào?","o":["Thẳng, cứng, khó uốn","Mềm, đung đưa theo gió","Ngắn và có nhiều lá"],"a":1},{"q":"Vì sao liễu dễ trồng?","o":["Cắm cành là mọc thành cây","Hạt rơi đâu cũng mọc","Không cần tưới nước"],"a":0}],"viet":"cây liễu","choi":"Cắm thử một cành rau muống hoặc cành trầu bà vào cốc nước, cùng bé theo dõi rễ mọc ra như cành liễu.","bm":"Giải thích 'dẻo dai' bằng động tác: bé uốn người mềm như cành liễu trước gió mà không ngã.","chude":"Chủ đề 6. Thiên nhiên kì thú"},{"id":"tv1-c6-ot","tap":2,"tuan":30,"ten":"Ôn tập","loai":"on-tap","am":["ay","ai","anh"],"tieng":["bảy","bay","nai","tài","xanh","chanh"],"tu":[{"w":"máy bay","e":"✈️"},{"w":"số bảy","e":"7️⃣"},{"w":"con nai","e":"🦌"},{"w":"quả chanh","e":"🍋"},{"w":"rừng xanh","e":"🌳"}],"cau":"Thiên nhiên thật kì thú.","doc":"Ôn tập chủ đề Thiên nhiên kì thú: bé đọc lại các bài, kể về một loài vật hoặc một cảnh thiên nhiên bé thích.","hoi":[{"q":"Cầu vồng có mấy màu?","o":["Mười màu","Bảy màu","Ba màu"],"a":1},{"q":"Vì sao hải âu được gọi là chim báo bão?","o":["Bay thành đàn tìm chỗ trú","Vì kêu rất to khi bay","Vì bay rất cao và xa"],"a":0}],"viet":"Viết tên một con vật em thích","choi":"Bé vẽ một bức tranh thiên nhiên có cầu vồng, chim, cây; kể tên từng thứ và nói bé đã học được gì về nó.","bm":"Cho bé đọc thêm một bài thơ hoặc truyện ngắn về thiên nhiên và kể lại cho bố mẹ.","chude":"Chủ đề 6. Thiên nhiên kì thú"},{"id":"tv1-c7-1","tap":2,"tuan":31,"ten":"Bài 1. Tia nắng đi đâu?","loai":"doc","am":["ia","ăng"],"tieng":["tia","mía","thìa","nắng","trăng","măng"],"tu":[{"w":"cái thìa","e":"🥄"},{"w":"cái đĩa","e":"🍽️"},{"w":"nắng","e":"☀️"},{"w":"trăng","e":"🌙"},{"w":"cái răng","e":"🦷"}],"cau":"Tia nắng nhảy nhót trên bàn học.","doc":"Tia nắng đi đâu? Buổi sáng, bạn nhỏ thấy tia nắng trên tán cây, trên bàn học và trên bàn tay mình. Bạn tò mò hỏi: buổi tối tia nắng đi đâu? Bạn nghĩ tia nắng đi ngủ, còn nhà của mặt trời ở trên bầu trời.","hoi":[{"q":"Thức dậy, bạn nhỏ thấy tia nắng ở đâu?","o":["Tán cây, bàn học, bàn tay","Trên mái nhà, ngoài sân","Trên trang sách, cửa sổ"],"a":0},{"q":"Theo bạn nhỏ, buổi tối tia nắng đi đâu?","o":["Đi học","Đi chợ","Đi ngủ"],"a":2}],"viet":"tia nắng","choi":"Dùng đèn pin chiếu 'tia nắng' lên các đồ vật trong phòng tối; bé gọi tên chỗ tia nắng dừng lại.","bm":"Các câu hỏi trong bài không cần đáp án khoa học; khuyến khích bé tưởng tượng và hỏi thêm.","chude":"Chủ đề 7. Thế giới trong mắt em"},{"id":"tv1-c7-2","tap":2,"tuan":31,"ten":"Bài 2. Trong giấc mơ buổi sáng","loai":"doc","am":["âc","uôi"],"tieng":["giấc","gấc","nhấc","buổi","chuối","muối"],"tu":[{"w":"giấc ngủ","e":"😴"},{"w":"nải chuối","e":"🍌"},{"w":"hạt muối","e":"🧂"},{"w":"buổi sáng","e":"🌅"},{"w":"dòng suối","e":"🏞️"}],"cau":"Em mơ thấy những
