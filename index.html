<style>
:root{
  --bg:#FFF4DF; --bg2:#FFE9C2; --card:#FFFFFF; --ink:#2A2140; --muted:#6A6182; --line:#EADFC8;
  --sun:#FFC233; --sun-d:#E59E00; --ok:#1FA45B; --ok-s:#DDF6E7; --bad:#E5484D; --bad-s:#FFE4E4;
  --tv:#F2603A; --tv-d:#C9431F; --tv-s:#FFE6DC;
  --toan:#2D7FF9; --toan-d:#1A5FCC; --toan-s:#DEEBFF;
  --eng:#13A15A; --eng-d:#0B7C43; --eng-s:#DCF5E6;
  --maths:#8B47EA; --maths-d:#6A2BC4; --maths-s:#EFE4FE;
  --par:#55607A; --par-d:#3B4458; --par-s:#E9ECF3;
  --c:#F2603A; --cd:#C9431F; --cs:#FFE6DC;
  --r:20px; --font: ui-rounded, "SF Pro Rounded", "Be Vietnam Pro", "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --emo: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Segoe UI Symbol", sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.45;overflow-x:hidden;-webkit-tap-highlight-color:transparent;min-height:100vh;
  background-image:radial-gradient(circle at 12% 8%, #FFE2A8 0 60px, transparent 61px),radial-gradient(circle at 92% 30%, #FFE7B8 0 40px, transparent 41px);background-attachment:fixed}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.emo{font-family:var(--emo);font-style:normal;line-height:1}
.s-tv{--c:var(--tv);--cd:var(--tv-d);--cs:var(--tv-s)}
.s-toan{--c:var(--toan);--cd:var(--toan-d);--cs:var(--toan-s)}
.s-eng{--c:var(--eng);--cd:var(--eng-d);--cs:var(--eng-s)}
.s-maths{--c:var(--maths);--cd:var(--maths-d);--cs:var(--maths-s)}
.s-par{--c:var(--par);--cd:var(--par-d);--cs:var(--par-s)}
#app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.wrap{padding:12px 16px 28px;flex:1}
/* thanh trên */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--c);color:#fff;box-shadow:0 3px 0 var(--cd)}
.top h1{flex:1;min-width:0;margin:0;font-size:20px;line-height:1.2;font-weight:800;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.top .sub{display:block;font-size:14px;font-weight:600;opacity:.9}
.ibtn{flex:none;width:56px;height:56px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:26px;display:grid;place-items:center;padding:0}
.ibtn:active{transform:scale(.94)}
.ibtn svg{width:28px;height:28px}
.chip-star{flex:none;border:0;color:#fff;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.25);border-radius:30px;padding:6px 12px;font-weight:800;font-size:18px;min-height:44px}
/* nút chung */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:10px 20px;border:0;border-radius:18px;background:var(--c);color:#fff;font-size:20px;font-weight:800;box-shadow:0 5px 0 var(--cd);transition:transform .08s;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--cd)}
.btn.soft{background:var(--cs);color:var(--cd);box-shadow:0 4px 0 color-mix(in srgb,var(--cd) 35%,transparent)}
.btn.white{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:48px;font-size:17px;padding:8px 14px;border-radius:14px}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
/* linh vật */
.mascot{display:flex;align-items:flex-end;gap:10px;margin:6px 0 14px;border:0;background:none;padding:0;text-align:left;width:100%}
.parrot{flex:none;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#FFF0C9 60%,#FFD978 100%);display:grid;place-items:center;font-size:56px;box-shadow:0 4px 0 #EBC15A}
.parrot.sm{width:64px;height:64px;font-size:42px}
.bubble{position:relative;flex:1;min-width:0;background:#fff;border-radius:20px;padding:12px 16px;font-size:20px;font-weight:700;box-shadow:0 4px 0 var(--line)}
.bubble:before{content:"";position:absolute;left:-10px;bottom:16px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.speaking .parrot{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-6px) rotate(4deg)}}
/* trang chủ */
.hello{display:flex;align-items:center;gap:10px;margin-top:4px}
.hello .who{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#fff;border:0;border-radius:30px;padding:6px 14px 6px 6px;box-shadow:0 3px 0 var(--line);min-height:56px;font-size:18px;font-weight:800;text-align:left}
.hello .who .av{width:44px;height:44px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:28px;flex:none}
.hello .who span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.starbar{background:#fff;border-radius:var(--r);padding:12px 14px;box-shadow:0 4px 0 var(--line);display:flex;align-items:center;gap:12px;margin:12px 0;border:0;width:100%;text-align:left;font-size:17px}
.starbar .big{font-size:30px}
.starbar .meter{flex:1;min-width:0}
.meter .bar{height:14px;border-radius:10px;background:#F3EAD7;overflow:hidden;margin-top:6px}
.meter .bar i{display:block;height:100%;background:linear-gradient(90deg,#FFD447,#FFA928);border-radius:10px}
.today{display:flex;align-items:center;gap:14px;width:100%;min-height:96px;border:0;border-radius:26px;padding:14px 18px;background:linear-gradient(135deg,#FFB020,#FF7A3D);color:#fff;box-shadow:0 6px 0 #D9601E;text-align:left;margin:4px 0 18px}
.today:active{transform:translateY(3px);box-shadow:0 3px 0 #D9601E}
.today .ic{font-size:48px}
.today b{display:block;font-size:26px;line-height:1.15}
.today small{font-size:16px;font-weight:600;opacity:.95}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{position:relative;border:0;border-radius:24px;padding:14px 12px 12px;min-height:150px;background:var(--c);color:#fff;box-shadow:0 6px 0 var(--cd);text-align:left;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.tile:active{transform:translateY(3px);box-shadow:0 3px 0 var(--cd)}
.tile .ic{font-size:44px;line-height:1}
.tile b{font-size:23px;line-height:1.15;margin-top:auto}
.tile small{font-size:15px;font-weight:600;opacity:.95}
.tile:after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.14)}
.minirow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.minirow .btn{font-size:18px;padding:10px 12px;white-space:nowrap}
.foot{padding:18px 16px 26px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.foot b{color:var(--ink)}
/* danh sách */
.tabs{display:flex;gap:8px;margin:4px 0 12px;background:#fff;padding:6px;border-radius:20px;box-shadow:0 3px 0 var(--line)}
.tabs button{flex:1;min-height:52px;border:0;border-radius:15px;background:transparent;font-size:18px;font-weight:800;color:var(--muted);padding:6px}
.tabs button.on{background:var(--c);color:#fff}
.wk{display:flex;align-items:center;gap:8px;margin:18px 2px 8px;font-weight:800;font-size:18px;color:var(--cd)}
.wk .now{background:var(--sun);color:#5B3B00;border-radius:20px;padding:2px 10px;font-size:14px}
.wk small{color:var(--muted);font-weight:600;font-size:14px}
.lcard{display:flex;align-items:center;gap:12px;width:100%;border:0;background:#fff;border-radius:20px;padding:10px 12px;margin:0 0 10px;box-shadow:0 4px 0 var(--line);text-align:left;min-height:72px}
.lcard:active{transform:translateY(2px)}
.lcard.cur{outline:3px solid var(--sun)}
.lcard .g{flex:none;width:58px;height:58px;border-radius:16px;background:var(--cs);color:var(--cd);display:grid;place-items:center;font-size:24px;font-weight:900;overflow:hidden;line-height:1;text-align:center;padding:2px}
.lcard .g.e{font-size:32px}
.lcard .t{flex:1;min-width:0}
.lcard .t b{display:block;font-size:18px;line-height:1.25}
.lcard .t small{display:block;color:var(--muted);font-size:15px;line-height:1.3;margin-top:2px}
.lcard .st{flex:none;font-size:15px;color:var(--sun-d);font-weight:800;letter-spacing:-1px}
.unit-h{margin:20px 2px 10px;padding:10px 14px;border-radius:16px;background:var(--cs);color:var(--cd)}
.unit-h b{display:block;font-size:19px;line-height:1.25}
.unit-h small{font-size:15px;font-weight:600}
.egrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ecard{border:0;border-radius:22px;background:#fff;box-shadow:0 4px 0 var(--line);padding:12px;text-align:left;min-height:140px;display:flex;flex-direction:column;gap:2px}
.ecard .ic{font-size:44px;line-height:1.1}
.ecard b{font-size:19px;line-height:1.2;margin-top:6px}
.ecard small{color:var(--muted);font-size:15px}
.ecard.cur{outline:3px solid var(--sun)}
/* bài học */
.sec{background:#fff;border-radius:var(--r);padding:14px;margin:0 0 14px;box-shadow:0 4px 0 var(--line)}
.sec>h2{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:19px;color:var(--cd)}
.sec>h2 .emo{font-size:24px}
.letters{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.letter{border:0;min-width:110px;min-height:120px;padding:6px 16px;border-radius:24px;background:var(--cs);color:var(--cd);font-size:72px;font-weight:800;line-height:1.1;box-shadow:0 5px 0 color-mix(in srgb,var(--cd) 30%,transparent)}
.letter.van{font-size:56px}
.letter small{display:block;font-size:15px;font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.say{border:0;min-height:56px;min-width:64px;padding:6px 16px;border-radius:16px;background:var(--cs);color:var(--ink);font-size:26px;font-weight:700;box-shadow:0 3px 0 color-mix(in srgb,var(--cd) 25%,transparent)}
.say:active,.letter:active,.wcard:active{transform:translateY(2px)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.wcard{border:0;border-radius:18px;background:var(--cs);padding:10px 6px;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.wcard .emo{font-size:46px}
.wcard b{font-size:20px;line-height:1.2;word-break:break-word}
.wcard small{font-size:15px;color:var(--muted);line-height:1.2}
.sent{display:flex;align-items:flex-start;gap:10px;width:100%;border:0;background:var(--cs);border-radius:18px;padding:12px 14px;font-size:22px;font-weight:700;text-align:left;line-height:1.4}
.sent .emo{font-size:26px;flex:none}
.sent+.sent{margin-top:8px}
.reading{font-size:21px;line-height:1.7}
.reading span{border-radius:8px;padding:1px 2px;cursor:pointer}
.reading span.hl{background:#FFE58A}
.phr{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--line)}
.phr:first-of-type{border-top:0}
.phr .en{flex:1;min-width:0;border:0;background:none;text-align:left;font-size:20px;font-weight:800;padding:6px 0;line-height:1.3}
.phr .en small{display:block;font-size:16px;color:var(--muted);font-weight:600}
.vibtn{flex:none;border:0;min-height:48px;padding:6px 12px;border-radius:14px;background:var(--cs);color:var(--cd);font-weight:800;font-size:15px}
.goals{margin:0;padding:0;list-style:none}
.goals li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line);font-size:18px}
.goals li:first-child{border-top:0}
.goals li .emo{flex:none;font-size:22px;margin-top:2px}
.goals li button{border:0;background:none;text-align:left;font-size:18px;padding:0;line-height:1.4}
.goals li small{display:block;color:var(--muted);font-size:16px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{border:0;border-radius:22px;background:var(--c);color:#fff;box-shadow:0 5px 0 var(--cd);min-height:112px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left}
.act:active{transform:translateY(3px);box-shadow:0 2px 0 var(--cd)}
.act .emo{font-size:36px}
.act b{font-size:19px;line-height:1.2}
.act small{font-size:14px;opacity:.95;font-weight:600}
.act.wide{grid-column:1/-1;min-height:84px;flex-direction:row;align-items:center;gap:12px}
.act.wide b{font-size:22px}
.minis{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.minis .btn{flex:1 1 auto}
details.pd{background:#fff;border-radius:var(--r);margin:0 0 14px;box-shadow:0 4px 0 var(--line);overflow:hidden}
details.pd summary{list-style:none;cursor:pointer;padding:14px;font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px;min-height:56px}
details.pd summary::-webkit-details-marker{display:none}
details.pd summary:after{content:"+";margin-left:auto;font-size:24px;color:var(--muted)}
details.pd[open] summary:after{content:"–"}
details.pd .in{padding:0 14px 14px;font-size:17px}
details.pd .in p{margin:0 0 10px}
/* luyện tập */
.play{min-height:100vh;display:flex;flex-direction:column}
.prog{flex:1;display:flex;gap:5px;align-items:center;min-width:0}
.prog i{flex:1;height:12px;border-radius:8px;background:rgba(255,255,255,.3)}
.prog i.d{background:#fff}
.prog i.c{background:var(--sun)}
.qcard{background:#fff;border-radius:24px;padding:14px;box-shadow:0 5px 0 var(--line);margin-bottom:14px}
.qhead{display:flex;align-items:flex-start;gap:10px}
.qhead .parrot{width:56px;height:56px;font-size:36px}
.qtext{flex:1;min-width:0;font-size:21px;font-weight:800;line-height:1.35;padding-top:4px}
.qtext small{display:block;font-size:16px;font-weight:600;color:var(--muted);margin-top:4px}
.qtools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.qtools .btn{flex:1 1 auto}
.qvis{margin-top:12px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;text-align:center}
.qvis:empty{display:none}
.opts{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
.opts.n2{grid-template-columns:1fr 1fr}
.opts.n4{grid-template-columns:1fr 1fr}
.opts.txt,.opts.wide{grid-template-columns:1fr}
.opt{position:relative;border:0;border-radius:22px;background:#fff;box-shadow:0 5px 0 var(--line);min-height:84px;padding:8px;font-size:36px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.15;transition:transform .1s}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.opts.txt .opt{font-size:21px;font-weight:800;justify-content:flex-start;text-align:left;padding:10px 12px 10px 16px;min-height:68px}
.opts.txt .opt .lab{flex:1;min-width:0}
.opts.pic .opt{min-height:120px}
.opts.pic .opt svg{width:100%;max-width:120px;height:auto;max-height:110px}
.opts.wide .opt{min-height:76px;justify-content:flex-start;padding:10px 14px}
.opts.wide .opt svg{width:100%;height:auto;max-height:64px}
.opt .emo{font-size:52px}
.opt .wl{display:block;font-size:20px;font-weight:800}
.opt.col{flex-direction:column;gap:4px}
.opt .osay{flex:none;width:44px;height:44px;border-radius:50%;background:var(--cs);display:grid;place-items:center;font-size:20px}
.opt.right{background:var(--ok-s);box-shadow:0 5px 0 #9ED9B5;animation:pop .35s}
.opt.wrong{background:var(--bad-s);box-shadow:0 5px 0 #F0B2B4;animation:shake .4s;opacity:.7}
.opt.hintme{animation:glow 1s ease-in-out infinite alternate}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes glow{from{box-shadow:0 0 0 3px var(--sun)}to{box-shadow:0 0 0 9px #FFE7A0}}
.pulse{animation:pop .3s}
.opts.txt.big .opt{font-size:34px;justify-content:center;text-align:center;min-height:76px}
.opts.txt.big .opt .lab{text-align:center}
.sec.wkplan h2{font-size:19px;color:var(--cd);margin:0 0 8px}
.wkplan ul{margin:0 0 10px;padding-left:22px}
.feedback{min-height:34px;text-align:center;font-weight:800;font-size:20px;margin:6px 0 10px;color:var(--cd)}
.feedback.bad{color:#B4303A}
/* hình minh hoạ */
.grp{display:inline-flex;flex-direction:column;gap:2px;align-items:flex-start}
.grp .r5{display:flex;gap:2px}
.grp .it{font-family:var(--emo);font-size:34px;line-height:1.15;width:42px;height:42px;display:grid;place-items:center;border-radius:10px;position:relative;cursor:pointer}
.grp.sm .it{font-size:24px;width:30px;height:30px}
.cmp .grp.sm .it{font-size:19px;width:23px;height:25px}
.cmp .grp .r5{gap:1px}
.grp .it.gone{opacity:.35}
#app.qwait [data-act="ans"],.vact.qwait [data-act="vans"]{opacity:.5;filter:saturate(.4);transition:opacity .3s}
.qvis.helped{animation:pop .5s}
.grp .it.gone:after{content:"";position:absolute;left:10%;right:10%;top:50%;height:4px;background:#E5484D;border-radius:3px;transform:rotate(-35deg)}
.grp .it.cnt{background:#FFF3C4}
.grp .it.cnt:before{content:attr(data-n);position:absolute;right:-2px;top:-4px;background:var(--c);color:#fff;font-family:var(--font);font-size:12px;font-weight:900;border-radius:10px;min-width:18px;height:18px;line-height:18px;padding:0 3px}
.eqp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.op{font-size:34px;font-weight:900;color:var(--cd)}
.eq{font-size:40px;font-weight:900;letter-spacing:1px;width:100%}
.eq .q,.vcalc .q{color:var(--c)}
.cmp{display:flex;align-items:stretch;gap:8px;width:100%;justify-content:center}
.cmp .side{flex:1;min-width:0;max-width:170px;background:var(--cs);border-radius:18px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px}
.cmp .mid{flex:none;align-self:center;width:52px;height:52px;border-radius:50%;border:3px dashed var(--c);display:grid;place-items:center;font-size:28px;font-weight:900;color:var(--c)}
.bignum{font-size:46px;font-weight:900;line-height:1}
.train{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.train span{min-width:56px;height:60px;padding:0 6px;border-radius:14px 14px 8px 8px;background:var(--cs);display:grid;place-items:center;font-size:28px;font-weight:900;border-bottom:6px solid var(--cd)}
.train span.miss{background:#FFF3C4;color:var(--c);border-color:var(--sun-d)}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:300px}
.dots i{width:24px;height:24px;border-radius:50%;background:var(--tv)}
.dots i.b{background:var(--toan)}
.vcalc{display:inline-grid;grid-template-columns:auto auto;gap:0 12px;font-size:42px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2;text-align:right}
.vcalc .ln{grid-column:1/-1;height:4px;background:var(--ink);border-radius:2px;margin:4px 0}
.vcalc .o{color:var(--cd)}
.story{font-size:20px;font-weight:700;background:var(--cs);border-radius:16px;padding:10px 12px;text-align:left;width:100%}
.listen{border:0;border-radius:24px;background:var(--cs);padding:14px 24px;font-size:56px;min-height:96px;min-width:140px}
.cal{width:170px;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.cal .m{background:var(--c);color:#fff;font-weight:800;font-size:18px;padding:6px}
.cal .d{font-size:64px;font-weight:900;line-height:1.1;padding:4px 0}
.cal .w{font-size:20px;font-weight:800;padding:0 0 10px}
.cal .w.sun{color:var(--bad)}
.scene{display:grid;grid-template-columns:repeat(3,minmax(0,96px));gap:8px;justify-content:center;margin:0 auto}
.scene .cell{min-height:92px;display:grid;place-items:center}
.scene .ref{font-size:62px;background:var(--cs);border-radius:20px;width:100%;height:92px;display:grid;place-items:center}
.scene .opt{width:100%;min-height:92px;font-size:52px}
.lineup{display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:nowrap}
.lineup .flag{font-size:30px;flex:none}
.lineup .opt{flex:1 1 0;min-width:0;max-width:72px;min-height:80px;font-size:38px;padding:4px}
.picto{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 10px;text-align:left}
.picto .pr{display:flex;align-items:center;gap:6px;padding:4px 0;border-top:1px dashed var(--line)}
.picto .pr:first-child{border-top:0}
.picto .lb{font-size:30px;width:40px;text-align:center;border-right:2px solid var(--line);padding-right:6px}
.picto .ic{font-size:26px;letter-spacing:2px}
.notes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.svgbox svg{display:block;max-width:100%;height:auto}
.svgbox{width:100%;display:flex;justify-content:center}
/* tô chữ */
.trace-box{position:relative;background:#fff;border-radius:24px;box-shadow:0 5px 0 var(--line);overflow:hidden;touch-action:none}
.trace-box canvas{display:block;width:100%;touch-action:none}
.trace-box canvas.ink{position:absolute;left:0;top:0}
.colors{display:flex;gap:10px;justify-content:center;margin:12px 0}
.colors button{width:52px;height:52px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 0 var(--line)}
.colors button.on{outline:4px solid var(--ink)}
/* ghép tiếng */
.slots{display:flex;align-items:center;justify-content:center;gap:6px;margin:6px 0 4px;flex-wrap:wrap}
.slot{min-width:68px;height:76px;padding:0 8px;border-radius:18px;border:3px dashed var(--c);display:grid;place-items:center;font-size:34px;font-weight:900;background:#fff}
.slot.f{border-style:solid;background:var(--cs)}
.slot.res{min-width:92px;border-color:var(--sun-d);background:#FFF7DA}
.glab{font-weight:800;color:var(--muted);margin:14px 0 6px;font-size:17px}
.gopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gopts .opt{min-height:76px;font-size:34px}
.gopts .opt.sel{background:var(--cs);box-shadow:0 0 0 4px var(--c)}
/* nối hình */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:flex;flex-direction:column;gap:12px}
.match .opt{min-height:84px;font-size:22px}
.match .opt .emo{font-size:48px}
.match .opt.sel{box-shadow:0 0 0 4px var(--c);background:var(--cs)}
.match .opt.done{visibility:hidden}
/* kết quả */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(42,33,64,.55);display:grid;place-items:center;padding:16px}
.result{width:100%;max-width:420px;background:#fff;border-radius:30px;padding:22px 18px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.15);animation:rise .4s}
@keyframes rise{from{transform:translateY(30px) scale(.95);opacity:0}}
.result .stars{font-size:54px;letter-spacing:4px;margin:6px 0}
.result .stars .off{filter:grayscale(1);opacity:.3}
.result h2{margin:4px 0;font-size:26px}
.result p{margin:6px 0 14px;font-size:18px;color:var(--muted)}
.result .stk{font-size:64px;display:block;margin:4px auto;animation:pop .6s}
.result .row{flex-direction:column}
.result .row>.btn{flex:none}
.opt .osay .emo{font-size:20px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
/* hồ sơ */
.who-list{display:grid;gap:12px;margin:10px 0 18px}
.pcard{display:flex;align-items:center;gap:14px;border:0;background:#fff;border-radius:22px;padding:12px 14px;box-shadow:0 4px 0 var(--line);min-height:80px;font-size:22px;font-weight:800;text-align:left;width:100%}
.pcard .av{width:58px;height:58px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:36px;flex:none}
.pcard small{display:block;font-size:15px;color:var(--muted);font-weight:600}
.field{width:100%;min-height:60px;border-radius:18px;border:3px solid var(--line);padding:10px 16px;font-size:24px;font-weight:700;font-family:inherit;background:#fff;color:var(--ink)}
.field:focus{outline:none;border-color:var(--c)}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0 18px}
.avs button{border:0;min-height:64px;border-radius:18px;background:#fff;font-size:38px;box-shadow:0 3px 0 var(--line)}
.avs button.on{background:var(--cs);outline:3px solid var(--c)}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.stickers div{aspect-ratio:1;border-radius:20px;background:#fff;display:grid;place-items:center;font-size:44px;box-shadow:0 3px 0 var(--line)}
.stickers div.lock{background:#F4EDDE;color:#C9BBA0;font-size:28px;font-weight:900;font-family:var(--font)}
/* góc bố mẹ */
.ptext{font-size:17px}
.ptext p{margin:0 0 10px}
.wkplan summary .cur{background:var(--sun);color:#5B3B00;border-radius:12px;padding:1px 8px;font-size:13px}
.wkplan .subj{margin:10px 0 0;padding:10px 12px;border-radius:14px;background:var(--cs)}
.wkplan .subj h4{margin:0 0 4px;font-size:16px;color:var(--cd)}
.wkplan .subj p{margin:4px 0;font-size:16px}
.wkplan .subj .tip{color:var(--muted);font-size:15px}
.pbar{height:12px;border-radius:8px;background:#EEE6D6;overflow:hidden;margin:4px 0 10px}
.pbar i{display:block;height:100%;background:var(--c)}
.logl{margin:0;padding:0;list-style:none;font-size:15px}
.logl li{padding:6px 0;border-top:1px dashed var(--line)}
.set-row{display:flex;flex-direction:column;gap:6px;margin:0 0 16px}
.set-row label{font-weight:800}
.set-row select,.set-row input[type=range]{width:100%;min-height:52px;font-size:17px;border-radius:14px;border:2px solid var(--line);padding:6px 10px;background:#fff;font-family:inherit}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{flex:1;text-align:center;font-size:20px}
.stepper .btn{min-width:64px}
.lock{max-width:420px;margin:30px auto;text-align:center}
.lock .q{font-size:40px;font-weight:900;margin:14px 0}
.small{font-size:15px;color:var(--muted)}
.center{text-align:center}
.mt{margin-top:14px}
.hide{display:none!important}
#printArea{display:none}
/* Toán vững từng bước */
:root{--add:#1E9E55;--add-d:#137A3F;--add-s:#DDF6E7;--sub:#EE7417;--sub-d:#B85508;--sub-s:#FFE9D4}
.s-vung{--c:#3762E6;--cd:#2245B4;--cs:#E2E9FF}
.sg{display:inline-block;min-width:.7em;text-align:center;font-weight:900;border-radius:10px;cursor:pointer;-webkit-user-select:none;user-select:none}
.sg.add{color:var(--add)}
.sg.sub{color:var(--sub)}
.sg.eqs{color:var(--ink)}
.vhome{display:flex;align-items:center;gap:12px;width:100%;min-height:104px;border:0;border-radius:26px;padding:14px;background:linear-gradient(135deg,#27367A,#3A4C9E);color:#fff;box-shadow:0 6px 0 #1B2558;text-align:left;margin:0 0 18px}
.vhome:active{transform:translateY(3px);box-shadow:0 3px 0 #2B3A9E}
.vhome .vic{flex:none;display:flex;flex-direction:column;gap:4px}
.vhome .vic span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 3px rgba(255,255,255,.5)}
.vhome .vic .a{background:var(--add)}
.vhome .vic .s{background:var(--sub)}
.vhome .vt{flex:1;min-width:0}
.vhome b{display:block;font-size:23px;line-height:1.15}
.vhome small{display:block;font-size:18px;font-weight:600;opacity:.95;margin-top:2px;line-height:1.3}
.vhome .go{flex:none;background:#fff;color:#2245B4;border-radius:30px;padding:8px 14px;font-weight:900;font-size:18px}
.today.vplay{background:linear-gradient(135deg,#27367A,#3A4C9E);color:#fff;box-shadow:0 6px 0 #1B2558}
.opbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opbtn{position:relative;border:0;border-radius:24px;min-height:128px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;font-size:22px;font-weight:900;line-height:1.15;transition:transform .1s}
.opbtn.add{background:var(--add);box-shadow:0 6px 0 var(--add-d)}
.opbtn.sub{background:var(--sub);box-shadow:0 6px 0 var(--sub-d)}
.opbtn:active{transform:translateY(3px)}
.opbtn .oi{line-height:0}
.opbtn .sgn{position:absolute;right:10px;top:6px;font-size:34px;line-height:1}
.opbtn.wrong{opacity:.55;animation:shake .4s}
.opbtn.right{box-shadow:0 0 0 5px var(--sun),0 6px 0 rgba(0,0,0,.15)}
.opbtn.hintme{animation:glow 1s ease-in-out infinite alternate}
.vwrap .qtext{font-size:21px}
.vbody{margin-top:4px}
.vact{margin-top:4px}
.vtale{font-size:20px;font-weight:700;background:var(--cs);border-radius:16px;padding:10px 12px;margin-top:10px;line-height:1.45;text-align:left}
.vtale .kw{font-weight:800}
.vtale.showkw .kw.add,.kw.add{background:var(--add-s);color:var(--add-d);border-radius:6px;padding:0 3px}
.vtale.showkw .kw.sub,.kw.sub{background:var(--sub-s);color:var(--sub-d);border-radius:6px;padding:0 3px}
.vtale:not(.showkw) .kw{background:none;color:inherit;padding:0}
.vtale span.hl{background:#FFE58A;border-radius:6px}
.vstage{position:relative;width:100%;margin-top:12px;-webkit-user-select:none;user-select:none}
.vzone{position:absolute;border-radius:18px;border:3px dashed #C9D3EA;background:#F5F8FF}
.vzone .zl{position:absolute;left:10px;top:5px;font-size:18px;font-weight:800;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap}
.vzone .zs{font-size:24px;line-height:1}
.vzone.bas{background:#FFF5DE;border:4px solid #DDAE68}
.vzone.out.blank{border-color:#E4E0EC;background:#FBFAFD}
.vzone.add{background:var(--add-s);border-color:var(--add);border-style:solid}
.vzone.add .zl{color:var(--add-d)}
.vzone.sub{background:var(--sub-s);border-color:var(--sub);border-style:solid}
.vzone.sub .zl{color:var(--sub-d)}
.vzone.plate{background:#fff;border:4px solid #C9B48A;border-radius:34px}
.vzone.tray{background:#F3EBDD;border:0}
.vzone.tfz{background:#fff;border:3px solid var(--ink);border-radius:12px}
.vzone.tfz i{position:absolute;width:48px;height:48px;border:2px solid #CFC7DD;border-radius:9px}
.vzone.pairz{background:#F5F8FF;border:0}
.vit{position:absolute;left:0;top:0;width:48px;height:48px;display:grid;place-items:center;font-size:38px;line-height:1;border-radius:14px;transition:left .5s cubic-bezier(.3,1.25,.5,1),top .5s cubic-bezier(.3,1.25,.5,1),opacity .5s,transform .35s;touch-action:none;cursor:pointer;z-index:2}
.vit.drag{cursor:grab}
.vit.dragging{transition:none;transform:scale(1.18);z-index:9;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
.vit.nw{background:rgba(30,158,85,.14);box-shadow:inset 0 0 0 3px rgba(30,158,85,.45)}
.vit.gone{opacity:.45;transform:scale(.78)}
.vit.gone.fly{animation:fly .6s ease-out}
.vit.ctr:before{content:"";width:36px;height:36px;border-radius:50%;background:#E5484D;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.vit.n:after,.cb.n:after{content:attr(data-n);position:absolute;right:-8px;top:-10px;background:var(--c);color:#fff;font-family:var(--font);font-size:18px;font-weight:900;border-radius:13px;min-width:26px;height:26px;line-height:26px;padding:0 4px;text-align:center;z-index:3}
.vit.hi{animation:glow 1s ease-in-out infinite alternate}
.vit.wig{animation:wig 1.4s ease-in-out infinite}
.vit.pop{animation:pop .4s}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes fly{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) rotate(-12deg) scale(1)}100%{transform:scale(.78)}}
.cb{position:relative}
.vpic{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;margin-top:12px}
.vbig{border:0;background:var(--cs);color:var(--cd);border-radius:24px;min-width:96px;min-height:96px;font-size:64px;padding:4px 18px}
.dice{display:inline-grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;width:136px;height:136px;padding:16px;background:#fff;border:4px solid var(--ink);border-radius:26px}
.dice i{display:block;border-radius:50%}
.dice i.pip{background:var(--ink)}
.dice.dots{border-color:#EADFC8;border-style:dashed}
.dice.dots i.pip{background:#E5484D}
.dice.sm{width:88px;height:88px;padding:10px;gap:5px;border-width:3px;border-radius:18px}
.dotrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:300px}
.dotrow i{display:block;width:26px;height:26px;border-radius:50%;background:#E5484D}
.dotrow.c2 i{background:#2D7FF9}
.vcmp{display:flex;flex-direction:column;gap:10px;align-items:flex-start;font-size:22px}
.vcmp>div{display:flex;align-items:center;gap:10px}
.vcmp b{width:30px;text-align:right}
.tf{display:inline-grid;grid-template-columns:repeat(5,44px);grid-auto-rows:44px;gap:4px;padding:6px;background:#fff;border:3px solid var(--ink);border-radius:12px;transition:opacity .3s}
.tf i{border:2px solid #CFC7DD;border-radius:8px;display:grid;place-items:center}
.tf b{display:block;width:32px;height:32px;border-radius:50%;background:#E5484D}
.tf b.c2{background:#2D7FF9}
.tf b.x{background:#F6B9BB;position:relative}
.tf b.x:before{content:"";position:absolute;left:-3px;right:-3px;top:14px;height:4px;border-radius:2px;background:var(--ink);transform:rotate(-40deg)}
.tf.f1{border-color:#E1DBEB}
.tf.f1 i{border-color:#F0ECF5}
.tf.f1 b{background:transparent;border:3px dashed #B4A3DE}
.tf.f1 b.x{opacity:.45}
.tf.sm{grid-template-columns:repeat(5,30px);grid-auto-rows:30px;gap:3px;padding:4px}
.tf.sm b{width:22px;height:22px}
.opts.wide .opt .tf{pointer-events:none}
.opts.vtfo .opt{justify-content:center}
.hands{display:flex;gap:6px;justify-content:center}
.hand{display:block;height:auto;max-width:100%}
.hand .fnum{font-size:16px;font-weight:900;fill:var(--c);opacity:0;font-family:var(--font)}
.hand .fnum.on{opacity:1}
.opts.pic .opt .hand{max-width:92px}
.opts.vtxt .opt{font-size:21px}
.opts.vtxt .opt .emo{font-size:36px}
.vexpr{font-size:44px;font-weight:900;text-align:center;margin-top:8px;letter-spacing:1px;line-height:1.2}
.vexpr.big{font-size:52px}
.vexpr .q{color:var(--c)}
.vnote{font-size:18px;color:var(--muted);margin:8px 2px 0;line-height:1.45}
.vb{display:flex;gap:5px;align-items:center;justify-content:center;margin-top:10px}
.vb .slot{min-width:54px;height:64px;padding:0 6px;font-size:32px;border-radius:16px}
.vb .slot .sg{font-size:36px}
.vb .vbeq .sg{font-size:36px}
.vb.done .slot{border-color:var(--ok);background:var(--ok-s)}
.nline{position:relative;width:100%;max-width:380px;margin:10px auto 0}
.nline svg{display:block;width:100%;height:auto}
.nlp{position:absolute;top:calc(69% - 46px);font-size:40px;line-height:1;transform:translateX(-50%);transition:left .45s ease;pointer-events:none}
.nlp.hop{animation:hop .45s ease}
@keyframes hop{50%{margin-top:-26px}}
.vh{font-size:21px;margin:20px 2px 10px;color:var(--cd)}
.vstep{display:flex;align-items:center;gap:12px;width:100%;border:0;background:#fff;border-radius:20px;padding:10px 12px;margin:0 0 10px;box-shadow:0 4px 0 var(--line);text-align:left;min-height:80px}
.vstep:active{transform:translateY(2px)}
.vstep .vn{flex:none;width:52px;height:52px;border-radius:50%;background:var(--cs);color:var(--cd);display:grid;place-items:center;font-size:24px;font-weight:900}
.vstep.ok .vn{background:var(--ok);color:#fff}
.vstep.cur{outline:4px solid var(--sun)}
.vstep.lock{background:#F4EFE4;box-shadow:none;color:var(--muted)}
.vstep.lock .vn{background:#E9E1D0;color:#9A8F7A}
.vstep .t{flex:1;min-width:0}
.vstep .t b{display:block;font-size:19px;line-height:1.25}
.vstep .t small{display:block;font-size:18px;color:var(--muted);line-height:1.3;margin-top:2px}
.vstep .vd{flex:none;display:flex;gap:5px;align-items:center}
.vstep .vd i{width:16px;height:16px;border-radius:50%;background:#EADFC8}
.vstep .vd i.on{background:var(--sun)}
.vstep .vd .emo{font-size:24px}
.vkey{display:inline-block;margin-top:4px;background:#FFF0C2;color:#6B4700;border-radius:10px;padding:1px 8px;font-size:18px;font-weight:800}
.vmsg{font-size:19px!important;color:var(--ink)!important}
.vstory{max-height:calc(100vh - 32px);overflow:auto;text-align:left}
.vstory h2{text-align:center;font-size:23px}
.vsbtn{margin:0 0 14px}
.tabs.ptabs{display:grid;grid-template-columns:repeat(3,1fr)}
.tabs.ptabs button{font-size:18px;white-space:nowrap;padding:4px}
.tabs.ptabs button.vt{grid-column:span 2;color:var(--add-d)}
.tabs.ptabs button.vt.on{background:var(--add);color:#fff}
.tabs.vseg button{font-size:18px;line-height:1.2}
.vpar{font-size:18px}
.vpar h2{font-size:21px;margin:0 0 10px;color:var(--ink);display:flex;align-items:center;gap:8px}
.vpar h3{font-size:19px;margin:16px 0 6px;color:var(--cd)}
.vpar ul{margin:0 0 10px;padding-left:22px}
.vpar li{margin:0 0 6px}
.vlrow{padding:10px 0;border-top:1px dashed var(--line)}
.vlrow:first-of-type{border-top:0}
.vlh{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.vlh b{font-size:18px;line-height:1.3}
.vls{font-size:18px;color:var(--muted)}
.vtag{flex:none;font-size:16px;font-weight:800;border-radius:10px;padding:1px 8px;background:#EEE6D6;color:#5D5440}
.vtag.ok{background:var(--ok-s);color:#11703C}
.vtag.cur{background:#FFF0C2;color:#6B4700}
.vtag.off{background:#F1EEF5;color:#7C7591}
.vchart{margin:0}
.vchart figcaption{font-weight:800;margin-bottom:6px}
.vchart svg{display:block;width:100%;height:auto}
.vlog li{font-size:18px}
@media (min-width:600px){
  .tiles{grid-template-columns:repeat(4,1fr)}
  .acts{grid-template-columns:repeat(3,1fr)}
  .egrid{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:360px){
  .letter{min-width:96px;font-size:60px}
  .opt{font-size:30px}
  .tile b{font-size:20px}
}
@media (prefers-reduced-motion: reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  #app,#confetti,.overlay{display:none!important}
  #printArea{display:block;font-family:var(--font);color:#000;font-size:11pt}
  #printArea h1{font-size:18pt;margin:0 0 4pt}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea th,#printArea td{border:1px solid #999;padding:4pt 5pt;vertical-align:top;text-align:left}
  #printArea th{background:#eee}
  #printArea tr{page-break-inside:avoid}
  #printArea td.ck{width:14mm}
  #printArea table.ptf{width:160mm;border-collapse:collapse;margin:6mm auto 0}
  #printArea .ptf td{border:2.5px solid #000;width:32mm;height:32mm;padding:0}
}

/* Trong khung xem của Claude không mở được hộp in, nên ẩn nút in */
.inframe [data-act="print"],.inframe [data-act="vprint"]{display:none!important}

/* ===== Nhận diện Victoria, đồng bộ với Góc học tập của anh Việt Anh ===== */
:root{--bg:#F2F7FD;--bg2:#E6EEF8;--card:#FFFFFF;--ink:#1B2350;--muted:#55607A;--line:#D3DDEA;--sun:#EEB742;--sun-d:#C8952A;--navy:#27367A;--gold-ink:#9A6A0A;
 --par:#27367A;--par-d:#1B2558;--par-s:#E6EEF8;
 --font:"Be Vietnam Pro",ui-rounded,"SF Pro Rounded","Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;--serif:"Literata",Georgia,"Times New Roman",serif}
body{background:var(--bg);background-image:none}
.top{background:var(--navy);box-shadow:0 3px 0 var(--sun)}
.parrot{background:radial-gradient(circle at 35% 30%,#fff 0,#FDF3D9 62%,#F3D58C 100%);box-shadow:0 4px 0 var(--sun-d)}
.today{background:var(--sun);color:#1B2350;box-shadow:0 6px 0 var(--sun-d)}
.today:active{box-shadow:0 3px 0 var(--sun-d)}
.meter .bar{background:var(--bg2)}.meter .bar i{background:linear-gradient(90deg,#F7D27A,#EEB742)}
.foot b{color:var(--navy)}
/* đầu trang */
.vhead{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg);border-bottom:3px solid var(--sun)}
.vhead .lg{flex:none;background:#fff;border-radius:12px;padding:5px 9px;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex}
.vhead .lg img{height:34px;display:block}
.vhead h1{flex:1;min-width:0;margin:0;font-family:var(--serif);font-size:19px;line-height:1.25;color:var(--navy)}
.vhead h1 small{display:block;font-family:var(--font);font-size:14px;font-weight:500;color:var(--muted)}
.vhead .ph{flex:none;width:52px;height:52px;border-radius:50%;border:3px solid var(--sun);overflow:hidden;background:#fff;padding:0}
.vhead .ph img{width:100%;height:100%;object-fit:cover;display:block}
/* thẻ học sinh */
.idc{position:relative;margin:14px 0;padding:14px;border-radius:24px;border:2px solid var(--sun);background:linear-gradient(135deg,#FFFFFF 55%,#FDF5E2);box-shadow:0 8px 22px rgba(39,54,122,.10);display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px 14px}
.idc .pic{width:96px;height:96px;border-radius:18px;border:3px solid var(--navy);overflow:hidden;background:#fff}
.idc .pic img{width:100%;height:100%;object-fit:cover;display:block}
.idc .who{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px}
.idc .tg{display:flex;align-items:center;justify-content:space-between;gap:8px}
.idc .tg img{height:26px}
.idc .tg span{background:var(--navy);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;letter-spacing:.08em}
.idc .nm{font-family:var(--serif);font-size:26px;line-height:1.15;color:var(--navy);margin:2px 0 0}
.idc .cl{font-size:14px;color:var(--muted);font-weight:600}
.idc .starbar{grid-column:1/-1;margin:0;box-shadow:none;border:1px solid var(--line);background:#fff}
.idc .go{grid-column:1/-1;display:flex;align-items:center;gap:14px;width:100%;min-height:76px;border:0;border-radius:20px;padding:10px 16px;background:var(--sun);color:#1B2350;box-shadow:0 6px 0 var(--sun-d),0 10px 22px rgba(238,183,66,.35);text-align:left}
.idc .go:active{transform:translateY(3px);box-shadow:0 3px 0 var(--sun-d)}
.idc .go i{flex:none;width:52px;height:52px;border-radius:50%;background:var(--navy);display:grid;place-items:center}
.idc .go i svg{width:26px;height:26px}
.idc .go b{display:block;font-size:23px;line-height:1.15}
.idc .go small{display:block;font-size:15px;font-weight:600;opacity:.85}
.idc .sw{position:absolute;right:12px;bottom:-14px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;color:var(--muted);min-height:32px}
/* nhiệm vụ hôm nay */
.mis{margin:18px 0;padding:14px;border-radius:22px;background:#fff;border:1px solid var(--line);border-left:6px solid var(--sun);box-shadow:0 4px 14px rgba(39,54,122,.06)}
.mis .mh{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:10px}
.mis .mh small{display:block;color:var(--gold-ink);font-weight:800;letter-spacing:.06em;font-size:14px}
.mis .mh b{font-size:19px}
.mis .mh .cnt{font-size:30px;font-weight:800;color:var(--navy)}
.mrow{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;margin:0 0 10px;padding:10px 12px;border:0;border-radius:18px;background:var(--bg2);text-align:left;color:var(--ink)}
.mrow:last-child{margin-bottom:0}
.mrow .ck{flex:none;width:34px;height:34px;border-radius:50%;border:3px solid var(--navy);display:grid;place-items:center;font-weight:900;color:#fff}
.mrow.ok .ck{background:#2E8B57;border-color:#2E8B57}
.mrow .ic{flex:none;font-size:34px}
.mrow .t{flex:1;min-width:0}.mrow .t b{display:block;font-size:18px;line-height:1.25}.mrow .t small{display:block;font-size:14px;color:var(--muted);line-height:1.3}
.mrow .ac{flex:none;background:var(--navy);color:#fff;border-radius:14px;padding:10px 16px;font-weight:800;font-size:18px}
.mrow.ok .ac{background:#fff;color:#2E8B57;border:2px solid #2E8B57}
.mrow.ok .t b{color:var(--muted)}
.hsec{margin:22px 2px 10px;font-family:var(--serif);font-size:22px;color:var(--navy)}
.pcard .av img,.who .av img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.qstart{display:flex;align-items:center;gap:14px;width:100%;min-height:96px;border:2px solid var(--sun);border-radius:24px;background:#fff;padding:12px 16px;text-align:left;margin:0 0 16px;box-shadow:0 5px 0 var(--sun-d)}
.qstart img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid var(--navy)}
.qstart b{display:block;font-family:var(--serif);font-size:24px;color:var(--navy)}.qstart small{font-size:15px;color:var(--muted)}
.parrot{width:64px;height:64px;font-size:40px}.parrot.sm{width:52px;height:52px;font-size:32px}.mascot{margin:4px 0 12px}.bubble{font-size:18px;padding:10px 14px}
.tiles+.vhome{margin-top:16px}

/* bài học từng bước */
.stephide{display:none!important}
.ponly{display:none!important}.ponly.pshow{display:block!important}
.stepnav{margin:6px 0 18px}
.stepnav .sdots{display:flex;justify-content:center;gap:8px;margin:0 0 12px}
.stepnav .sdots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.stepnav .sdots i.d{background:var(--sun)}.stepnav .sdots i.c{background:var(--navy);transform:scale(1.25)}
.stepnav .sbtns{display:flex;gap:10px}.stepnav .sbtns .btn.white{flex:none;width:64px;padding:0}.stepnav .sbtns .btn.white svg{width:28px;height:28px}
.stepnav .sbtns .btn.block{flex:1;background:var(--navy);box-shadow:0 5px 0 #1B2558;font-size:22px;min-height:64px}
.sskip{display:block;margin:12px auto 0;border:0;background:none;color:var(--muted);font-weight:700;font-size:16px;text-decoration:underline;min-height:44px}

/* sao bay khi đúng, nhãn dán bật ra, màn mừng cuối ngày */
.popb{position:fixed;width:0;height:0;z-index:9999;pointer-events:none}
.popb i{position:absolute;left:-12px;top:-12px;font-size:24px;animation:popf .85s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes popf{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1.1);opacity:0}}
.result .stk{display:inline-block;animation:stkin .9s cubic-bezier(.2,1.6,.4,1) both;animation-delay:.35s}
@keyframes stkin{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.result .stars span{display:inline-block;animation:stkin .6s cubic-bezier(.2,1.6,.4,1) both}.result .stars span:nth-child(2){animation-delay:.15s}.result .stars span:nth-child(3){animation-delay:.3s}
.dayp .dph{position:relative;width:120px;height:120px;margin:0 auto 6px}
.dayp .dph img,.dayp .dph>.emo:not(.crown){width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid var(--sun);display:grid;place-items:center;font-size:70px;background:#fff}
.dayp .crown{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-size:44px;animation:stkin .8s cubic-bezier(.2,1.6,.4,1) both .2s}
.dayp h2{font-family:var(--serif);color:var(--navy)}

/* Ngoài giờ học: Tiếng Anh cùng Bingo */
.vui{display:flex;align-items:center;gap:12px;width:100%;min-height:96px;border:2px dashed var(--line);border-radius:22px;background:#fff;padding:12px 14px;text-align:left;color:var(--ink)}
.vui .ic{flex:none;font-size:40px}.vui .t{flex:1;min-width:0}.vui b{display:block;font-size:20px}.vui small{display:block;color:var(--muted);font-size:14px;line-height:1.35}
.vui .go{flex:none;background:var(--sun);color:#1B2350;border-radius:14px;padding:10px 16px;font-weight:800}
.vuiov{position:fixed;inset:0;z-index:9000;background:var(--bg);display:flex;flex-direction:column}
.vuibar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--navy);color:#fff;box-shadow:0 3px 0 var(--sun)}
.vuibar b{font-size:18px}.vuibar small{opacity:.8;font-size:14px;margin-left:auto}
.vuibox{flex:1;min-height:0;display:flex}.vuibox iframe{flex:1;border:0;width:100%;height:100%;background:#fff}
.vuiwait{margin:auto;padding:24px;text-align:center;color:var(--muted);font-size:18px;max-width:420px}

/* Laptop: trang chủ hai cột như Góc học tập của anh Việt Anh */
@media (min-width:1000px){
 #app.home{max-width:1180px}
 #app.home .vhead{padding:12px 24px}
 #app.home .hgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start;padding:16px 24px 28px}
 #app.home .hl .idc{margin-top:0}
 #app.home .hr .hsec:first-child{margin-top:0}
 #app.home .tiles{grid-template-columns:1fr 1fr}
}

/* ===== Vui mắt hơn: nền nhiều màu, đáp án mỗi ô một màu, xúc xắc rực rỡ, thanh trên theo màu môn ===== */
body{background:
 radial-gradient(circle at 6% 10%,#FFE7A3 0 70px,transparent 71px),
 radial-gradient(circle at 94% 18%,#CDE6FF 0 95px,transparent 96px),
 radial-gradient(circle at 88% 86%,#FFD9E3 0 120px,transparent 121px),
 radial-gradient(circle at 10% 82%,#D5F4E2 0 95px,transparent 96px),
 radial-gradient(circle at 50% 50%,#FFFFFF 0 0,transparent 0),
 linear-gradient(180deg,#EAF4FF 0%,#FFF7E8 100%);background-attachment:fixed}
#app.play .top{background:linear-gradient(90deg,var(--c),var(--cd));box-shadow:0 4px 0 var(--sun)}
#app.s-vung{--c:#3762E6;--cd:#5B3FD0;--cs:#E2E9FF}
.qcard{position:relative;overflow:hidden;border:0;box-shadow:0 8px 24px rgba(39,54,122,.10),0 5px 0 var(--line)}
.qcard::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(90deg,#F2603A,#FFB020,#13A15A,#2D7FF9,#8B47EA)}
.qvis{background:radial-gradient(circle,#F3F7FF 1.5px,transparent 1.6px) 0 0/18px 18px;border-radius:18px;padding:12px}
.qtext{font-size:22px}
.opts .opt:not(.right):not(.wrong):not(.hintme):nth-child(5n+1){background:#FFE4D9;box-shadow:0 6px 0 #F4A98E;color:#A9361A}
.opts .opt:not(.right):not(.wrong):not(.hintme):nth-child(5n+2){background:#DCEBFF;box-shadow:0 6px 0 #92B9F3;color:#1D4FA8}
.opts .opt:not(.right):not(.wrong):not(.hintme):nth-child(5n+3){background:#DDF5E6;box-shadow:0 6px 0 #8FD3AA;color:#13703F}
.opts .opt:not(.right):not(.wrong):not(.hintme):nth-child(5n+4){background:#EFE3FF;box-shadow:0 6px 0 #C2A3F1;color:#5B2BAA}
.opts .opt:not(.right):not(.wrong):not(.hintme):nth-child(5n+5){background:#FFF1C9;box-shadow:0 6px 0 #EBC56A;color:#8A5A00}
.opts .opt{transition:transform .12s}.opts .opt:hover{transform:translateY(-2px)}.opts .opt:active{transform:translateY(3px)}
.dice{border-color:#3762E6;border-style:solid;box-shadow:0 8px 0 #C9D6F7,0 14px 26px rgba(55,98,230,.18);transform:rotate(-4deg);background:linear-gradient(160deg,#fff,#F2F6FF)}
.dice i.pip{background:radial-gradient(circle at 35% 30%,#FF9A8B,#E5484D 60%,#B8282D);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.dice.dots{border-color:#FFB020;border-style:dashed;transform:rotate(3deg)}
.dice.dots i.pip{background:radial-gradient(circle at 35% 30%,#7FB2FF,#2D7FF9 60%,#1A5FCC)}
.qhead .parrot{background:radial-gradient(circle at 35% 30%,#fff 0,#FFF3C8 60%,#FFD36B 100%)}
.btn.soft{background:linear-gradient(180deg,#fff,var(--cs))}

/* sân chơi Toán vững nhiều màu hơn */
.vzone{background:linear-gradient(180deg,#F7FAFF,#EEF3FF);border-color:#A9C1F5}
.vzone.plate{background:radial-gradient(circle at 50% 40%,#FFFFFF 55%,#FFF4D6 100%);border:5px solid #FFB020;box-shadow:0 6px 0 #F2D08A,0 12px 22px rgba(255,176,32,.25)}
.vzone.tray{background:repeating-linear-gradient(45deg,#E8F1FF 0 14px,#DDEBFF 14px 28px);border-radius:22px;box-shadow:inset 0 3px 0 rgba(0,0,0,.04)}
.vzone.bas{background:linear-gradient(180deg,#FFF6E0,#FFE9B8);border-color:#F0A830}
.vzone.tfz{border-color:#3762E6;box-shadow:0 5px 0 #C9D6F7}
.vzone.tfz i{border-color:#B9C8F2;background:#F7FAFF}
.vit.ctr:before{background:radial-gradient(circle at 35% 30%,#FF9A8B,#E5484D 60%,#B8282D);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 3px 6px rgba(229,72,77,.35)}
@media (min-width:1000px){#app.play{max-width:900px}}

/* nhận diện trên mọi trang trong */
.bstrip{position:sticky;top:76px;z-index:19;display:flex;align-items:center;gap:10px;padding:6px 12px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bstrip .bl{flex:none;display:flex;background:#fff;border-radius:8px;padding:2px 6px;box-shadow:0 1px 3px rgba(0,0,0,.08)}.bstrip .bl img{height:28px;display:block}
.bstrip .bt{flex:1;min-width:0;font-size:13px;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bstrip .bme{flex:none;display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;min-height:40px;color:var(--navy);font-size:14px}
.bstrip .bp{width:46px;height:46px;border-radius:50%;border:3px solid var(--sun);overflow:hidden;display:grid;place-items:center;background:#fff;font-size:22px}
.bstrip .bp img{width:100%;height:100%;object-fit:cover}
@media (max-width:420px){.bstrip .bt{display:none}.bstrip .bme{margin-left:auto}}
.rpic{position:relative;display:block;width:104px;height:104px;margin:0 auto 6px}
.rpic img,.rpic>span.emo{width:104px;height:104px;border-radius:50%;object-fit:cover;border:4px solid var(--sun);display:grid;place-items:center;font-size:60px;background:#fff;box-shadow:0 6px 16px rgba(39,54,122,.18)}
.rpic i{position:absolute;right:-6px;top:-6px;font-size:34px;font-style:normal;animation:stkin .7s cubic-bezier(.2,1.6,.4,1) both .2s}

["ba","bà","bè","bò","bi","bố"],"tu":[{"w":"bà","e":"👵"},{"w":"bố","e":"👨"},{"w":"bò","e":"🐄"},{"w":"bóng","e":"⚽"},{"w":"bắp","e":"🌽"},{"w":"bướm","e":"🦋"}],"cau":"Bà bế bé.","doc":"","hoi":[{"q":"Từ nào có âm b?","o":["cái kèn","bà","con muỗi"],"a":1}],"viet":"b, bà","choi":"Đi tìm đồ vật: bé đi quanh nhà tìm ba đồ vật hoặc tranh ảnh có tên chứa âm b, ví dụ bà, mang về và đọc to tên từng thứ.","bm":"Bé hay viết ngược b thành d; mẹo nhớ: nét thẳng đứng trước, cái bụng ở bên phải. Dấu huyền đọc giọng trầm xuống, viết nghiêng từ trái sang phải đi xuống.","dau":"huyền"},{"id":"tv1-03","tap":1,"tuan":2,"ten":"Bài 3. C c, dấu sắc","loai":"am","am":["c"],"tieng":["ca","cá","cà","cò","cô","cú"],"tu":[{"w":"cá","e":"🐟"},{"w":"cua","e":"🦀"},{"w":"cà rốt","e":"🥕"},{"w":"cam","e":"🍊"},{"w":"cốc","e":"🥛"},{"w":"cú mèo","e":"🦉"}],"cau":"Bà có cá.","doc":"","hoi":[{"q":"Từ nào có âm c?","o":["cá","dừa","nến"],"a":0}],"viet":"c, cá","choi":"Bắt bóng: bố mẹ tung quả bóng và nói một tiếng; tiếng có âm c thì bé bắt bóng, không có thì để bóng rơi.","bm":"Dấu sắc đọc giọng vút lên, viết nghiêng ngược với dấu huyền. Khi ghép tiếng, chữ c đọc là 'cờ', bé đừng gọi là 'xê'.","dau":"sắc"},{"id":"tv1-04","tap":1,"tuan":2,"ten":"Bài 4. E e Ê ê","loai":"am","am":["e","ê"],"tieng":["be","bé","bè","bê","bế","dê"],"tu":[{"w":"bé","e":"👶"},{"w":"mẹ","e":"👩"},{"w":"xe","e":"🚗"},{"w":"dê","e":"🐐"},{"w":"lê","e":"🍐"},{"w":"tre","e":"🎋"}],"cau":"Bê và dê ăn cỏ.","doc":"","hoi":[{"q":"Từ nào có âm e?","o":["ngọn núi","hoa thơm","bé"],"a":2},{"q":"Từ nào có âm ê?","o":["lá thư","dê","con sóc"],"a":1}],"viet":"e, ê, bé, bê","choi":"Viết lên lưng: bố mẹ dùng ngón tay viết âm e lên lưng bé, bé đoán đúng thì đọc một từ có âm e như bé, rồi đổi vai.","bm":"ê có thêm cái mũ và đọc khép miệng hơn e. Bé hay quên mũ khi viết, mẹ nhắc bé đọc lại chữ mình vừa viết."},{"id":"tv1-05","tap":1,"tuan":2,"ten":"Bài 5. Ôn tập và kể chuyện","loai":"ke-chuyen","am":["a","b","c","e","ê"],"tieng":["ba","bà","bé","bê","ca","cá"],"tu":[{"w":"bà","e":"👵"},{"w":"cá","e":"🐟"},{"w":"bé","e":"👶"},{"w":"cua","e":"🦀"},{"w":"bò","e":"🐄"},{"w":"dê","e":"🐐"}],"cau":"Bà bế bé, bé có cá.","doc":"Kể chuyện: Búp bê và dế mèn. Búp bê làm việc nhà suốt ngày, quét nhà, rửa bát, nấu cơm nên rất mệt. Dế mèn hát tặng búp bê một bài, nghe hát xong búp bê vui hẳn lên và hết mệt.","hoi":[{"q":"Ai hát tặng búp bê?","o":["Con gà","Dế mèn","Chú mèo"],"a":1},{"q":"Nghe hát xong, búp bê thấy thế nào?","o":["Vui và hết mệt","Mệt hơn lúc trước","Muốn đi ngủ ngay"],"a":0}],"viet":"bé, bà, cá","choi":"Kể chuyện bằng tranh: bố mẹ vẽ nhanh bốn tranh của câu chuyện ra giấy rồi xáo trộn; bé xếp lại đúng thứ tự và kể theo từng tranh.","bm":"Cho bé kể lại câu chuyện theo từng tranh, mỗi tranh một câu. Đừng sửa lỗi liên tục, chỉ khen và gợi ý thêm từ."},{"id":"tv1-06","tap":1,"tuan":3,"ten":"Bài 6. O o, dấu hỏi","loai":"am","am":["o"],"tieng":["bò","bó","bỏ","cò","có","cỏ"],"tu":[{"w":"bò","e":"🐄"},{"w":"cỏ","e":"🌿"},{"w":"chó","e":"🐕"},{"w":"nho","e":"🍇"},{"w":"thỏ","e":"🐇"},{"w":"giỏ","e":"🧺"}],"cau":"Bò bê có bó cỏ.","doc":"","hoi":[{"q":"Từ nào có âm o?","o":["bò","cục pin","hà mã"],"a":0}],"viet":"o, cỏ","choi":"Ghép thẻ chữ: viết các chữ đã học ra thẻ giấy, bé ghép thành tiếng như bò, bó, đọc to rồi đố bố mẹ đọc theo.","bm":"Dấu hỏi đọc giọng xuống rồi lên nhẹ. Người miền Nam hay đọc hỏi và ngã giống nhau, bố mẹ phát âm chậm và rõ để bé nghe ra khác biệt.","dau":"hỏi"},{"id":"tv1-07","tap":1,"tuan":3,"ten":"Bài 7. Ô ô, dấu nặng","loai":"am","am":["ô"],"tieng":["bô","bố","bộ","cô","cổ","cộ"],"tu":[{"w":"bố","e":"👨"},{"w":"cô giáo","e":"👩‍🏫"},{"w":"cái ô","e":"☂️"},{"w":"ô tô","e":"🚗"},{"w":"hổ","e":"🐯"},{"w":"tô phở","e":"🍜"}],"cau":"Bé bá cổ bố.","doc":"","hoi":[{"q":"Từ nào có âm ô?","o":["mẹ","mùa xuân","bố"],"a":2}],"viet":"ô, cô, bộ","choi":"Ai nhanh hơn: bày các hình trong bài lên bàn, bố mẹ đọc một từ, bé chỉ đúng hình thật nhanh; đúng năm lần được một ngôi sao.","bm":"Dấu nặng là dấu duy nhất đặt dưới chữ, đọc giọng nặng và dứt khoát. Phân biệt o và ô bằng cái mũ.","dau":"nặng"},{"id":"tv1-08","tap":1,"tuan":3,"ten":"Bài 8. D d Đ đ","loai":"am","am":["d","đ"],"tieng":["da","dê","dỗ","đá","đỏ","đò"],"tu":[{"w":"dê","e":"🐐"},{"w":"dừa","e":"🥥"},{"w":"dưa hấu","e":"🍉"},{"w":"đèn","e":"💡"},{"w":"đồng hồ","e":"⏰"},{"w":"đá bóng","e":"⚽"}],"cau":"Dê ăn cỏ ở bờ đê.","doc":"","hoi":[{"q":"Từ nào có âm d?","o":["gà con","dê","lời chào"],"a":1},{"q":"Từ nào có âm đ?","o":["đèn","con vịt","lướt sóng"],"a":0}],"viet":"d, đ, dê, đò","choi":"Nặn chữ: bé nặn đất nặn hoặc xếp que tính thành âm d, rồi kể một từ có âm d; mỗi từ kể đúng được nặn thêm một chữ.","bm":"đ có thêm một nét gạch ngang. Bé dễ nhầm d với b, cho bé so hai chữ cạnh nhau. Ở miền Nam d đọc gần như gi, nên bé cần nhớ mặt chữ của từng từ."},{"id":"tv1-09","tap":1,"tuan":3,"ten":"Bài 9. Ơ ơ, dấu ngã","loai":"am","am":["ơ"],"tieng":["bơ","bờ","cờ","cỡ","đỡ","dỡ"],"tu":[{"w":"lá cờ","e":"🚩"},{"w":"quả bơ","e":"🥑"},{"w":"cái nơ","e":"🎀"},{"w":"áo sơ mi","e":"👕"},{"w":"thợ xây","e":"👷"},{"w":"giấc mơ","e":"💭"}],"cau":"Bé có lá cờ đỏ.","doc":"","hoi":[{"q":"Từ nào có âm ơ?","o":["lá cờ","cúp vàng","bút chì"],"a":0}],"viet":"ơ, cờ, cỡ","choi":"Săn tiếng: bố mẹ đọc chậm từng từ, nghe tiếng nào có âm ơ thì bé vỗ tay một cái, không có thì ngồi im. Sau năm lượt đổi vai, bé đọc để bố mẹ vỗ tay.","bm":"ơ có cái râu bên phải. Dấu ngã đọc giọng vút lên và gãy, khác dấu hỏi; cho bé nghe cặp 'cỏ' và 'cỗ' để so.","dau":"ngã"},{"id":"tv1-10","tap":1,"tuan":3,"ten":"Bài 10. Ôn tập và kể chuyện","loai":"ke-chuyen","am":["o","ô","d","đ","ơ"],"tieng":["cỏ","cô","dê","đỏ","bơ","cờ"],"tu":[{"w":"chó","e":"🐕"},{"w":"ô tô","e":"🚗"},{"w":"dê","e":"🐐"},{"w":"đèn","e":"💡"},{"w":"lá cờ","e":"🚩"},{"w":"cái nơ","e":"🎀"}],"cau":"Bố đỡ bé, bé có cờ đỏ.","doc":"Kể chuyện: Đàn kiến con ngoan ngoãn. Bà kiến già sống trong một cái tổ nhỏ, chật chội. Đàn kiến con thương bà, cùng nhau khiêng bà trên một chiếc lá đến chỗ ở mới cao ráo hơn. Bà kiến vui lắm và cảm ơn các cháu.","hoi":[{"q":"Đàn kiến con đưa bà kiến đi bằng gì?","o":["Một chiếc ô tô","Một con thuyền","Một chiếc lá"],"a":2},{"q":"Ở chỗ mới, bà kiến thấy thế nào?","o":["Buồn vì phải rời tổ cũ","Vui và cảm ơn các cháu","Lo vì chỗ mới lạ quá"],"a":1}],"viet":"cỏ, cờ, đỏ","choi":"Diễn kịch nhỏ: bé và bố mẹ mỗi người nhận một vai trong câu chuyện, dùng thú bông làm nhân vật và diễn lại trong năm phút.","bm":"Hỏi bé: em đã bao giờ giúp ông bà như đàn kiến chưa? Câu hỏi liên hệ giúp bé nhớ ý chuyện lâu hơn."},{"id":"tv1-11","tap":1,"tuan":4,"ten":"Bài 11. I i K k","loai":"am","am":["i","k"],"tieng":["bi","kì","kẻ","kế","dì","đi"],"tu":[{"w":"que kem","e":"🍦"},{"w":"kẹo","e":"🍬"},{"w":"cái kéo","e":"✂️"},{"w":"con kiến","e":"🐜"},{"w":"kì đà","e":"🦎"},{"w":"bí ngô","e":"🎃"}],"cau":"Dì để kẹo ở kệ.","doc":"","hoi":[{"q":"Từ nào có âm k?","o":["hoa hướng dương","que kem","ăn cơm"],"a":1},{"q":"Từ nào có âm i?","o":["kì đà","vở","tàu thuỷ"],"a":0}],"viet":"i, k, kì, kẻ","choi":"Săn tiếng: bố mẹ đọc chậm từng từ, nghe tiếng nào có âm i hoặc k thì bé vỗ tay một cái, không có thì ngồi im. Sau năm lượt đổi vai, bé đọc để bố mẹ vỗ tay.","bm":"Mẹo chính tả đầu tiên: k chỉ đứng trước e, ê, i; c đứng trước các chữ còn lại. Bé hay viết 'cem', mẹ nhắc nhẹ bằng câu 'k đi với e, ê, i'."},{"id":"tv1-12","tap":1,"tuan":4,"ten":"Bài 12. H h L l","loai":"am","am":["h","l"],"tieng":["hè","hồ","hổ","lá","lê","lò"],"tu":[{"w":"hổ","e":"🐯"},{"w":"hoa","e":"🌸"},{"w":"hà mã","e":"🦛"},{"w":"lá","e":"🍃"},{"w":"quả lê","e":"🍐"},{"w":"lửa","e":"🔥"}],"cau":"Bà cho bé quả lê.","doc":"","hoi":[{"q":"Từ nào có âm l?","o":["lá","cam","bố"],"a":0},{"q":"Từ nào có âm h?","o":["cây cầu","cái tai","hổ"],"a":2}],"viet":"h, l, hè, lá","choi":"Đi tìm đồ vật: bé đi quanh nhà tìm ba đồ vật hoặc tranh ảnh có tên chứa âm h hoặc l, ví dụ hổ, mang về và đọc to tên từng thứ.","bm":"Một số vùng đọc lẫn l và n; khi đọc l, đầu lưỡi chạm chân răng trên rồi bật ra. h đọc 'hờ', hơi thoát nhẹ từ cổ."},{"id":"tv1-13","tap":1,"tuan":4,"ten":"Bài 13. U u Ư ư","loai":"am","am":["u","ư"],"tieng":["bú","cú","củ","đu","hư","dữ"],"tu":[{"w":"cú mèo","e":"🦉"},{"w":"mũ","e":"🧢"},{"w":"hũ mật","e":"🍯"},{"w":"sư tử","e":"🦁"},{"w":"lá thư","e":"✉️"},{"w":"cái dù","e":"☂️"}],"cau":"Bé đội mũ đỏ.","doc":"","hoi":[{"q":"Từ nào có âm u?","o":["viên gạch","con cọp","cú mèo"],"a":2},{"q":"Từ nào có âm ư?","o":["con chim","sư tử","cây vợt"],"a":1}],"viet":"u, ư, đu đủ","choi":"Bắt bóng: bố mẹ tung quả bóng và nói một tiếng; tiếng có âm u hoặc ư thì bé bắt bóng, không có thì để bóng rơi.","bm":"ư là u có thêm râu. Đọc u thì môi tròn, đọc ư thì môi dẹt sang hai bên; cho bé soi gương để thấy khác biệt."},{"id":"tv1-14","tap":1,"tuan":4,"ten":"Bài 14. Ch ch Kh kh","loai":"am","am":["ch","kh"],"tieng":["chè","chó","chợ","khế","khô","khỉ"],"tu":[{"w":"chó","e":"🐕"},{"w":"chim","e":"🐦"},{"w":"chuối","e":"🍌"},{"w":"khỉ","e":"🐒"},{"w":"khoai lang","e":"🍠"},{"w":"khăn","e":"🧣"}],"cau":"Khỉ ăn chuối.","doc":"","hoi":[{"q":"Từ nào có âm ch?","o":["ngọn tháp","chó","rạp xiếc"],"a":1},{"q":"Từ nào có âm kh?","o":["khỉ","áo sơ mi","gió"],"a":0}],"viet":"ch, kh, chú khỉ","choi":"Viết lên lưng: bố mẹ dùng ngón tay viết âm ch lên lưng bé, bé đoán đúng thì đọc một từ có âm ch như chó, rồi đổi vai.","bm":"ch đọc 'chờ', kh đọc 'khờ' có hơi cọ ở cổ họng. Bé dễ viết thiếu chữ h, nhắc bé đây là chữ ghép từ hai con chữ."},{"id":"tv1-15","tap":1,"tuan":4,"ten":"Bài 15. Ôn tập và kể chuyện","loai":"ke-chuyen","am":["i","k","h","l","u","ư","ch","kh"],"tieng":["kì","hè","lá","củ","chó","khỉ"],"tu":[{"w":"que kem","e":"🍦"},{"w":"hổ","e":"🐯"},{"w":"lá","e":"🍃"},{"w":"mũ","e":"🧢"},{"w":"chó","e":"🐕"},{"w":"khỉ","e":"🐒"}],"cau":"Khỉ ăn chuối, chó ăn cơm.","doc":"Kể chuyện: Con quạ thông minh. Một con quạ khát nước tìm thấy cái lọ có ít nước dưới đáy nhưng mỏ không với tới. Quạ nghĩ ra cách gắp từng viên sỏi bỏ vào lọ, nước dâng lên dần và quạ uống được nước.","hoi":[{"q":"Lúc đầu vì sao quạ không uống được nước?","o":["Mỏ không với tới nước","Lọ đã hết sạch nước","Nước trong lọ bị bẩn"],"a":0},{"q":"Quạ bỏ gì vào lọ?","o":["Những chiếc lá","Hạt thóc","Những viên sỏi"],"a":2}],"viet":"kì, lá, khỉ","choi":"Kể nối tiếp: bố mẹ kể câu đầu, bé kể câu tiếp theo, cứ thế đến hết chuyện; ai quên thì được xem lại tranh gợi ý.","bm":"Cho bé làm thử: thả sỏi vào cốc nước để thấy nước dâng lên như trong chuyện, bé sẽ hiểu vì sao quạ thông minh."},{"id":"tv1-16","tap":1,"tuan":5,"ten":"Bài 16. M m N n","loai":"am","am":["m","n"],"tieng":["má","mẹ","mơ","no","nơ","nụ"],"tu":[{"w":"mèo","e":"🐱"},{"w":"mẹ","e":"👩"},{"w":"mũ","e":"🧢"},{"w":"cái nơ","e":"🎀"},{"w":"nấm","e":"🍄"},{"w":"nến","e":"🕯️"}],"cau":"Mẹ cho bé nơ đỏ.","doc":"","hoi":[{"q":"Từ nào có âm n?","o":["vở","gói quà","cái nơ"],"a":2},{"q":"Từ nào có âm m?","o":["sữa","mèo","bắp"],"a":1}],"viet":"m, n, mẹ, nơ","choi":"Ghép thẻ chữ: viết các chữ đã học ra thẻ giấy, bé ghép thành tiếng như má, mẹ, đọc to rồi đố bố mẹ đọc theo.","bm":"m thì mím môi, n thì đặt lưỡi lên chân răng. Nhiều bé lẫn n với l, bố mẹ cho bé đọc thật chậm cặp 'nơ' và 'lơ'."},{"id":"tv1-17","tap":1,"tuan":5,"ten":"Bài 17. G g Gi gi","loai":"am","am":["g","gi"],"tieng":["gà","gỗ","gõ","giá","giỏ","giò"],"tu":[{"w":"gà","e":"🐔"},{"w":"gà con","e":"🐤"},{"w":"gấu","e":"🐻"},{"w":"giày","e":"👟"},{"w":"gió","e":"🌬️"},{"w":"giỏ","e":"🧺"}],"cau":"Gió thổi, gà gáy.","doc":"","hoi":[{"q":"Từ nào có âm gi?","o":["xe đạp","giày","phim hoạt hình"],"a":1},{"q":"Từ nào có âm g?","o":["gà","con mèo","cái ly"],"a":0}],"viet":"g, gi, gà, giỏ","choi":"Ai nhanh hơn: bày các hình trong bài lên bàn, bố mẹ đọc một từ, bé chỉ đúng hình thật nhanh; đúng năm lần được một ngôi sao.","bm":"gi đọc là 'di' và là một chữ ghép, bé hay tách thành g và i. Ở miền Nam d, gi, v nói gần giống nhau, nên cho bé nhìn mặt chữ thật nhiều."},{"id":"tv1-18","tap":1,"tuan":5,"ten":"Bài 18. Gh gh Nh nh","loai":"am","am":["gh","nh"],"tieng":["ghế","ghi","ghẹ","nhà","nho","nhổ"],"tu":[{"w":"ghế","e":"🪑"},{"w":"con ghẹ","e":"🦀"},{"w":"nhà","e":"🏠"},{"w":"nho","e":"🍇"},{"w":"nhện","e":"🕷️"},{"w":"nhím","e":"🦔"}],"cau":"Nhà bà có ghế gỗ.","doc":"","hoi":[{"q":"Từ nào có âm nh?","o":["nhà","mèo","dùi trống"],"a":0},{"q":"Từ nào có âm gh?","o":["lê","con ong","ghế"],"a":2}],"viet":"gh, nh, ghế, nhà","choi":"Nặn chữ: bé nặn đất nặn hoặc xếp que tính thành âm gh, rồi kể một từ có âm gh; mỗi từ kể đúng được nặn thêm một chữ.","bm":"gh chỉ đi với e, ê, i, giống quy tắc của k. nh đọc 'nhờ', mặt lưỡi áp lên vòm miệng."},{"id":"tv1-19","tap":1,"tuan":5,"ten":"Bài 19. Ng ng Ngh ngh","loai":"am","am":["ng","ngh"],"tieng":["ngô","ngõ","ngủ","nghé","nghỉ","nghệ"],"tu":[{"w":"ngô","e":"🌽"},{"w":"ngựa","e":"🐴"},{"w":"ngủ","e":"😴"},{"w":"ngôi sao","e":"⭐"},{"w":"nghé","e":"🐃"},{"w":"nghe nhạc","e":"🎧"}],"cau":"Nghé ăn cỏ ở ngõ nhỏ.","doc":"","hoi":[{"q":"Từ nào có âm ngh?","o":["hoa thơm","xoài","nghé"],"a":2},{"q":"Từ nào có âm ng?","o":["cái ly","ngô","cá"],"a":1}],"viet":"ng, ngh, ngô, nghé","choi":"Nhảy ô: kẻ các ô trên sàn, mỗi ô ghi một âm trong bài (ng, ngh); bố mẹ đọc từ nào, bé nhảy vào ô có âm của từ đó.","bm":"ngh cũng chỉ đi với e, ê, i. Ba cặp c và k, g và gh, ng và ngh theo cùng một quy tắc, bố mẹ dạy chung một câu cho bé dễ nhớ."},{"id":"tv1-20","tap":1,"tuan":5,"ten":"Bài 20. Ôn tập và kể chuyện","loai":"ke-chuyen","am":["m","n","g","gi","gh","nh","ng","ngh"],"tieng":["mẹ","nơ","gà","ghế","nhà","ngô"],"tu":[{"w":"mèo","e":"🐱"},{"w":"cái nơ","e":"🎀"},{"w":"gà","e":"🐔"},{"w":"ghế","e":"🪑"},{"w":"nhà","e":"🏠"},{"w":"ngựa","e":"🐴"}],"cau":"Mẹ đi chợ, bé ở nhà với bà.","doc":"Kể chuyện: Cô chủ không biết quý tình bạn. Cô bé có chú gà trống đẹp nhưng đem đổi lấy gà mái, rồi đổi gà mái lấy vịt, đổi vịt lấy chú chó con. Cứ đổi mãi như thế, cuối cùng cô bé chẳng còn người bạn nào ở bên.","hoi":[{"q":"Cô bé đổi gà trống lấy con gì?","o":["Con cá","Gà mái","Con mèo"],"a":1},{"q":"Vì sao cuối cùng cô bé không còn bạn nào?","o":["Vì cô không biết quý bạn","Vì các bạn bỏ đi chơi xa","Vì cô bận học cả ngày"],"a":0}],"viet":"mẹ, ghế, nghé","choi":"Kể chuyện bằng tranh: bố mẹ vẽ nhanh bốn tranh của câu chuyện ra giấy rồi xáo trộn; bé xếp lại đúng thứ tự và kể theo từng tranh.","bm":"Hỏi bé: nếu em là cô chủ, em có giữ lại bạn gà trống không? Để bé tự rút ra rằng bạn bè cần được quý trọng."},{"id":"tv1-21","tap":1,"tuan":6,"ten":"Bài 21. R r S s","loai":"am","am":["r","s"],"tieng":["rổ","rễ","rá","sò","sẻ","số"],"tu":[{"w":"rùa","e":"🐢"},{"w":"rắn","e":"🐍"},{"w":"rau","e":"🥬"},{"w":"sóc","e":"🐿️"},{"w":"sữa","e":"🥛"},{"w":"vỏ sò","e":"🐚"}],"cau":"Bà có rổ rau.","doc":"","hoi":[{"q":"Từ nào có âm r?","o":["rùa","quả táo","váy xoè"],"a":0},{"q":"Từ nào có âm s?","o":["xe ca","quà","sóc"],"a":2}],"viet":"r, s, rổ, sẻ","choi":"Săn tiếng: bố mẹ đọc chậm từng từ, nghe tiếng nào có âm r hoặc s thì bé vỗ tay một cái, không có thì ngồi im. Sau năm lượt đổi vai, bé đọc để bố mẹ vỗ tay.","bm":"Miền Nam hay đọc r gần như g và s như x. Khi đọc s bé uốn lưỡi lên; đây là cặp hay sai chính tả nhất về sau, nên nhớ mặt chữ từ bây giờ."},{"id":"tv1-22","tap":1,"tuan":6,"ten":"Bài 22. T t Tr tr","loai":"am","am":["t","tr"],"tieng":["tô","tủ","tổ","tre","trê","trà"],"tu":[{"w":"quả táo","e":"🍎"},{"w":"tôm","e":"🦐"},{"w":"tay","e":"✋"},{"w":"cây tre","e":"🎋"},{"w":"cái trống","e":"🥁"},{"w":"quả trứng","e":"🥚"}],"cau":"Bà để trà ở tủ.","doc":"","hoi":[{"q":"Từ nào có âm t?","o":["phô mai","ngọn nến","quả táo"],"a":2},{"q":"Từ nào có âm tr?","o":["hoa huệ","cây tre","cú mèo"],"a":1}],"viet":"t, tr, tổ, tre","choi":"Đi tìm đồ vật: bé đi quanh nhà tìm ba đồ vật hoặc tranh ảnh có tên chứa âm t hoặc tr, ví dụ quả táo, mang về và đọc to tên từng thứ.","bm":"tr đọc uốn lưỡi, ch đọc thẳng lưỡi. Bé hay viết 'che' thay vì 'tre', cho bé xem ảnh cây tre để gắn chữ với vật."},{"id":"tv1-23","tap":1,"tuan":6,"ten":"Bài 23. Th th ia","loai":"am","am":["th","ia"],"tieng":["thỏ","thư","thợ","mía","tía","đĩa"],"tu":[{"w":"thỏ","e":"🐇"},{"w":"thuyền","e":"⛵"},{"w":"cái thìa","e":"🥄"},{"w":"cái đĩa","e":"🍽️"},{"w":"chìa khoá","e":"🔑"},{"w":"lá thư","e":"✉️"}],"cau":"Bé lấy thìa và đĩa cho bà.","doc":"","hoi":[{"q":"Từ nào có vần ia?","o":["đôi đũa","cái thìa","huân chương"],"a":1},{"q":"Từ nào có âm th?","o":["thỏ","cơn mưa","quả xoài"],"a":0}],"viet":"th, ia, thỏ, lá mía","choi":"Bắt bóng: bố mẹ tung quả bóng và nói một tiếng; tiếng có âm th hoặc ia thì bé bắt bóng, không có thì để bóng rơi.","bm":"th đọc 'thờ' có bật hơi. ia đọc liền, nhấn ở i như trong 'lá mía', không tách thành hai tiếng."},{"id":"tv1-24","tap":1,"tuan":6,"ten":"Bài 24. ua ưa","loai":"am","am":["ua","ưa"],"tieng":["cua","rùa","mua","mưa","dưa","cửa"],"tu":[{"w":"cua","e":"🦀"},{"w":"rùa","e":"🐢"},{"w":"vua","e":"👑"},{"w":"mưa","e":"🌧️"},{"w":"dưa hấu","e":"🍉"},{"w":"ngựa","e":"🐴"}],"cau":"Mẹ đi chợ mua cua.","doc":"","hoi":[{"q":"Từ nào có vần ua?","o":["cua","trăng","cá mập"],"a":0},{"q":"Từ nào có vần ưa?","o":["dê","người tuyết","mưa"],"a":2}],"viet":"ua, ưa, cua, ngựa","choi":"Viết lên lưng: bố mẹ dùng ngón tay viết vần ua lên lưng bé, bé đoán đúng thì đọc một từ có vần ua như cua, rồi đổi vai.","bm":"ua đọc nhấn ở u, ưa nhấn ở ư. Lưu ý 'qua', 'quả' không thuộc vần ua mà là qu ghép với a."},{"id":"tv1-25","tap":1,"tuan":6,"ten":"Bài 25. Ôn tập và kể chuyện","loai":"ke-chuyen","am":["r","s","t","tr","th","ia","ua","ưa"],"tieng":["rổ","sẻ","tre","thỏ","mía","mưa"],"tu":[{"w":"rùa","e":"🐢"},{"w":"sóc","e":"🐿️"},{"w":"quả táo","e":"🍎"},{"w":"quả trứng","e":"🥚"},{"w":"thỏ","e":"🐇"},{"w":"mưa","e":"🌧️"}],"cau":"Trời mưa, thỏ ở nhà.","doc":"Kể chuyện: Chó sói và cừu non. Cừu non mải ăn cỏ nên tụt lại sau đàn và gặp chó sói. Cừu bình tĩnh xin được hát một bài trước, rồi kêu thật to. Bác chăn cừu nghe thấy liền chạy đến cứu cừu non.","hoi":[{"q":"Cừu non gặp ai khi tụt lại sau đàn?","o":["Chú thỏ","Bác voi","Chó sói"],"a":2},{"q":"Ai đã cứu cừu non?","o":["Đàn cừu","Bác chăn cừu","Chú chó nhà bên"],"a":1}],"viet":"rổ, tre, mưa","choi":"Diễn kịch nhỏ: bé và bố mẹ mỗi người nhận một vai trong câu chuyện, dùng thú bông làm nhân vật và diễn lại trong năm phút.","bm":"Nhân câu chuyện, dặn bé khi đi chơi phải đi cùng bố mẹ, không đi lẻ một mình."},{"id":"tv1-26","tap":1,"tuan":7,"ten":"Bài 26. Ph ph Qu qu","loai":"am","am":["ph","qu"],"tieng":["phố","phở","pha","quả","quê","quạ"],"tu":[{"w":"phở","e":"🍜"},{"w":"pháo hoa","e":"🎆"},{"w":"phô mai","e":"🧀"},{"w":"quà","e":"🎁"},{"w":"quần","e":"👖"},{"w":"quả bóng","e":"⚽"}],"cau":"Bà cho bé quà quê.","doc":"","hoi":[{"q":"Từ nào có âm qu?","o":["sóc","quà","nải chuối"],"a":1},{"q":"Từ nào có âm ph?","o":["phở","ruộng bậc thang","kì đà"],"a":0}],"viet":"ph, qu, phố, quả","choi":"Ghép thẻ chữ: viết các chữ đã học ra thẻ giấy, bé ghép thành tiếng như phố, phở, đọc to rồi đố bố mẹ đọc theo.","bm":"ph đọc 'phờ', răng trên chạm môi dưới; qu đọc 'quờ' và q luôn đi cùng u. Bé hay viết thiếu u sau q."},{"id":"tv1-27","tap":1,"tuan":7,"ten":"Bài 27. V v X x","loai":"am","am":["v","x"],"tieng":["vó","vẽ","vở","xe","xô","xa"],"tu":[{"w":"voi","e":"🐘"},{"w":"vịt","e":"🦆"},{"w":"vở","e":"📒"},{"w":"xe đạp","e":"🚲"},{"w":"xoài","e":"🥭"},{"w":"xương","e":"🦴"}],"cau":"Bé vẽ voi và xe.","doc":"","hoi":[{"q":"Từ nào có âm v?","o":["voi","áo sơ mi","bút chì"],"a":0},{"q":"Từ nào có âm x?","o":["nhịp trống","cánh buồm","xe đạp"],"a":2}],"viet":"v, x, vở, xe","choi":"Ai nhanh hơn: bày các hình trong bài lên bàn, bố mẹ đọc một từ, bé chỉ đúng hình thật nhanh; đúng năm lần được một ngôi sao.","bm":"v đọc 'vờ', răng trên chạm môi dưới; x đọc 'xờ'. Người miền Nam hay đọc v giống d, bố mẹ phát âm mẫu thật rõ."},{"id":"tv1-28","tap":1,"tuan":7,"ten":"Bài 28. Y y","loai":"am","am":["y"],"tieng":["y","ý","ly","quý"],"tu":[{"w":"y tá","e":"👩‍⚕️"},{"w":"chú ý","e":"⚠️"},{"w":"cái ly","e":"🥤"},{"w":"đá quý","e":"💎"},{"w":"ý tưởng","e":"💡"}],"cau":"Chị y tá dặn bé chú ý giữ ấm.","doc":"","hoi":[{"q":"Từ nào có âm y?","o":["đôi dép","viên thuốc","y tá"],"a":2}],"viet":"y, y tá","choi":"Nặn chữ: bé nặn đất nặn hoặc xếp que tính thành âm y, rồi kể một từ có âm y; mỗi từ kể đúng được nặn thêm một chữ.","bm":"y dài đứng một mình làm tiếng như 'y tá', 'ý'; i ngắn thường đi sau phụ âm như 'bi', 'kì'. Bé chưa cần thuộc hết quy tắc, chỉ cần nhận mặt chữ."},{"id":"tv1-29","tap":1,"tuan":7,"ten":"Bài 29. Luyện tập chính tả","loai":"on-tap","am":["c","k","g","gh","ng","ngh"],"tieng":["cá","kẻ","gà","ghế","ngõ","nghé"],"tu":[{"w":"cá","e":"🐟"},{"w":"que kem","e":"🍦"},{"w":"gà","e":"🐔"},{"w":"ghế","e":"🪑"},{"w":"ngựa","e":"🐴"},{"w":"nghé","e":"🐃"}],"cau":"Bé kê ghế cho bà ngồi nghỉ.","doc":"","hoi":[{"q":"Từ nào có âm g?","o":["hà mã","gà","số tám"],"a":1},{"q":"Từ nào có âm ngh?","o":["nghé","đoàn tàu","màu xanh"],"a":0}],"viet":"kẻ, ghế, nghé","choi":"Nhảy ô: kẻ các ô trên sàn, mỗi ô ghi một âm trong bài (c, k, g, gh); bố mẹ đọc từ nào, bé nhảy vào ô có âm của từ đó.","bm":"Ôn quy tắc: k, gh, ngh đi với e, ê, i; c, g, ng đi với các chữ còn lại. Bé viết sai thì cho bé tự soát bằng quy tắc thay vì sửa giúp."},{"id":"tv1-30","tap":1,"tuan":7,"ten":"Bài 30. Ôn tập và kể chuyện","loai":"ke-chuyen","am":["ph","qu","v","x","y"],"tieng":["phố","quả","vở","xe","ý"],"tu":[{"w":"phở","e":"🍜"},{"w":"quà","e":"🎁"},{"w":"voi","e":"🐘"},{"w":"xe đạp","e":"🚲"},{"w":"y tá","e":"👩‍⚕️"},{"w":"vịt","e":"🦆"}],"cau":"Bố chở bé đi phố xem voi.","doc":"Kể chuyện về dế mèn và đàn kiến. Suốt mùa ấm, dế mèn chỉ mải hát chơi, còn đàn kiến chăm chỉ tha mồi về tổ. Mùa đông đến, dế hết cái ăn phải sang xin kiến, bác kiến khuyên dế phải chăm làm. Sang xuân, dế cùng đàn kiến đi kiếm mồi.","hoi":[{"q":"Mùa ấm, đàn kiến làm gì?","o":["Chăm chỉ tha mồi","Hát chơi cả ngày","Xây tổ mới"],"a":0},{"q":"Câu chuyện khuyên em điều gì?","o":["Phải biết hát hay","Phải biết xin giúp đỡ","Phải chăm chỉ làm việc"],"a":2}],"viet":"phố, quả, vở","choi":"Kể nối tiếp: bố mẹ kể câu đầu, bé kể câu tiếp theo, cứ thế đến hết chuyện; ai quên thì được xem lại tranh gợi ý.","bm":"Gợi ý bé kể lại bằng giọng từng nhân vật: dế mèn vui vẻ, bác kiến ân cần. Đổi giọng giúp bé hứng thú và nhớ trình tự."},{"id":"tv1-31","tap":1,"tuan":8,"ten":"Bài 31. an ăn ân","loai":"van","am":["an","ăn","ân"],"tieng":["bàn","lan","chăn","khăn","cân","sân"],"tu":[{"w":"cây đàn","e":"🎸"},{"w":"bạn bè","e":"👫"},{"w":"khăn","e":"🧣"},{"w":"ăn cơm","e":"🍚"},{"w":"cái cân","e":"⚖️"},{"w":"cần câu","e":"🎣"}],"cau":"Bé quàng khăn đi ra sân.","doc":"","hoi":[{"q":"Từ nào có vần an?","o":["con tôm","đèn","cây đàn"],"a":2},{"q":"Từ nào có vần ăn?","o":["cá mập","khăn","đồng hồ"],"a":1}],"viet":"an, ăn, ân, cái cân","choi":"Săn tiếng: bố mẹ đọc chậm từng từ, nghe tiếng nào có vần an, ăn hoặc ân thì bé vỗ tay một cái, không có thì ngồi im. Sau năm lượt đổi vai, bé đọc để bố mẹ vỗ tay.","bm":"a, ă, â khác nhau ở dấu phụ: ă có hình trăng khuyết, â có mũ. Miền Nam hay đọc an như ang, bố mẹ đọc rõ chữ n cuối, lưỡi chạm răng."},{"id":"tv1-32","tap":1,"tuan":8,"ten":"Bài 32. on ôn ơn","loai":"van","am":["on","ôn","ơn"],"tieng":["con","nón","chồn","thôn","sơn","lợn"],"tu":[{"w":"nón lá","e":"👒"},{"w":"ngọn nến","e":"🕯️"},{"w":"bồn tắm","e":"🛁"},{"w":"cơn mưa","e":"🌧️"},{"w":"con lợn","e":"🐷"},{"w":"hộp sơn","e":"🎨"}],"cau":"Mẹ mua cho bé cái nón mới.","doc":"","hoi":[{"q":"Từ nào có vần on?","o":["sinh nhật","nón lá","cái rìu"],"a":1},{"q":"Từ nào có vần ôn?","o":["bồn tắm","khỉ","biển"],"a":0}],"viet":"on, ôn, ơn, con chồn","choi":"Đi tìm đồ vật: bé đi quanh nhà tìm ba đồ vật hoặc tranh ảnh có tên chứa vần on, ôn hoặc ơn, ví dụ nón lá, mang về và đọc to tên từng thứ.","bm":"on, ôn, ơn chỉ khác nhau ở chữ đầu vần; cho bé đọc cả dãy 'con, côn, cơn' để tai phân biệt."},{"id":"tv1-33","tap":1,"tuan":8,"ten":"Bài 33. en ên in un","loai":"van","am":["en","ên","in","un"],"tieng":["kèn","sen","nến","tên","pin","giun"],"tu":[{"w":"cái kèn","e":"🎺"},{"w":"bóng đèn","e":"💡"},{"w":"cuộn len","e":"🧶"},{"w":"ngọn nến","e":"🕯️"},{"w":"cục pin","e":"🔋"},{"w":"số chín","e":"9️⃣"}],"cau":"Đèn hết pin, mẹ thắp nến.","doc":"","hoi":[{"q":"Từ nào có vần ên?","o":["ngọn nến","ngựa","cà rốt"],"a":0},{"q":"Từ nào có vần en?","o":["huy hiệu","chó","cái kèn"],"a":2}],"viet":"en, ên, in, un","choi":"Bắt bóng: bố mẹ tung quả bóng và nói một tiếng; tiếng có vần en, ên, in hoặc un thì bé bắt bóng, không có thì để bóng rơi.","bm":"Bốn vần đều kết thúc bằng n; bé dễ đọc en thành eng. Đọc mẫu thật chậm, kéo dài âm n ở cuối."},{"id":"tv1-34","tap":1,"tuan":8,"ten":"Bài 34. am ăm âm","loai":"van","am":["am","ăm","âm"],"tieng":["cam","tám","tằm","chăm","nấm","mâm"],"tu":[{"w":"quả cam","e":"🍊"},{"w":"số tám","e":"8️⃣"},{"w":"con tằm","e":"🐛"},{"w":"nấm","e":"🍄"},{"w":"cái đầm","e":"👗"},{"w":"ngắm trăng","e":"🌕"}],"cau":"Mẹ hái nấm, bé hái cam.","doc":"","hoi":[{"q":"Từ nào có vần ăm?","o":["hươu cao cổ","mèo","con tằm"],"a":2},{"q":"Từ nào có vần am?","o":["thỏ","quả cam","trái tim"],"a":1}],"viet":"am, ăm, âm, quả cam","choi":"Viết lên lưng: bố mẹ dùng ngón tay viết vần am lên lưng bé, bé đoán đúng thì đọc một từ có vần am như quả cam, rồi đổi vai.","bm":"Vần có m cuối thì môi khép lại khi kết thúc; cho bé đặt ngón tay lên môi để cảm nhận."},{"id":"tv1-35","tap":1,"tuan":8,"ten":"Bài 35. Ôn tập và kể chuyện","loai":"ke-chuyen","am":["an","ăn","ân","on","ôn","ơn","en","ên","in","un","am","ăm","âm"],"tieng":["bàn","khăn","con","đèn","pin","cam"],"tu":[{"w":"khăn","e":"🧣"},{"w":"nón lá","e":"👒"},{"w":"bóng đèn","e":"💡"},{"w":"cục pin","e":"🔋"},{"w":"quả cam","e":"🍊"},{"w":"nấm","e":"🍄"}],"cau":"Gà và vịt là đôi bạn thân.","doc":"Kể chuyện về đôi bạn gà và vịt. Ngày nào gà và vịt cũng rủ nhau qua sông kiếm ăn. Có hôm nước dâng cao, gà không qua được, vịt liền cõng gà qua sông. Cảm động trước tấm lòng của bạn, gà ấp trứng giúp vịt.","hoi":[{"q":"Khi nước dâng cao, vịt đã làm gì?","o":["Gọi bác trâu đến giúp","Cõng gà qua sông","Bơi đi kiếm ăn một mình"],"a":1},{"q":"Gà giúp lại vịt bằng cách nào?","o":["Ấp trứng giúp vịt","Tìm thóc cho vịt ăn","Gáy gọi vịt dậy sớm"],"a":0}],"viet":"bạn, cam, đèn","choi":"Kể chuyện bằng tranh: bố mẹ vẽ nhanh bốn tranh của câu chuyện ra giấy rồi xáo trộn; bé xếp lại đúng thứ tự và kể theo từng tranh.","bm":"Khen bé mỗi khi bé biết nói lời cảm ơn trong ngày, giống như gà nhớ ơn vịt."},{"id":"tv1-36","tap":1,"tuan":9,"ten":"Bài 36. om ôm ơm","loai":"van","am":["om","ôm","ơm"],"tieng":["đom","chòm","tôm","nồm","cơm","rơm"],"tu":[{"w":"con tôm","e":"🦐"},{"w":"bát cơm","e":"🍚"},{"w":"đống rơm","e":"🌾"},{"w":"ôm","e":"🤗"},{"w":"chòm sao","e":"✨"},{"w":"thơm","e":"🌸"}],"cau":"Nồi cơm chín, thơm phức.","doc":"","hoi":[{"q":"Từ nào có vần ơm?","o":["bát cơm","luỹ tre","cái chổi"],"a":0},{"q":"Từ nào có vần ôm?","o":["con chim","cây vợt","con tôm"],"a":2}],"viet":"om, ôm, ơm, con tôm","choi":"Ghép thẻ chữ: viết các chữ đã học ra thẻ giấy, bé ghép thành tiếng như đom, chòm, đọc to rồi đố bố mẹ đọc theo.","bm":"om, ôm, ơm đều khép môi ở cuối. Bé dễ đọc 'cơm' thành 'côm', nhắc bé ơ có râu."},{"id":"tv1-37","tap":1,"tuan":9,"ten":"Bài 37. em êm im um","loai":"van","am":["em","êm","im","um"],"tieng":["kem","tem","đêm","nệm","chim","chùm"],"tu":[{"w":"que kem","e":"🍦"},{"w":"ban đêm","e":"🌃"},{"w":"con chim","e":"🐦"},{"w":"con nhím","e":"🦔"},{"w":"trái tim","e":"❤️"},{"w":"chùm nho","e":"🍇"}],"cau":"Đêm về, chim nhỏ ngủ im.","doc":"","hoi":[{"q":"Từ nào có vần êm?","o":["máy bay","con sói","ban đêm"],"a":2},{"q":"Từ nào có vần em?","o":["sư tử","que kem","chuối"],"a":1}],"viet":"em, êm, im, um","choi":"Ai nhanh hơn: bày các hình trong bài lên bàn, bố mẹ đọc một từ, bé chỉ đúng hình thật nhanh; đúng năm lần được một ngôi sao.","bm":"Bé hay nhầm êm với em và um với ôm; đọc chậm từng cặp: kem và đêm, chùm và tôm."},{"id":"tv1-38","tap":1,"tuan":9,"ten":"Bài 38. ai ay ây","loai":"van","am":["ai","ay","ây"],"tieng":["tai","mai","tay","máy","mây","cây"],"tu":[{"w":"cái tai","e":"👂"},{"w":"con nai","e":"🦌"},{"w":"bàn tay","e":"✋"},{"w":"máy bay","e":"✈️"},{"w":"đám mây","e":"☁️"},{"w":"cái cây","e":"🌳"}],"cau":"Máy bay bay qua đám mây.","doc":"","hoi":[{"q":"Từ nào có vần ai?","o":["lướt sóng","cái tai","bóng"],"a":1},{"q":"Từ nào có vần ây?","o":["đám mây",
