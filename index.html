lượng rồi đếm lại để kiểm tra, đếm cách 2, số chẵn, số lẻ. Phần chục và đơn vị gần với bài số có hai chữ số trong nước, hai chương trình hỗ trợ nhau tốt.","lessons":[{"id":"m1-09a","en":"Counting and estimating to 20","vi":"Đếm và ước lượng đến 20","goals":[["I can count objects to 20.","Bé đếm được đồ vật đến 20."],["I can estimate how many, then check by counting.","Bé đoán số lượng rồi đếm để kiểm tra."]],"words":[["estimate","ước lượng"],["guess","đoán"],["check","kiểm tra"],["twenty","hai mươi"]],"gen":[{"k":"dem","max":20}],"say":[["Guess how many, then count.","Đoán xem có bao nhiêu rồi đếm lại."],["Count back from 20.","Đếm lùi từ 20."]],"choi":"Đoán hũ kẹo: cho một nắm kẹo vào hũ trong, cả nhà ghi số đoán, sau đó bé đổ ra đếm. Ai đoán gần nhất được chọn kẹo trước.","bm":"Ước lượng không cần đúng ngay; khen bé khi số đoán gần với số thật, đó mới là kỹ năng cần luyện."},{"id":"m1-09b","en":"Tens and ones","vi":"Chục và đơn vị","goals":[["I can make numbers from 10 to 20 with a ten and some ones.","Bé tạo số từ 10 đến 20 bằng một chục và các đơn vị."]],"words":[["ten","một chục"],["ones","đơn vị"],["teen numbers","các số mười mấy"],["make","tạo thành"]],"gen":[{"k":"chucdv","max":20},{"k":"tachgop","max":20}],"say":[["14 is 1 ten and 4 ones.","14 gồm 1 chục và 4 đơn vị."],["Make 17 with tens and ones.","Tạo số 17 bằng chục và đơn vị."]],"choi":"Bó que tính: bé bó 10 que bằng dây chun thành một chục, bố mẹ đọc số, bé lấy một bó và thêm que lẻ cho đúng số.","bm":"Thirteen đến nineteen trong tiếng Anh đọc hàng đơn vị trước (six-teen), ngược với tiếng Việt (mười sáu); bé viết nhầm 61 thay vì 16 thì nhắc đây là lý do."},{"id":"m1-09c","en":"Order, odd and even","vi":"Thứ tự, số chẵn và số lẻ","goals":[["I can compare and order numbers to 20.","Bé so sánh và sắp xếp được các số đến 20."],["I can count in twos and know odd and even numbers.","Bé đếm cách 2 và nhận ra số chẵn, số lẻ."]],"words":[["odd","số lẻ"],["even","số chẵn"],["count in twos","đếm cách 2"],["between","ở giữa"],["more than","lớn hơn"]],"gen":[{"k":"sosanh","max":20},{"k":"thutu","max":20},{"k":"chan_le","max":20}],"say":[["Count in twos: 2, 4, 6...","Đếm cách 2: 2, 4, 6..."],["Is 7 odd or even?","7 là số lẻ hay số chẵn?"],["Which number is between 12 and 14?","Số nào nằm giữa 12 và 14?"]],"choi":"Đôi tất: đếm tất trong giỏ đồ theo từng đôi two, four, six; chiếc nào thừa ra không có đôi thì số đó là số lẻ.","bm":"Số chẵn là số chia được thành từng cặp không thừa; cho bé xếp đồ vật thành cặp sẽ hiểu ngay mà không cần thuộc định nghĩa."}]},{"id":"m1-10","en":"Working with numbers to 20","vi":"Làm tính với các số đến 20","tuan":"22-24","note":"Đây là chỗ khác lớn nhất. Toán 1 trong nước cộng, trừ không nhớ trong phạm vi 100 (ví dụ 23 + 14), còn Cambridge cộng, trừ trong phạm vi 20 có cả qua 10 (8 + 5 = 13), là nội dung lớp 2 trong nước. Cambridge thêm nhân đôi và nhận biết tiền; tiền Việt Nam trong nước học ở lớp 2.","lessons":[{"id":"m1-10a","en":"Adding and subtracting to 20","vi":"Cộng, trừ trong phạm vi 20","goals":[["I can add and subtract with answers to 20.","Bé cộng, trừ được với kết quả đến 20."],["I can use 10 to help me add.","Bé tách số để cộng qua 10 (8 + 5 = 8 + 2 + 3)."]],"words":[["add","cộng"],["subtract","trừ"],["equals","bằng"],["number line","tia số"],["how many more","nhiều hơn bao nhiêu"]],"gen":[{"k":"cong","max":20},{"k":"tru","max":20},{"k":"congtru","max":20},{"k":"toan_loi","max":20}],"say":[["8 add 5 equals what?","8 cộng 5 bằng mấy?"],["15 take away 3 is?","15 bớt 3 còn mấy?"],["Jump along the number line.","Nhảy dọc theo tia số."]],"choi":"Tia số trên sàn: dán băng dính ghi số 0 đến 20 dọc hành lang, bố mẹ đọc phép tính, bé đứng ở số đầu rồi nhảy thêm hoặc lùi lại cho đúng.","bm":"Khi cộng qua 10, gợi ý bé làm tròn 10 trước (8 cần thêm 2 để thành 10), dùng lại cặp số bằng 10 đã thuộc ở Unit 2."},{"id":"m1-10b","en":"Doubles","vi":"Gấp đôi","goals":[["I know doubles up to double 10.","Bé thuộc phép gấp đôi đến 10 + 10."]],"words":[["double","gấp đôi"],["same","giống nhau"],["twice","hai lần"]],"gen":[{"k":"cong","max":20}],"say":[["Double 4 is 8.","Gấp đôi 4 là 8."],["What is double 6?","Gấp đôi 6 là mấy?"]],"choi":"Gương thần: bé đặt vài hạt đậu trước chiếc gương nhỏ, đếm số hạt cả thật lẫn trong gương và nói Double three is six!","bm":"Gấp đôi là phép cộng hai số giống nhau; thuộc gấp đôi giúp bé tính nhanh 6 + 7 bằng gấp đôi 6 thêm 1."},{"id":"m1-10c","en":"Money","vi":"Tiền","goals":[["I can recognise the money we use.","Bé nhận biết các tờ tiền Việt Nam thường dùng."]],"words":[["money","tiền"],["coin","đồng xu"],["note","tờ tiền"],["buy","mua"],["how much","bao nhiêu tiền"]],"gen":[{"k":"tien"}],"say":[["How much is it?","Món này giá bao nhiêu?"],["Which note is this?","Đây là tờ tiền nào?"]],"choi":"Cửa hàng tạp hóa: dán giá 1 nghìn, 2 nghìn, 5 nghìn, 10 nghìn lên đồ chơi, bé dùng tiền thật mệnh giá nhỏ để mua và đọc tên tờ tiền.","bm":"Sách Cambridge chỉ yêu cầu nhận biết tiền nước mình đang dùng, nên bố mẹ dạy bằng tiền Việt Nam, chưa cần đổi tiền thừa."}]},{"id":"m1-11","en":"Geometry (2)","vi":"Hình học (phần 2)","tuan":"25-26","note":"Ôn và mở rộng hình phẳng, hình khối. Phần xoay hình xem có giống như cũ không là nội dung Cambridge thêm, chuẩn bị cho đối xứng ở lớp trên. Trong nước có bài lắp ghép, xếp hình, bổ trợ tốt cho phần này.","lessons":[{"id":"m1-11a","en":"Sorting shapes","vi":"Phân loại hình theo đặc điểm","goals":[["I can sort shapes by sides, corners and faces.","Bé phân loại hình theo số cạnh, số góc, số mặt."]],"words":[["corner","góc, đỉnh"],["edge","cạnh (của khối)"],["face","mặt"],["curved","cong"],["flat","phẳng"]],"gen":[{"k":"hinhphang"},{"k":"hinhkhoi"}],"say":[["Which shapes have 4 sides?","Những hình nào có 4 cạnh?"],["Has it got a curved face?","Khối này có mặt cong không?"]],"choi":"Túi bí ẩn: bỏ vài hình khối vào túi vải, bé thò tay sờ, tả bằng tiếng Anh It's got flat faces, it's got 8 corners rồi đoán tên trước khi lấy ra.","bm":"Khối lập phương có 6 mặt, ụ đo: bé tìm trong nhà cân sức khỏe, thước dây, ca đong, nhiệt kế, đặt cạnh nhau và nói mỗi thứ dùng để đo gì.","bm":"Chưa cần đọc chính xác số trên cân hay nhiệt kế, chỉ cần bé thấy các vạch số và biết cái nào dùng cho việc gì."}]},{"id":"m1-14","en":"Position, direction and patterns","vi":"Vị trí, hướng đi và quy luật","tuan":"31-32","note":"Mở rộng phần vị trí: đi theo chỉ dẫn tiến, lùi, rẽ trái, rẽ phải. Phần tìm quy luật của dãy hình, dãy đồ vật là điểm Cambridge chú trọng; trong nước có dạng điền số còn thiếu trong dãy, hai bên bổ trợ nhau.","lessons":[{"id":"m1-14a","en":"Directions and turns","vi":"Hướng đi và quay","goals":[["I can follow and give directions.","Bé đi theo chỉ dẫn và tự chỉ đường được cho người khác."]],"words":[["forwards","tiến lên"],["backwards","lùi lại"],["turn left","rẽ trái"],["turn right","rẽ phải"],["step","bước"]],"gen":[{"k":"vitri"}],"say":[["Go forwards 3 steps.","Tiến lên 3 bước."],["Turn right.","Rẽ phải."]],"choi":"Rô-bốt nghe lời: bố mẹ làm rô-bốt bị bịt mắt, bé đọc lệnh Forwards 2 steps! Turn left! để dẫn rô-bốt tới chỗ giấu kẹo.","bm":"Khi đứng đối diện bé, trái phải của bố mẹ ngược với của bé; nên đứng cùng hướng với bé khi tập."},{"id":"m1-14b","en":"Patterns","vi":"Quy luật","goals":[["I can continue a pattern of objects or numbers.","Bé tiếp tục được một dãy đồ vật hoặc dãy số theo quy luật."],["I can make my own pattern.","Bé tự tạo được một dãy có quy luật."]],"words":[["pattern","quy luật, mẫu lặp"],["next","tiếp theo"],["repeat","lặp lại"],["sequence","dãy"]],"gen":[{"k":"thutu","max":20}],"say":[["What comes next?","Tiếp theo là gì?"],["Red, blue, red, blue... what next?","Đỏ, xanh, đỏ, xanh... tiếp theo là màu gì?"]],"choi":"Vòng hạt quy luật: bé xâu hạt hoặc xếp lego theo mẫu đỏ, đỏ, vàng, đỏ, đỏ, vàng; bố mẹ cố tình xếp sai một hạt để bé tìm chỗ sai.","bm":"Hỏi bé Tell me the rule (quy luật là gì) để bé nói thành lời, việc nói ra quy luật quan trọng hơn chỉ xếp đúng."}]},{"id":"m1-15","en":"Time (2)","vi":"Thời const KEY = 'bingoLop1.v1';
const Store = {
  mem: null,
  load() {
    let raw = null;
    try { raw = window.localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (!raw && this.mem) raw = this.mem;
    try { return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  },
  save(obj) {
    const raw = JSON.stringify(obj);
    this.mem = raw;
    try { window.localStorage.setItem(KEY, raw); return true; } catch (e) { return false; }
  }
};
const DEF = () => ({ v: 1, profiles: [], cur: null, set: { rate: 0.85, vi: '', en: '', sfx: true } });

const Sync = {

  on() { const a = this.acct(); return !!(window.FB && FB.ok && a && a.rt && a.uid); },
  async token() { if (this.tk && Date.now() - this.at < 40 * 60e3) return this.tk; const a = this.acct(); const r = await FB.auth.refresh(a.rt); a.rt = r.refreshToken || a.rt; try { localStorage.setItem('gh:acct', JSON.stringify(a)); } catch (e) {} this.tk = r.idToken; this.at = Date.now(); return this.tk; },
  later() { if (!this.on()) return; clearTimeout(this.tm); this.tm = setTimeout(() => this.push(), 4000); },
  async push() { if (!this.on()) return; try { const a = this.acct(); await FB.fs.commit([{ merge: 'progress/' + a.uid, data: { d: { bingo: { s: JSON.stringify(S), t: S.t || Date.now() } }, at: new Date() }, mask: ['d.bingo', 'at'] }], await this.token()); } catch (e) {} },
  async pull() { if (!this.on()) return false; try { const a = this.acct(); const d = await FB.fs.get('progress/' + a.uid, await this.token()); const b = d && d.d && d.d.bingo; if (!b || !b.s) { this.push(); return false; }
      if ((+b.t || 0) > (S.t || 0)) { const R = JSON.parse(b.s); if (R && Array.isArray(R.profiles)) { S = R; Store.save(S); return true; } } else if ((S.t || 0) > (+b.t || 0)) this.push(); } catch (e) {} return false; }
};

/* Tiếng Anh cùng Bingo: app riêng, mở trong khung toàn màn hình; bản trên trang có đăng nhập tải app_vui.bin và giải mã bằng khoá tài khoản */
let vuiHTML = null;
async function vuiLoad() {
  if (vuiHTML) return vuiHTML;
  if (!/^https?:/.test(location.protocol)) return null;
  const a = Sync.acct(); const hk = a && a.keys && a.keys.hub;
  if (!hk) { const r = await fetch('vui.html'); if (!r.ok) return null; vuiHTML = await r.text(); return vuiHTML; }
  const raw = Uint8Array.from(atob(hk), c => c.charCodeAt(0));
  const b = await (await fetch('app_vui.bin')).arrayBuffer();
  const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const p = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(b, 0, 12) }, k, new Uint8Array(b, 12));
  vuiHTML = await new Response(new Blob([p]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return vuiHTML;
}

/* Tiếng Việt: nghe và chọn */
function tvNgheMaker(u) {
  const near = TV.units.slice(Math.max(0, u._i - 4), u._i + 5);
  const nearTu = []; near.forEach(x => x.tu.forEach(w => { if (!nearTu.some(y => y.w === w.w || y.e === w.e)) nearTu.push(w); }));
  const nearTieng = uniq(near.flatMap(x => x.tieng));
  const qTu = shuffle(u.tu), qTg = shuffle(u.tieng);
  let a = 0, b = 0;
  return i => {
    const useTu = (i % 2 === 0 && qTu.length) || !qTg.length;
    if (useTu) {
      const t = qTu[a++ % qTu.length];
      const ds = shuffle(u.tu.filter(x => x.w !== t.w && x.e !== t.e)).concat(shuffle(nearTu.filter(x => x.w !== t.w && x.e !== t.e)));
      const pickD = []; for (const d of ds) { if (pickD.length >= 2) break; if (!pickD.some(y => y.e === d.e || y.w === d.w)) pickD.push(d); }
      return { t: T('Bé nghe rồi chạm vào hình đúng nhé.', ''), speak: [{ t: 'Tìm từ:', lang: 'vi' }, { t: t.w, lang: 'vi', rate: 0.75 }], opts: shuffle([t, ...pickD]).map(x => O(x.w, `<span class="emo">${x.e}</span><span class="wl">${esc(x.w)}</span>`, null, 'col')), a: t.w, lay: 'pic', hint: T(`Nghe kĩ nhé: ${t.w}.`, '') };
    }
    const t = qTg[b++ % qTg.length];
    const ds = shuffle(u.tieng.filter(x => x !== t)).concat(shuffle(nearTieng.filter(x => x !== t && !u.tieng.includes(x))));

  };
}

/* ===================== Kết quả ===================== */

  const p = prof(), before = stickerCount(p);
  const gain = gainStars(p, cfg.it.id + '|' + cfg.mode, stars);
  if (stars) { const d = p.done[cfg.it.id] || (p.done[cfg.it.id] = { b: {}, t: 0 }); d.b[cfg.mode] = Math.max(d.b[cfg.mode] || 0, stars); d.t = Date.now(); }
  p.log.unshift({ id: cfg.it.id, s: cfg.subj, m: cfg.mode, st: stars, c: correct, n: total, t: Date.now(), f: ex.fast || 0 });
  p.log = p.log.slice(0, 80);

  CUR = null;
  const head = stars === 3 ? `Tuyệt vời, ${esc(p.name)}!` : stars === 2 ? `Giỏi lắm, ${esc(p.name)}!` : stars === 1 ? `${esc(p.name)} đã cố gắng rồi!` : `Mình chơi lại nhé, ${esc(p.name)}!`;
  const hasty = (ex.fast || 0) >= 3;

  const ov = document.createElement('div');

    <p>${cfg.mode === 'to' ? `Bé tô đẹp ${correct}/${total} chữ.` : `Bé làm đúng ngay ${correct}/${total} ${cfg.mode === 'match' ? 'cặp' : 'câu'}.`} Bé có tất cả ${p.stars} ngôi sao.</p>${note ? `<p class="small" style="margin-top:0">${note}</p>` : ''}
    ${stk ? `<span class="stk emo">${stk}</span><p style="margin-top:0"><b>Nhãn dán mới cho bé!</b></p>` : ''}
    <div class="row"><button class="btn block" data-act="again"><span class="emo">🔁</span> Chơi lại</button><button class="btn soft block" data-act="back">Về bài học</button><button class="btn white block" data-act="home"><span class="emo">🏠</span> Trang chủ</button></div></div>`;
  document.body.appendChild(ov);
  if (stars) { confetti(); Sfx.win(); }
  const vi = stars ? `${pick(['Giỏi quá', 'Tuyệt vời', 'Hoan hô'])}, ${p.name}! Bé được ${stars} ngôi sao.${stk ? ' Bé có thêm một nhãn dán mới!' : ''}${stars === 1 ? ' Mình chơi lại để được nhiều sao hơn nhé!' : ''}${hasty ? ' Lần sau bé nghe hết câu hỏi rồi mới chọn nhé.' : ''}` : `${p.name} ơi, lần này bé chưa được sao. ${hasty ? 'Bé chạm hơi vội. Bé nghe hết câu hỏi rồi mới chọn nhé.' : 'Bé xem lại bài rồi chơi lại nhé.'}`;
  const parts = (cfg.subj === 'eng' || cfg.subj === 'maths') && stars ? [{ t: `Well done, ${p.name}!`, lang: 'en' }, { t: vi, lang: 'vi' }] : [{ t: vi, lang: 'vi' }];

/* ===================== Match the picture ===================== */
function runMatch(u) {
  const words = shuffle(u.words), rounds = words.length >= 8 ? 2 : 1, per = Math.min(4, Math.floor(words.length / rounds));
  const cfg = { subj: 'eng', it: u, mode: 'match' };
  const st = { r: 0, sel: null, ok: 0, firstOk: 0, missed: new Set(), total: rounds * per, res: [], wait: 0 };
  CUR = { L: 'en', cfg };
  const intro = () => Speech.say([{ t: 'Match the picture and the word.', lang: 'en' }, { t: 'Bé chạm vào một hình, rồi chạm vào chữ đúng. Chạm vào chữ để nghe đọc.', lang: 'vi' }]);
  function round() {
    if (st.r >= rounds) return finishSession(cfg, st.firstOk, st.total);
    const set = words.slice(st.r * per, st.r * per + per);
    st.ok = 0; st.sel = null;
    app.innerHTML = playTop(rounds, st.r, st.res, st.firstOk) + `<div class="wrap">
      <div class="qcard"><div class="qhead"><button class="parrot emo" data-act="replay" style="border:0" aria-label="Nghe lại">🦜</button><div class="qtext">Match the picture and the word.<small>Chạm vào một hình, rồi chạm vào chữ đúng</small></div></div></div>
      <div class="feedback" id="fb" role="status"></div>
      <div class="match"><div class="col">${shuffle(set).map(w => `<button class="opt" data-act="mt" data-side="p" data-w="${esc(w.w)}"><span class="emo">${w.e}</span></button>`).join('')}</div>
      <div class="col">${shuffle(set).map(w => `<button class="opt" data-act="mt" data-side="w" data-w="${esc(w.w)}">${esc(w.w)}</button>`).join('')}</div></div>
    </div>`;
    st.set = set;

  }
  ACT.replay = intro;

    }

      setTimeout(() => { [a.el, el].forEach(b => b.classList.add('done')); }, 600);

      [a.el, el].forEach(b => { b.classList.add('wrong'); setTimeout(() => b.classList.remove('wrong'), 600); });

    }

  round();

  { name: 'nét thẳng', d: 'M50 8 L50 92' }, { name: 'nét ngang', d: 'M8 50 L92 50' }, { name: 'nét xiên', d: 'M28 92 L72 8' },

function traceItems(u) {

  const add = x => { const k = x.txt || x.name; if (k && !seen.has(k)) { seen.add(k); items.push(x); } };

  if (/nét (cơ bản|thẳng)/i.test(v)) STROKES.forEach(add);
  if (!items.length) v.split(/[,;:]/).map(s => s.trim()).filter(s => s && s.length <= 14 && s.split(/\s+/).length <= 3 && !/^(viết|tô|tập|nghe|các|chép)\b/i.test(s)).forEach(s => add({ txt: s }));
  if (items.length < 2) u.am.forEach(a => add({ txt: a }));
  if (items.length < 2) u.tieng.slice(0, 3).forEach(t => add({ txt: t }));
  return items.slice(0, 6);
}
function runTrace(u) {

  const sayIt = () => Speech.say([{ t: 'Bé tô theo nét chấm nhé:', lang: 'vi' }, { t: itemSay(items[st.i]), lang: 'vi', rate: 0.8 }]);

  let bg, ink, mask, wide;
  function setup() {
    const box = $('#tbox'); if (!box) return;
    const W = Math.floor(box.clientWidth), H = Math.round(clamp(W * 0.62, 220, 420)), dpr = Math.min(3, window.devicePixelRatio || 1);
    st.W = W; st.H = H;
    bg = $('#cbg'); ink = $('#cink');
    [bg, ink].forEach(c => { c.width = W * dpr; c.height = H * dpr; c.style.height = H + 'px'; c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0); });

  const tx = { dice: 'Có mấy chấm? Bé nhìn nhanh, không cần đếm.', dots: 'Có mấy chấm? Bé nhìn nhanh, không cần đếm.', hand: 'Bàn tay giơ mấy ngón? Bé nhìn nhanh nhé.', frame: 'Khung 10 ô có mấy hạt? Hàng trên đủ là 5 hạt.', hands: 'Hai bàn tay giơ mấy ngón? Một bàn tay là 5 ngón.' }[kind];
  api.text(tx);
  api.body.innerHTML = `<div class="vpic" id="vpic">${pic}</div>`;
  vTapCount($('#vpic'));
  const big = kind === 'frame' || kind === 'hands';
  vAsk(api, { ans: n, min: big ? 4 : 1, max: big ? 10 : 6, help: () => vCountSeq(api, $$('[data-c]', $('#vpic'))) });
};

  vAsk(api, { ans: n, opts: os.map(v => ({ v, h: diceHTML(v, 'sm') })), lay: 'pic', wrong1: `Không sao. Đây là ${n} hạt, bé tìm mặt có số chấm giống vậy nhé.`, help: () => { $('#vhelp').innerHTML = `<div class="dotrow">${'<i class="cb" data-c></i>'.repeat(n)}</div>`; vCountSeq(api, $$('#vhelp [data-c]')); } });
};
/* Bậc 2: xếp hạt vào khung 10 ô */
VQ.frameMake = (api, n) => {
  api.text(`Bé xếp ${n} hạt vào khung 10 ô nhé. Xếp kín hàng trên trước.`, `Bé xếp ${n} hạt vào khung 10 ô nhé. Kéo hoặc chạm vào hạt, xếp kín hàng trên trước. Xong thì bấm Xong rồi.`);
  api.body.innerHTML = '<div class="vstage" id="vst"></div>';
  const S = vStage($('#vst')), B = 3, P = 5, fw = 5 * STEP - GAP + 2 * (B + P), fh = 2 * STEP - GAP + 2 * (B + P), fx = (S.W - fw) / 2;
  S.zone('frame', fx, 0, fw, fh, 'tfz', Array.from({ length: 10 }, (_, k) => `<i style="left:${P + (k % 5) * STEP}px;top:${P + Math.floor(k / 5) * STEP}px"></i>`).join(''));
  S.zone('tray', 0, fh + 14, S.W, 2 * STEP + 14, 'tray', null);
  S.setH(fh + 14 + 2 * STEP + 14);
  const cs = Array.from({ length: 10 }, () => S.add('', 'tray', 'ctr'));
  let seq = 0;
  const inF = () => cs.filter(i => i.zone === 'frame').sort((a, b) => a.fo - b.fo);
  const lay = () => { inF().forEach((it, k) => S.pos(it, fx + B + P + (k % 5) * STEP, B + P + Math.floor(k / 5) * STEP)); S.layout('tray'); };
  const say = () => { const c = inF().length; Speech.say(c === 5 ? '5. Kín hàng trên rồi.' : String(c)); };
  const toF = it => { if (inF().length >= 10) return; it.zone = 'frame'; it.fo = ++seq; lay(); Sfx.tap(); say(); api.fb(''); };
  S.mode = 'drag'; S.from = 'tray'; S.to = 'frame';
  S.onDrop = toF;
  S.onTap = it => { if (it.zone === 'tray') toF(it); else { it.zone = 'tray'; lay(); Sfx.tap(); say(); } };
  lay();
  api.act.innerHTML = `<button class="btn block" data-act="vdone"><span class="emo">✅</span> Xong rồi</button>`;
  VS.check = () => {
    const c = inF().length;
    if (c === n) { VS.check = null; S.mode = 'none'; api.act.innerHTML = ''; api.done({ say: `${n} là 5 và ${n - 5}.` }); return; }
    api.miss(); Sfx.no();
    const m = `Khung đang có ${c} hạt. Mình cần ${n} hạt. ${c < n ? 'Bé xếp thêm nhé.' : 'Bé chạm vào hạt trong khung để bớt đi nhé.'}`;
    api.fb(m, true); Speech.say(m);
  };
};

};
/* Bậc 3: ghép cặp để so sánh */
VQ.pair = (api, P, a, b, ask, pre) => {
  const A = P.a, Bo = P.b, cols = Math.max(a, b);
  const qt = ask === 'more' ? `${A.s} nhiều hơn, ${Bo.s.toLowerCase()} nhiều hơn, hay hai bên bằng nhau?` : `${A.s} ít hơn, ${Bo.s.toLowerCase()} ít hơn, hay hai bên bằng nhau?`;
  api.body.innerHTML = '<div class="vstage" id="vst"></div>';
  const S = vStage($('#vst')), H = 3 * STEP + 40;
  S.zone('all', 0, 0, S.W, H, 'pairz', null);
  S.setH(H);
  const cx = k => (S.W - (cols * STEP - GAP)) / 2 + k * STEP;
  const yT = 8, yP = 8 + STEP + 8, yB = H - IT - 10;
  const bot = Array.from({ length: b }, (_, k) => { const it = S.add(Bo.e, 'bot'); S.pos(it, cx(k), yB); return it; });
  const topSp = a > 1 ? Math.min(STEP + 6, (S.W - IT - 8) / (a - 1)) : 0, tx0 = (S.W - ((a - 1) * topSp + IT)) / 2;
  const top = Array.from({ length: a }, (_, k) => { const it = S.add(A.e, 'top', 'drag'); S.pos(it, tx0 + k * topSp, yT); return it; });
  const need = Math.min(a, b);
  let pairs = 0;
  const pairTo = (it, j) => { it.zone = 'pair'; it.el.classList.remove('drag', 'wig'); bot[j].paired = true; S.pos(it, cx(j), yP); pairs++; Sfx.tap(); };
  const ask2 = pre => {
    S.mode = 'none';
    api.text((pre || '') + qt);
    const opts = [{ v: 'a', h: `<span class="emo">${A.e}</span><span class="lab">${A.s} ${ask === 'more' ? 'nhiều hơn' : 'ít hơn'}</span>` }, { v: 'b', h: `<span class="emo">${Bo.e}</span><span class="lab">${Bo.s} ${ask === 'more' ? 'nhiều hơn' : 'ít hơn'}</span>` }, { v: 'eq', h: `<span class="emo">🤝</span><span class="lab">Bằng nhau</span>` }];
    const ans = a === b ? 'eq' : (ask === 'more') === (a > b) ? 'a' : 'b';
    vAsk(api, { ans, opts, lay: 'txt vtxt', wrong1: a === b ? 'Bé nhìn xem: bạn nào cũng có đôi, không ai bị thừa ra.' : 'Bé nhìn xem bên nào có bạn bị thừa ra, không được ghép cặp.', help: () => { top.concat(bot).filter(i => i.zone === 'top' || (i.zone === 'bot' && !i.paired)).forEach(i => i.el.classList.add('hi')); } });
  };
  if (pre) {
    top.forEach((it, k) => { if (k < need) pairTo(it, k); });
    ask2(`Mỗi ${A.n} ghép với một ${Bo.n}. `);
    return;
  }
  api.text(`Bé kéo mỗi ${A.n} đến một ${Bo.n} nhé.`, `Bé kéo mỗi ${A.n} đến một ${Bo.n} nhé. Kéo hoặc chạm vào ${A.n}.`);
  top.forEach(i => i.el.classList.add('wig'));
  const freeNear = x => { let best = -1, bd = 1e9; bot.forEach((t, j) => { if (!t.paired) { const d = Math.abs(cx(j) - x); if (d < bd) { bd = d; best = j; } } }); return best; };
  const home = it => S.pos(it, tx0 + top.indexOf(it) * topSp, yT);
  const step = (it, j) => {
    if (pairs >= need || it.zone !== 'top') return;
    if (j == null || j < 0) j = bot.findIndex(t => !t.paired);
    if (j < 0) { home(it); return; }
    pairTo(it, j);
    if (pairs >= need) { top.forEach(t => t.el.classList.remove('wig')); api.later(() => { Speech.say(a === b ? 'Bạn nào cũng có đôi.' : 'Ghép xong rồi. Có bạn bị thừa ra.'); api.later(() => ask2(), 900); }, 500); }
  };
  S.mode = 'drag'; S.from = 'top'; S.to = 'all';
  S.onDrop = (it, x, y) => { if (y < yT + 26 || pairs >= need) { home(it); return; } step(it, freeNear(x)); };
  S.onTap = it => { if (it.zone === 'top') step(it); };
};
VQ.cmpNum = (api, x, y, ask) => {

  const row = (n, c) => `<div class="dotrow ${c}">${'<i class="cb" data-c></i>'.repeat(n)}</div>`;
  vAsk(api, { ans: ask === 'more' ? Math.max(x, y) : Math.min(x, y), opts: [{ v: x, h: String(x) }, { v: y, h: String(y) }], lay: 'n2', wrong1: 'Không sao. Bé xem hai hàng hạt, ghép từng cặp một nhé.', help: () => { $('#vhelp').innerHTML = `<div class="vcmp"><div><b>${x}</b>${row(x, '')}</div><div><b>${y}</b>${row(y, 'c2')}</div></div>`; } });
};

/* Bậc 4 đến 7: câu chuyện thêm vào, bớt đi trên sân khấu */
function vStory(api, o) {
  const st = o.st, op = o.op, add = op === '+', a = o.a, b = o.b, res = add ? a + b : a - b, lv = o.lv;
  const t1 = st.s1(a), t2 = st.s2(b), tq = st.q, kw = kwFirst(t2, op), k = add ? 'add' : 'sub';
  api.body.innerHTML = `<div class="vtale${lv === 'd' || lv === 'e' ? ' showkw' : ''}" id="vtale"><span>${autoKw(t1, op)}</span> <span id="ts2"${lv === 'g' ? ' class="hide"' : ''}>${autoKw(t2, op)}</span> <span id="tsq"${lv === 'f' ? '' : ' class="hide"'}>${autoKw(tq, op)}</span></div>
    ${lv === 'g' ? `<div class="vb" id="vb"><span class="slot" id="vb0">?</span><span class="slot sgslot" id="vb1">?</span><span class="slot" id="vb2">?</span><span class="vbeq hide" id="vb3">${SGN('=')}</span><span class="slot res" id="vb4">?</span></div>` : ''}
    <div class="vstage" id="vst"></div><div id="veql"></div>`;
  const S = vStage($('#vst'));
  const rB = Math.max(2, Math.ceil((add ? a + b : a) / 5)), rO = Math.max(1, Math.ceil(b / 5));
  const hO = 34 + rO * STEP + 6, hB = 34 + rB * STEP + 8;
  const lazy = lv === 'f' || lv === 'g', off = hO + 12;
  const zo = S.zone('out', 0, 0, S.W, hO, 'out blank' + (lazy ? ' hide' : ''), `<span class="zl"></span>`);
  S.zone('bas', 0, lazy ? 0 : off, S.W, hB, 'bas', `<span class="zl"><span class="emo">${st.zi}</span> ${esc(st.zl)}</span>`);
  S.setH((lazy ? 0 : off) + hB);
  const base = Array.from({ length: a }, () => S.add(st.e, 'bas'));
  S.layout('bas');
  let extra = [];
  const reveal = () => {
    if (lazy) { zo.el.classList.remove('hide'); const zb = S.zones.bas; zb.y = off; zb.el.style.top = off + 'px'; S.setH(off + hB); S.layout('bas'); }
    zo.el.classList.remove('blank'); zo.el.classList.add(k);
    $('.zl', zo.el).innerHTML = add ? `<span class="emo">${st.who}</span> Thêm vào <span class="zs">+</span>` : `<span class="emo">${st.ai}</span> Bớt đi <span class="zs">−</span>`;
    if (add) { extra = Array.from({ length: b }, () => { const it = S.add(st.e, 'out', 'nw pop'); it.ord = 100 + it.id; return it; }); S.layout('out'); }
  };
  const instr = () => add ? `Bé kéo ${b} ${st.cl} vào ${st.zl.toLowerCase()} nhé.` : st.tap(b);
  const doAction = next => {
    if (add) {
      S.mode = 'drag'; S.from = 'out'; S.to = 'bas';
      extra.forEach(i => i.el.classList.add('wig', 'drag'));
      let moved = 0;
      const put = (it, x, y) => {
        if (it.zone !== 'out') return;
        it.zone = 'bas'; it.el.classList.remove('wig', 'drag', 'pop'); it.ord = 100 + moved; moved++;
        if (x == null) { const sl = S.slots('bas', a + b)[a + moved - 1]; S.pos(it, sl[0], sl[1]); } else { const c = S.clamp('bas', x, y); S.pos(it, c[0], c[1]); }
        Sfx.tap(); Speech.say(String(moved));
        if (moved === b) { S.mode = 'none'; api.later(() => { S.layout('bas'); Speech.say('Gộp lại.'); api.later(next, 900); }, 500); }
      };
      S.onDrop = put; S.onTap = it => { if (S.mode === 'drag') put(it); };
    } else {
      S.mode = 'tap'; let gone = 0;
      S.onTap = it => {
        if (it.zone !== 'bas' || gone >= b) return;
        it.zone = 'out'; it.ord = gone; gone++;
        it.el.classList.add('gone', st.fx); S.layout('out');
        Sfx.tap(); Speech.say(String(gone));
        if (gone === b) { S.onTap = null; api.later(() => { S.layout('bas'); Speech.say('Còn lại.'); api.later(next, 900); }, 600); }
      };
    }
  };
  const countMode = keep => { if (!keep) { vUnmark(S.host); S.k = 0; } S.onTap = it => { if (it.zone !== 'bas' || it.el.classList.contains('n')) return; vMark(it.el, ++S.k); Speech.say(String(S.k)); Sfx.tap(); }; };
  const countHelp = get => () => { S.onTap = null; const els = get().map(i => i.el); vCountSeq(api, els, () => { S.k = els.length; countMode(true); }); };
  const showEq = () => { $('#veql').innerHTML = `<div class="vexpr">${a} ${SGN(op)} ${b} ${SGN('=')} ${res}</div><p class="vnote">Bé chạm vào dấu để nghe nghĩa của dấu nhé.</p>`; };
  const eqSay = `${add ? 'Thêm vào là phép cộng' : 'Bớt đi là phép trừ'}. ${a} ${add ? 'cộng' : 'trừ'} ${b} bằng ${res}.`;
  const askRes = () => {
    $('#tsq').classList.remove('hide');
    countMode();
    api.text(`${autoKw(tq, op)}`, `${tq} Bé chạm vào từng ${st.cl} để đếm nhé.`);
    vAsk(api, { ans: res, min: 0, max: Math.max(10, res + 2), help: countHelp(() => S.inZone('bas')), onRight: () => {
      if (lv === 'g') { fill(4, res); $('#vb').classList.add('done'); api.done({ btn: true, say: `${a} ${add ? 'cộng' : 'trừ'} ${b} bằng ${res}. Bé chạm vào dấu để nghe nghĩa của dấu nhé.` }); return; }
      if (o.eq) { showEq(); api.done({ btn: true, say: eqSay }); } else api.done({ say: `${res} ${st.cl}.` });
    } });
  };
  const fill = (i, v) => { const el = $('#vb' + i); el.innerHTML = v; el.classList.add('f'); };
  /* chọn trước: thêm vào hay bớt đi */
  const chooseOp = (then, prompt) => {
    api.act.innerHTML = opBtns('vop');
    let wrongs = 0;
    VS.op = (kk, el) => {
      if (el.classList.contains('wrong')) return;
      if (kk === k) {
        VS.op = null; api.mix(true); el.classList.add('right'); Sfx.ok();
        const m = add ? 'Đúng rồi, thêm vào. Thêm vào là cộng.' : 'Đúng rồi, bớt đi. Bớt đi là trừ.';
        api.fb(m + ' ⭐'); Speech.say(m);
        api.later(then, 1300);
      } else {
        wrongs++; api.mix(false); api.miss(); el.classList.add('wrong'); Sfx.no();
        $('#vtale').classList.add('showkw');
        const same = kw === 'bớt đi' || kw === 'thêm';
        const m = `Mình nghe lại nhé: ${kw}. ${cap(kw)} là ${same ? (add ? 'cộng' : 'trừ') : add ? 'thêm vào' : 'bớt đi'}.`;
        api.fb(m, true); Speech.say(m);
        if (wrongs >= 2) { const g = $(`.opbtn.${k}`, api.act); if (g) g.classList.add('hintme'); }
      }
    };
    if (prompt) api.text(prompt[0], prompt[1]);
  };
  const startAction = after => { api.act.innerHTML = ''; api.fb(''); reveal(); api.text(instr()); doAction(after); };

  if (lv === 'd' || lv === 'e') {
    reveal();
    api.text(instr(), `${t1} ${t2} ${instr()}`);
    doAction(askRes);
  } else if (lv === 'f') {
    chooseOp(() => startAction(askRes), ['Câu chuyện này là thêm vào hay bớt đi?', `${t1} ${t2} ${tq} Câu chuyện này là thêm vào hay bớt đi? Bé chọn trước rồi mới tính nhé.`]);
  } else {
    /* g: ghép phép tính từng phần */
    countMode();
    api.text(`${esc(t1)} Lúc đầu có mấy ${st.cl}?`);
    vAsk(api, { ans: a, min: 1, max: 10, help: countHelp(() => S.inZone('bas')), onRight: () => {
      fill(0, a); api.fb(`Lúc đầu có ${a}. ⭐`);
      $('#ts2').classList.remove('hide');
      chooseOp(() => {
        fill(1, SGN(op));
        startAction(() => {
          countMode();
          api.text(`${add ? 'Thêm vào' : 'Bớt đi'} mấy ${st.cl}?`);
          vAsk(api, { ans: b, min: 1, max: 6, help: countHelp(() => add ? extra : S.inZone('out')), onRight: () => {
            fill(2, b); $('#vb3').classList.remove('hide'); api.fb(`${add ? 'Thêm vào' : 'Bớt đi'} ${b}. ⭐`);
            api.later(askRes, 700);
          } });
        });
      }, [`${autoKw(t2, op)} Câu chuyện là thêm vào hay bớt đi?`, `${t2} Câu chuyện là thêm vào hay bớt đi?`]);
    } });
  }
}

/* Bậc 8: tia số */
VQ.hop = (api, s0, op, b) => {
  const add = op === '+', k = add ? 'add' : 'sub', end = add ? s0 + b : s0 - b;
  api.body.innerHTML = `<div class="vexpr">${s0} ${SGN(op)} ${b}</div>${nlineHTML()}`;
  const P = $('#nlp'), arcs = $('#nlarcs');
  const place = i => { P.style.left = ((20 + i * 30) / 340 * 100) + '%'; };
  place(s0);
  api.text(`Vẹt đang đứng ở số ${s0}. Phép tính ${s0} ${add ? 'cộng' : 'trừ'} ${b}. Bé bấm cho vẹt nhảy nhé.`, `Vẹt đang đứng ở số ${s0}. Phép tính ${s0} ${add ? 'cộng' : 'trừ'} ${b}. Cộng là nhảy tới, trừ là nhảy lùi. Bé bấm cho vẹt nhảy ${b} bước nhé.`);
  api.act.innerHTML = opBtns('vhop', 'Nhảy tới', 'Nhảy lùi');
  let cur = s0, hops = 0, wrongs = 0;
  VS.hop = (kk, el) => {
    if (hops >= b) return;
    if (kk !== k) {
      wrongs++; api.mix(false); api.miss(); Sfx.no();
      el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong');
      const m = add ? 'Dấu cộng là thêm vào, vẹt nhảy tới nhé.' : 'Dấu trừ là bớt đi, vẹt nhảy lùi nhé.';
      api.fb(m, true); Speech.say(m);
      if (wrongs >= 2) { const g = $(`.opbtn.${k}`, api.act); if (g) g.classList.add('hintme'); }
      return;
    }
    if (!hops) api.mix(true);
    el.classList.remove('wrong');
    const from = cur; cur += add ? 1 : -1; hops++;
    const x1 = 20 + from * 30, x2 = 20 + cur * 30, mx = (x1 + x2) / 2;
    arcs.insertAdjacentHTML('beforeend', `<path d="M${x1} 72 Q${mx} 34 ${x2} 72" fill="none" stroke="var(--${k})" stroke-width="3.5" stroke-linecap="round"/><text x="${mx}" y="42" text-anchor="middle" font-size="16" font-weight="900" fill="var(--${k}-d)" style="font-family:inherit">${hops}</text>`);
    place(cur); P.classList.remove('hop'); void P.offsetWidth; P.classList.add('hop');
    Sfx.tap(); Speech.say(String(hops));
    api.fb('');
    if (hops === b) {
      api.later(() => {
        api.text('Vẹt đứng ở số mấy?');

/* Xem bằng câu chuyện: mở đúng câu cộng, trừ bé vừa làm sai */
const FLY_E = ['🐝', '🦋', '🎈', '🐦', '🦆'], EAT_E = ['🍎', '🍌', '🍊', '🍓', '🧁', '🍪'];
function storyOf(sq) {
  const o = OBJ.find(x => x.e === sq.e) || { e: sq.e, vi: 'đồ vật', cl: 'cái' };
  if (sq.text) return { o, text: sq.text };
  const add = sq.op === '+', b = sq.b;
  const v = FLY_E.includes(o.e) ? `${b} ${o.cl} bay đi.` : EAT_E.includes(o.e) ? `Bé ăn mất ${b} ${o.cl}.` : o.e === '🍬' ? `Bé cho bạn ${b} viên.` : `Bớt đi ${b} ${o.cl}.`;
  return { o, text: add ? `Có ${sq.a} ${o.vi}. Có thêm ${b} ${o.cl} nữa. Gộp lại, có tất cả mấy ${o.cl}?` : `Có ${sq.a} ${o.vi}. ${v} Còn lại mấy ${o.cl}?` };
}
let storyTok = 0;
function openStory(sq) {
  Speech.stop();
  const old = $('#vov'); if (old) old.remove();
  const { o, text } = storyOf(sq), add = sq.op === '+';
  const ss = sentences(text);
  const ov = document.createElement('div');
  ov.className = 'overlay s-toan'; ov.id = 'vov';
  ov.innerHTML = `<div class="result vstory" role="dialog" aria-label="Xem bằng câu chuyện"><h2><span class="emo">📖</span> Xem bằng câu chuyện</h2>
    <div class="vtale showkw" id="ovt">${ss.map((s, i) => `<span data-i="${i}">${autoKw(s, sq.op)}</span>`).join(' ')}</div>
    <div class="vstage" id="ovst"></div>
    <div class="vexpr">${sq.a} ${SGN(sq.op)} ${sq.b} ${SGN('=')} <span class="q">?</span></div>
    <div class="row"><button class="btn soft block" data-act="vstoryre"><span class="emo">🔁</span> Xem lại</button><button class="btn block" data-act="vstoryx">Bé chọn đáp án nhé</button></div></div>`;
  ov._sq = sq;
  document.body.appendChild(ov);
  playStory(sq, o, ss);
}
async function playStory(sq, o, ss) {
  const my = ++storyTok, alive = () => my === storyTok && $('#vov');
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const add = sq.op === '+', a = sq.a, b = sq.b, k = add ? 'add' : 'sub';
  const S = vStage($('#ovst'));
  const rB = Math.max(2, Math.ceil((add ? a + b : a) / 5)), rO = Math.max(1, Math.ceil(b / 5));
  const hO = 34 + rO * STEP + 6, hB = 34 + rB * STEP + 8;
  const zo = S.zone('out', 0, 0, S.W, hO, 'out blank', '<span class="zl"></span>');
  S.zone('bas', 0, hO + 12, S.W, hB, 'bas', `<span class="zl"><span class="emo">🧺</span> Của bé</span>`);
  S.setH(hO + 12 + hB);
  for (let i = 0; i < a; i++) S.add(o.e, 'bas');
  S.layout('bas');
  const hl = i => $$('#ovt span[data-i]').forEach(s => s.classList.toggle('hl', +s.dataset.i === i));
  const sayW = async (t, min) => { await Promise.all([Speech.say(t), wait(min || 1200)]); };
  hl(0); await sayW(ss[0], 1400); if (!alive()) return;
  hl(1);
  zo.el.classList.remove('blank'); zo.el.classList.add(k);
  $('.zl', zo.el).innerHTML = add ? 'Thêm vào <span class="zs">+</span>' : 'Bớt đi <span class="zs">−</span>';
  const pSay = sayW(ss[1] || '', 1200);
  if (add) {
    const ex = Array.from({ length: b }, () => { const it = S.add(o.e, 'out', 'nw pop'); it.ord = 100 + it.id; return it; });
    S.layout('out'); await wait(700);
    for (const it of ex) { if (!alive()) return; it.zone = 'bas'; it.el.classList.remove('pop'); S.layout('bas'); await wait(RM ? 150 : 550); }
  } else {
    const l = S.inZone('bas').slice(-b);
    for (let i = 0; i < l.length; i++) { if (!alive()) return; const it = l[l.length - 1 - i]; it.zone = 'out'; it.ord = i; it.el.classList.add('gone', FLY_E.includes(o.e) ? 'fly' : 'give'); S.layout('out'); await wait(RM ? 150 : 600); }
    S.layout('bas');
  }
  await pSay; if (!alive()) return;
  hl(2);
  await sayW(add ? 'Gộp lại. Mình đếm tất cả nhé.' : 'Mình đếm số còn lại nhé.', 900); if (!alive()) return;
  const left = S.inZone('bas');
  if (!left.length) await sayW('Không còn lại ' + o.cl + ' nào.', 1000);
  for (let i = 0; i < left.length; i++) { if (!alive()) return; vMark(left[i].el, i + 1); Speech.say(String(i + 1)); await wait(750); }
  if (!alive()) return;
  hl(-1);
  sayVi(ss[ss.length - 1]);
}

function vChart(p) {
  const mix = vData(p).mix, days = Object.keys(mix).filter(d => (mix[d].ok + mix[d].bad) > 0).sort().slice(-10);
  if (!days.length) return '<p class="vnote">Chưa có số liệu. Biểu đồ sẽ hiện khi con chơi Bậc 6, 7 hoặc 8, là những bậc con phải chọn thêm vào hay bớt đi.</p>';
  const W = 330, H = 190, L = 30, R = 8, T = 26, Bm = 40, pw = W - L - R, ph = H - T - Bm;
  const mx = Math.max(2, ...days.map(d => mix[d].bad)), bw = Math.min(30, pw / days.length * 0.6);
  let s = '';
  [0, mx].forEach(v => { const y = T + ph - v / mx * ph; s += `<line x1="${L}" y1="${y}" x2="${W - R}" y2="${y}" stroke="#E6DCC6" stroke-width="1"/><text x="${L - 6}" y="${y + 5}" text-anchor="end" font-size="14" fill="#6A6182" style="font-family:inherit">${v}</text>`; });
  days.forEach((d, i) => {
    const m = mix[d], cx = L + pw * (i + 0.5) / days.length, h = m.bad / mx * ph, y = T + ph - h, tot = m.ok + m.bad, lab = `${d.slice(8)}/${d.slice(5, 7)}`, short = i === 0 || d.slice(5, 7) !== days[i - 1].slice(5, 7) ? lab : d.slice(8);
    const r = Math.min(4, h / 2, bw / 2);
    s += `<g><title>${lab}: chọn nhầm ${m.bad} lần, chọn đúng ngay ${m.ok} câu</title><rect x="${cx - 22}" y="${T}" width="44" height="${ph + Bm}" fill="transparent"/>`;
    if (h > 0) s += `<path d="M${cx - bw / 2} ${T + ph} V${y + r} Q${cx - bw / 2} ${y} ${cx - bw / 2 + r} ${y} H${cx + bw / 2 - r} Q${cx + bw / 2} ${y} ${cx + bw / 2} ${y + r} V${T + ph} Z" fill="#7A5AF0"/>`;
    s += `<text x="${cx}" y="${y - 6}" text-anchor="middle" font-size="14" font-weight="800" fill="#2A2140" style="font-family:inherit">${m.bad}/${tot}</text><text x="${cx}" y="${H - 18}" text-anchor="middle" font-size="14" fill="#6A6182" style="font-family:inherit">${short}</text></g>`;
  });
  s += `<line x1="${L}" y1="${T + ph}" x2="${W - R}" y2="${T + ph}" stroke="#B9AE96" stroke-width="1.5"/>`;
  return `<figure class="vchart"><figcaption>Số lần con chọn nhầm giữa Thêm vào và Bớt đi, theo ngày</figcaption><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ số lần chọn nhầm theo ngày">${s}</svg>
    <p class="vnote">Mỗi cột là một ngày. Số trên cột là số lần chọn nhầm trên tổng số câu con phải chọn. Cột thấp dần là con đang hiểu rõ hơn.</p></figure>`;
}

  return sec('💛', 'Giúp con vững Toán', `<p>Nhiều bạn sáu tuổi cần thêm thời gian để hiểu cộng và trừ, và điều đó rất bình thường. Mỗi con có nhịp riêng. Con học chắc nhất khi được cầm, được chạm vào đồ vật thật, rồi nhìn hình, sau cùng mới đến con số và dấu.</p><p>Phần Toán vững từng bước trong app đi đúng thứ tự ấy. Ở nhà, bố mẹ chỉ cần năm phút mỗi tối, chơi nhẹ nhàng như một trò chơi, là đã tiếp sức cho con rất nhiều.</p>`)
    + sec('🌙', 'Năm phút mỗi tối với đồ vật thật', `
      <h3>Bàn tay</h3><p>Bố mẹ giơ nhanh vài ngón tay rồi hỏi: bố giơ mấy ngón? Con nói luôn, không cần đếm. Sau đó đổi vai, con giơ để bố mẹ đoán. Với số từ 6 đến 10, nhắc con: một bàn tay là 5, thêm 2 ngón nữa là 7.</p>
      <h3>Khung 10 ô vẽ trên giấy</h3><p>Kẻ hai hàng, mỗi hàng 5 ô. Dùng hạt đậu, nắp chai hay viên kẹo đặt vào ô, luôn xếp kín hàng trên trước. Hỏi con: hàng trên đã kín chưa? Thêm mấy hạt nữa thì kín cả khung?</p>
      <button class="btn soft block" data-act="vprint"><span class="emo">🖨️</span> In khung 10 ô</button>
      <h3>Câu chuyện thêm bớt trong bữa ăn</h3><p>Trên đĩa con có 3 miếng dưa, mẹ cho thêm 1 miếng. Trước khi đếm, hỏi con một câu thôi: đây là thêm vào hay bớt đi? Khi con ăn mất 2 miếng, lại hỏi: thêm vào hay bớt đi? Còn lại mấy miếng? Để con tự đếm trên đĩa.</p>
      <h3>Đi chợ</h3><p>Cho con bỏ từng quả cam vào túi và đếm to. Mua thêm 2 quả là thêm vào. Biếu bà 1 quả là bớt đi. Để con được cầm, được đếm và được nói.</p>
      <h3>Cả nhà nói cùng một kiểu</h3><p>Ở nhà và trong app, cả nhà dùng chung một bộ từ. <b class="kw add">Thêm, được cho thêm, gộp lại, tất cả</b> là cộng. <b class="kw sub">Bớt, bay đi, ăn mất, cho bạn, còn lại</b> là trừ. Nghe mãi những từ quen này, con sẽ dần tự biết nên làm phép tính nào.</p>
      <p>Hãy dừng khi con còn đang vui, và kết thúc bằng một câu thật dễ để con được đúng.</p>`)
    + sec('🤗', 'Khi con làm sai, nên nói gì', `
      <p>Lúc con sai là lúc con đang học. Bố mẹ có thể nói:</p>
      <ul><li>Mình cùng đếm lại bằng ngón tay nhé.</li><li>Con nghe lại câu chuyện nhé: có con chim bay đi, vậy là thêm vào hay bớt đi?</li><li>Con đã thử rất chăm, mình làm câu này cùng nhau.</li><li>Sai cũng không sao, mình thử cách khác.</li></ul>
      <p>Nên tránh những câu như dễ thế mà cũng không biết, tránh so sánh con với bạn hay với anh chị, tránh giục con làm nhanh hay làm thay con. Khen sự cố gắng và cách con đếm cẩn thận, hơn là khen con thông minh.</p>`)
    + sec('🏫', 'Phối hợp với cô giáo', `
      <ul><li>Kể với cô rằng ở nhà con đang luyện bằng đồ vật và khung 10 ô, mỗi tối khoảng năm phút.</li><li>Hỏi cô trên lớp đang dùng những từ nào cho phép cộng và phép trừ, để ở nhà nói giống cô.</li><li>Nhờ cô cho con dùng que tính, ngón tay hay khung 10 ô khi cần, và thỉnh thoảng gọi con trả lời một câu con chắc chắn làm được để con tự tin.</li><li>Khoảng hai tuần một lần, hỏi cô một điều con đã tiến bộ và một điều cần luyện thêm. Bố mẹ có thể mở phần Con đang ở đâu để cô cùng xem.</li></ul>`)
    + sec('🌱', 'Theo dõi nhẹ nhàng', `
      <p>Tiến bộ thường đến từng chút một: hôm nay con chọn đúng thêm vào hay bớt đi nhiều hơn hôm qua, tuần này con lên thêm một bậc. Bố mẹ xem biểu đồ trong phần Con đang ở đâu, cột thấp dần là con đang hiểu rõ hơn.</p>
      <p>Nếu sau khoảng hai, ba tháng luyện đều đặn mà con vẫn chưa tiến bộ, bố mẹ có thể trao đổi với cô và tham khảo ý kiến chuyên viên tâm lí giáo dục để được đánh giá kĩ hơn, từ đó có cách giúp con phù hợp nhất.</p>`);
}
function parentVung() {
  const p = prof();
  if (!p) return '<div class="sec ptext"><p>Chưa có hồ sơ bé.</p></div>';
  return `<div class="tabs vseg"><button class="${vungView === 'prog' ? 'on' : ''}" data-act="vview" data-v="prog">Con đang ở đâu</button><button class="${vungView === 'guide' ? 'on' : ''}" data-act="vview" data-v="guide">Giúp con vững Toán</button></div>` + (vungView === 'guide' ? vGuide() : vProg(p));
}
ACT.vprint = () => {
  const fr = () => `<table class="ptf">${[0, 1].map(() => `<tr>${'<td></td>'.repeat(5)}</tr>`).join('')}</table>`;
  $('#printArea').innerHTML = `<h1>Khung 10 ô</h1><p>Xếp hạt đậu hay nắp chai vào ô, luôn xếp kín hàng trên trước. Thêm, được cho thêm, gộp lại, tất cả là cộng. Bớt, bay đi, ăn mất, cho bạn, còn lại là trừ.</p>${fr()}<div style="height:14mm"></div>${fr()}`;
  setTimeout(() => { try { window.print(); } catch (e) {} }, 50);
};

/* ===================== Góc bố mẹ ===================== */
let lockQ = null, goalWeek = null;
function weekPlan(w) {
  return { tv: TV.units.filter(u => u.tuan === w), to: TOAN_L.filter(b => b.tuan === w), en: ENG.units.find(u => inWeek(u, w)), mu: MC.units.find(u => inWeek(u, w)), ml: MC_L.filter(l => inWeek(l, w)) };
}
function renderParent() {
  app.className = 's-par';
  if (!parentOK) {
    if (!lockQ) lockQ = [rnd(6, 9), rnd(6, 9)];
    app.innerHTML = topbar('Góc bố mẹ', 'Dành cho người lớn', { right: '' }) + `<div class="wrap"><div class="lock sec">
      <p style="margin:0">Để mở Góc bố mẹ, xin bố mẹ tính:</p>
      <div class="q">${lockQ[0]} × ${lockQ[1]} = ?</div>
      <input id="lk" class="field" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Kết quả" style="text-align:center">
      <div class="feedback bad" id="lkfb"></div>
      <button class="btn block" data-act="unlock">Mở</button></div></div>`;
    const inp = $('#lk'); inp.addEventListener('keydown', e => { if (e.key === 'Enter') ACT.unlock(); });
    return;
  }
  const tabs = [['plan', 'Kế hoạch'], ['prog', 'Tiến độ'], ['goal', 'Mục tiêu'], ['vung', '💛 Vững Toán'], ['set', 'Cài đặt']];
  let body = '';
  if (parentTab === 'plan') body = parentPlan();
  else if (parentTab === 'prog') body = parentProg();
  else if (parentTab === 'goal') body = parentGoals();
  else if (parentTab === 'vung') body = parentVung();
  else body = parentSettings();
  app.innerHTML = topbar('Góc bố mẹ', `Năm học 2026 – 2027 · Tuần ${curWeek()}`, { right: '' }) + `<div class="wrap"><div class="tabs ptabs">${tabs.map(([k, n]) => `<button class="${k === parentTab ? 'on' : ''}${k === 'vung' ? ' vt' : ''}" data-act="ptab" data-t="${k}">${n}</button>`).join('')}</div>${body}</div>${footer()}`;
}
ACT.unlock = () => {
  const v = parseInt(($('#lk') || {}).value, 10);
  if (lockQ && v === lockQ[0] * lockQ[1]) { parentOK = true; lockQ = null; renderParent(); }
  else { const f = $('#lkfb'); if (f) f.textContent = 'Chưa đúng, bố mẹ thử lại nhé.'; lockQ = [rnd(6, 9), rnd(6, 9)]; const q = $('.lock .q'); if (q) q.textContent = `${lockQ[0]} × ${lockQ[1]} = ?`; const i = $('#lk'); if (i) { i.value = ''; i.focus(); } }
};
ACT.ptab = el => { parentTab = el.dataset.t; renderParent(); };
const tip = (lab, t) => t ? `<p class="tip"><b>${lab}:</b> ${esc(t)}</p>` : '';
function weekBlock(w) {
  const P = weekPlan(w);
  let h = `<div class="subj s-tv"><h4>Tiếng Việt</h4>${P.tv.length ? P.tv.map(u => `<p><b>${esc(u.ten)}</b>${u.viet ? ` · viết: ${esc(u.viet)}` : ''}</p>${tip('Trò chơi', u.choi)}${tip('Lưu ý', u.bm)}`).join('') : '<p>Ôn lại các bài tuần trước.</p>'}</div>`;
  h += `<div class="subj s-toan"><h4>Toán</h4>${P.to.length ? P.to.map(b => `<p><b>${esc(b.ten)}</b></p>${tip('Trò chơi', b.choi)}${tip('Lưu ý', b.bm)}`).join('') : '<p>Tuần này không có bài mới: ôn lại bài tuần trước bằng phần Luyện tập.</p>'}</div>`;
  if (P.en) h += `<div class="subj s-eng"><h4>English</h4><p><b>Unit ${P.en._i + 1}. ${esc(P.en.en)}</b> (${esc(P.en.vi)}), tuần ${esc(P.en.tuan)}</p>${tip('Trò chơi', P.en.game)}${tip('Gợi ý', P.en.parent)}</div>`;
  if (P.mu) h += `<div class="subj s-maths"><h4>Maths</h4><p><b>Unit ${P.mu._n}. ${esc(P.mu.en)}</b> (${esc(P.mu.vi)})${P.ml.length ? ': ' + P.ml.map(l => `${esc(l.en)} (${esc(l.vi)})`).join(', ') : ''}</p>${P.ml.map(l => tip('Trò chơi', l.choi) + tip('Lưu ý', l.bm)).join('')}${tip('So với Toán 1', P.mu.note)}</div>`;
  return h;
}
function parentPlan() {
  const cw = curWeek();
  let h = `<div class="sec ptext"><p>Kế hoạch 35 tuần của bốn môn, tính từ thứ Hai 07/09/2026. Tuần đang học được mở sẵn. Nếu cả nhà nghỉ Tết hoặc học chậm hơn, bố mẹ chỉnh tuần trong phần Cài đặt.</p><button class="btn block" data-act="print"><span class="emo">🖨️</span> In kế hoạch cả năm</button></div>`;
  for (let w = 1; w <= 35; w++) h += `<details class="pd wkplan"${w === cw ? ' open' : ''}><summary>Tuần ${w} <span class="small">${weekLabel(w)}</span>${w === cw ? ' <span class="cur">Tuần này</span>' : ''}</summary><div class="in">${weekBlock(w)}</div></details>`;
  return h;
}
function parentProg() {
  let h = '';
  S.profiles.forEach(p => {
    const sc = stickerCount(p);
    h += `<div class="sec ptext"><h2 style="display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:20px"><span class="emo">${p.av}</span>${esc(p.name)}${p.id === S.cur ? ' <span class="small">(đang học)</span>' : ''}</h2>
      <p>⭐ ${p.stars} sao · ${sc} nhãn dán · tuần đang học: ${clamp(autoWeek() + (p.shift || 0), 1, 35)}</p>
      ${Object.keys(SUBJ).map(k => { const d = doneCount(k, p), t = SUBJ[k].total(); return `<div class="s-${k}"><b>${SUBJ[k].name}</b>: ${d}/${t} ${k === 'eng' ? 'unit' : 'bài'} đã luyện<div class="pbar"><i style="width:${t ? d / t * 100 : 0}%"></i></div></div>`; }).join('')}
      <b>Gần đây</b>${p.log.length ? `<ul class="logl">${p.log.slice(0, 8).map(l => { const it = IDX[l.id]; const d = new Date(l.t); if (l.s === 'vung') { const k = VL.findIndex(x => 'vung-' + x.id === l.id); return `<li>${dm(d)} · Toán vững từng bước · Bậc ${k + 1}: đúng ngay ${l.c}/${l.n} câu ${starTxt(l.st)}${l.f >= 3 ? ` · chạm vội ${l.f} lần` : ''}</li>`; } return `<li>${dm(d)} · ${SUBJ[l.s] ? SUBJ[l.s].name : ''} · ${esc(it ? itemTitle(l.s, it) : l.id)} · ${esc(modeName(l.m))}: ${l.c}/${l.n} ${starTxt(l.st)}${l.f >= 3 ? ` · chạm vội ${l.f} lần` : ''}</li>`; }).join('')}</ul>` : '<p class="small">Bé chưa chơi bài nào.</p>'}
      <div class="row mt"><button class="btn soft sm" data-act="prename" data-id="${p.id}">Đổi tên</button><button class="btn soft sm" data-act="preset" data-id="${p.id}">Xoá tiến độ</button><button class="btn soft sm" data-act="pdel" data-id="${p.id}">Xoá bé</button></div></div>`;
  });
  return h + `<button class="btn block" data-act="go" data-to="who">Thêm bé mới</button>`;
}
const findP = id => S.profiles.find(p => p.id === id);
ACT.prename = el => { const p = findP(el.dataset.id); if (!p) return; const n = window.prompt('Tên mới của bé', p.name); if (n && n.trim()) { p.name = n.trim().slice(0, 24); save(); renderParent(); } };
ACT.preset = el => { const p = findP(el.dataset.id); if (!p) return; if (window.confirm(`Xoá toàn bộ sao và tiến độ của ${p.name}?`)) { p.stars = 0; p.done = {}; p.log = []; save(); renderParent(); } };
ACT.pdel = el => { const p = findP(el.dataset.id); if (!p) return; if (window.confirm(`Xoá hồ sơ của ${p.name} khỏi máy này?`)) { S.profiles = S.profiles.filter(x => x !== p); if (S.cur === p.id) S.cur = S.profiles[0] ? S.profiles[0].id : null; save(); if (S.cur) renderParent(); else go('who'); } };
function parentGoals() {
  const w = goalWeek || curWeek(), P = weekPlan(w);
  let h = `<div class="sec"><div class="stepper"><button class="btn soft" data-act="gw" data-d="-1" aria-label="Tuần trước">${ICON_BACK}</button><b>Tuần ${w}<br><span class="small">${weekLabel(w)}</span></b><button class="btn soft" data-act="gw" data-d="1" aria-label="Tuần sau" style="transform:scaleX(-1)">${ICON_BACK}</button></div></div>`;
  h += `<div class="sec wkplan ptext s-tv"><h2>Tiếng Việt</h2>${P.tv.map(u => `<p><b>${esc(u.ten)}</b><br>${u.am.length ? `Âm, vần: ${esc(u.am.join(', '))}. ` : ''}${u.viet ? `Viết: ${esc(u.viet)}.` : ''}${u.cau ? `<br>Câu: ${esc(u.cau)}` : ''}</p>`).join('') || '<p>Ôn tập.</p>'}</div>`;
  h += `<div class="sec wkplan ptext s-toan"><h2>Toán</h2>${P.to.map(b => `<p><b>${esc(b.ten)}</b></p><ul>${(b.muctieu || []).map(m => `<li>${esc(m)}</li>`).join('')}</ul>`).join('') || '<p>Ôn lại bài tuần trước.</p>'}</div>`;
  if (P.en) h += `<div class="sec wkplan ptext s-eng"><h2>English · Unit ${P.en._i + 1}. ${esc(P.en.en)}</h2><ul>${(P.en.goals || []).map(g => `<li>${esc(g)}</li>`).join('')}</ul></div>`;
  if (P.mu) h += `<div class="sec wkplan ptext s-maths"><h2>Maths · Unit ${P.mu._n}. ${esc(P.mu.en)}</h2>${(P.ml.length ? P.ml : P.mu.lessons).map(l => `<p><b>${esc(l.en)}</b> (${esc(l.vi)})</p><ul>${(l.goals || []).map(([en, vi]) => `<li>${esc(vi)} <span class="small">${esc(en)}</span></li>`).join('')}</ul>`).join('')}</div>`;
  return h;
}
ACT.gw = el => { goalWeek = clamp((goalWeek || curWeek()) + +el.dataset.d, 1, 35); renderParent(); };
function parentSettings() {
  Speech.load();
  const p = prof(), vv = Speech.list('vi'), ev = Speech.list('en');
  const opt = (list, cur) => `<option value="">Tự chọn giọng tốt nhất</option>` + list.map(v => `<option value="${esc(v.voiceURI)}"${v.voiceURI === cur ? ' selected' : ''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('');
  return `<div class="sec ptext">
    <div class="set-row"><label>Tuần đang học của ${esc(p ? p.name : '')}</label><div class="stepper"><button class="btn soft" data-act="shift" data-d="-1">Lùi</button><b>Tuần ${curWeek()}<br><span class="small">${p && p.shift ? `lệch ${p.shift > 0 ? '+' : ''}${p.shift} tuần so với lịch` : 'theo lịch'}</span></b><button class="btn soft" data-act="shift" data-d="1">Tiến</button></div></div>
    <div class="set-row"><label for="vvi">Giọng tiếng Việt</label><select id="vvi" data-set="vi">${opt(vv, S.set.vi)}</select>${vv.length ? '' : '<span class="small">Máy này chưa có giọng tiếng Việt. Trên điện thoại, bố mẹ vào Cài đặt, mục Chuyển văn bản thành giọng nói, tải thêm giọng tiếng Việt.</span>'}</div>
    <div class="set-row"><label for="ven">Giọng tiếng Anh</label><select id="ven" data-set="en">${opt(ev, S.set.en)}</select></div>
    <div class="set-row"><label for="rate">Tốc độ đọc: <span id="ratev">${(+S.set.rate).toFixed(2)}</span></label><input id="rate" type="range" min="0.6" max="1.1" step="0.05" value="${S.set.rate}"></div>
    <div class="row"><button class="btn soft sm" ${sayAttr('Xin chào, mình là vẹt Bingo. Bé học giỏi lắm!')}>Thử giọng Việt</button><button class="btn soft sm" ${sayAttr('Hello! I am Bingo. Well done!', 'en')}>Thử giọng Anh</button></div>
    <div class="set-row mt"><label><input type="checkbox" id="sfx"${S.set.sfx ? ' checked' : ''} style="width:24px;height:24px;vertical-align:middle"> Tiếng chuông khi trả lời</label></div>
  </div>`;
}
ACT.shift = el => { const p = prof(); if (!p) return; const nw = clamp(curWeek() + +el.dataset.d, 1, 35); p.shift = nw - autoWeek(); save(); renderParent(); };
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('select[data-set]')) { S.set[t.dataset.set] = t.value; save(); Speech.say([{ t: t.dataset.set === 'en' ? 'Hello, I am Bingo.' : 'Xin chào, mình là Bingo.', lang: t.dataset.set }]); }
  if (t.id === 'sfx') { S.set.sfx = t.checked; save(); }
  if (t.id === 'rate') { S.set.rate = +t.value; save(); sayVi('Tốc độ đọc như thế này nhé.'); }
});
document.addEventListener('input', e => { if (e.target.id === 'rate') { const v = $('#ratev'); if (v) v.textContent = (+e.target.value).toFixed(2); } });
ACT.print = () => {
  const cw = curWeek();
  let h = `<h1>Bingo học lớp 1 · Kế hoạch năm học 2026 – 2027</h1><p>Bé: ${esc(prof() ? prof().name : '')} · In ngày ${dm(new Date())}/${new Date().getFullYear()} · Victoria School</p>
  <table><thead><tr><th>Tuần</th><th>Tiếng Việt</th><th>Toán</th><th>English</th><th>Maths</th><th>Xong</th></tr></thead><tbody>`;
  for (let w = 1; w <= 35; w++) {
    const P = weekPlan(w);
    h += `<tr${w === cw ? ' style="background:#FFF6D6"' : ''}><td><b>${w}</b><br>${weekLabel(w)}</td><td>${P.tv.map(u => esc(u.ten)).join('<br>') || 'Ôn tập'}</td><td>${P.to.map(b => esc(b.ten)).join('<br>') || 'Ôn tập'}</td><td>${P.en ? `Unit ${P.en._i + 1}. ${esc(P.en.en)}<br>${esc(P.en.vi)}` : ''}</td><td>${P.mu ? `Unit ${P.mu._n}. ${esc(P.mu.en)}` : ''}${P.ml.length ? '<br>' + P.ml.map(l => esc(l.en)).join('<br>') : ''}</td><td class="ck"></td></tr>`;
  }
  $('#printArea').innerHTML = h + '</tbody></table>';
  setTimeout(() => { try { window.print(); } catch (e) {} }, 50);
};

/* ===================== Khởi động ===================== */
document.addEventListener('pointerdown', () => { gestured = true; }, { once: true, capture: true });
document.addEventListener('visibilitychange', () => { if (document.hidden) Speech.stop(); });
render();
</script>
</body>
